---
# Sample inventory. The `boards` group is the canonical target for
# setup_netboot.yml and the per-host loops in nfs_content. Per-model
# subgroups exist so playbooks can be limited (e.g. --limit rock_5b).
#
# This starter inventory has one of each of the two common Rockchip
# layouts:
#   - rock-5b-01         — SPI populated. The bootloader role flashes
#                          U-Boot to SPI.
#   - orange-pi-5-pro-01 — no SPI, no eMMC. The bootloader role flashes
#                          U-Boot to the SD card the board is currently
#                          booted from. Operator is expected to write
#                          Armbian to the SD card manually first; the
#                          card stays inserted permanently and behaves
#                          identically to SPI from a DHCP standpoint.
# Both boards keep their root filesystem on NVMe (primary_storage: nvme,
# flash_target_device: /dev/nvme0n1 in roles/bootloader/vars/boards.yml).
#
# Multiple hosts of the same board_model are supported: each gets its
# own NFS rootfs export, hostname, machine-id, and SSH host keys (see
# nfs_content/tasks/per_host.yml). The model-level template in
# nfs_rootfs_path/_templates/<board_model>/ is shared via
# `cp --reflink=auto`, so storage cost stays at one rootfs per model
# on filesystems that support reflinks (XFS, btrfs, ZFS).
#
# To add more boards: pick a board_model from
# roles/bootloader/vars/boards.yml (or add a new entry there) and add
# a host with board_mac and board_model under a per-model subgroup.

all:
  children:
    netboot_server:
      hosts:
        netboot-server:
          ansible_host: 192.168.1.10
          ansible_user: ansible
          ansible_become: true

    routeros:
      hosts:
        router:
          ansible_host: 192.168.1.1
          # network_cli (SSH) connection vars set in group_vars/routeros.yml

    routeros_switches:
      hosts:
        switch:
          ansible_host: 192.168.1.2
          # Only targeted by bootstrap_routeros_user.yml — that play overrides
          # the connection to network_cli with an existing admin user's SSH key.

    routeros_devices:
      # Convenience parent group consumed by bootstrap_routeros_user.yml so the
      # same play provisions the SSH-only admin user on the router and switches
      # in one run.
      children:
        routeros:
        routeros_switches:

    boards:
      children:
        # Rock 5B: SPI populated → U-Boot lives in SPI flash.
        rock_5b:
          hosts:
            rock-5b-01:
              ansible_host: 192.168.1.131
              board_mac: "aa:bb:cc:dd:ee:31"
              board_model: rock-5b

            # Example: a Rock 5B unit that diverges from the model defaults
            # in roles/bootloader/vars/boards.yml. Use host_board_overrides
            # for SKU-level variation (chip populated/not, non-default
            # device paths, alternate boot order, etc.) without forking
            # boards.yml. Any field from the SoC family vars file or the
            # board entry can be overridden — later wins.
            #
            # rock-5b-02:
            #   ansible_host: 192.168.1.132
            #   board_mac: "aa:bb:cc:dd:ee:32"
            #   board_model: rock-5b
            #   host_board_overrides:
            #     # This unit's SPI socket is unpopulated. The bootloader
            #     # role would otherwise try to flash SPI and fail at MTD
            #     # detection. Forcing has_spi=false routes it to eMMC if
            #     # populated, or fail-fasts toward prepare_sd_card.yml.
            #     has_spi: false
            #     # eMMC module retrofitted onto this specific unit.
            #     has_emmc: true
            #     # Two NVMe controllers on a carrier board put the rootfs
            #     # disk at nvme1 instead of the default nvme0.
            #     flash_target_device: /dev/nvme1n1
            #     # Match the boot order to the new NVMe address.
            #     boot_targets_pxe: "pxe dhcp mmc0 nvme1 nvme0"
            #     # Non-stock UART wired to a USB-TTL adapter at 115200.
            #     console: ttyS2,115200n8

        # Orange Pi 5 Pro: no SPI, no eMMC → U-Boot on SD card.
        # Workflow:
        #   1. Manually flash Armbian to an SD card (etcher / `dd` /
        #      Armbian installer) and insert it into the board.
        #   2. Power the board on; wait for SSH.
        #   3. Run flash_bootloader.yml — it apt-installs U-Boot and
        #      writes the PXE-first U-Boot to that same SD card in place.
        orange_pi_5_pro:
          hosts:
            orange-pi-5-pro-01:
              ansible_host: 192.168.1.111
              board_mac: "aa:bb:cc:dd:ee:11"
              board_model: orange-pi-5-pro

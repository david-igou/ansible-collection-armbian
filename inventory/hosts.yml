---
# DOCUMENTATION-ONLY INVENTORY — not used at runtime.
# The real inventory lives in .inventory/ (gitignored) and is picked up
# by Ansible's default inventory search. This file exists solely to
# illustrate the expected group structure, host variables, and naming
# conventions for users setting up their own inventory.
#
# Every onboarded board always has a pxelinux.cfg on rb5009. The
# `default` directive inside it (driven by armbian_netboot_boot_mode)
# selects which boot label is active. Supported values:
#
#   nfs          — NFS root. No extra keys required.
#   sd           — local SD card root. root=LABEL=armbi_root by default;
#                  override with armbian_netboot_sd_root when the label
#                  would be ambiguous (e.g. "PARTLABEL=rootfs").
#   local_kernel — rootfs on a local block device (NVMe, eMMC, …).
#                  Requires armbian_netboot_local_kernel (at minimum
#                  `persist_via: hook`) and armbian_netboot_local_disks
#                  (declarative partition layout). See the orange-pi-5-pro
#                  example below and docs/boot-mode-override.md.
#
# Multiple hosts of the same armbian_netboot_board_model are supported:
# each gets its own NFS rootfs export, hostname, machine-id, and SSH
# host keys (see netboot_assets/tasks/per_host.yml). The model-level
# template in nfs_rootfs_path/_templates/<board_model>/ is shared via
# `cp --reflink=auto`, so storage cost stays at one rootfs per model
# on filesystems that support reflinks (XFS, btrfs, ZFS).

all:
  children:
    netboot_server:
      hosts:
        netboot-server:
          ansible_host: 192.168.1.10
          ansible_user: ansible
          ansible_become: true

    # Hosts that run armbian/build to produce custom .img.xz images,
    # consumed by stage_nfs_rootfs via armbian_netboot_image_urls
    # overridden to the netboot server's HTTP assets path.
    armbian_builders:
      hosts:
        builder-01:
          ansible_host: 192.0.2.50
          ansible_user: builder
          ansible_become: true

    # `routeros` is the parent of every RouterOS device this collection
    # touches. Per-host SSH settings (ansible_user, ansible_port) live
    # directly on the host entries below; group_vars/routeros.yml pins
    # only the network_cli connection plumbing.
    routeros:
      children:
        routeros_routers:
        routeros_switches:

    # rb5009 (and any other DHCP-serving RouterOS device).
    # `converge_boot_mode.yml`, `set_boot_mode.yml`, and
    # `stage_tftp_assets.yml` all target this group; the collection
    # writes per-board pxelinux.cfg + per-model TFTP files to
    # flash:/sbc/ via /ip tftp.
    routeros_routers:
      hosts:
        router:
          ansible_host: 192.168.1.1
          ansible_user: ansible-netboot
          ansible_port: 22

    # Switches that should also be provisioned with the same
    # ansible-netboot SSH user, but are not the DHCP server this
    # collection drives. Only targeted by bootstrap_routeros_user.yml
    # (via the routeros_netboot parent group).
    routeros_switches:
      hosts:
        switch:
          ansible_host: 192.168.1.2
          ansible_user: ansible-netboot
          ansible_port: 22

    # Subset of `routeros` that bootstrap_routeros_user.yml provisions
    # the ansible-netboot user on. By default that's the same as
    # `routeros` (every device).
    routeros_netboot:
      children:
        routeros_routers:
        routeros_switches:

    boards:
      children:
        # Orange Pi 5 Pro: RK3588S, Motorcomm YT6801 PCIe 1GbE
        # controller (not the SoC GMAC + external PHY combo; the
        # mainline u-boot DT for this board has `&gmac1 { status =
        # "disabled"; }` for this reason). No SPI, no eMMC — custom
        # Armbian image is written to the SD card by the operator
        # before this inventory is exercised. The card stays
        # inserted permanently. PoE provides power; PoE cycling is
        # the only available power control surface for these boards.
        #
        # NOTE: ethernet chip per Xunlong's published BOM for the
        # board revision in operator's hands as of 2026-05; revisions
        # are known to vary across production runs even for the same
        # SKU. Validate with `ethtool -i end0` if behavior diverges.
        #
        # This example shows the local_kernel boot mode: the board
        # runs a rootfs on its NVMe drive. U-Boot fetches kernel,
        # initrd, and DTB from TFTP (the passthrough model), then
        # mounts armbi_root_local as /. Single root partition at p1
        # is the canonical layout — disk_provision DSL creates one
        # partition that grows to fill the disk.
        # persist_via: hook keeps the extlinux.conf updated on the
        # local disk so the board stays bootable after kernel updates.
        orange_pi_5_pro:
          hosts:
            orange-pi-5-pro-01:
              ansible_host: 192.168.1.111
              armbian_netboot_board_mac: "aa:bb:cc:dd:ee:11"
              armbian_netboot_board_model: orange-pi-5-pro
              armbian_netboot_boot_mode: local_kernel
              armbian_netboot_local_kernel:
                persist_via: hook
              armbian_netboot_local_disks:
                - device: /dev/nvme0n1
                  wipe: true
                  layout:
                    - id: root
                      size: grow
                      type: root
                      format: ext4
                      label: armbi_root_local
                      mount: /
              armbian_netboot_poe_switch: switch
              armbian_netboot_poe_port: ether4

        # Orange Pi 5: RK3588S, Motorcomm YT8531C 1GbE PHY on SoC
        # GMAC1, SPI flash. Note this is the GMAC + external PHY
        # path (different from the Pro variant, which uses an
        # on-board PCIe NIC and ships gmac1 disabled in DT).
        # Mainline u-boot v2026.04's `CONFIG_PHY_MOTORCOMM=y`
        # nominally covers YT85xx, but C-variant support may be
        # incomplete on a given upstream tag — verify with kernel
        # bind output if PXE silently fails.
        # armbian/build's orangepi5.conf
        # `post_family_config__orangepi5_use_mainline_uboot` hook
        # forces mainline v2026.04 on every branch (current, edge,
        # vendor); branch selection in build_image.yml is effectively
        # cosmetic for this board.
        #
        # NOTE: ethernet chip per Xunlong's published BOM for the
        # operator's board revision as of 2026-05; revisions vary
        # — confirm with `ethtool -i end0` and `dmesg | grep -i phy`.
        orange_pi_5:
          hosts:
            orange-pi-5-01:
              ansible_host: 192.168.1.114
              armbian_netboot_board_mac: "00:00:00:00:00:00"
              armbian_netboot_board_model: orange-pi-5
              armbian_netboot_boot_mode: nfs
              armbian_netboot_poe_switch: switch
              armbian_netboot_poe_port: ether7

        # Rock 5A: RK3588S, Realtek RTL8211F 1GbE PHY on SoC GMAC1
        # (per Radxa product page + mainline u-boot's
        # `rk3588s-rock-5a.dts` PHY node carrying compatible
        # `ethernet-phy-id001c.c916` — the Realtek OUI). SPI flash,
        # eMMC. Uses build_branches: edge in build_image.yml, which
        # triggers our `__999_rock5a_use_mainline_uboot` userpatch
        # (the upstream rock-5a.conf has no mainline-uboot edge hook;
        # without our override the family default Radxa
        # next-dev-v2024.10 fork is used, which patches PXE-first
        # incorrectly because the fork uses BOOT_TARGET_DEVICES
        # X-macro rather than the legacy #define BOOT_TARGETS form).
        #
        # NOTE: ethernet chip per upstream sources; revisions vary —
        # confirm with `ethtool -i end0` if behavior diverges.
        rock_5a:
          hosts:
            rock-5a-01:
              ansible_host: 192.168.1.113
              armbian_netboot_board_mac: "00:00:00:00:00:00"
              armbian_netboot_board_model: rock-5a
              armbian_netboot_boot_mode: nfs
              armbian_netboot_poe_switch: switch
              armbian_netboot_poe_port: ether6

        # Orange Pi 5 Max: RK3588 with Realtek RTL8125BG PCIe 2.5GbE
        # NIC, SPI flash, NVMe slot. Uses edge U-Boot (mainline
        # v2025.04 via armbian/build's
        # `post_family_config_branch_edge__orangepi5max_use_mainline_uboot`
        # hook) because the family-default Radxa next-dev-v2024.10
        # fork lacks the r8169-family driver entirely.
        #
        # NOTE: ethernet chip per Xunlong's published BOM; revisions
        # may vary — confirm with `lspci -nn | grep -i ethernet`
        # if behavior diverges.
        orange_pi_5_max:
          hosts:
            orange-pi-5-max-01:
              ansible_host: 192.168.1.112
              armbian_netboot_board_mac: "00:00:00:00:00:00"
              armbian_netboot_board_model: orange-pi-5-max
              armbian_netboot_boot_mode: nfs
              armbian_netboot_poe_switch: switch
              armbian_netboot_poe_port: ether5

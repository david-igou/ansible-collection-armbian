---
# Variables that apply to every host in this inventory.
#
# Most cross-cutting collection-level variables live here so they're loaded
# regardless of which group a play targets. Per-host SSH settings
# (ansible_host, ansible_user, ansible_port) live on the host entries
# themselves; per-group connection plumbing
# (ansible_connection / ansible_network_os) lives in group_vars/<group>.yml.

# ── armbian_netboot collection ──────────────────────────────────────────────
# Two-host topology:
#
#   TFTP for SBCs   → rb5009 (RouterOS), per-subnet IP (e.g. 10.10.9.1
#                     for vlan9). flash:/sbc/ holds per-model
#                     kernel/initrd/dtb + per-board pxelinux.cfg.
#                     Provisioned via /ip tftp rules registered by
#                     stage_tftp_assets.yml + converge_boot_mode.yml.
#   NFS rootfs      → TrueNAS host, 10.10.9.213. Exports
#                     /mnt/ssd/netboot/rootfs to 10.10.9.0/24.
#   HTTP for images → public nginx container on TrueNAS, vlan45 at
#                     10.10.45.241, FQDN public.igou.systems (HTTPS via
#                     Let's Encrypt; HTTP on :80 also works). Serves
#                     /boot-files from /mnt/ssd/public/boot-files on the
#                     host. Read by armbian_netboot_image_urls below
#                     (image_extract on netboot_server, disk_image on
#                     boards).
#
# `next-server` for the SBC subnet must point at rb5009 (the local
# subnet's rb5009 IP). This collection does NOT manage next-server —
# it is owned by the operator's separate RouterOS-config repo (e.g.
# igou-ansible's deploy_netboot_binaries.yml).
armbian_netboot_server_ip: "10.10.9.213"
armbian_netboot_nfs_server_ip: "10.10.9.213"

# Per-board Armbian .img.xz source, keyed by armbian_netboot_board_model.
# Each value is an https:// URL, http:// URL, or absolute path. Consumed
# by both the image_extract role on the netboot_server (Phase 1 of
# test_fleet_e2e.yml, and stage_netboot_assets.yml) and the disk_image
# role on each board (Phase 3 dd-to-SD); whichever value you set must be
# reachable from both. Required by the collection's preflight — missing
# entries fail fast in stage_netboot_assets.yml.
armbian_netboot_image_urls:
  orange-pi-5-pro: "https://public.igou.systems/boot-files/images/orangepi5pro/Armbian-unofficial_<version>_Orangepi5pro_<dist>_current_<kver>_minimal.img.xz"
  rock-5b: "https://public.igou.systems/boot-files/images/rock-5b/Armbian-unofficial_26.05.0-trunk_Rock-5b_bookworm_edge_7.0.6_minimal.img.xz"
  orange-pi-5: "https://public.igou.systems/boot-files/images/orangepi5/Armbian-unofficial_<version>_Orangepi5_<dist>_current_<kver>_minimal.img.xz"
  rock-5a: "https://public.igou.systems/boot-files/images/rock-5a/Armbian-unofficial_<version>_Rock-5a_<dist>_current_<kver>_minimal.img.xz"
  orange-pi-5-max: "https://public.igou.systems/boot-files/images/orangepi5-max/Armbian-unofficial_<version>_Orangepi5-max_<dist>_edge_<kver>_minimal.img.xz"

# U-Boot branch — informational; the canonical branch source is each
# armbian_netboot_board_configs.<model>.uboot_apt_package field in the
# collection.
armbian_netboot_branch: "current"

# Public SSH keys installed on a board's freshly-flashed Armbian image
# by `playbooks/bootstrap_armbian.yml`. Used by both the operator's
# manual bootstrap workflow and the e2e harness's auto-bootstrap path.
#
# Required (the role asserts non-empty before doing anything destructive).
# Duplicate this list verbatim into your real inventory's
# group_vars/all/<file>.yml — the doc-only inventory here is not loaded
# at runtime.
armbian_netboot_bootstrap_ssh_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOWgNfV1zdod84sj28d+z7YBLkaD5ZImElWt8zHw+u7/"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINHO7UsiIgAepf5+s2z+1CbPQf2eqJo8aNK/vT9Oaf4B"

# Verbose / diagnostic kernel cmdline for PXE-booted boards.
#
# When true, roles/routeros_pxe_config/templates/pxelinux_cfg.j2 appends
# a diagnostic suffix to the append line (earlycon, loglevel=8,
# initcall_debug, systemd.log_target=console, ...). Per-host overrides
# win: setting `armbian_netboot_pxe_verbose: true` in host_vars flips
# just that board into verbose mode.
armbian_netboot_pxe_verbose: false

# Topology variable — set at inventory scope because build_image.yml's
# publish play consumes it without loading the netboot_assets role.
armbian_netboot_nfs_assets_export: /mnt/ssd/public/boot-files

# Root password on a freshly flashed Armbian image. Used by
# playbooks/bootstrap_armbian.yml to connect as root via password
# auth before the SSH-key user is provisioned. "1234" is the
# Armbian default — encrypt with ansible-vault in any real inventory.
armbian_netboot_default_password: "1234"

# ── Cross-role path defaults ────────────────────────────────────────────────
# These live at group_vars/all scope (rather than role defaults) because
# multiple roles consume them and duplicating across role defaults is a
# drift vector.
armbian_netboot_nfs_rootfs_path: /mnt/ssd/netboot/rootfs
armbian_netboot_tftp_flash_dir: sbc
# Anchor on inventory_dir, not playbook_dir — playbook_dir resolves
# to different directories in stage_router.yml (playbooks/) vs the
# imported routeros/upload_tftp_assets.yml (playbooks/routeros/),
# which caused the fetch to land in one path and the upload to look
# in another. inventory_dir is the same in both contexts.
#
# IMPORTANT: if your inventory dir is a symlink (e.g. .inventory →
# ../some-other-repo), don't use this relative form — set an absolute
# path instead. fetch resolves dest lexically while stat/file resolve
# via POSIX symlink-follow, so the two tasks land on different
# physical paths when `..` crosses a symlink.
armbian_netboot_tftp_cache_dir: "{{ inventory_dir }}/../.cache/sbc-tftp"
# Scratch dir on the netboot_server where image_extract caches .img.xz / .img
# downloads and writes per-model TFTP artefacts (sbc-tftp/<model>/vmlinuz, ...).
# Read by stage_netboot_assets.yml and stage_router.yml. Both fall back to the
# value below if this is not set in your real inventory.
armbian_netboot_image_cache: /var/lib/armbian_netboot/cache

# ---------------------------------------------------------------------
# local_kernel mode (per host)
# ---------------------------------------------------------------------
# Opt a host into local_kernel mode by setting:
#   armbian_netboot_boot_mode: local_kernel
# and an optional override block:
#   armbian_netboot_local_kernel:
#     persist_via: hook       # 'hook' (default) | 'spi'
#     # storage: "nvme 0:4"   # default from vars/boards.yml's local_kernel.storage
#     # storage_scan: "nvme scan"
#     # root_label: armbi_root_local
#
# persist_via:
#   hook — use the U-Boot binary's compile-time default localcmd (baked
#          by playbooks/build_image.yml's __999_local_kernel_bake hook).
#          No runtime fw_setenv step. Default.
#   spi  — write per-host localcmd to SPI via fw_setenv at convergence
#          time. Only valid on boards with uboot_env.storage: spi_flash.
#
# armbian_netboot_uboot_env_extra (escape hatch, host or group scope):
#   Flat dict of arbitrary U-Boot env vars merged into the converged
#   set with highest precedence. Can override anything in
#   uboot_env.defaults, ethaddr derived from board_mac, or the
#   collection-rendered localcmd. Documented as "you own what you
#   override."
#
# armbian_netboot_persist_uboot_env (playbook-level knob):
#   auto    — default; run step 3.5 for hosts where uboot_env.storage
#             == spi_flash.
#   always  — run step 3.5 unconditionally (no-op on NOWHERE hosts).
#   never   — skip step 3.5 entirely.

# Default block device for SD-card reimaging (test_fleet_e2e.yml Phase 0).
# Override per-host in inventory if a future board's SD slot enumerates
# differently (see CLAUDE.md "MMC controller index varies per board").
armbian_netboot_sd_device: /dev/mmcblk0

---
# Variables that apply to every host in this inventory.
#
# Most cross-cutting collection-level variables live here so they're loaded
# regardless of which group a play targets. Per-host SSH settings
# (ansible_host, ansible_user, ansible_port) live on the host entries
# themselves; per-group connection plumbing
# (ansible_connection / ansible_network_os) lives in group_vars/<group>.yml.

# ── armbian_netboot collection ──────────────────────────────────────────────
# Two-host topology:
#
#   TFTP for SBCs   → rb5009 (RouterOS), per-subnet IP (e.g. 10.10.9.1
#                     for vlan9). flash:/sbc/ holds per-model
#                     kernel/initrd/dtb + per-board pxelinux.cfg.
#                     Provisioned via /ip tftp rules registered by
#                     stage_netboot_assets.yml + enable_netboot.yml.
#   NFS rootfs      → TrueNAS host, 10.10.9.213. Exports
#                     /mnt/ssd/netboot/rootfs to 10.10.9.0/24.
#   HTTP for images → public nginx container on TrueNAS, vlan45 at
#                     10.10.45.241, FQDN public.igou.systems (HTTPS via
#                     Let's Encrypt; HTTP on :80 also works). Serves
#                     /boot-files from /mnt/ssd/public/boot-files on the
#                     host. Read by armbian_image_urls below. Used only
#                     by stage_netboot_assets.yml when fetching .img.xz.
#
# `next-server` for the SBC subnet must point at rb5009 (the local
# subnet's rb5009 IP). This collection does NOT manage next-server —
# it is owned by the operator's separate RouterOS-config repo (e.g.
# igou-ansible's deploy_netboot_binaries.yml).
netboot_server_ip: "10.10.9.213"
nfs_server_ip: "10.10.9.213"

# Per-board Armbian .img.xz URLs, keyed by board_model. Lives at the
# `all` scope (not `boards`) because the consumer is the netboot_assets
# role running against the netboot_server, which is not in the boards
# group. Required by the collection's preflight — missing entries fail
# fast in stage_netboot_assets.yml. Browse
# https://dl.armbian.com/<board>/ or the aliased redirect (e.g.
# https://dl.armbian.com/orangepi5pro/Trixie_current_minimal) for a
# newer one.
armbian_image_urls:
  orange-pi-5-pro: "https://public.igou.systems/boot-files/images/orangepi5pro/Armbian-unofficial_<version>_Orangepi5pro_<dist>_current_<kver>_minimal.img.xz"
  rock-5b: "https://public.igou.systems/boot-files/images/rock-5b/Armbian-unofficial_26.05.0-trunk_Rock-5b_bookworm_current_6.18.29_minimal.img.xz"

# U-Boot branch — informational; the canonical branch source is each
# board_configs.<model>.uboot_apt_package field in the collection.
armbian_branch: "current"

# Public SSH keys installed on a board's freshly-flashed Armbian image
# by `playbooks/bootstrap_armbian.yml`. Used by both the operator's
# manual bootstrap workflow and the e2e harness's auto-bootstrap path
# (test_hardware_e2e.yml shells out to bootstrap_armbian.yml when it
# detects a freshly-reflashed board).
#
# Required (the role asserts non-empty before doing anything destructive).
# Duplicate this list verbatim into your real inventory's
# group_vars/all/<file>.yml — the doc-only inventory here is not loaded
# at runtime.
bootstrap_armbian_ssh_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOWgNfV1zdod84sj28d+z7YBLkaD5ZImElWt8zHw+u7/"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINHO7UsiIgAepf5+s2z+1CbPQf2eqJo8aNK/vT9Oaf4B"

# Verbose / diagnostic kernel cmdline for PXE-booted boards.
#
# When true, roles/routeros_sbc_tftp/templates/pxelinux_cfg.j2 appends a
# diagnostic suffix to the APPEND line (earlycon, loglevel=8,
# initcall_debug, systemd.log_target=console, …). The intent is to make
# the kernel-init and userspace-init phases visible on serial when
# investigating boards that boot but never reach sshd — see issue #38
# for the failure modes that motivated this.
#
# Per-host overrides win: setting `pxelinux_verbose: true` in
# host_vars/<board>.yml flips just that board into verbose mode without
# affecting the rest of the fleet. Most useful as a one-off via -e:
#
#   ansible-playbook playbooks/enable_netboot.yml \
#     --limit orange-pi-5-pro-01 \
#     -e pxelinux_verbose=true
#
# Requires per-board earlycon metadata in vars/boards.yml; the
# routeros_sbc_tftp role asserts this at render time.
pxelinux_verbose: false

# Topology variable — set at inventory scope (rather than relying on
# roles/netboot_assets/defaults/main.yml) because build_image.yml's
# publish play consumes it without loading the netboot_assets role.
# Mirrors the role default; override only if your homelab layout differs.
nfs_assets_export: /mnt/ssd/public/boot-files

# Other collection path defaults — role-scoped consumers only, loaded
# via the role's defaults/main.yml. Override at the role-vars level if
# they need to differ from these:
#
#   nfs_rootfs_path     /mnt/ssd/netboot/rootfs                         (TrueNAS NFS export)
#   armbian_image_cache /mnt/ssd/netboot/cache                          (TrueNAS)
#   sbc_tftp_flash_dir  sbc                                             (rb5009 flash:/)
#   sbc_tftp_cache_dir  {{ playbook_dir }}/../.cache/sbc-tftp           (control node)

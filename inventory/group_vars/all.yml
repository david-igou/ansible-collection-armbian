---
# ── Addresses ────────────────────────────────────────────────────────────────
netboot_server_ip: "192.168.1.10"
routeros_host: "192.168.1.1"
routeros_api_user: "ansible"
routeros_dhcp_server_name: "dhcp1"

# ── NFS export paths on the netboot server ───────────────────────────────────
# These must already exist and be exported before running setup_netboot.yml.
nfs_rootfs_path: /exports/rootfs
tftp_nfs_export: /opt/netbootxyz/config
nfs_assets_export: /opt/netbootxyz/assets

# ── Local mount base on the Ansible control node ─────────────────────────────
nfs_local_mount: /mnt/netboot

# tftp_base resolves through the NFS mount; used when writing pxelinux.cfg
tftp_base: "{{ nfs_local_mount }}/tftp"

# ── Armbian image URLs ────────────────────────────────────────────────────────
# Set to the full .img.xz URL for each board model.
# Browse https://dl.armbian.com/<armbian_dl_dir>/ to find the current URL.
armbian_image_urls:
  orange-pi-5: ""
  orange-pi-5-pro: ""
  orange-pi-5-max: ""
  rock-5b: ""
  rock-5a: ""

# U-Boot branch — determines which linux-u-boot-<branch>-<board> package is used
armbian_branch: "current"

# ── RouterOS credentials ──────────────────────────────────────────────────────
# Encrypt routeros_api_password with ansible-vault
routeros_api_password: "changeme"

# ── Board SSH defaults ────────────────────────────────────────────────────────
ansible_user: "armbian"
ansible_become: true
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

# ── Armbian default credentials (NFS root environment) ───────────────────────
# Used by reprovision.yml to SSH into boards booted from the NFS rootfs.
# The fresh Armbian image has root/1234 until first interactive login.
# Encrypt with ansible-vault before committing.
armbian_default_password: "1234"

---
# community.routeros connection parameters — SSH / network_cli
ansible_connection: "ansible.netcommon.network_cli"
ansible_network_os: "community.routeros.routeros"
ansible_user: "{{ routeros_ssh_user }}"
ansible_port: "{{ routeros_ssh_port | default(22) }}"
# Authentication is SSH key based — no password is set here. Provision keys
# with playbooks/bootstrap_routeros_user.yml before running other playbooks.

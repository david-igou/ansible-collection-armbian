---
# Variables for the `armbian` group — parent group covering both
# `armbian_builders` and `boards`. Values here are visible on every
# host this collection touches as part of the armbian fleet, but not
# on unrelated inventory (routeros switches, kubernetes nodes, etc.).
#
# This file is part of the documentation-only inventory under
# inventory/. Copy required vars to your real inventory's
# group_vars/armbian.yml before first run.

# ── Fleet-wide armbian/build userpatches ─────────────────────────────
# Shared userpatches applied to every board build by
# playbooks/build_image.yml. v1's only entry is the rk3588 family-level
# PXE-first override + adjacent rk3588 family hooks (see below).
#
# Path `config/sources/families/rockchip-rk3588.conf` is the idiomatic
# armbian/build user overlay path for per-family logic: main-config.sh's
# source_family_config_and_arch() sources
# ${SRC}/config/sources/families/<family>.conf then
# ${USERPATCHES_PATH}/config/sources/families/<family>.conf. Our overlay
# ADDS to armbian's family file (doesn't replace), and functions defined
# here get registered by initialize_extension_manager which runs LATER
# in the build flow.
#
# Hook suffix `__999_pxe_first` forces this to sort LAST among
# pre_config_uboot_target hooks (armbian/build's extension manager
# auto-prefixes hooks without a numeric ID with `500_` and sorts with
# LC_ALL=C --general-numeric-sort; see extensions.sh:222-238). This wins
# against per-board hooks like
# `pre_config_uboot_target__rock5b_patch_rockchip_common_boot_order`
# which sets a board-vendor-preferred SD-first order.
#
# The sed is a no-op on u-boot trees that don't use the legacy
# `#define BOOT_TARGETS "..."` form (e.g. Radxa's next-dev-v2024.10 fork
# uses the X-macro `BOOT_TARGET_DEVICES(func)` form instead — but that
# fork lacks RTL8125 PCIe driver anyway, so the collection ships
# affected boards on the edge branch which uses mainline u-boot v2026.04
# with the legacy form (the per-board conf overlay in
# inventory/group_vars/rock_5b.yml carries a hook that overrides
# armbian/build's v2026.01 pin on the rock-5b board config). See
# armbian_board_branch in inventory/group_vars/<model_group>.yml.
#
# The `{{ _local_kernel_dispatch_table }}` and
# `{{ _uboot_env_storage_table }}` references are facts set by
# playbooks/build_image.yml's pre_tasks (templated from vars/boards.yml).
# Group_vars Jinja is lazy-evaluated at use site, and the builder host
# has those facts set by the time the include_role expression resolves.
build_userpatches_common:
  - dest: "config/sources/families/rockchip-rk3588.conf"
    content: |
      function pre_config_uboot_target__999_pxe_first() {
          # Legacy distro_bootcmd boot order (only takes effect on
          # u-boot trees that haven't moved to bootstd yet, or that
          # still expose boot_targets as a runtime knob).
          declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
          sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" \
              include/configs/rockchip-common.h

          # rk3588(s) U-Boot defconfig backfill for our local_kernel
          # boot model. All rk3588(s) boards in this collection are
          # used with PCIe NVMe for local_kernel root storage; some
          # upstream defconfigs ship without CONFIG_PCI=y (assuming
          # the M.2 slot is WiFi, e.g. rock5a-rk3588s_defconfig), or
          # with CONFIG_PCI=y but without CONFIG_PCI_INIT_R=y (means
          # bootstd's bootflow scan won't see the PCIe NIC at
          # init_r → silent PXE failure on Rock 5B's RTL8125), or
          # without CONFIG_CMD_NVME=y / CONFIG_NVME_PCI=y (means the
          # baked localcmd chain hits `Unknown command 'nvme'` and
          # falls through to SD boot). Backfill all four
          # unconditionally — they're harmless on boards without
          # PCIe NVMe and required for the boards that do.
          local defconfig="configs/${BOOTCONFIG}"
          if [[ -f "$defconfig" ]]; then
              grep -q "^CONFIG_PCI=y" "$defconfig" \
                  || echo "CONFIG_PCI=y" >> "$defconfig"
              grep -q "^CONFIG_PCIE_DW_ROCKCHIP=y" "$defconfig" \
                  || echo "CONFIG_PCIE_DW_ROCKCHIP=y" >> "$defconfig"
              grep -q "^CONFIG_PCI_INIT_R=y" "$defconfig" \
                  || echo "CONFIG_PCI_INIT_R=y" >> "$defconfig"
              grep -q "^CONFIG_CMD_NVME=y" "$defconfig" \
                  || echo "CONFIG_CMD_NVME=y" >> "$defconfig"
              grep -q "^CONFIG_NVME_PCI=y" "$defconfig" \
                  || echo "CONFIG_NVME_PCI=y" >> "$defconfig"
          fi
      }

      # Generic local_kernel bake hook. Replaces the OPi5Max-specific
      # __999_orangepi5max_localcmd hook from #82. The dispatch table
      # below is templated by Ansible from vars/boards.yml at playbook
      # run time — adding a new board to local_kernel means adding a
      # local_kernel:{storage,storage_scan} block to its entry in
      # vars/boards.yml (storage = full device address including partition
      # number, e.g. "nvme 0:2"), not editing this hook.
      #
      # Approach B per #82's LK1 evidence — explicit ext4load + booti
      # because U-Boot bootstd's bootflow scan skips
      # disk_provision-generated GPT partitions carrying the systemd-
      # repart "GrowFs" attribute bit 59. This hook makes the
      # mechanism board-agnostic.
      #
      # Idempotent: the literal `localcmd=setenv bootargs root=LABEL=`
      # substring is the marker; repeat builds against a cached tree
      # skip the insert. Post-condition grep defends against a silent
      # sed no-op (matched-0-lines).
      function pre_config_uboot_target__999_local_kernel_bake() {
          [[ "${BRANCH}" != "edge" ]] && return 0

          declare -A LOCAL_KERNEL_CHAIN=(
      {{ _local_kernel_dispatch_table | trim }}
          )

          local chain="${LOCAL_KERNEL_CHAIN[${BOARD}]:-}"
          [[ -z "${chain}" ]] && return 0   # board doesn't opt into local_kernel

          # Locate CFG_EXTRA_ENV_SETTINGS in rk3588_common.h (fall
          # back to CONFIG_-prefixed for pre-v2024.01 trees).
          local header marker
          if [[ -f include/configs/rk3588_common.h ]] \
             && grep -qE '^[[:space:]]*#define[[:space:]]+(CFG_|CONFIG_)EXTRA_ENV_SETTINGS' include/configs/rk3588_common.h; then
              header=include/configs/rk3588_common.h
          else
              header="$(grep -lE '^[[:space:]]*#define[[:space:]]+(CFG_|CONFIG_)EXTRA_ENV_SETTINGS' include/configs/rk3588*.h 2>/dev/null | head -n 1)"
          fi
          if [[ -z "${header}" ]]; then
              exit_with_error "${BOARD}: no EXTRA_ENV_SETTINGS in include/configs/rk3588*.h — upstream changed; fix __999_local_kernel_bake"
          fi
          if grep -q '^[[:space:]]*#define[[:space:]]\+CFG_EXTRA_ENV_SETTINGS' "${header}"; then
              marker='^[[:space:]]*#define[[:space:]]\+CFG_EXTRA_ENV_SETTINGS'
          else
              marker='^[[:space:]]*#define[[:space:]]\+CONFIG_EXTRA_ENV_SETTINGS'
          fi
          display_alert "${BOARD}" "localcmd target macro found in ${header}" "info"

          # Idempotency: skip if any localcmd marker is already present.
          if grep -q 'localcmd=setenv bootargs root=LABEL=' "${header}"; then
              display_alert "${BOARD}" "localcmd already baked into ${header}" "info"
              return 0
          fi

          local tmp
          tmp="$(mktemp)"
          printf '\t"localcmd=%s\\0" \\\n' "${chain}" > "${tmp}"
          sed -i "/${marker}/r ${tmp}" "${header}"
          rm -f "${tmp}"

          if ! grep -q 'localcmd=setenv bootargs root=LABEL=' "${header}"; then
              exit_with_error "${BOARD}: localcmd bake silently failed — marker matched 0 lines in ${header}"
          fi

          display_alert "${BOARD}" "baked local_kernel localcmd chain into U-Boot default env" "info"
      }

      # Defconfig-vs-vars/boards.yml env-storage drift check.
      # Runs after defconfig is laid down. Greps the finalized
      # defconfig (configs/${BOOTCONFIG}) for CONFIG_ENV_IS_*=y,
      # maps the match to {nowhere, spi_flash, mmc}, compares to the
      # expected value from vars/boards.yml. Mismatch fails the build
      # loudly so drift can't ship silently.
      function pre_config_uboot_target__999_uboot_env_check() {
          declare -A EXPECTED_STORAGE=(
      {{ _uboot_env_storage_table | trim }}
          )
          local expected="${EXPECTED_STORAGE[${BOARD}]:-}"
          [[ -z "${expected}" ]] && return 0    # board has no uboot_env block; skip

          local defconfig="configs/${BOOTCONFIG}"
          if [[ ! -f "${defconfig}" ]]; then
              display_alert "${BOARD}" "defconfig ${defconfig} not present; skip uboot_env check" "wrn"
              return 0
          fi

          # The defconfig SOURCE file only carries CONFIG_ENV_IS_*=y
          # when the board explicitly opts INTO non-default env
          # storage. U-Boot's Kconfig default when nothing is
          # selected is ENV_IS_NOWHERE (see u-boot's env/Kconfig
          # `default ENV_IS_NOWHERE`). So a defconfig with no
          # CONFIG_ENV_IS_*=y line discovers as `nowhere`.
          local discovered=nowhere
          if grep -q '^CONFIG_ENV_IS_NOWHERE=y' "${defconfig}"; then
              discovered=nowhere
          elif grep -q '^CONFIG_ENV_IS_IN_SPI_FLASH=y' "${defconfig}"; then
              discovered=spi_flash
          elif grep -q '^CONFIG_ENV_IS_IN_MMC=y' "${defconfig}"; then
              discovered=mmc
          fi

          declare -A DISCOVERED_SYMBOL=(
              [nowhere]=CONFIG_ENV_IS_NOWHERE
              [spi_flash]=CONFIG_ENV_IS_IN_SPI_FLASH
              [mmc]=CONFIG_ENV_IS_IN_MMC
          )
          # NOTE: pre_config_uboot_target fires BEFORE armbian/build
          # applies board-config-level defconfig fragments that may
          # add CONFIG_ENV_IS_IN_SPI_FLASH=y or similar. So
          # `discovered` here reflects the SOURCE defconfig only,
          # not the final resolved config. False-positive mismatches
          # (e.g. rock-5b's source defconfig has no CONFIG_ENV_IS_*
          # but the running binary uses SPI) downgrade this from a
          # build-blocker to a warning. A future improvement would
          # move the check to a post-defconfig hook stage.
          if [[ "${discovered}" != "${expected}" ]]; then
              display_alert "${BOARD}" "uboot_env.storage drift suspected: defconfig reports ${DISCOVERED_SYMBOL[${discovered}]}=y but vars/boards.yml says uboot_env.storage=${expected}; may be a false positive if board-config patches in env storage later" "wrn"
          else
              display_alert "${BOARD}" "uboot_env.storage matches defconfig (${discovered})" "info"
          fi
      }

      # Suppress the bcmdhd Broadcom WiFi DKMS driver. Some rk3588
      # boards (e.g. orangepi5-max) `enable_extension "bcmdhd"` +
      # `BCMDHD_TYPE="sdio"` in their armbian/build board config,
      # which downloads armbian/bcmdhd-dkms and rebuilds it inside
      # the rootfs chroot. On the edge kernel (7.0.7-rockchip64)
      # gcc segfaults compiling dhd_dbg_ring.c, aborting the build.
      # Netboot boards run wired-only; on-board WiFi is unused.
      # extensions/bcmdhd.sh's deb-install hook short-circuits on
      # `[[ -z $BCMDHD_TYPE ]]`, so clearing the var at
      # extension_finish_config (after the extension's own
      # __500_install_kernel_headers_for_bcmdhd_dkms hook runs) makes
      # it a no-op. INSTALL_HEADERS is reverted to match
      # BUILD_MINIMAL=yes intent.
      function extension_finish_config__999_no_bcmdhd_for_netboot() {
          [[ -z "${BCMDHD_TYPE}" ]] && return 0
          display_alert "${BOARD}" "disabling bcmdhd DKMS (wired netboot, no WiFi needed)" "info"
          unset BCMDHD_TYPE
          declare -g INSTALL_HEADERS="no"
      }

---
# Defaults for all RK3588/RK3588S boards.
# Override these in host_vars for boards that differ.

# Armbian U-Boot package name suffix — set per board_model in vars/boards.yml
# but these defaults apply if not found there
uboot_spi_image: "u-boot-rockchip-spi.bin"
uboot_emmc_image: "u-boot-rockchip.bin"

# The eMMC device that holds the U-Boot boot partition (mmcblk0boot0)
emmc_device: "/dev/mmcblk0"

# NVMe device — present on boards with an M.2 slot
nvme_device: "/dev/nvme0n1"

# Serial console for kernel cmdline; all current RK3588 boards use ttyS2
board_console: "ttyS2,1500000n8"

# Armbian repo suite used when installing the u-boot package on the board
armbian_apt_suite: "bookworm"

# U-Boot environment tool (present on all Armbian RK3588 installs)
fw_env_config: "/etc/fw_env.config"

# Default boot order: disk first, PXE fallback
# Boot order written to the SD card U-Boot env for non-SPI boards.
# PXE is first so DHCP options alone control whether the board netboots.
# When DHCP provides no next-server, PXE fails gracefully and U-Boot
# falls through to mmc0/nvme0.
uboot_boot_targets_pxe: "pxe dhcp mmc0 nvme0 mmc1"

# U-Boot environment location on disk — used by fw_setenv when writing
# the PXE-first environment to an SD card.
# Verify against /etc/fw_env.config on a running Armbian RK3588 board
# if the default does not match your hardware.
uboot_sd_env_offset: "0x3f8000"
uboot_sd_env_size: "0x8000"

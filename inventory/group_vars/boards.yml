---
# Variables for the `boards` group — values inherited by every host
# in the boards group and its per-model subgroups (e.g.
# orange_pi_5_pro).
#
# This file is part of the documentation-only inventory under
# inventory/. Copy required vars to your real inventory's
# group_vars/boards.yml (the same file path in your .inventory/ or
# whatever directory ANSIBLE_INVENTORY points at) before first run.

# ── netboot router selection ─────────────────────────────────────────
# Required: inventory hostname of the router that owns SBC TFTP state
# for boards in this group. Top-level playbooks (converge_boot_mode,
# test_hardware_e2e, persist_uboot_env) use this as delegate_to for
# router mutation tasks (per-board pxelinux.cfg upload, /ip tftp rows).
#
# Must be an inventory host with the matching network_cli connection
# settings — typically a member of the `routeros_router` group.
# Override per-host (host_vars/<board>.yml) if a specific board is
# served by a different router. No default — set this in your real
# inventory's group_vars/boards.yml; an unset value will cause
# router-delegated tasks to fail with an explicit ansible error.
# armbian_router: <inventory-hostname-of-your-routeros-router>

# ── boot-mode retry/timeout knobs (optional overrides) ───────────────
# Defaults live in roles/board_boot_wait/defaults/main.yml and are
# consumed by playbooks/tasks/cold_boot_with_retry.yml and
# playbooks/tasks/wait_for_ssh_with_cycle_retry.yml. See
# docs/retry-configuration.md for tuning intuition and recommended
# combinations (healthy / flaky-PoE / max-consistency / fast-iter /
# fresh-rootfs).
#
# NB: test_fleet_e2e.yml defaults armbian_boot_retry_attempts
# to 1 at play scope (one auto-retry per phase) so a single SD
# voltage-select flake doesn't drop a host from the fleet run. Set it
# explicitly here to override that default fleet-wide.
#
# armbian_boot_retry_attempts: 0
# armbian_boot_attempt_timeout: 180
# armbian_ssh_wait_timeout: 90
# armbian_ssh_wait_retry_attempts: "{{ armbian_boot_retry_attempts }}"
# armbian_post_boot_wait_timeout: 300
# armbian_poe_cycle_delay: 5
#
# Example: production flaky-HAT setup — retries with 60 s cap drain.
# armbian_boot_retry_attempts: 2
# armbian_poe_cycle_delay: 60

# ── Phase D kernel-update target (slow-nvme rec #2) ──────────────────
# Per-host `armbian_kernel_target` is read by Phase D of
# test_fleet_e2e.yml to deterministically install a specific kernel
# version (`state: present`, `allow_downgrade: true`). Precedence:
#   1. per-host `armbian_kernel_target` (deterministic; pins
#      Phase D to the same version every run for fleet homogeneity)
#   2. `-e kernel_update_pin=<version>` (run-time override of all hosts)
#   3. unset / "" → state: latest from apt repo (default mechanism test)
#
# Set per-host in host_vars/<board>.yml or per-model in
# group_vars/<model-group>.yml. Example:
#
# armbian_kernel_target: "26.05.0-trunk"

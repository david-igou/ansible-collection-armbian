# Consumed by the ansible-content-actions sanity reusable workflow,
# which generates its GitHub matrix via `tox --ansible --gh-matrix
# --conf tox-ansible.ini`. Without this file the workflow injects an
# empty default, so the only reason to keep it is the skip list below.
#
# Skip entries are substring-matched against generated env names
# (e.g. "sanity-py3.12-devel"), so a "py3.12-devel" entry removes just
# that python/ansible combination.
#
# py3.12-devel: ansible-core devel requires Python >= 3.13 since June
# 2026, but tox-ansible's matrix table still emits this cell, which then
# fails at `pip install .../devel.tar.gz`. Drop the entry when
# tox-ansible stops generating the combination.
[ansible]

skip =
    py3.12-devel

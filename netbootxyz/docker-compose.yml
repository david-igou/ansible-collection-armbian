---
# Standalone docker-compose for quick bring-up.
# The Ansible netbootxyz role generates a templated version of this file.
# Paths here match the Ansible defaults — adjust if you change them.

services:
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz:latest
    container_name: netbootxyz
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /opt/netbootxyz/config:/config
      - /opt/netbootxyz/assets:/assets
    ports:
      - "69:69/udp"     # TFTP
      - "8080:80"       # HTTP asset server
      - "3000:3000"     # Web UI
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

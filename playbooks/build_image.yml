---
# Builds custom Armbian images for every unique board_model in
# groups['boards'], then publishes the resulting artifact directories to
# the netboot server's HTTP export.
#
# Two plays:
#   1. hosts: armbian_builders — invoke the armbian_build role per
#      unique board_model, then stage each <board>/ directory on the
#      controller at /tmp/armbian_publish/<board>/.
#   2. hosts: netboot_server — push each staged <board>/ directory from
#      the controller into nfs_assets_export/images/<board>/.
#
# The controller mediates the transfer so the only SSH trust required is
# controller→builder and controller→netboot_server (already needed for
# Ansible to reach them). No builder↔netboot_server SSH key is required.
#
# Prerequisites for the publish play:
#   - netboot_server's ansible_user must have passwordless sudo (the
#     publish task uses rsync_path: 'sudo rsync' so the receive side
#     writes the root-owned per-board directories with --mkpath).
#
# The PXE-first userpatches table is playbook data, not role data —
# the armbian_build role itself is intent-agnostic. Add a new board by
# extending build_userpatches with another entry and adding the host(s)
# under groups['boards'] in inventory with a board_model that exists in
# vars/boards.yml.
#
# Usage:
#   ansible-playbook playbooks/build_image.yml

- name: Build custom Armbian images and stage them on the controller
  hosts: armbian_builders
  gather_facts: false
  vars:
    build_userpatches:
      orangepi5:
        - dest: "config/boards/orangepi5.conf"
          content: |
            function pre_config_uboot_target__orangepi5_pxe_first() {
                declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
                sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" \
                    include/configs/rockchip-common.h
            }
      # Each PXE-first userpatch handles BOTH forms that rockchip-common.h
      # appears in across the u-boot trees armbian/build pulls for RK3588:
      #
      #   1. Legacy single-line form (e.g. u-boot-orangepi5pro/v2025.10):
      #          #define BOOT_TARGETS "..."
      #      The OPi5Pro fork ships PXE-first already; the sed below is
      #      effectively a no-op there but documented for explicitness.
      #
      #   2. X-macro form (Radxa next-dev-v2024.10, the rk3588 family
      #      default — used by rock-5b and most other rk3588 boards):
      #          #define BOOT_TARGET_DEVICES(func) \
      #              BOOT_TARGET_USB(func) \
      #              BOOT_TARGET_SD(func) \
      #              ... PXE at position 8 of 9 ...
      #      The python heredoc below reorders this block to put PXE+DHCP
      #      first. Match is on the exact upstream layout; a no-op (silent)
      #      if Radxa changes the macro structure — re-run a Phase-3 smoke
      #      after every u-boot tree refresh to catch drift.
      #
      # The two boards' bodies are identical except for the function name
      # (bash function names cannot contain dashes, so rock-5b uses
      # rock_5b_pxe_first; the suffix after __ is an arbitrary unique-id
      # for armbian/build's extension hook system, not a board encoding).
      orangepi5pro:
        - dest: "config/boards/orangepi5pro.conf"
          content: |
            function pre_config_uboot_target__orangepi5pro_pxe_first() {
                local cfg="include/configs/rockchip-common.h"
                declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
                sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" "$cfg"
                python3 - "$cfg" <<'PYEOF'
            import pathlib, sys
            path = pathlib.Path(sys.argv[1])
            src = path.read_text()
            old_block = (
                "#define BOOT_TARGET_DEVICES(func) \\\n"
                "\tBOOT_TARGET_USB(func) \\\n"
                "\tBOOT_TARGET_SD(func) \\\n"
                "\tBOOT_TARGET_NVME(func) \\\n"
                "\tBOOT_TARGET_SCSI(func) \\\n"
                "\tBOOT_TARGET_EMMC(func) \\\n"
                "\tBOOT_TARGET_MTD(func) \\\n"
                "\tBOOT_TARGET_RKNAND(func) \\\n"
                "\tBOOT_TARGET_PXE(func) \\\n"
                "\tBOOT_TARGET_DHCP(func)"
            )
            new_block = (
                "#define BOOT_TARGET_DEVICES(func) \\\n"
                "\tBOOT_TARGET_PXE(func) \\\n"
                "\tBOOT_TARGET_DHCP(func) \\\n"
                "\tBOOT_TARGET_SD(func) \\\n"
                "\tBOOT_TARGET_EMMC(func) \\\n"
                "\tBOOT_TARGET_NVME(func) \\\n"
                "\tBOOT_TARGET_SCSI(func) \\\n"
                "\tBOOT_TARGET_USB(func) \\\n"
                "\tBOOT_TARGET_MTD(func) \\\n"
                "\tBOOT_TARGET_RKNAND(func)"
            )
            if old_block in src:
                path.write_text(src.replace(old_block, new_block, 1))
            PYEOF
            }
      rock-5b:
        - dest: "config/boards/rock-5b.conf"
          content: |
            function pre_config_uboot_target__rock_5b_pxe_first() {
                local cfg="include/configs/rockchip-common.h"
                local defconfig="configs/rock-5b-rk3588_defconfig"
                # rock-5b uses an RTL8211F gigabit PHY. Radxa's
                # next-dev-v2024.10 defconfig enables CONFIG_GMAC_ROCKCHIP
                # (the MAC controller) but NOT CONFIG_PHY_REALTEK, so
                # U-Boot can't talk to the PHY, link never comes up,
                # DHCP/PXE silently fail. Linux's kernel has the driver
                # so the board boots Armbian fine post-U-Boot, but
                # netboot is broken until this is set. Append-if-absent.
                if [[ -f "$defconfig" ]] && ! grep -q "^CONFIG_PHY_REALTEK=y" "$defconfig"; then
                    echo "CONFIG_PHY_REALTEK=y" >> "$defconfig"
                fi
                declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
                sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" "$cfg"
                python3 - "$cfg" <<'PYEOF'
            import pathlib, sys
            path = pathlib.Path(sys.argv[1])
            src = path.read_text()
            old_block = (
                "#define BOOT_TARGET_DEVICES(func) \\\n"
                "\tBOOT_TARGET_USB(func) \\\n"
                "\tBOOT_TARGET_SD(func) \\\n"
                "\tBOOT_TARGET_NVME(func) \\\n"
                "\tBOOT_TARGET_SCSI(func) \\\n"
                "\tBOOT_TARGET_EMMC(func) \\\n"
                "\tBOOT_TARGET_MTD(func) \\\n"
                "\tBOOT_TARGET_RKNAND(func) \\\n"
                "\tBOOT_TARGET_PXE(func) \\\n"
                "\tBOOT_TARGET_DHCP(func)"
            )
            new_block = (
                "#define BOOT_TARGET_DEVICES(func) \\\n"
                "\tBOOT_TARGET_PXE(func) \\\n"
                "\tBOOT_TARGET_DHCP(func) \\\n"
                "\tBOOT_TARGET_SD(func) \\\n"
                "\tBOOT_TARGET_EMMC(func) \\\n"
                "\tBOOT_TARGET_NVME(func) \\\n"
                "\tBOOT_TARGET_SCSI(func) \\\n"
                "\tBOOT_TARGET_USB(func) \\\n"
                "\tBOOT_TARGET_MTD(func) \\\n"
                "\tBOOT_TARGET_RKNAND(func)"
            )
            if old_block in src:
                path.write_text(src.replace(old_block, new_block, 1))
            PYEOF
            }
  pre_tasks:
    - name: Load board configs for board name lookup
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/boards.yml"

    - name: Resolve unique board_models from groups['boards']
      ansible.builtin.set_fact:
        _board_models: >-
          {{ groups['boards']
             | map('extract', hostvars, 'board_model')
             | unique
             | list }}

    - name: Assert every board_model has a board_configs entry
      ansible.builtin.assert:
        that:
          - item in board_configs
        fail_msg: >-
          board_model '{{ item }}' (from groups['boards']) has no entry in
          vars/boards.yml. Add it there or remove the host from the
          boards group.
      loop: "{{ _board_models }}"

    - name: Resolve build targets from board_configs
      ansible.builtin.set_fact:
        _build_targets: >-
          {{ _board_models
             | map('extract', board_configs, 'armbian_board_name')
             | list }}

    - name: Report build targets
      ansible.builtin.debug:
        msg: "Will build images for: {{ _build_targets }}"

  tasks:
    - name: Build image per inventory board
      ansible.builtin.include_role:
        name: armbian_build
      vars:
        armbian_build_board: "{{ item }}"
        armbian_build_userpatches: "{{ build_userpatches[item] }}"
      loop: "{{ _build_targets }}"

    # rsync invoked via command (not ansible.posix.synchronize) so it
    # always uses SSH — synchronize short-circuits to a local copy when
    # both endpoints are localhost, which is wrong if the controller and
    # the builder don't share a filesystem (e.g. controller in a
    # container, builder on the host reachable via ssh igou@localhost).
    # connection: local forces this task to run on the controller itself,
    # not via SSH back to an inventory entry named localhost.
    - name: Stage built image directory on the controller
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --compress
          - --delete
          - --mkpath
          - --rsh
          - "ssh -p {{ ansible_port | default(22) }}"
          - "{{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }}:{{ armbian_build_output_dir }}/{{ item }}/"
          - "/tmp/armbian_publish/{{ item }}/"
      delegate_to: localhost
      connection: local
      changed_when: true
      loop: "{{ _build_targets }}"

- name: Publish staged images to the netboot server
  hosts: netboot_server
  gather_facts: false
  vars:
    _builder: "{{ groups['armbian_builders'][0] }}"
  tasks:
    - name: Push staged image + manifest to netboot server (sudo on receive)
      ansible.posix.synchronize:
        src: "/tmp/armbian_publish/{{ item }}/"
        dest: "{{ nfs_assets_export }}/images/{{ item }}/"
        delete: false
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--mkpath"
      loop: "{{ hostvars[_builder]._build_targets }}"

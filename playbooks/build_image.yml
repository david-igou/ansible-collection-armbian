---
# Build one custom Armbian image. All inputs are play vars below —
# edit them to pick what gets built. No inventory resolution, no
# pre-task templating; just literal values + a single include_role.
#
# Run:
#   ansible-playbook playbooks/build_image.yml
#
# Output lands at armbian_build_output_dir/<board>/ on the builder.
#
# Companion to playbooks/build_and_publish_from_inventory.yml, which
# composes the same role inputs across every board in groups['boards']
# and also publishes to the netboot server. Use this simplified
# variant for one-off builds where reading the playbook tells you
# exactly what gets built.

- name: Build one Armbian image
  hosts: armbian_builders
  gather_facts: false

  vars:
    # ── EDIT THESE to change what gets built ─────────────────────────
    # armbian/build BOARD= value (must exist in armbian/build's
    # config/boards/<board>.conf).
    armbian_build_board: orangepi5pro

    # current | edge | legacy | vendor — passed as BRANCH= to compile.sh.
    armbian_build_branch: edge

    # Working directory on the builder: armbian/build checkout + cache
    # + userpatches tree live here. Needs ≥50 GiB free. Under the
    # connecting user's home so the role doesn't need sudo on the
    # builder (the fleet playbook uses /var/lib/armbian_build and
    # relies on the role's selective become: true for dir creation).
    armbian_build_cache_dir: "/home/{{ ansible_user }}/armbian_build"

    # Output directory: the final .img.xz and manifest.json land at
    # <armbian_build_output_dir>/<armbian_build_board>/.
    armbian_build_output_dir: "/home/{{ ansible_user }}/armbian_build/output"

    # Userpatches passed to the image_build role. The LOCAL_KERNEL_CHAIN
    # and EXPECTED_STORAGE entries below are hardcoded for the board
    # named above; edit them in tandem when you change armbian_build_board.
    # See inventory/group_vars/armbian.yml for the fleet variant that
    # templates these from vars/boards.yml at runtime.
    armbian_build_userpatches:
      - dest: config/sources/families/rockchip-rk3588.conf
        content: |
          # PXE-first U-Boot boot order + PCIe/NVMe defconfig backfill
          # for the rk3588(s) family. Both pieces are required for the
          # collection's netboot model.
          function pre_config_uboot_target__999_pxe_first() {
              declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
              sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" \
                  include/configs/rockchip-common.h
              local defconfig="configs/${BOOTCONFIG}"
              if [[ -f "$defconfig" ]]; then
                  grep -q "^CONFIG_PCI=y"             "$defconfig" || echo "CONFIG_PCI=y"             >> "$defconfig"
                  grep -q "^CONFIG_PCIE_DW_ROCKCHIP=y" "$defconfig" || echo "CONFIG_PCIE_DW_ROCKCHIP=y" >> "$defconfig"
                  grep -q "^CONFIG_PCI_INIT_R=y"      "$defconfig" || echo "CONFIG_PCI_INIT_R=y"      >> "$defconfig"
                  grep -q "^CONFIG_CMD_NVME=y"        "$defconfig" || echo "CONFIG_CMD_NVME=y"        >> "$defconfig"
                  grep -q "^CONFIG_NVME_PCI=y"        "$defconfig" || echo "CONFIG_NVME_PCI=y"        >> "$defconfig"
              fi
          }

          # Bake a `localcmd` chain into U-Boot's default env so the
          # board can boot kernel+initrd+dtb from a local block device
          # without bootflow scan. Idempotent.
          function pre_config_uboot_target__999_local_kernel_bake() {
              [[ "${BRANCH}" != "edge" ]] && return 0

              declare -A LOCAL_KERNEL_CHAIN=(
                  [orangepi5pro]='setenv bootargs root=LABEL=armbi_root_local rootfstype=ext4 rootwait rw console=ttyS2,1500000n8; nvme scan; ext4load nvme 0:1 ${kernel_addr_r} /boot/Image; ext4load nvme 0:1 ${ramdisk_addr_r} /boot/uInitrd; setenv ramdisk_size ${filesize}; ext4load nvme 0:1 ${fdt_addr_r} /boot/dtb/rockchip/rk3588s-orangepi-5-pro.dtb; booti ${kernel_addr_r} ${ramdisk_addr_r}:${ramdisk_size} ${fdt_addr_r}'
              )

              local chain="${LOCAL_KERNEL_CHAIN[${BOARD}]:-}"
              [[ -z "${chain}" ]] && return 0

              local header marker
              if [[ -f include/configs/rk3588_common.h ]] \
                 && grep -qE '^[[:space:]]*#define[[:space:]]+(CFG_|CONFIG_)EXTRA_ENV_SETTINGS' include/configs/rk3588_common.h; then
                  header=include/configs/rk3588_common.h
              else
                  header="$(grep -lE '^[[:space:]]*#define[[:space:]]+(CFG_|CONFIG_)EXTRA_ENV_SETTINGS' include/configs/rk3588*.h 2>/dev/null | head -n 1)"
              fi
              [[ -z "${header}" ]] && exit_with_error "${BOARD}: no EXTRA_ENV_SETTINGS in include/configs/rk3588*.h"

              if grep -q '^[[:space:]]*#define[[:space:]]\+CFG_EXTRA_ENV_SETTINGS' "${header}"; then
                  marker='^[[:space:]]*#define[[:space:]]\+CFG_EXTRA_ENV_SETTINGS'
              else
                  marker='^[[:space:]]*#define[[:space:]]\+CONFIG_EXTRA_ENV_SETTINGS'
              fi
              grep -q 'localcmd=setenv bootargs root=LABEL=' "${header}" && return 0

              local tmp
              tmp="$(mktemp)"
              printf '\t"localcmd=%s\\0" \\\n' "${chain}" > "${tmp}"
              sed -i "/${marker}/r ${tmp}" "${header}"
              rm -f "${tmp}"
          }

          # Defconfig-vs-expected env-storage drift check; warning-only.
          function pre_config_uboot_target__999_uboot_env_check() {
              declare -A EXPECTED_STORAGE=(
                  [orangepi5pro]='nowhere'
              )
              local expected="${EXPECTED_STORAGE[${BOARD}]:-}"
              [[ -z "${expected}" ]] && return 0

              local defconfig="configs/${BOOTCONFIG}"
              [[ ! -f "${defconfig}" ]] && return 0

              local discovered=nowhere
              if   grep -q '^CONFIG_ENV_IS_NOWHERE=y'      "${defconfig}"; then discovered=nowhere
              elif grep -q '^CONFIG_ENV_IS_IN_SPI_FLASH=y' "${defconfig}"; then discovered=spi_flash
              elif grep -q '^CONFIG_ENV_IS_IN_MMC=y'       "${defconfig}"; then discovered=mmc
              fi
              [[ "${discovered}" != "${expected}" ]] \
                  && display_alert "${BOARD}" "uboot_env.storage drift suspected (defconfig=${discovered}, expected=${expected})" "wrn"
          }

          # Disable the Broadcom bcmdhd DKMS extension on the edge
          # kernel where it segfaults the build. Wired-only netboot.
          function extension_finish_config__999_no_bcmdhd_for_netboot() {
              [[ -z "${BCMDHD_TYPE}" ]] && return 0
              unset BCMDHD_TYPE
              declare -g INSTALL_HEADERS="no"
          }
    # ─────────────────────────────────────────────────────────────────

  tasks:
    - name: Build image
      ansible.builtin.include_role:
        name: image_build

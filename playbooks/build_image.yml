---
# Builds custom Armbian images for every unique armbian_netboot_board_model in
# groups['boards'], then publishes the resulting artifact directories to
# the netboot server's HTTP export.
#
# Two plays:
#   1. hosts: armbian_builders — invoke the armbian_build role per
#      unique armbian_netboot_board_model, then stage each <board>/ directory on the
#      controller at /tmp/armbian_publish/<board>/.
#   2. hosts: netboot_server — push each staged <board>/ directory from
#      the controller into armbian_netboot_nfs_assets_export/images/<board>/.
#
# The controller mediates the transfer so the only SSH trust required is
# controller→builder and controller→netboot_server (already needed for
# Ansible to reach them). No builder↔netboot_server SSH key is required.
#
# Prerequisites for the publish play:
#   - netboot_server's ansible_user must have passwordless sudo (the
#     publish task uses rsync_path: 'sudo rsync' so the receive side
#     writes the root-owned per-board directories with --mkpath).
#
# The PXE-first userpatches table is playbook data, not role data —
# the armbian_build role itself is intent-agnostic. Add a new board by
# extending build_userpatches with another entry and adding the host(s)
# under groups['boards'] in inventory with an armbian_netboot_board_model that exists in
# vars/boards.yml.
#
# Usage:
#   ansible-playbook playbooks/build_image.yml

- name: Build custom Armbian images and stage them on the controller
  hosts: armbian_builders
  gather_facts: false
  vars:
    # Shared userpatches applied to every board build. v1's only entry
    # is the rk3588 family-level PXE-first override (see below).
    #
    # Path `config/sources/families/rockchip-rk3588.conf` is the
    # idiomatic armbian/build user overlay path for per-family logic:
    # main-config.sh's source_family_config_and_arch() sources
    # ${SRC}/config/sources/families/<family>.conf then
    # ${USERPATCHES_PATH}/config/sources/families/<family>.conf.
    # Our overlay ADDS to armbian's family file (doesn't replace), and
    # functions defined here get registered by initialize_extension_manager
    # which runs LATER in the build flow.
    #
    # Hook suffix `__999_pxe_first` forces this to sort LAST among
    # pre_config_uboot_target hooks (armbian/build's extension manager
    # auto-prefixes hooks without a numeric ID with `500_` and sorts
    # with LC_ALL=C --general-numeric-sort; see extensions.sh:222-238).
    # This wins against per-board hooks like
    # `pre_config_uboot_target__rock5b_patch_rockchip_common_boot_order`
    # which sets a board-vendor-preferred SD-first order.
    #
    # The sed is a no-op on u-boot trees that don't use the legacy
    # `#define BOOT_TARGETS "..."` form (e.g. Radxa's
    # next-dev-v2024.10 fork uses the X-macro `BOOT_TARGET_DEVICES(func)`
    # form instead — but that fork lacks RTL8125 PCIe driver anyway, so
    # the collection ships affected boards on the edge branch which
    # uses mainline u-boot v2026.04 with the legacy form (the
    # `__999_rock5b_uboot_v2026_04` hook below overrides armbian/build's
    # v2026.01 pin on the rock-5b board config). See `build_branches`.
    build_userpatches_common:
      - dest: "config/sources/families/rockchip-rk3588.conf"
        content: |
          function pre_config_uboot_target__999_pxe_first() {
              # Legacy distro_bootcmd boot order (only takes effect on
              # u-boot trees that haven't moved to bootstd yet, or that
              # still expose boot_targets as a runtime knob).
              declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
              sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" \
                  include/configs/rockchip-common.h

              # Bootstd / bootflow framework finds boot devices among
              # PCI-enumerated devices. Mainline u-boot rk3588 defconfigs
              # commonly set CONFIG_PCI=y but NOT CONFIG_PCI_INIT_R=y,
              # so PCIe devices (e.g. Rock 5B's RTL8125 NIC) are NOT
              # enumerated at init_r — bootflow scan never sees the NIC
              # → no DHCP request → silent PXE failure (HITS=0 on the
              # TFTP server). Append CONFIG_PCI_INIT_R=y to the defconfig
              # being built (via $BOOTCONFIG, set by armbian/build's
              # per-board config) for any board that opts into CONFIG_PCI.
              local defconfig="configs/${BOOTCONFIG}"
              if [[ -f "$defconfig" ]] \
                 && grep -q "^CONFIG_PCI=y" "$defconfig" \
                 && ! grep -q "^CONFIG_PCI_INIT_R=y" "$defconfig"; then
                  echo "CONFIG_PCI_INIT_R=y" >> "$defconfig"
              fi
          }

          # Bumps rock-5b's mainline u-boot pin from armbian/build's
          # v2026.01 default to v2026.04. armbian/build registers
          # `post_family_config_branch_edge__rock-5b_use_mainline_uboot`
          # (in config/boards/rock-5b.conf) which sets BOOTBRANCH +
          # BOOTPATCHDIR to v2026.01; that hook is auto-prefixed to
          # `500_` by initialize_extension_manager, so our `__999_*`
          # variant sorts after it and wins on the BOOTBRANCH /
          # BOOTPATCHDIR re-declaration. armbian/build ships a
          # `patch/u-boot/v2026.04/` directory, so BOOTPATCHDIR points
          # at a real patch set (not at v2026.01 patches applied to a
          # v2026.04 tree, which would risk rejects).
          #
          # Per the explainer (docs/uboot-armbian-build-explainer.html
          # §8.2), v2026.04 does NOT clear any of rock-5b's three PXE
          # failure layers on its own — Approach B
          # (playbooks/persist_uboot_env.yml) still has to run to
          # populate SPI env. The bump is just to track upstream.
          function post_family_config_branch_edge__999_rock5b_uboot_v2026_04() {
              [[ "${BOARD}" != "rock-5b" ]] && return 0
              [[ "${BRANCH}" != "edge" ]] && return 0
              display_alert "${BOARD}" "overriding u-boot pin to v2026.04 (was v2026.01)" "info"
              declare -g BOOTBRANCH="tag:v2026.04"
              declare -g BOOTPATCHDIR="v2026.04"
          }

          # Switch rock-5a from the rk3588 family-default Radxa fork
          # (next-dev-v2024.10) to mainline u-boot v2026.04 on the edge
          # branch. armbian/build's config/boards/rock-5a.conf has no
          # `post_family_config_branch_edge__*` hook (unlike rock-5b),
          # so without this override rock-5a would build against the
          # Radxa fork, which:
          #   1. uses the X-macro `BOOT_TARGET_DEVICES(func)` form in
          #      include/configs/rockchip-common.h — our
          #      `__999_pxe_first` sed against `#define BOOT_TARGETS`
          #      is silently a no-op, so PXE stays at the end of the
          #      Radxa fork's default order (USB → SD → NVMe → SCSI →
          #      eMMC → MTD → RKNAND → PXE → DHCP) and SD wins.
          #   2. has no `post_family_config_branch_edge` override at
          #      all in upstream armbian/build for rock-5a (only the
          #      vendor branch gets `post_family_config_branch_vendor__
          #      dual_uboot_for_rock5a`).
          # Mainline v2026.04 already ships a rock5a-rk3588s_defconfig
          # (note: NO dash between "rock" and "5a" — matches rock-5b's
          # mainline naming pattern, distinct from the Radxa fork's
          # rock-5a-rk3588s_defconfig). Upstream's rock5a defconfig
          # includes CONFIG_PHY_REALTEK=y and a DT PHY node carrying
          # the Realtek OUI compatible (`ethernet-phy-id001c.c916`,
          # which is RTL8211F per the Radxa product page); whether
          # that matches the specific Rock 5A revision in operator's
          # hands is *not* something this file should assume. See
          # "SBC ecosystem reality" in CLAUDE.md for why and how to
          # validate against the live `dmesg`/`ethtool` output.
          #
          # The body mirrors armbian/build's
          # `post_family_config_branch_edge__rock-5b_use_mainline_uboot`
          # exactly (BOOT_SCENARIO + prepare_boot_configuration to reuse
          # the ATF path from rockchip64_common, binman-produced
          # u-boot-rockchip{,-spi}.bin via UBOOT_TARGET_MAP, custom
          # write_uboot_platform{,_mtd}). Auto-prefixed `500_` by
          # initialize_extension_manager would NOT happen here because
          # this hook has an explicit `__999_` numeric ID; sort order
          # only matters relative to any future upstream hook on the
          # same name.
          # Diverges from rock-5b's mainline override in one place:
          # UBOOT_TARGET_MAP lists only u-boot-rockchip.bin (no -spi.bin
          # variant). rock-5b's mainline-mainline binman config emits both
          # SD-bootable and SPI-bootable images, but mainline v2026.04's
          # rock5a binman config (`arch/arm/dts/rk3588s-rock-5a-u-boot.dtsi`
          # is a near-empty stub) only emits the SD-bootable form. Listing
          # u-boot-rockchip-spi.bin in UBOOT_TARGET_MAP makes
          # `deploy_built_uboot_bins_for_one_target_to_packaging_area`
          # exit_with_error after the SD bin has already been copied.
          # We netboot from SD; the SPI variant is unused, so dropping it
          # is the correct minimal fix (vs. the heavier alternative of
          # patching the upstream u-boot DTSI to add a binman SPI image
          # node). Correspondingly we don't redefine write_uboot_platform_mtd
          # — the unset clears rockchip64_common's default; no MTD writer
          # is needed since BOOT_SUPPORT_SPI's SPI-loader build path is not
          # exercised when no SPI artifact exists.
          function post_family_config_branch_edge__999_rock5a_use_mainline_uboot() {
              [[ "${BOARD}" != "rock-5a" ]] && return 0
              [[ "${BRANCH}" != "edge" ]] && return 0
              display_alert "${BOARD}" "switching to mainline u-boot v2026.04 (was Radxa next-dev-v2024.10)" "info"

              BOOT_SCENARIO="tpl-blob-atf-mainline"
              prepare_boot_configuration

              declare -g BOOTCONFIG="rock5a-rk3588s_defconfig"
              declare -g BOOTDELAY=1
              declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
              declare -g BOOTBRANCH="tag:v2026.04"
              declare -g BOOTPATCHDIR="v2026.04"
              declare -g BOOTDIR="u-boot-${BOARD}"
              declare -g UBOOT_TARGET_MAP="BL31=bl31.elf ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
              unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

              function write_uboot_platform() {
                  dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
              }
          }

          # Suppress the bcmdhd Broadcom WiFi DKMS driver. Some rk3588
          # boards (e.g. orangepi5-max) `enable_extension "bcmdhd"` +
          # `BCMDHD_TYPE="sdio"` in their armbian/build board config,
          # which downloads armbian/bcmdhd-dkms and rebuilds it inside
          # the rootfs chroot. On the edge kernel (7.0.7-rockchip64)
          # gcc segfaults compiling dhd_dbg_ring.c, aborting the build.
          # Netboot boards run wired-only; on-board WiFi is unused.
          # extensions/bcmdhd.sh's deb-install hook short-circuits on
          # `[[ -z $BCMDHD_TYPE ]]`, so clearing the var at
          # extension_finish_config (after the extension's own
          # __500_install_kernel_headers_for_bcmdhd_dkms hook runs) makes
          # it a no-op. INSTALL_HEADERS is reverted to match
          # BUILD_MINIMAL=yes intent.
          function extension_finish_config__999_no_bcmdhd_for_netboot() {
              [[ -z "${BCMDHD_TYPE}" ]] && return 0
              display_alert "${BOARD}" "disabling bcmdhd DKMS (wired netboot, no WiFi needed)" "info"
              unset BCMDHD_TYPE
              declare -g INSTALL_HEADERS="no"
          }

    # Per-board userpatches — escape hatch keyed by armbian_board_name
    # for genuinely board-specific source modifications. Empty in v1:
    # both boards are fully covered by build_userpatches_common +
    # build_branches. New boards generally won't need entries here.
    build_userpatches: {}

    # Per-board armbian/build BRANCH override. Most boards use 'current'
    # (the armbian_build role default); a board opts into 'edge' here
    # only when something downstream gates on BRANCH=edge:
    #
    #   rock-5b — armbian/build's
    #     `post_family_config_branch_edge__rock-5b_use_mainline_uboot`
    #     swaps the Radxa next-dev-v2024.10 fork (which lacks the
    #     RTL8125 PCIe NIC driver Rock 5B ships with) for mainline
    #     u-boot. Our `__999_rock5b_uboot_v2026_04` then bumps that
    #     upstream-hook's v2026.01 default to v2026.04.
    #
    #   rock-5a — armbian/build has NO mainline override for rock-5a
    #     (upstream's `config/boards/rock-5a.conf` only carries a
    #     vendor-branch hook), so we ship one in
    #     build_userpatches_common:
    #     `__999_rock5a_use_mainline_uboot`. That hook gates on
    #     BRANCH=edge, so this entry is what activates it. Without it,
    #     rock-5a would build against the Radxa fork's BOOT_TARGET_-
    #     DEVICES X-macro form, which the `__999_pxe_first` sed
    #     cannot patch.
    build_branches:
      rock-5b: edge
      # orangepi5-max: edge
      rock-5a: edge
      orangepi5: edge
      orangepi5pro: edge

  pre_tasks:
    - name: Load board configs for board name lookup
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/boards.yml"

    - name: Resolve unique armbian_netboot_board_model values from groups['boards']
      ansible.builtin.set_fact:
        _board_models: >-
          {{ groups['boards']
             | map('extract', hostvars, 'armbian_netboot_board_model')
             | unique
             | list }}

    - name: Assert every armbian_netboot_board_model has an armbian_netboot_board_configs entry
      ansible.builtin.assert:
        that:
          - item in armbian_netboot_board_configs
        fail_msg: >-
          armbian_netboot_board_model '{{ item }}' (from groups['boards']) has no entry in
          vars/boards.yml. Add it there or remove the host from the
          boards group.
      loop: "{{ _board_models }}"

    - name: Resolve build targets from armbian_netboot_board_configs
      ansible.builtin.set_fact:
        _build_targets: >-
          {{ _board_models
             | map('extract', armbian_netboot_board_configs, 'armbian_board_name')
             | list }}

    - name: Report build targets
      ansible.builtin.debug:
        msg: "Will build images for: {{ _build_targets }}"

  tasks:
    - name: Build image per inventory board
      ansible.builtin.include_role:
        name: armbian_build
      vars:
        armbian_build_board: "{{ item }}"
        armbian_build_userpatches: "{{ build_userpatches_common + (build_userpatches[item] | default([])) }}"
        armbian_build_branch: "{{ build_branches[item] | default('current') }}"
      loop: "{{ _build_targets }}"

    # rsync invoked via command (not ansible.posix.synchronize) so it
    # always uses SSH — synchronize short-circuits to a local copy when
    # both endpoints are localhost, which is wrong if the controller and
    # the builder don't share a filesystem (e.g. controller in a
    # container, builder on the host reachable via ssh igou@localhost).
    # connection: local forces this task to run on the controller itself,
    # not via SSH back to an inventory entry named localhost.
    - name: Stage built image directory on the controller
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --compress
          - --delete
          - --mkpath
          - --rsh
          - "ssh -p {{ ansible_port | default(22) }}"
          - "{{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }}:{{ armbian_build_output_dir }}/{{ item }}/"
          - "/tmp/armbian_publish/{{ item }}/"
      delegate_to: localhost
      connection: local
      changed_when: true
      loop: "{{ _build_targets }}"

- name: Publish staged images to the netboot server
  hosts: netboot_server
  gather_facts: false
  vars:
    _builder: "{{ groups['armbian_builders'][0] }}"
  tasks:
    - name: Push staged image + manifest to netboot server (sudo on receive)
      ansible.posix.synchronize:
        src: "/tmp/armbian_publish/{{ item }}/"
        dest: "{{ armbian_netboot_nfs_assets_export }}/images/{{ item }}/"
        delete: false
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--mkpath"
      loop: "{{ hostvars[_builder]._build_targets }}"

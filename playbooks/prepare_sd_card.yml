---
# Prepares an SD card as the PXE-capable bootloader source for non-SPI boards.
# Run on the netboot server after setup_server.yml has been run at least once
# (the U-Boot binaries are extracted from the cached Armbian image).
#
# The resulting SD card:
#   - Contains U-Boot at the standard RK3588 offset (sector 64)
#   - Has a U-Boot environment that tries PXE before local disk
#   - Behaves identically to SPI flash: DHCP options alone control boot mode
#   - Can remain inserted permanently; when DHCP has no PXE options the board
#     falls through to NVMe/eMMC as normal
#
# Usage:
#   ansible-playbook playbooks/prepare_sd_card.yml \
#     -e board_model=rock-5a \
#     -e sd_card_device=/dev/sdb
#
# The playbook runs on the netboot server. Attach the SD card via USB adapter
# or the server's built-in SD reader before running.

- name: Prepare PXE boot SD card
  hosts: netboot_server
  gather_facts: false
  pre_tasks:
    - name: Verify required variables are set
      ansible.builtin.assert:
        that:
          - board_model is defined
          - sd_card_device is defined
        fail_msg: >-
          Both board_model and sd_card_device must be provided.
          Example: -e board_model=rock-5a -e sd_card_device=/dev/sdb

    - name: Ensure u-boot-tools is installed (provides fw_setenv)
      ansible.builtin.apt:
        name: u-boot-tools
        state: present

  tasks:
    - name: Prepare SD card
      ansible.builtin.include_role:
        name: bootloader
        tasks_from: prepare_sd_card.yml

---
# Render each board's pxelinux.cfg (the per-board `01-<mac>` file) to a
# local directory on the control node. Demo of the pxelinux_render role.
# It only writes the file; uploading it to the TFTP server is a separate
# step (see playbooks/converge_boot_mode.yml, which composes this render
# with the RouterOS upload reference playbook).
#
# Runs `hosts: boards` so each board's hostvars (MAC, model, boot mode)
# are in scope, but delegates the render to localhost — one file per
# board lands in the output dir below.
#
# Usage:
#   ansible-playbook playbooks/pxelinux_render.yml --limit orange-pi-5-pro-01
#   ls .cache/pxelinux.cfg/
#
# Role variables (see roles/pxelinux_render/README.md):
#   pxelinux_render_board_mac      — board MAC (-> 01-<mac> filename)
#   pxelinux_render_boot_mode      — nfs | sd | local | local_kernel | extra key
#   pxelinux_render_nfs_server_ip  — IP written into nfsroot=
#   pxelinux_render_nfs_root_path  — NFS export root (per-host subdir appended)
#   pxelinux_render_hostname       — inventory hostname (NFS subdir + menu label)
#   pxelinux_render_output_dir     — local dir to write 01-<mac> into
#
# Prerequisite: armbian_board_config must be resolved on each host (the
# pre_task below does this) — the template reads console/earlycon/name
# from it.

- name: Render per-board pxelinux.cfg locally
  hosts: "{{ armbian_boards_group | default('boards') }}"
  gather_facts: false

  pre_tasks:
    - name: Resolve effective armbian_board_config
      ansible.builtin.include_tasks: tasks/_resolve_board_config.yml

  tasks:
    # delegate_to is not valid directly on include_role; wrap it in a
    # block so the role's tasks run on the control node (one file per
    # board), the way converge_boot_mode.yml does.
    - name: Render this board's pxelinux.cfg (delegated to localhost)
      delegate_to: localhost
      become: false
      block:
        - name: Include pxelinux_render
          ansible.builtin.include_role:
            name: pxelinux_render
          vars:
            pxelinux_render_board_mac: "{{ armbian_board_mac }}"
            pxelinux_render_boot_mode: "{{ armbian_boot_mode | default('nfs') }}"
            pxelinux_render_nfs_server_ip: "{{ armbian_nfs_server_ip | default('192.0.2.10') }}"
            pxelinux_render_nfs_root_path: "{{ armbian_nfs_rootfs_path | default('/srv/netboot/rootfs') }}"
            pxelinux_render_hostname: "{{ inventory_hostname }}"
            pxelinux_render_output_dir: "{{ playbook_dir }}/../.cache/pxelinux.cfg"

---
# Pull TFTP artifacts from the netboot server's cache onto the
# controller, then push them to the router + register /ip tftp rows.
#
# Pre-condition: stage_netboot_assets.yml has been run so the
# kernel/initrd/dtb are populated under
# {{ armbian_image_cache }}/sbc-tftp/<host>/ on netboot_server
# (defaults to /var/lib/armbian/cache/sbc-tftp/<host>/).
#
# Use -e armbian_netboot_server_group=<group> (or default 'netboot_server')
# — not --limit. The three plays mix netboot_server with router upload +
# plumbing-check imports; --limit silently empties the router plays.

- name: Pre-flight — refuse --limit on composite playbook
  hosts: "{{ armbian_netboot_server_group | default('netboot_server') }}"
  gather_facts: false
  tasks:
    - name: "Assert no --limit narrowing on composite playbook"
      ansible.builtin.include_tasks: tasks/_assert_no_limit.yml
      vars:
        _expected_pattern: "{{ armbian_netboot_server_group | default('netboot_server') }}"

- name: Fetch TFTP artifacts from netboot server to controller cache
  hosts: "{{ armbian_netboot_server_group | default('netboot_server') }}"
  become: true
  gather_facts: false
  vars:
    _assets: [vmlinuz, initrd.img, board.dtb]
  tasks:
    - name: Ensure controller cache dir exists per host
      ansible.builtin.file:
        path: "{{ armbian_tftp_cache_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      loop: "{{ groups[armbian_boards_group] }}"

    - name: Fetch each (host, asset) from netboot server
      ansible.builtin.fetch:
        src: "{{ armbian_image_cache | default('/var/lib/armbian/cache') }}/sbc-tftp/{{ item.0 }}/{{ item.1 }}"
        dest: "{{ armbian_tftp_cache_dir }}/{{ item.0 }}/{{ item.1 }}"
        flat: true
      loop: "{{ groups[armbian_boards_group] | product(_assets) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}"

- name: Upload TFTP assets to router (reference playbook)
  ansible.builtin.import_playbook: "{{ armbian_tftp_upload_playbook | default('routeros/upload_tftp_assets.yml') }}"
  vars:
    armbian_tftp_upload_models: "{{ groups[armbian_boards_group] }}"

- name: Plumbing check — verify /ip tftp rows landed
  ansible.builtin.import_playbook: "{{ armbian_plumbing_check_playbook | default('routeros/plumbing_check.yml') }}"
  vars:
    armbian_tftp_check_models: "{{ groups[armbian_boards_group] }}"

---
# Populates the NFS rootfs export and TFTP assets on an already-running
# netboot server, and creates the shared RouterOS DHCP option objects used by
# enable/disable_netboot.
#
# Prerequisites:
#   - NFS server running; nfs_rootfs_path is exported (rw) and accessible.
#     The role creates _templates/<model>/ and per-host <hostname>/
#     subdirectories inside it; no per-model NFS export setup is needed.
#   - netboot.xyz running (TFTP config and assets directories NFS-exported)
#   - armbian_image_urls set in group_vars/all.yml for each board model
#
# Usage:
#   ansible-playbook playbooks/setup_netboot.yml
#
# To re-run only the NFS content population (e.g. after updating image URLs):
#   ansible-playbook playbooks/setup_netboot.yml --tags nfs_content

- name: Populate NFS and TFTP content
  hosts: netboot_server
  become: true
  gather_facts: false
  roles:
    - role: nfs_content
      tags: nfs_content

- name: Configure RouterOS DHCP option objects
  hosts: routeros
  gather_facts: false
  vars:
    routeros_setup_options: true
  roles:
    - role: routeros_dhcp
      tags: routeros

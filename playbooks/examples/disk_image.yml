---
# Stream an image onto a board's block device. Run it while the board is
# booted from another device (for example NFS); the role refuses a target
# that backs a mounted filesystem.
#
#   ansible-playbook playbooks/examples/disk_image.yml --limit orange-pi-5-pro-01 \
#     -e disk_image_source=https://images.example.lan/orange-pi-5-pro.img.xz

- name: Image a board's SD card
  hosts: boards
  gather_facts: false
  tasks:
    - name: Stream the image onto the target device
      ansible.builtin.include_role:
        name: david_igou.armbian.disk_image
      vars:
        disk_image_source: https://images.example.lan/orange-pi-5-pro.img.xz
        disk_image_target_device: /dev/mmcblk0

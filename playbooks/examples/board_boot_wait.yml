---
# Power-cycle each board through a caller-supplied tasks file and wait until
# it answers SSH as the inventory user. power_cycle.yml is yours to write:
# a PoE, PDU or hypervisor call for the board.
- name: Boot the boards
  hosts: boards
  gather_facts: false
  tasks:
    - name: Power-cycle and wait
      ansible.builtin.include_role:
        name: david_igou.armbian.board_boot_wait
      vars:
        board_boot_wait_power_cycle_tasks: "{{ playbook_dir }}/tasks/power_cycle.yml"
        board_boot_wait_attempts: 3

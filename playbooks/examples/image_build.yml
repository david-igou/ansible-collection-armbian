---
# Build one PXE-first Armbian image on a builder host. The image and
# manifest.json land in <image_build_cache_dir>/output/<image_build_name>/.
#
#   ansible-playbook playbooks/examples/image_build.yml --limit builder-01

- name: Build a PXE-first Armbian image
  hosts: armbian_builders
  gather_facts: false
  tasks:
    - name: Build the image
      ansible.builtin.include_role:
        name: david_igou.armbian.image_build
      vars:
        image_build_board: orangepi5pro
        image_build_name: orange-pi-5-pro-01
        image_build_cache_dir: /srv/armbian_build
        image_build_userpatches:
          # armbian/build sources config/boards/<board>.conf only for that board.
          - dest: config/boards/orangepi5pro.conf
            content: |
              function pre_config_uboot_target__orangepi5pro_pxe_first() {
                  declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
                  sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" \
                      include/configs/rockchip-common.h
              }

    - name: Show where the image is
      ansible.builtin.debug:
        msg: "{{ image_build_manifest.image_filename }} (built: {{ image_build_needed }})"

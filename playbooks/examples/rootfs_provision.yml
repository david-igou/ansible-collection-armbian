---
# Provision a per-host NFS rootfs and TFTP boot files on the netboot server
# for every board in the `boards` group. Each board's image URL and DTB
# come from its inventory, for example:
#
#   orange-pi-5-pro-01:
#     rootfs_image_url: https://images.example.lan/orange-pi-5-pro-01.img.xz
#     rootfs_dtb: rockchip/rk3588s-orangepi-5-pro.dtb
#
#   ansible-playbook playbooks/examples/rootfs_provision.yml

- name: Provision per-host NFS rootfs on the netboot server
  hosts: netboot_server
  become: true
  gather_facts: false
  tasks:
    - name: Provision each board's rootfs
      ansible.builtin.include_role:
        name: david_igou.armbian.rootfs_provision
      vars:
        rootfs_provision_src: "{{ hostvars[board].rootfs_image_url }}"
        rootfs_provision_checksum: "sha256:{{ hostvars[board].rootfs_image_url }}.sha"
        rootfs_provision_hostname: "{{ board }}"
        rootfs_provision_dtb: "{{ hostvars[board].rootfs_dtb | default('') }}"
        rootfs_provision_target_dir: "/srv/netboot/rootfs/{{ board }}"
        rootfs_provision_tftp_dir: "/srv/netboot/tftp/{{ board }}"
        rootfs_provision_cache_dir: /var/cache/rootfs_provision
      loop: "{{ groups['boards'] }}"
      loop_control:
        loop_var: board

---
# Partition a board's NVMe with one ext4 root that fills the disk and copy
# the running rootfs onto it. Run it while the board is booted from NFS;
# the role refuses to wipe the disk that backs /.
#
#   ansible-playbook playbooks/examples/disk_provision.yml --limit orange-pi-5-pro-01

- name: Provision a board's NVMe for local boot
  hosts: boards
  gather_facts: false
  tasks:
    - name: Partition and populate the NVMe
      ansible.builtin.include_role:
        name: david_igou.armbian.disk_provision
      vars:
        disk_provision_disk_binding:
          device: /dev/nvme0n1
          layout:
            - id: root
              size: grow
              type: root
              format: ext4
              label: armbi_root_local
              mount: /

---
# Provision a per-host NFS rootfs on the netboot server from each board's
# .img.xz: extract the rootfs into a per-host directory, stage
# kernel/initrd/dtb to a TFTP cache, and reset identity (hostname,
# machine-id, SSH host keys). Demo of the rootfs_provision role.
#
# Two plays, mirroring the known-good composition in
# playbooks/stage_netboot_assets.yml:
#   1. On the boards: resolve armbian_board_config + armbian_rootfs_src.
#   2. On the netboot server: loop rootfs_provision over each board,
#      reading the resolved facts from the board hostvars.
#
# Usage:
#   ansible-playbook playbooks/rootfs_provision.yml
#   # force a clean re-extract regardless of the sentinel:
#   ansible-playbook playbooks/rootfs_provision.yml -e armbian_force_refresh=true
#
# Role variables (see roles/rootfs_provision/README.md):
#   armbian_rootfs_src           — .img.xz URL or local path on the server (required)
#   armbian_rootfs_host          — inventory_hostname this rootfs is for (required)
#   armbian_rootfs_dtb           — DTB path under /boot/dtb/ (required)
#   armbian_rootfs_force_refresh — re-extract even if the sentinel matches (default false)
#
# Example inventory this playbook expects (doc-safe placeholders):
#
#   # inventory/hosts.yml
#   all:
#     children:
#       netboot_server:                 # the host that exports NFS rootfs
#         hosts:
#           truenas-01:
#             ansible_host: 192.0.2.10
#             ansible_user: admin
#             ansible_become: true
#       boards:
#         children:
#           orange_pi_5_pro:            # <model_group> — carries the model layer
#             hosts:
#               orange-pi-5-pro-01:
#                 ansible_host: 192.0.2.111
#                 armbian_board_model: orange-pi-5-pro
#                 # .img.xz for THIS host (URL or path on the netboot server).
#                 # Omit to resolve from the published manifest instead
#                 # (armbian_nfs_assets_export/images/<host>/manifest.json).
#                 armbian_rootfs_src: "https://images.example.lan/orange-pi-5-pro-01.img.xz"
#
#   # inventory/group_vars/rk3588s.yml      (family layer)
#   armbian_board_config_family:
#     console: ttyS2,1500000n8
#     earlycon: uart8250,mmio32,0xfeb50000
#
#   # inventory/group_vars/orange_pi_5_pro.yml   (model layer — sets dtb)
#   armbian_board_config_model:
#     armbian_board_name: orangepi5pro
#     dtb: rockchip/rk3588s-orangepi-5-pro.dtb
#
#   # inventory/group_vars/all.yml
#   armbian_nfs_rootfs_path: /srv/netboot/rootfs
#   armbian_nfs_assets_export: /srv/netboot/boot-files
#   armbian_image_cache: /var/lib/armbian/cache
#
# _resolve_board_config.yml merges family → model → host into
# armbian_board_config (so armbian_board_config.dtb comes from the model
# layer above); _resolve_rootfs_src.yml uses the host's armbian_rootfs_src
# or falls back to the published manifest.

- name: Resolve board configs + rootfs sources per board host
  hosts: "{{ armbian_boards_group | default('boards') }}"
  gather_facts: false

  tasks:
    - name: Resolve effective armbian_board_config
      ansible.builtin.include_tasks: tasks/_resolve_board_config.yml
    - name: Resolve armbian_rootfs_src per host
      ansible.builtin.include_tasks: tasks/_resolve_rootfs_src.yml

- name: Provision per-host NFS rootfs + TFTP artifacts on the netboot server
  hosts: "{{ armbian_netboot_server_group | default('netboot_server') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Run rootfs_provision per board host
      ansible.builtin.include_role:
        name: rootfs_provision
      vars:
        armbian_rootfs_src: "{{ hostvars[_board].armbian_rootfs_src }}"
        armbian_rootfs_host: "{{ _board }}"
        armbian_rootfs_dtb: "{{ hostvars[_board].armbian_board_config.dtb }}"
        armbian_rootfs_force_refresh: "{{ armbian_force_refresh | default(false) }}"
      loop: "{{ groups[armbian_boards_group | default('boards')] }}"
      loop_control:
        loop_var: _board

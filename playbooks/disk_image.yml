---
# Stream an .img.xz (or raw .img) onto a board's block device via
# `curl | xz -dc | dd`. Mount-aware: refuses to write to a device that
# currently backs a mounted filesystem. The role always writes — there
# is no idempotency cache.
#
# Run this while the board is booted from a DIFFERENT device than the
# target (e.g. NFS-booted, writing the SD card). Writing the disk you're
# running from will be refused.
#
# Usage:
#   ansible-playbook playbooks/disk_image.yml --limit orange-pi-5-pro-01 \
#     -e image_source=https://images.example.lan/orange-pi-5-pro.img.xz
#
# Role variables (see roles/disk_image/README.md):
#   image_source      — https://, http://, or local path to .img.xz/.img (required)
#   target_device     — whole-disk path, WILL BE OVERWRITTEN (required)
#   disk_image_dd_bs  — dd block size (default 4M)
#
# For the full fleet reset that wraps this role (Phase 3), see
# playbooks/test_fleet_e2e.yml.

- name: Image a board's block device from a published .img.xz
  hosts: "{{ armbian_boards_group | default('boards') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Stream the image onto the target device
      ansible.builtin.include_role:
        name: disk_image
      vars:
        image_source: "{{ armbian_disk_image_source | default('https://images.example.lan/orange-pi-5-pro.img.xz') }}"
        target_device: "{{ armbian_sd_device | default('/dev/mmcblk0') }}"
        disk_image_dd_bs: 4M

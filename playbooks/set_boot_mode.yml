---
# Set a board's boot mode via -e override (ad-hoc, no inventory edit).
#
# Requires `-e armbian_netboot_boot_mode=nfs|sd`. The override applies
# to every board in the limit set; use `--limit` to scope. See
# docs/boot-mode-override.md for the full menu of override methods.
#
# Usage:
#   ansible-playbook playbooks/set_boot_mode.yml \
#     --limit orange-pi-5-pro-01 \
#     -e armbian_netboot_boot_mode=sd
#
#   # Write rb5009 state only — don't cycle the board
#   ansible-playbook playbooks/set_boot_mode.yml \
#     --limit orange-pi-5-pro-01 \
#     -e armbian_netboot_boot_mode=nfs \
#     -e armbian_netboot_cycle_board=false

- name: Validate boot mode was provided
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert armbian_netboot_boot_mode is set via -e
      ansible.builtin.assert:
        that: armbian_netboot_boot_mode is defined
        fail_msg: >-
          set_boot_mode.yml requires -e armbian_netboot_boot_mode=nfs|sd

- name: Pre-flight — assert per-model /ip tftp rows exist on rb5009
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Plumbing check
      ansible.builtin.include_role:
        name: netboot_assets
        tasks_from: plumbing_check.yml
      vars:
        _check_models: >-
          {{ query('inventory_hostnames', target_hosts | default('boards'))
             | map('extract', hostvars, 'armbian_netboot_board_model')
             | list | unique }}
      run_once: true
      tags: preflight

- name: Set boot mode
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Apply boot mode from -e override
      ansible.builtin.include_role:
        name: boot_mode

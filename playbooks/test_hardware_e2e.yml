---
# Hardware end-to-end test for the PXE-first boot toggle.
#
# Drives the target board through three phases:
#   1. disk boot baseline (PoE cycle, assert local rootfs)
#   2. nfsroot (write per-board pxelinux.cfg + /ip tftp row on rb5009,
#      PoE cycle, assert NFS rootfs)
#   3. back to disk (remove per-board pxelinux.cfg + /ip tftp row from
#      rb5009, PoE cycle, assert local rootfs)
#
# Pre-condition (v1): the target board has a custom-built Armbian
# image manually flashed to its SD card (or other primary storage)
# and is wired to its poe_switch port. v1 does not call reprovision.yml;
# the operator owns getting the custom image onto disk for now.
#
# Diagnostic bundle (playbooks/tasks/diagnostic_bundle.yml) runs at
# every verify checkpoint to surface findmnt, kernel cmdline, routes,
# resolv.conf, lsblk, U-Boot deb version, and the last 100 journal
# lines so a failure tells the operator what went wrong without
# re-SSHing.
#
# Failure cleanup: by default, the always-block removes the per-board
# pxelinux.cfg + /ip tftp row from rb5009 and PoE-cycles the board back
# to disk boot regardless of pass/fail. Pass `-e leave_state=true` to
# preserve the failure state for forensic debugging.
#
# Optional serial capture: pass `-e capture_serial=true` to spawn a
# background socat capture from a USB-UART on the *serial host*. The
# serial host defaults to `localhost` (the inventory entry for it
# determines the connection: SSH, local, etc.) and can be overridden
# with `-e serial_host=<inventory-host>` for setups where the dongle is
# attached to a machine that isn't the Ansible controller.
#
# Prerequisites on the serial host (whatever it is): `socat` installed
# and on PATH; the user used in the connection has passwordless sudo
# (the FTDI dongle is typically owned root:dialout/games and only root
# can run stty/socat against it).
#
# Defaults to /dev/ttyUSB0 at 1500000 baud (Rockchip current). Override
# device/baud with `-e serial_device=/dev/ttyUSB1 -e serial_baud=115200`
# for Allwinner or alternate dongle assignment. The log lands at
# /tmp/serial-<host>.log on the serial host and a tail is printed at
# every diagnostic checkpoint (slurped over the same connection).
# Best-effort: socat-start failures abort the play (so the operator
# notices), but slurp failures inside the diagnostic bundle do not.
#
# Usage:
#   ansible-playbook playbooks/test_hardware_e2e.yml --limit opi5pro-01
#   ansible-playbook playbooks/test_hardware_e2e.yml --limit opi5pro-01 -e leave_state=true
#   ansible-playbook playbooks/test_hardware_e2e.yml --limit opi5pro-01 -e capture_serial=true

- name: Hardware E2E PXE-first toggle test
  hosts: boards
  gather_facts: false
  vars:
    leave_state: false
    capture_serial: false
    serial_host: localhost
    serial_device: /dev/ttyUSB0
    serial_baud: 1500000
    _routeros_target: "{{ groups['routeros_routers'] | first }}"
    _wait_timeout: 300
    _serial_log: "/tmp/serial-{{ inventory_hostname }}.log"
    _serial_pid: "/tmp/socat-{{ inventory_hostname }}.pid"

  tasks:
    - name: Pre-flight — assert exactly one board targeted
      ansible.builtin.assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          test_hardware_e2e.yml is single-board. Pass --limit <hostname>.
          Got {{ ansible_play_hosts | length }} hosts: {{ ansible_play_hosts }}
      run_once: true

    - name: Pre-flight — assert per-board PoE state
      ansible.builtin.assert:
        that:
          - poe_switch is defined
          - poe_switch | length > 0
          - poe_port is defined
          - poe_port | length > 0
        fail_msg: >-
          {{ inventory_hostname }} needs poe_switch and poe_port hostvars set.
          Add them to inventory/host_vars/{{ inventory_hostname }}.yml.

    - name: Pre-flight — assert armbian_default_password is set
      ansible.builtin.assert:
        that:
          - armbian_default_password is defined
          - armbian_default_password | length > 0
        fail_msg: >-
          armbian_default_password must be set in group_vars (vault recommended).
          Phase 2 SSH to the NFS-mounted board uses these credentials.
      run_once: true

    - name: Pre-flight — assert per-model /ip tftp rows exist on rb5009
      delegate_to: "{{ _routeros_target }}"
      run_once: true
      block:
        - name: Pre-flight — include netboot_assets plumbing_check
          ansible.builtin.include_role:
            name: netboot_assets
            tasks_from: plumbing_check.yml
          vars:
            _check_models:
              - "{{ board_model }}"

    # Background serial capture on the serial host (the machine with
    # the USB-UART attached). Defaults to localhost; can be overridden
    # with -e serial_host=<inventory-host> for split-machine setups.
    # Pre-create the log file as root with mode 0644 so socat (also
    # root, since the FTDI dongle is typically root:dialout/games)
    # appends to a world-readable file — that lets the diagnostic_bundle
    # slurp run without become later. socat is started with async/poll=0
    # (Ansible's fire-and-forget pattern) wrapped in a shell that
    # records the post-exec PID to {{ _serial_pid }}; the always-block
    # reads that pidfile and kills the recorded PID. Pidfile-based
    # cleanup is portable to minimal serial hosts (UBI, alpine,
    # distroless) that ship without pkill/pgrep.
    - name: Pre-flight — start serial capture
      when: capture_serial | bool
      delegate_to: "{{ serial_host }}"
      run_once: true
      become: true
      block:
        - name: Serial — assert socat is available on the control node
          ansible.builtin.command:
            cmd: which socat
          changed_when: false

        - name: Serial — assert serial device exists
          ansible.builtin.stat:
            path: "{{ serial_device }}"
          register: _serial_dev_stat
          failed_when: not _serial_dev_stat.stat.exists

        - name: Serial — truncate log file and ensure world-readable
          ansible.builtin.copy:
            dest: "{{ _serial_log }}"
            content: ""
            mode: "0644"

        - name: Serial — configure tty line discipline
          ansible.builtin.command:
            cmd: stty -F {{ serial_device }} {{ serial_baud }} cs8 -cstopb -parenb -ixon -crtscts raw
          changed_when: true

        # `echo $$` records the shell's own PID, which `exec` then
        # replaces with socat — so the pidfile contains socat's PID.
        - name: Serial — start socat capture in background (pidfile-tracked)
          ansible.builtin.shell: |
            echo $$ > {{ _serial_pid }}
            exec socat -u {{ serial_device }},b{{ serial_baud }},raw,echo=0 OPEN:{{ _serial_log }},append
          async: 86400
          poll: 0
          changed_when: true

    # Stale known_hosts entries on the controller (typically left by
    # a prior boot, a reflash, or a per_host NFS rootfs identity reset)
    # don't *prevent* connections (host_key_checking=False handles the
    # auth side) but ssh's "REMOTE HOST IDENTIFICATION HAS CHANGED"
    # warning still pollutes any failure-mode error message that wraps
    # the underlying ssh stderr — making real failures (kernel hang,
    # missing inventory user) hard to read in the e2e output. Drop any
    # entries for this board up-front so subsequent ssh probes start
    # from a clean state and any errors that surface later carry only
    # the actionable signal.
    - name: Pre-flight — clear stale known_hosts entries on controller
      ansible.builtin.command:
        cmd: "ssh-keygen -R {{ item }}"
      delegate_to: localhost
      become: false
      loop: "{{ [inventory_hostname, ansible_host | default(inventory_hostname)] | unique }}"
      changed_when: false
      failed_when: false  # exits 1 when no entries — that's fine

    - name: Test phases (cleanup runs in always)
      block:
        - name: Phase 1 — PoE cycle to disk-boot baseline
          ansible.builtin.include_role:
            name: routeros_poe
          vars:
            poe_action: cycle

        # Auto-bootstrap detection. After a fresh SD-card reflash the
        # board boots cleanly but the inventory user (ansible_user)
        # doesn't exist yet — only the Armbian default root user does.
        # The original Phase 1 wait_for_connection then sits for
        # _wait_timeout seconds with `Permission denied (publickey,
        # password)` and ultimately reports an opaque "timed out" that
        # looks identical to a hardware boot hang. The detection below
        # distinguishes those:
        #   1. wait_for TCP/22 — identity-agnostic; a real boot failure
        #      still times out here.
        #   2. one short wait_for_connection probe as the inventory
        #      user — succeeds quickly if bootstrap already ran.
        #   3. if (1) succeeds and (2) fails, the board is freshly
        #      reflashed; shell out to bootstrap_armbian.yml inline,
        #      then fall through to the regular Phase 1 wait below.
        # Sub-playbook invocation (rather than include_role) keeps the
        # auto-bootstrap path fully aligned with the operator's manual
        # workflow — same playbook, same vars, same SSH keys baked in
        # — without duplicating the connection/var setup here.
        - name: Phase 1 — wait for board TCP/22 (identity-agnostic)
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 22
            timeout: "{{ _tcp_probe_timeout | default(180) }}"
            state: started
          delegate_to: localhost

        - name: Phase 1 — short SSH probe as inventory user
          ansible.builtin.wait_for_connection:
            timeout: 30
            sleep: 5
            delay: 0
          register: _inv_probe
          failed_when: false
          ignore_errors: true # noqa: ignore-errors

        - name: Phase 1 — auto-bootstrap (board appears freshly reflashed)
          when: _inv_probe is failed
          delegate_to: localhost
          block:
            - name: Phase 1 — auto-bootstrap notice
              ansible.builtin.debug:
                msg: >-
                  Inventory user can't authenticate to {{ inventory_hostname }}
                  but the board is reachable on TCP/22 — treating this as a
                  freshly reflashed image and running bootstrap_armbian.yml
                  inline.

            - name: Phase 1 — auto-bootstrap (sub-playbook invocation)
              ansible.builtin.command:
                argv:
                  - ansible-playbook
                  - "{{ playbook_dir }}/bootstrap_armbian.yml"
                  - --limit
                  - "{{ inventory_hostname }}"
                  - -e
                  - "armbian_default_password={{ armbian_default_password }}"
              changed_when: true
              register: _autobootstrap

            - name: Phase 1 — auto-bootstrap output
              ansible.builtin.debug:
                msg: "{{ _autobootstrap.stdout_lines | default([]) }}"

        - name: Phase 1 — wait for SSH (disk-boot identity)
          ansible.builtin.wait_for_connection:
            delay: 30
            timeout: "{{ _wait_timeout }}"

        - name: Phase 1 — gather facts
          ansible.builtin.setup:

        - name: Phase 1 — capture root mount facts
          ansible.builtin.set_fact:
            _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='fstype') | first }}"
            _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='device') | first }}"

        - name: Phase 1 — diagnostic bundle
          ansible.builtin.import_tasks: tasks/diagnostic_bundle.yml
          vars:
            _diag_phase: "phase 1 — disk-boot baseline"

        - name: Phase 1 — assert rootfs is on a local block device
          ansible.builtin.assert:
            that:
              - _root_fstype not in ['nfs', 'nfs4']
              - _root_device is match('^/dev/')
            fail_msg: >-
              Phase 1: expected rootfs on /dev/<block>; got
              {{ _root_device }} ({{ _root_fstype }}).
              Diagnostic bundle is in the prior debug task.

        - name: Phase 2 — write per-board pxelinux.cfg + /ip tftp row on rb5009
          delegate_to: "{{ _routeros_target }}"
          block:
            - name: Phase 2 — include routeros_dhcp write_pxelinux_cfg
              ansible.builtin.include_role:
                name: routeros_dhcp
                tasks_from: write_pxelinux_cfg.yml
              vars:
                # Use hostvars[] so delegate_to: rb5009 doesn't recurse on
                # `board_mac: "{{ board_mac }}"` (rb5009 has no such hostvar
                # → fallback to task-scope → infinite loop in set_fact).
                board_mac: "{{ hostvars[inventory_hostname].board_mac }}"
                board_model: "{{ hostvars[inventory_hostname].board_model }}"
                target_board_host: "{{ inventory_hostname }}"

        - name: Phase 2 — PoE cycle into nfsroot
          ansible.builtin.include_role:
            name: routeros_poe
          vars:
            poe_action: cycle

        - name: Phase 2 — verify NFS-mounted boot
          vars:
            ansible_user: root
            ansible_password: "{{ armbian_default_password }}"
            ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            ansible_become: false
          block:
            - name: Phase 2 — reset connection so new identity takes effect
              ansible.builtin.meta: reset_connection

            - name: Phase 2 — wait for SSH (NFS-root identity)
              ansible.builtin.wait_for_connection:
                delay: 30
                timeout: "{{ _wait_timeout }}"

            - name: Phase 2 — gather facts
              ansible.builtin.setup:

            - name: Phase 2 — capture root mount facts
              ansible.builtin.set_fact:
                _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                                 | map(attribute='fstype') | first }}"
                _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                                 | map(attribute='device') | first }}"

            - name: Phase 2 — diagnostic bundle
              ansible.builtin.import_tasks: tasks/diagnostic_bundle.yml
              vars:
                _diag_phase: "phase 2 — nfsroot"

            - name: Phase 2 — assert rootfs is NFS
              ansible.builtin.assert:
                that:
                  - _root_fstype in ['nfs', 'nfs4']
                fail_msg: >-
                  Phase 2: expected NFS-mounted rootfs; got fstype
                  {{ _root_fstype }}.
                  Board did not PXE-boot into NFS root despite per-board
                  pxelinux.cfg + /ip tftp row being written on rb5009.
                  Diagnostic bundle is in the prior debug task — check
                  /proc/cmdline for nfsroot=, and confirm rb5009's /ip tftp
                  serves armbian/<model>/{vmlinuz,initrd.img,board.dtb}.

        - name: Phase 3 — remove per-board pxelinux.cfg + /ip tftp row from rb5009
          delegate_to: "{{ _routeros_target }}"
          block:
            - name: Phase 3 — include routeros_dhcp remove_pxelinux_cfg
              ansible.builtin.include_role:
                name: routeros_dhcp
                tasks_from: remove_pxelinux_cfg.yml
              vars:
                board_mac: "{{ hostvars[inventory_hostname].board_mac }}"
                target_board_host: "{{ inventory_hostname }}"

        - name: Phase 3 — PoE cycle back to disk
          ansible.builtin.include_role:
            name: routeros_poe
          vars:
            poe_action: cycle

        # Phase 3 intentionally has no block-scoped vars: the Phase 2
        # verify-NFS block has exited so its NFS-root identity vars are
        # already out of scope. reset_connection here flushes the cached
        # SSH ControlMaster so wait_for_connection re-opens with the
        # inventory ansible_user. Do NOT wrap Phase 3 in a vars block for
        # symmetry with Phase 2 — that would re-introduce the override.
        - name: Phase 3 — reset connection so inventory identity takes effect
          ansible.builtin.meta: reset_connection

        - name: Phase 3 — wait for SSH (disk-boot identity)
          ansible.builtin.wait_for_connection:
            delay: 30
            timeout: "{{ _wait_timeout }}"

        - name: Phase 3 — gather facts
          ansible.builtin.setup:

        - name: Phase 3 — capture root mount facts
          ansible.builtin.set_fact:
            _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='fstype') | first }}"
            _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='device') | first }}"

        - name: Phase 3 — diagnostic bundle
          ansible.builtin.import_tasks: tasks/diagnostic_bundle.yml
          vars:
            _diag_phase: "phase 3 — back to disk"

        - name: Phase 3 — assert rootfs returned to local block device
          ansible.builtin.assert:
            that:
              - _root_fstype not in ['nfs', 'nfs4']
              - _root_device is match('^/dev/')
            fail_msg: >-
              Phase 3: expected rootfs on /dev/<block> after removing the
              per-board pxelinux.cfg + /ip tftp row from rb5009; got
              {{ _root_device }} ({{ _root_fstype }}).
              Toggle is not bidirectional — the per-board file and/or
              /ip tftp row may still exist on rb5009. To distinguish: run
              `/ip tftp print where req-filename~"pxelinux.cfg/01-{{ board_mac | lower | replace(':', '-') }}"`
              on {{ _routeros_target }}; if non-empty, the remove didn't
              take. Diagnostic bundle is in the prior debug task.
      always:
        - name: Cleanup — print exit-state notice if leave_state
          ansible.builtin.debug:
            msg: >-
              leave_state=true: not cleaning up. Board may be in NFS
              root; remove the per-board pxelinux.cfg + /ip tftp row
              from rb5009 manually with:
              ansible-playbook playbooks/disable_netboot.yml
              --limit {{ inventory_hostname }}
          when: leave_state | bool

        - name: Cleanup — remove per-board pxelinux.cfg from rb5009
          delegate_to: "{{ _routeros_target }}"
          when: not (leave_state | bool)
          block:
            - name: Cleanup — include routeros_dhcp remove_pxelinux_cfg
              ansible.builtin.include_role:
                name: routeros_dhcp
                tasks_from: remove_pxelinux_cfg.yml
              vars:
                board_mac: "{{ hostvars[inventory_hostname].board_mac }}"
                target_board_host: "{{ inventory_hostname }}"

        - name: Cleanup — PoE cycle back to disk boot
          ansible.builtin.include_role:
            name: routeros_poe
          vars:
            poe_action: cycle
          when: not (leave_state | bool)

        - name: Cleanup — reset connection to inventory identity
          ansible.builtin.meta: reset_connection
          when: not (leave_state | bool)

        - name: Cleanup — wait for SSH after cleanup cycle
          ansible.builtin.wait_for_connection:
            delay: 30
            timeout: "{{ _wait_timeout }}"
          when: not (leave_state | bool)

        - name: Cleanup — verify board returned to disk boot
          ansible.builtin.setup:
          when: not (leave_state | bool)

        - name: Cleanup — capture root mount facts (post-cleanup)
          ansible.builtin.set_fact:
            _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='fstype') | first }}"
            _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='device') | first }}"
          when: not (leave_state | bool)

        - name: Cleanup — assert disk-rooted (post-cleanup)
          ansible.builtin.assert:
            that:
              - _root_fstype not in ['nfs', 'nfs4']
            fail_msg: >-
              Cleanup left the board in NFS root mode despite removing the
              per-board pxelinux.cfg + /ip tftp row from rb5009. Investigate
              rb5009's /ip tftp rows for {{ board_mac }} and the
              linux-u-boot-* deb on disk.
          when: not (leave_state | bool)

        # Stop serial capture last so the cleanup phase's reboots are
        # captured. The log file persists at {{ _serial_log }} on the
        # control node regardless of leave_state — it's an artifact, not
        # device state. The pidfile may be missing (start block failed
        # before socat spawned) and the recorded PID may already be dead
        # (socat exited on its own); both cases are non-failures.
        - name: Cleanup — stop serial capture
          ansible.builtin.shell: |
            if [ -f {{ _serial_pid }} ]; then
              kill "$(cat {{ _serial_pid }})" 2>/dev/null || true
              rm -f {{ _serial_pid }}
            fi
          delegate_to: "{{ serial_host }}"
          run_once: true
          become: true
          changed_when: false
          when: capture_serial | bool

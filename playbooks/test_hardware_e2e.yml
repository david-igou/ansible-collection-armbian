---
# Hardware end-to-end test for the always-netboot boot-mode model.
#
# Per-board pxelinux.cfg on the router always exists; U-Boot PXE-loads
# it every boot and the `default` directive selects nfsroot vs local
# SD. This playbook drives the target board through three phases:
#   1. SD baseline — converge pxelinux `default sd`, PoE cycle, assert
#      root on a local block device
#   2. nfsroot — set `default nfs`, render pxelinux, PoE cycle, assert
#      NFS rootfs
#   3. Back to SD — set `default sd`, render pxelinux, PoE cycle,
#      assert local rootfs again
#
# Pre-condition: the board runs a custom-built Armbian image with
# PXE-first U-Boot and PoE wiring matches inventory.
#
# Diagnostic bundle (playbooks/tasks/diagnostic_bundle.yml) runs at
# every verify checkpoint to surface findmnt, kernel cmdline, routes,
# resolv.conf, lsblk, U-Boot deb version, and the last 100 journal
# lines so a failure is actionable without re-SSHing.
#
# Failure cleanup: by default, the always-block converges pxelinux
# back to `default sd` on the router and PoE-cycles the board
# regardless of pass/fail. Pass `-e leave_state=true` to preserve the
# failure state for forensics.
#
# Skip-baseline mode: pass `-e skip_baseline=true` to bypass Phase 1
# (SD-side baseline). Useful when local SD boot is broken but NFS path
# is healthy — Phase 2 still validates nfsroot; Phase 3 still asserts
# return-to-SD. Phase 2 diagnostics are usually what matter.
#
# Optional serial capture: pass `-e capture_serial=true` to spawn
# socat on the serial host (default `localhost`; override with
# `-e serial_host=<host>`). socat must be on PATH; passwordless sudo
# for stty/socat against the UART device.
#
# Usage:
#   ansible-playbook playbooks/test_hardware_e2e.yml --limit opi5pro-01
#   ansible-playbook playbooks/test_hardware_e2e.yml --limit opi5pro-01 -e leave_state=true
#   ansible-playbook playbooks/test_hardware_e2e.yml --limit opi5pro-01 -e capture_serial=true
#   ansible-playbook playbooks/test_hardware_e2e.yml --limit opi5pro-01 -e skip_baseline=true
#
# For iteration runs with per-iter serial artifacts, prefer
# `playbooks/scripts/run-iter.sh <iter-number> -- <ansible-playbook extras>`.

- name: Hardware E2E always-netboot boot-mode test
  hosts: boards
  gather_facts: false
  vars:
    leave_state: false
    skip_baseline: false
    capture_serial: false
    serial_host: localhost
    serial_device: /dev/ttyUSB0
    serial_baud: 1500000
    _serial_log: "/tmp/serial-{{ inventory_hostname }}.log"
    _serial_pid: "/tmp/socat-{{ inventory_hostname }}.pid"

  tasks:
    - name: Pre-flight — assert exactly one board targeted
      ansible.builtin.assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          test_hardware_e2e.yml is single-board. Pass --limit <hostname>.
          Got {{ ansible_play_hosts | length }} hosts: {{ ansible_play_hosts }}
      run_once: true

    - name: Pre-flight — assert per-board PoE state
      ansible.builtin.assert:
        that:
          - armbian_poe_switch is defined
          - armbian_poe_switch | length > 0
          - armbian_poe_port is defined
          - armbian_poe_port | length > 0
        fail_msg: >-
          {{ inventory_hostname }} needs armbian_poe_switch and
          armbian_poe_port hostvars set.

    - name: Pre-flight — assert armbian_default_password is set
      ansible.builtin.assert:
        that:
          - armbian_default_password is defined
          - armbian_default_password | length > 0
        fail_msg: >-
          armbian_default_password must be set (vault recommended).
          Phase 2's SSH to the NFS-mounted board uses these credentials.
      run_once: true

    - name: Pre-flight — resolve effective armbian_board_config
      ansible.builtin.include_tasks: tasks/_resolve_board_config.yml

    # Background serial capture on the serial host. Pre-create the log
    # file as root with mode 0644 so socat (also root, since the FTDI
    # dongle is typically root:dialout/games) appends to a world-readable
    # file. socat starts with async/poll=0; the pre-exec PID gets written
    # to {{ _serial_pid }}, then `exec` replaces the shell with socat, so
    # the pidfile contains socat's PID. Cleanup kills via the pidfile.
    # Ordered before the router plumbing-check so any plumbing-check
    # failure still leaves a serial trace from whatever boot activity
    # happened during the run.
    - name: Pre-flight — start serial capture
      when: capture_serial | bool
      delegate_to: "{{ serial_host }}"
      run_once: true
      become: true
      block:
        - name: Serial — assert socat is available on the control node
          ansible.builtin.command:
            cmd: which socat
          changed_when: false

        # Defensive pre-start: kill any leaked socat from a prior run.
        # `[s]ocat` regex avoids self-match: pkill -f matches against
        # the full cmdline, so a literal `socat -u <dev>` would also
        # match the shell running pkill itself.
        - name: Serial — kill any pre-existing socat on this device
          ansible.builtin.shell: |
            pkill -f "[s]ocat -u {{ serial_device }}" 2>/dev/null || true
            rm -f {{ _serial_pid }}
          changed_when: false

        - name: Serial — assert serial device exists
          ansible.builtin.stat:
            path: "{{ serial_device }}"
          register: _serial_dev_stat
          failed_when: not _serial_dev_stat.stat.exists

        - name: Serial — truncate log file and ensure world-readable
          ansible.builtin.copy:
            dest: "{{ _serial_log }}"
            content: ""
            mode: "0644"

        - name: Serial — configure tty line discipline
          ansible.builtin.command:
            cmd: stty -F {{ serial_device }} {{ serial_baud }} cs8 -cstopb -parenb -ixon -crtscts raw
          changed_when: true

        - name: Serial — start socat capture in background (pidfile-tracked)
          ansible.builtin.shell: |
            echo $$ > {{ _serial_pid }}
            exec socat -u {{ serial_device }},b{{ serial_baud }},raw,echo=0 OPEN:{{ _serial_log }},append
          async: 86400
          poll: 0
          changed_when: true

    - name: Pre-flight — assert per-model /ip tftp rows exist on the router
      delegate_to: "{{ armbian_router }}"
      run_once: true
      block:
        - name: Pre-flight — count /ip tftp rows per asset for this host
          community.routeros.command:
            commands:
              - >-
                /ip tftp print count-only where
                req-filename="armbian/{{ inventory_hostname }}/{{ item }}"
          register: _plumbing_row_count
          retries: 3
          delay: 5
          until: _plumbing_row_count is succeeded
          changed_when: false
          loop: [vmlinuz, initrd.img, board.dtb]

        - name: Pre-flight — assert each row exists
          ansible.builtin.assert:
            that:
              - (item.stdout[0] | trim | int) >= 1
            fail_msg: >-
              Router has no /ip tftp row for
              armbian/{{ inventory_hostname }}/{{ item.item }}.
              Run playbooks/stage_router.yml first.
          loop: "{{ _plumbing_row_count.results }}"
          loop_control:
            label: "{{ item.item }}"

    # Stale known_hosts on the controller don't *prevent* connections
    # (host_key_checking=False handles auth) but ssh's "REMOTE HOST
    # IDENTIFICATION HAS CHANGED" warning pollutes failure-mode error
    # messages, making real failures hard to read. Drop entries up-front.
    # `connection: local` avoids the SSH-to-localhost class of failure
    # in containerised dev environments where the agent can flake.
    - name: Pre-flight — clear stale known_hosts entries on controller
      ansible.builtin.command:
        cmd: "ssh-keygen -R {{ item }}"
      delegate_to: localhost
      connection: local
      become: false
      loop: "{{ [inventory_hostname, ansible_host | default(inventory_hostname)] | unique }}"
      changed_when: false
      failed_when: false

    - name: Test phases (cleanup runs in always)
      block:
        # Before Phase 1's opening PoE cycle, converge pxelinux.cfg so
        # the `default` label is sd. The pxelinux.cfg file always exists
        # on the router; boot mode is selected by `default`, not by file
        # presence. A prior aborted run might have left default=nfs and
        # would trip Phase 1's local-rootfs assertion.
        - name: Pre-flight — converge pxelinux default to sd on router
          ansible.builtin.include_tasks: tasks/render_and_upload_pxelinux.yml
          vars:
            armbian_boot_mode: sd

        - name: Phase 1 — SD baseline (skippable via skip_baseline=true)
          when: not (skip_baseline | bool)
          block:
            # Auto-bootstrap detection: after a fresh SD reflash the
            # board boots cleanly but the inventory user doesn't exist
            # yet — only the Armbian default root user does.
            #   1. wait_for TCP/22 (inside cold_boot_with_retry) —
            #      identity-agnostic; a real boot failure times out
            #      across all attempts.
            #   2. one short wait_for_connection probe as the inventory
            #      user — succeeds quickly if bootstrap already ran.
            #   3. if (1) succeeds and (2) fails, run bootstrap_armbian
            #      inline against the root account.
            - name: Phase 1 — PoE cycle + wait for TCP/22 (with retries)
              ansible.builtin.include_tasks: tasks/cold_boot_with_retry.yml
              vars:
                _phase_label: "Phase 1"
                _boot_max_attempts: "{{ armbian_boot_retry_attempts | default(0) | int + 1 }}"

            - name: Phase 1 — auto-bootstrap if needed
              ansible.builtin.include_tasks: tasks/auto_bootstrap_if_needed.yml
              vars:
                _phase_label: "Phase 1"

            - name: Phase 1 — wait for SSH (SD-root identity, with cycle retry)
              ansible.builtin.include_tasks: tasks/wait_for_ssh_with_cycle_retry.yml
              vars:
                _phase_label: "Phase 1"
                _wait_timeout: "{{ armbian_post_boot_wait_timeout | default(300) }}"

            - name: Phase 1 — gather facts
              ansible.builtin.setup:

            - name: Phase 1 — capture root mount facts
              ansible.builtin.set_fact:
                _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                                 | map(attribute='fstype') | first }}"
                _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                                 | map(attribute='device') | first }}"

            - name: Phase 1 — diagnostic bundle
              ansible.builtin.import_tasks: tasks/diagnostic_bundle.yml
              vars:
                _diag_phase: "phase 1 — SD baseline"

            - name: Phase 1 — assert rootfs is on a local block device
              ansible.builtin.assert:
                that:
                  - _root_fstype not in ['nfs', 'nfs4']
                  - _root_device is match('^/dev/')
                fail_msg: >-
                  Phase 1: expected rootfs on /dev/<block>; got
                  {{ _root_device }} ({{ _root_fstype }}).
                  Diagnostic bundle is in the prior debug task.

        - name: Phase 2 — render+upload pxelinux for nfs
          ansible.builtin.include_tasks: tasks/render_and_upload_pxelinux.yml
          vars:
            armbian_boot_mode: nfs

        - name: Phase 2 — PoE cycle + wait for TCP/22 (with retries)
          ansible.builtin.include_tasks: tasks/cold_boot_with_retry.yml
          vars:
            _phase_label: "Phase 2"
            _boot_max_attempts: "{{ armbian_boot_retry_attempts | default(0) | int + 1 }}"

        - name: Phase 2 — reset connection so new identity takes effect
          ansible.builtin.meta: reset_connection

        # Same auto-bootstrap pattern as Phase 1. The per-host NFS
        # rootfs is initially cloned from _templates/<model>/ (stock
        # Armbian image), so a never-bootstrapped clone only has the
        # Armbian default root user. But per-host clones persist across
        # test sessions; any prior iter that auto-bootstrapped the
        # rootfs leaves the inventory user provisioned. Probe + auto-
        # bootstrap handles both cases.
        - name: Phase 2 — auto-bootstrap if needed (NFS rootfs may be fresh)
          ansible.builtin.include_tasks: tasks/auto_bootstrap_if_needed.yml
          vars:
            _phase_label: "Phase 2"

        - name: Phase 2 — verify NFS-mounted boot
          block:
            - name: Phase 2 — wait for SSH (NFS-root identity, with cycle retry)
              ansible.builtin.include_tasks: tasks/wait_for_ssh_with_cycle_retry.yml
              vars:
                _phase_label: "Phase 2"
                _wait_timeout: "{{ armbian_post_boot_wait_timeout | default(300) }}"

            - name: Phase 2 — gather facts
              ansible.builtin.setup:

            - name: Phase 2 — capture root mount facts
              ansible.builtin.set_fact:
                _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                                 | map(attribute='fstype') | first }}"
                _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                                 | map(attribute='device') | first }}"

            - name: Phase 2 — diagnostic bundle
              ansible.builtin.import_tasks: tasks/diagnostic_bundle.yml
              vars:
                _diag_phase: "phase 2 — nfsroot"

            - name: Phase 2 — assert rootfs is NFS
              ansible.builtin.assert:
                that:
                  - _root_fstype in ['nfs', 'nfs4']
                fail_msg: >-
                  Phase 2: expected NFS-mounted rootfs; got fstype
                  {{ _root_fstype }}. Board did not PXE-boot into NFS
                  root despite pxelinux.cfg default=nfs on the router.
                  Check /proc/cmdline in the diagnostic bundle and the
                  router's /ip tftp serving for armbian/{{ inventory_hostname }}/.

        - name: Phase 3 — render+upload pxelinux for sd
          ansible.builtin.include_tasks: tasks/render_and_upload_pxelinux.yml
          vars:
            armbian_boot_mode: sd

        # Phase 3 intentionally has no block-scoped vars: the Phase 2
        # verify block has exited so its NFS-root identity vars are
        # already out of scope. reset_connection runs BEFORE the cold
        # boot retry so the retry's wait_for_connection opens a fresh
        # SSH session with the inventory ansible_user.
        - name: Phase 3 — reset connection so inventory identity takes effect
          ansible.builtin.meta: reset_connection

        - name: Phase 3 — PoE cycle + wait for TCP/22 (with retries)
          ansible.builtin.include_tasks: tasks/cold_boot_with_retry.yml
          vars:
            _phase_label: "Phase 3"
            _boot_max_attempts: "{{ armbian_boot_retry_attempts | default(0) | int + 1 }}"

        - name: Phase 3 — wait for SSH (SD-root identity, with cycle retry)
          ansible.builtin.include_tasks: tasks/wait_for_ssh_with_cycle_retry.yml
          vars:
            _phase_label: "Phase 3"
            _wait_timeout: "{{ armbian_post_boot_wait_timeout | default(300) }}"

        - name: Phase 3 — gather facts
          ansible.builtin.setup:

        - name: Phase 3 — capture root mount facts
          ansible.builtin.set_fact:
            _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='fstype') | first }}"
            _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='device') | first }}"

        - name: Phase 3 — diagnostic bundle
          ansible.builtin.import_tasks: tasks/diagnostic_bundle.yml
          vars:
            _diag_phase: "phase 3 — back to SD"

        - name: Phase 3 — assert rootfs returned to local block device
          ansible.builtin.assert:
            that:
              - _root_fstype not in ['nfs', 'nfs4']
              - _root_device is match('^/dev/')
            fail_msg: >-
              Phase 3: expected rootfs on /dev/<block> after converging
              pxelinux.cfg to default sd; got {{ _root_device }}
              ({{ _root_fstype }}).

      always:
        - name: Cleanup — print exit-state notice if leave_state
          ansible.builtin.debug:
            msg: >-
              leave_state=true: not cleaning up. Board may still be in
              NFS root; converge back to SD manually with:
              ansible-playbook playbooks/converge_boot_mode.yml
              --limit {{ inventory_hostname }}
              -e armbian_boot_mode=sd
          when: leave_state | bool

        - name: Cleanup — converge pxelinux default sd on router
          ansible.builtin.include_tasks: tasks/render_and_upload_pxelinux.yml
          vars:
            armbian_boot_mode: sd
          when: not (leave_state | bool)

        - name: Cleanup — reset connection to inventory identity
          ansible.builtin.meta: reset_connection
          when: not (leave_state | bool)

        - name: Cleanup — PoE cycle + wait for TCP/22 (with retries)
          ansible.builtin.include_tasks: tasks/cold_boot_with_retry.yml
          vars:
            _phase_label: "Cleanup"
            _boot_max_attempts: "{{ armbian_boot_retry_attempts | default(0) | int + 1 }}"
          when: not (leave_state | bool)

        - name: Cleanup — auto-bootstrap if needed (post-Phase-1-skip recovery)
          ansible.builtin.include_tasks: tasks/auto_bootstrap_if_needed.yml
          vars:
            _phase_label: "Cleanup"
          when: not (leave_state | bool)

        - name: Cleanup — wait for SSH after cleanup cycle (with cycle retry)
          ansible.builtin.include_tasks: tasks/wait_for_ssh_with_cycle_retry.yml
          vars:
            _phase_label: "Cleanup"
            _wait_timeout: "{{ armbian_post_boot_wait_timeout | default(300) }}"
          when: not (leave_state | bool)

        - name: Cleanup — verify board returned to SD boot
          ansible.builtin.setup:
          when: not (leave_state | bool)

        - name: Cleanup — capture root mount facts (post-cleanup)
          ansible.builtin.set_fact:
            _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='fstype') | first }}"
            _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='device') | first }}"
          when: not (leave_state | bool)

        - name: Cleanup — assert SD-rooted (post-cleanup)
          ansible.builtin.assert:
            that:
              - _root_fstype not in ['nfs', 'nfs4']
            fail_msg: >-
              Cleanup left the board in NFS root mode despite converging
              pxelinux.cfg to default sd. Investigate the pxelinux.cfg
              default directive on the router and the linux-u-boot-*
              deb on disk.
          when: not (leave_state | bool)

        # Stop serial capture last so the cleanup phase's reboots are
        # captured. Belt-and-suspenders: kill the pidfile-recorded PID
        # first (the primary mechanism), then `pkill -f` any remaining
        # socat reading {{ serial_device }} as a backstop for stale
        # pidfiles. Plays that abort before the test phases block
        # leak socat; the defensive pre-start kill in the Pre-flight
        # serial-capture block catches those on the next run.
        - name: Cleanup — stop serial capture
          ansible.builtin.shell: |
            if [ -f {{ _serial_pid }} ]; then
              kill "$(cat {{ _serial_pid }})" 2>/dev/null || true
              rm -f {{ _serial_pid }}
            fi
            pkill -f "[s]ocat -u {{ serial_device }}" 2>/dev/null || true
          delegate_to: "{{ serial_host }}"
          run_once: true
          become: true
          changed_when: false
          when: capture_serial | bool

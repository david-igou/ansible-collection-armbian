---
# Manual-PSU cold-boot test for USB-C powered RK3588(S) boards.
#
# Same shape as test_hardware_e2e.yml's Phase 2 (converge pxelinux.cfg
# to nfs + verify NFS-rooted boot), but the power transitions are
# operator-driven `ansible.builtin.pause` prompts instead of a PoE
# cycle on the upstream RouterOS switch. Use this when the board is
# being powered via its USB-C input from an external PSU rather than
# via PoE.
#
# Pre-conditions:
#   - PSU is DISCONNECTED (board is off) at invocation.
#   - The RouterOS router is reachable.
#   - Serial UART (USB-FTDI) is connected on serial_host's
#     /dev/ttyUSB0 if capture_serial is true (default).
#   - Board's Ethernet is wired (PoE port is fine even though no
#     power is delivered — the port still passes data).
#
# Workflow per invocation (one cold boot per run):
#   1. Pre-flight serial capture starts on serial_host.
#   2. Per-board pxelinux.cfg converged to nfs mode on the router.
#   3. PAUSE: prompt operator to plug in PSU.
#   4. wait_for TCP/22 (board cold-boots via PXE → NFS).
#   5. wait_for_connection (inv user SSH ready).
#   6. Gather root mount facts, assert rootfs is NFS.
#   7. Diagnostic bundle.
#   8. ALWAYS-block: converge pxelinux.cfg to sd mode, stop serial,
#      PAUSE: prompt operator to unplug PSU for next iter.
#
# Usage:
#   ansible-playbook playbooks/test_manual_psu_cold_boot.yml \
#     --limit opi5pro-01.example.lan \
#     -e armbian_default_password=1234

- name: Manual-PSU cold-boot test (single cold boot per run)
  hosts: "{{ armbian_boards_group | default('boards') }}"
  gather_facts: false
  vars:
    capture_serial: true
    serial_host: localhost
    serial_device: /dev/ttyUSB0
    serial_baud: 1500000
    _routeros_target: "{{ groups['routeros_router'] | first }}"
    _wait_timeout: 300
    armbian_boot_attempt_timeout: 180
    _serial_log: "/tmp/serial-{{ inventory_hostname }}.log"
    _serial_pid: "/tmp/socat-{{ inventory_hostname }}.pid"

  tasks:
    - name: Pre-flight — assert exactly one board targeted
      ansible.builtin.assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          test_manual_psu_cold_boot.yml is single-board. Pass
          --limit <hostname>. Got {{ ansible_play_hosts | length }}
          hosts: {{ ansible_play_hosts }}
      run_once: true

    - name: Pre-flight — assert armbian_default_password is set
      ansible.builtin.assert:
        that:
          - armbian_default_password is defined
          - armbian_default_password | length > 0
        fail_msg: >-
          armbian_default_password must be set. Pass via
          -e armbian_default_password=<pw> or set in inventory.
      run_once: true

    - name: Pre-flight — start serial capture
      when: capture_serial | bool
      delegate_to: "{{ serial_host }}"
      run_once: true
      become: true
      block:
        - name: Serial — assert socat is available
          ansible.builtin.command:
            cmd: which socat
          changed_when: false

        - name: Serial — assert serial device exists
          ansible.builtin.stat:
            path: "{{ serial_device }}"
          register: _serial_dev_stat
          failed_when: not _serial_dev_stat.stat.exists

        - name: Serial — kill any pre-existing socat on this device
          ansible.builtin.shell: |
            pkill -f "[s]ocat -u {{ serial_device }}" 2>/dev/null || true
            rm -f {{ _serial_pid }}
          changed_when: false

        - name: Serial — truncate log file and ensure world-readable
          ansible.builtin.copy:
            dest: "{{ _serial_log }}"
            content: ""
            mode: "0644"

        - name: Serial — configure tty line discipline
          ansible.builtin.command:
            cmd: stty -F {{ serial_device }} {{ serial_baud }} cs8 -cstopb -parenb -ixon -crtscts raw
          changed_when: true

        - name: Serial — start socat capture in background
          ansible.builtin.shell: |
            echo $$ > {{ _serial_pid }}
            exec socat -u {{ serial_device }},b{{ serial_baud }},raw,echo=0 OPEN:{{ _serial_log }},append
          async: 86400
          poll: 0
          changed_when: true

    - name: Pre-flight — clear stale known_hosts entries on controller
      ansible.builtin.command:
        cmd: "ssh-keygen -R {{ item }}"
      delegate_to: localhost
      connection: local
      become: false
      loop: "{{ [inventory_hostname, ansible_host | default(inventory_hostname)] | unique }}"
      changed_when: false
      failed_when: false

    - name: Cold-boot test (cleanup runs in always)
      block:
        - name: Setup — converge pxelinux.cfg to nfs mode on the router
          ansible.builtin.include_tasks: tasks/render_and_upload_pxelinux.yml
          vars:
            armbian_boot_mode: nfs

        - name: PSU plug-in — operator action
          ansible.builtin.pause:
            prompt: >-
              =================================================================
              PLUG IN PSU NOW
              Board should cold-boot via PXE → NFS.
              Press Enter once connected (board boot will take ~60-90 s).
              =================================================================

        - name: Wait for board TCP/22 (identity-agnostic)
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 22
            timeout: "{{ armbian_boot_attempt_timeout | default(180) }}"
            state: started
          delegate_to: localhost

        - name: Wait for SSH (inventory identity)
          ansible.builtin.wait_for_connection:
            delay: 10
            timeout: "{{ _wait_timeout }}"

        - name: Gather facts
          ansible.builtin.setup:

        - name: Capture root mount facts
          ansible.builtin.set_fact:
            _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='fstype') | first }}"
            _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                             | map(attribute='device') | first }}"

        - name: Diagnostic bundle
          ansible.builtin.import_tasks: tasks/diagnostic_bundle.yml
          vars:
            _diag_phase: "manual-psu cold boot — nfsroot verify"

        - name: Assert rootfs is NFS
          ansible.builtin.assert:
            that:
              - _root_fstype in ['nfs', 'nfs4']
            fail_msg: >-
              Cold boot completed but rootfs is {{ _root_fstype }}
              ({{ _root_device }}) — expected NFS. Board did not
              PXE-boot despite pxelinux.cfg with default=nfs being on
              the router. Diagnostic bundle above has /proc/cmdline,
              findmnt, etc.

      always:
        - name: Cleanup — converge pxelinux.cfg to sd mode on the router
          ansible.builtin.include_tasks: tasks/render_and_upload_pxelinux.yml
          vars:
            armbian_boot_mode: sd

        - name: Cleanup — stop serial capture
          ansible.builtin.shell: |
            if [ -f {{ _serial_pid }} ]; then
              kill "$(cat {{ _serial_pid }})" 2>/dev/null || true
              rm -f {{ _serial_pid }}
            fi
            pkill -f "[s]ocat -u {{ serial_device }}" 2>/dev/null || true
          delegate_to: "{{ serial_host }}"
          run_once: true
          become: true
          changed_when: false
          when: capture_serial | bool

        - name: PSU unplug — operator action (for next iter)
          ansible.builtin.pause:
            prompt: >-
              =================================================================
              UNPLUG PSU NOW
              (Required before running the next iter.)
              Press Enter once disconnected.
              =================================================================

---
# Flashes PXE-capable U-Boot to SPI or eMMC on target boards.
# Boards must already be running an Armbian OS and reachable via SSH.
#
# Usage (all boards):
#   ansible-playbook playbooks/flash_bootloader.yml
#
# Usage (specific board):
#   ansible-playbook playbooks/flash_bootloader.yml --limit orange-pi-5-01
#
# Options:
#   -e bootloader_target=spi    force SPI flash
#   -e bootloader_target=emmc   force eMMC flash
#   -e bootloader_target=auto   detect (default)

- name: Flash U-Boot bootloader
  hosts: boards
  gather_facts: true
  become: true
  serial: 1
  roles:
    - role: bootloader

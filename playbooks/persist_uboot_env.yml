---
# Approach B from docs/uboot-armbian-build-explainer.html §8 ("Fixing
# rock-5b's autonomous-PXE problem").
#
# Persist the U-Boot environment vars that rock-5b's stock SPI env is
# missing, by writing them with `fw_setenv` from Linux on the running
# board. The next cold boot reads the updated env from SPI and clears
# two of the three failure layers in one pass:
#
#   Layer 1 (wrong MAC on DHCP) — setting `ethaddr` short-circuits
#     rockchip_setup_macaddr() so DHCP DISCOVER carries the inventory
#     MAC that rb5009's static reservation recognises.
#
#   Layer 2 (PXE addresses vanish) — restores `pxefile_addr_r`,
#     `kernel_addr_r`, `ramdisk_addr_r`, `fdt_addr_r`, `scriptaddr`
#     (which CONFIG_ENV_IS_IN_SPI_FLASH=y erases on first successful
#     `fw_setenv`) plus `bootmeths` so `bootflow scan` enumerates the
#     ethernet bootdev.
#
# Layer 0 (NIC not enumerated) is already cleared at build time by the
# `__999_pxe_first` family hook in playbooks/build_image.yml — without
# it CONFIG_PCI_INIT_R is unset and the RTL8125 isn't a bootdev, so
# this playbook has nothing to act on.
#
# Idempotent: each var is read with `fw_printenv -n` first; `fw_setenv`
# only fires on the vars that actually drift. The cold-cycle handler
# runs only when at least one var was rewritten.
#
# State lives in per-board SPI, not the U-Boot binary. Re-image a board
# and the env reverts to whatever the U-Boot binary's defaults are; re-
# run this playbook to converge. Per-board MAC comes from the same
# `board_mac` hostvar that drives pxelinux.cfg/01-<mac>, so the SPI env
# and rb5009 TFTP layout can't drift apart.
#
# Prerequisites:
#   - Board must boot to Linux on SD (Approach B can't run on a board
#     that won't reach an init system — use Approach A for that case).
#   - playbooks/bootstrap_armbian.yml must have run so this play can
#     SSH in as the inventory user with passwordless sudo.
#   - inventory hostvars: `board_mac` (mandatory); `poe_switch` +
#     `poe_port` (mandatory; consumed by the cold-cycle handler).
#
# Usage:
#   # Converge SPI env on all rock-5b boards
#   ansible-playbook playbooks/persist_uboot_env.yml
#
#   # Single board
#   ansible-playbook playbooks/persist_uboot_env.yml --limit rock-5b-01
#
#   # Skip the cold-cycle (e.g. you'll PoE-cycle out-of-band)
#   ansible-playbook playbooks/persist_uboot_env.yml \
#     --skip-tags cold_cycle

- name: Persist U-Boot env vars to SPI on rock-5b boards
  hosts: rock_5b
  gather_facts: false
  vars:
    # SPI env layout for rock-5b. Pulled from
    # cache/sources/u-boot-worktree/.../configs/rock5b-rk3588_defconfig:
    #   CONFIG_ENV_OFFSET=0xc00000     (env start in SPI)
    #   CONFIG_ENV_SIZE=0x20000        (env region size)
    #   CONFIG_ENV_SECT_SIZE=0x1000    (flash erase block)
    # fw_env.config columns: <device> <offset> <env-size> <sect-size>.
    fw_env_config: "/dev/mtd0    0xc00000    0x20000    0x1000\n"

    # Vars to converge in SPI. Values come from upstream u-boot's
    # default_environment[] for rk3588 (include/configs/rockchip-common.h
    # + arch/arm/include/asm/arch-rockchip/boot_mode.h), preserved here
    # so a CRC-valid SPI env doesn't silently drop them. board_mac is
    # lowercased: U-Boot's eth_env_get_enetaddr_by_index() parses hex
    # case-insensitively, but fw_printenv returns the stored string
    # verbatim — keeping case consistent avoids spurious drift each run.
    uboot_env_vars:
      ethaddr: "{{ board_mac | lower }}"
      pxefile_addr_r: "0x00500000"
      kernel_addr_r: "0x02080000"
      ramdisk_addr_r: "0x06000000"
      fdt_addr_r: "0x08000000"
      scriptaddr: "0x00c00000"
      bootmeths: "pxe extlinux script efi"

  pre_tasks:
    # Minimal fact set — we need ansible_date_time for the snapshot
    # filename, but gathering every fact is wasted work on a play that
    # only touches one userspace tool.
    - name: Gather date facts for snapshot filename
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - date_time

    - name: Assert per-host board_mac is defined
      ansible.builtin.assert:
        that:
          - board_mac is defined
          - board_mac | length > 0
          - board_mac is match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$')
        fail_msg: >-
          board_mac must be set on {{ inventory_hostname }} as a
          colon-separated hex MAC (xx:xx:xx:xx:xx:xx). Got:
          '{{ board_mac | default("<undefined>") }}'.

  tasks:
    - name: Ensure u-boot-tools is installed
      become: true
      ansible.builtin.apt:
        name: u-boot-tools
        state: present

    # Asserting fw_env.config matches the rock-5b SPI layout is what
    # makes fw_setenv aim at the right flash region. Wrong offsets here
    # corrupt the env (or worse, U-Boot proper). Treat this file as
    # collection-owned: overwrite unconditionally so an operator who
    # tweaked it can't silently desync the layout.
    - name: Ensure /etc/fw_env.config matches the SPI env layout
      become: true
      ansible.builtin.copy:
        dest: /etc/fw_env.config
        content: "{{ fw_env_config }}"
        owner: root
        group: root
        mode: "0644"

    - name: Ensure /var/backups exists for env snapshot
      become: true
      ansible.builtin.file:
        path: /var/backups
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Snapshot BEFORE any fw_setenv so the operator has a recovery
    # hatch. One snapshot per run (per host); replays of this playbook
    # within the same minute reuse the existing snapshot via `creates`.
    - name: Snapshot current U-Boot env before mutating
      become: true
      ansible.builtin.shell:
        cmd: >-
          fw_printenv >
          /var/backups/uboot-env-{{ ansible_facts.date_time.iso8601_basic_short }}.bak
        creates: "/var/backups/uboot-env-{{ ansible_facts.date_time.iso8601_basic_short }}.bak"

    # `fw_printenv -n <name>` exits non-zero when the var is missing —
    # that's "drift" too, so we suppress the failure and let the
    # drift-detect step (next task) treat an empty stdout as a value
    # the set task must write.
    - name: Read each U-Boot env var currently in SPI
      become: true
      ansible.builtin.command:
        cmd: "fw_printenv -n {{ item.key }}"
      register: _current_env
      changed_when: false
      failed_when: false
      loop: "{{ uboot_env_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Set each var only on drift. The zip pairs the desired (k,v) with
    # the corresponding fw_printenv result for the same key. We compare
    # the stored value (lowercased to match the desired form) against
    # the desired value; non-equal triggers a set + cold-cycle.
    #
    # The cold-cycle isn't expressed as a handler because Ansible
    # rejects include_role inside `handlers:` (handlers run a more
    # restricted task set). Instead we register the loop result and
    # gate the cycle task on any iteration having changed.
    - name: Persist each drifted U-Boot env var to SPI
      become: true
      ansible.builtin.command:
        argv:
          - fw_setenv
          - "{{ item.0.key }}"
          - "{{ item.0.value }}"
      when: (item.1.stdout | default('') | lower) != (item.0.value | lower)
      loop: "{{ uboot_env_vars | dict2items | zip(_current_env.results) | list }}"
      loop_control:
        label: "{{ item.0.key }}"
      register: _set_results
      # The `when:` above skips iterations with no drift, so anything
      # that runs has just modified SPI. Mark it changed unconditionally
      # for the lint profile and for downstream `_set_results` checks.
      changed_when: true

    # Warm `reboot` may skip re-reading SPI env on some RK3588 boot
    # ROMs, so we PoE-cycle. Per-task delegation to `poe_switch` is
    # baked into the routeros_poe role, so include_role here runs in
    # the board's context but each underlying command hits the switch.
    - name: Cold-cycle the board when any env var drifted
      ansible.builtin.include_role:
        name: routeros_poe
      vars:
        poe_action: cycle
      when: _set_results.results | selectattr('changed') | list | length > 0
      tags: cold_cycle

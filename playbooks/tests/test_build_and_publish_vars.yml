---
# Localhost-only test harness that exercises the per-host variable
# resolution build_and_publish_from_inventory.yml uses, then asserts
# the resolved values match what the example inventory should carry.
#
# This is a static check — no SSH, no Docker, no armbian/build clone.
# It runs entirely against the documentation-only example inventory.
#
# Run with:
#   unset ANSIBLE_INVENTORY
#   ansible-playbook -i inventory/ playbooks/tests/test_build_and_publish_vars.yml
#
# Failures here indicate either (a) drift between the playbook's
# expected variable contract and the example inventory's group_vars,
# or (b) the resolver logic in build_and_publish_from_inventory.yml needs
# the same update.

- name: Resolve per-host build vars and assert expected values
  hosts: "{{ armbian_boards_group | default('boards') }}"
  gather_facts: false
  connection: local
  tasks:
    - name: Resolve effective armbian_board_config per host
      ansible.builtin.include_tasks: ../tasks/_resolve_board_config.yml

    - name: Resolve effective armbian_build per host
      ansible.builtin.include_tasks: ../tasks/_resolve_build_profile.yml

    - name: Assert armbian_board_config.armbian_board_name is populated
      ansible.builtin.assert:
        that:
          - armbian_board_config.armbian_board_name | default('') | length > 0
        fail_msg: >-
          {{ inventory_hostname }}: armbian_board_config.armbian_board_name is empty.
          Check armbian_board_config_family / _model / _host in inventory.

    - name: Assert armbian_board_config.dtb is populated
      ansible.builtin.assert:
        that:
          - armbian_board_config.dtb | default('') | length > 0
        fail_msg: >-
          {{ inventory_hostname }}: armbian_board_config.dtb is empty.
          Set dtb in armbian_board_config_model for this board's model group.

    - name: Assert armbian_board_config.console is populated
      ansible.builtin.assert:
        that:
          - armbian_board_config.console | default('') | length > 0
        fail_msg: >-
          {{ inventory_hostname }}: armbian_board_config.console is empty.
          Set console in armbian_board_config_family or _model.

    - name: Assert armbian_build.branch is a known armbian/build BRANCH value
      ansible.builtin.assert:
        that:
          - armbian_build.branch in ['current', 'edge', 'vendor', 'legacy']
        fail_msg: >-
          {{ inventory_hostname }}: armbian_build.branch = '{{ armbian_build.branch }}'
          is not a known armbian/build BRANCH value.
          Check armbian_build_family / _model / _host in inventory.

    - name: Assert armbian_build.userpatches entries all have dest and content
      ansible.builtin.assert:
        that:
          - armbian_build.userpatches | selectattr('dest', 'undefined') | list | length == 0
          - armbian_build.userpatches | selectattr('content', 'undefined') | list | length == 0
        fail_msg: >-
          {{ inventory_hostname }}: at least one armbian_build.userpatches entry is
          missing 'dest' or 'content'. userpatches = {{ armbian_build.userpatches }}

- name: Assert example-inventory-specific contracts (localhost play)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert rk3588 + rock_5a boards use edge branch in example inventory
      ansible.builtin.assert:
        that:
          - hostvars[item].armbian_build.branch == 'edge'
        fail_msg: >-
          Board {{ item }} has armbian_build.branch =
          '{{ hostvars[item].armbian_build.branch }}';
          example-inventory contract expects 'edge' for rk3588 + rock_5a
          boards (PCIe NICs / SPI U-Boot require mainline u-boot from edge).
          Note: orange_pi_5 (rk3588s, RTL/YT8531C via GMAC) legitimately
          uses 'current' and is excluded from this check.
      loop: >-
        {{ (groups.get('rk3588', []) + groups.get('rock_5a', []))
           | unique | list }}

    - name: Assert rock-5b ships its v2026.04 u-boot bump via per-board conf overlay
      ansible.builtin.assert:
        that:
          - >-
            hostvars[item].armbian_build.userpatches
            | selectattr('dest', 'equalto', 'config/boards/rock-5b.conf')
            | list | length == 1
          - >-
            'post_family_config_branch_edge__999_rock5b_uboot_v2026_04' in
            (hostvars[item].armbian_build.userpatches
             | selectattr('dest', 'equalto', 'config/boards/rock-5b.conf')
             | map(attribute='content') | first | default(''))
        fail_msg: >-
          {{ item }}: must ship the
          post_family_config_branch_edge__999_rock5b_uboot_v2026_04
          hook via dest: config/boards/rock-5b.conf.
      loop: "{{ groups.get('rock_5b', []) }}"

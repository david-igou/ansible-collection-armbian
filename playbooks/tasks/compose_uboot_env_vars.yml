---
# Compose the per-host uboot_env_vars dict from three sources in this
# precedence (low → high):
#   1. armbian_board_configs[<model>].uboot_env.defaults
#      (board static SPI defaults, e.g. rock-5b's addr_r vars)
#   2. Collection-managed keys: ethaddr (from armbian_board_mac),
#      and localcmd (rendered, only when persist_via == 'spi')
#   3. armbian_uboot_env_extra (operator escape hatch; wins)
#
# Output (registered fact): _uboot_env_vars — flat dict of name→value.
#
# Inputs (must be defined on the host before include):
#   armbian_board_model   — model key for vars/boards.yml lookup
#   armbian_board_mac     — colon-separated MAC (xx:xx:xx:xx:xx:xx)
#   armbian_board_configs — usually from vars/boards.yml
#   armbian_boot_mode     — 'local_kernel' triggers localcmd render
#   armbian_local_kernel  — optional dict with .persist_via and field overrides
#   armbian_uboot_env_extra — optional flat dict (operator escape hatch)
#
# Used by:
#   - playbooks/persist_uboot_env.yml (real fw_setenv path; Task 8)
#   - extensions/molecule/persist_uboot_env/converge.yml (precedence test; Task 7)

- name: Pull board config for this host
  ansible.builtin.set_fact:
    _board_cfg: "{{ armbian_board_configs[armbian_board_model] }}"

# Source 1: board-level SPI env defaults (e.g. addr_r vars for rock-5b).
# Boards with no SPI flash (uboot_env.storage: nowhere) leave this empty.
- name: Source 1 — board defaults
  ansible.builtin.set_fact:
    _src1: "{{ _board_cfg.uboot_env.defaults | default({}) }}"

# Source 2a: ethaddr — always included, derived from inventory MAC.
# U-Boot's eth_env_get_enetaddr_by_index() parses hex case-insensitively,
# but fw_printenv returns the stored string verbatim; lowercasing keeps
# drift checks stable across repeated runs.
- name: Source 2a — collection-managed ethaddr
  ansible.builtin.set_fact:
    _src2_ethaddr:
      ethaddr: "{{ armbian_board_mac | lower }}"

# Source 2b: localcmd — rendered only when:
#   - armbian_boot_mode == 'local_kernel'  (intent)
#   - armbian_local_kernel.persist_via == 'spi'  (mechanism)
# The hook path (persist_via == 'hook' or absent) skips this task; the
# resulting _src2_localcmd default({}) in the combine below is a no-op.
#
# Chain logic mirrors roles/image_build/templates/render_localcmd_chain.j2
# exactly. The duplication is intentional: Jinja's FileSystemLoader path
# restriction prevents importing that macro from a set_fact in a tasks
# file outside a role. Task 7's molecule scenario verifies both render
# the same string.
#
# Uses per-board hardcoded storage (full device address including partition,
# e.g. "nvme 0:2"). Universal lookup approaches (part number + gpt setenv)
# both failed on opi5pro hardware; reverted to hardcoded per #82 design.
- name: Source 2b — collection-managed localcmd (only when persist_via == spi)
  vars:
    _lk: "{{ armbian_local_kernel | default({}) }}"
    _storage: "{{ _lk.storage | default(_board_cfg.local_kernel.storage) }}"
    _storage_scan: "{{ _lk.storage_scan | default(_board_cfg.local_kernel.storage_scan) }}"
    _root_label: "{{ _lk.root_label | default('armbi_root_local') }}"
    _console: "{{ _lk.console | default(_board_cfg.console) }}"
    _dtb: "{{ _lk.dtb | default(_board_cfg.dtb) }}"
    _chain: >-
      setenv bootargs root=LABEL={{ _root_label }} rootfstype=ext4 rootwait rw console={{ _console }};
      {{- ' ' }}{{ _storage_scan }};
      {{- ' ' }}ext4load {{ _storage }} ${kernel_addr_r} /boot/Image;
      {{- ' ' }}ext4load {{ _storage }} ${ramdisk_addr_r} /boot/uInitrd;
      {{- ' ' }}setenv ramdisk_size ${filesize};
      {{- ' ' }}ext4load {{ _storage }} ${fdt_addr_r} /boot/dtb/{{ _dtb }};
      {{- ' ' }}booti ${kernel_addr_r} ${ramdisk_addr_r}:${ramdisk_size} ${fdt_addr_r}
  ansible.builtin.set_fact:
    _src2_localcmd:
      localcmd: "{{ _chain }}"
  when:
    - armbian_boot_mode | default('') == 'local_kernel'
    - (armbian_local_kernel.persist_via | default('hook')) == 'spi'

# Source 2: merge ethaddr (always) with localcmd (conditional).
# _src2_localcmd is undefined when the when: above was skipped; default({})
# keeps the combine idempotent regardless of whether localcmd was rendered.
- name: Source 2 — combined collection-managed keys
  ansible.builtin.set_fact:
    _src2: "{{ _src2_ethaddr | combine(_src2_localcmd | default({})) }}"

# Source 3: operator escape hatch. Any key here wins, including ethaddr
# or localcmd if the operator needs to override the collection-managed values.
- name: Source 3 — operator escape hatch
  ansible.builtin.set_fact:
    _src3: "{{ armbian_uboot_env_extra | default({}) }}"

# Final merge in precedence order: source 3 overrides 2 overrides 1.
# Callers consume only _uboot_env_vars; the _src* facts are internal
# intermediates (leading underscore) and should not be relied on.
- name: Compose final dict in precedence order
  ansible.builtin.set_fact:
    _uboot_env_vars: "{{ _src1 | combine(_src2) | combine(_src3) }}"

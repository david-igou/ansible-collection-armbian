---
# Second-layer retry for the post-boot SSH wait.
#
# After the first-layer cold_boot_with_retry succeeds (board's TCP/22
# + sustained ssh-ping passed within ssh_wait_timeout), the playbook
# moves on to a longer wait_for_connection that gates the rest of the
# verify chain (gather_facts, root mount capture, rootfs assertion).
# In iters 91 / 101 / 106 / 107 of #38 we saw the board pass the
# first-layer check, then fall off the network for the full duration
# of the post-retry wait_for_connection ("No route to host" for the
# entire _wait_timeout window). That failure can't be caught by the
# first-layer retry — it happens after that retry has already exited
# claiming success.
#
# This file wraps the post-boot SSH wait in a block/rescue so that
# such failures trigger another cold cycle and one more attempt:
#
#   - wait_for_connection (initial)
#   - on failure → rescue:
#       - cold_boot_with_retry (full boot loop, up to N attempts)
#       - wait_for_connection (retry attempt)
#   - if that also fails → rescue exits unhandled → play fails
#
# Bounded retry — one extra cycle-and-wait at this layer. If the board
# is genuinely too sick to come up cleanly after both the first-layer
# retry and a fresh cycle, that's a hardware issue to investigate.
#
# Inputs (vars from caller):
#   _phase_label    human label (e.g. "Phase 1", "Phase 2", "Phase 3",
#                   "Cleanup"). Used in task names + the nested
#                   cold_boot_with_retry phase label.
#
# Reuses _wait_timeout (defined in the parent play's vars).
# Reuses boot_retry_attempts for the nested cold cycle's depth, but
# this can be overridden per-invocation via ssh_wait_retry_attempts.

- name: "{{ _phase_label }} — wait for SSH (with cycle retry on failure)"
  block:
    - name: "{{ _phase_label }} — wait for SSH (first attempt)"
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: "{{ _wait_timeout }}"

  rescue:
    - name: "{{ _phase_label }} — SSH wait failed, cycle and retry"
      ansible.builtin.debug:
        msg: >-
          {{ _phase_label }}: post-boot SSH wait failed (typical mode:
          board passed the first-layer retry check then fell off the
          network during the longer wait_for_connection window).
          PoE-cycling the board via cold_boot_with_retry, then trying
          the SSH wait one more time.

    - name: "{{ _phase_label }} — second-layer cold cycle"
      ansible.builtin.include_tasks: cold_boot_with_retry.yml
      vars:
        _phase_label: "{{ _phase_label }} (SSH-wait retry)"
        _boot_max_attempts: "{{ ssh_wait_retry_attempts | default(boot_retry_attempts) | int + 1 }}"

    - name: "{{ _phase_label }} — wait for SSH (second attempt, post cycle)"
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: "{{ _wait_timeout }}"

---
# One attempt at PoE cycle + wait_for TCP/22. Wrapped in block/rescue
# so a failure here doesn't propagate up the include chain — the outer
# loop in cold_boot_with_retry.yml advances to the next attempt
# instead. Caller is responsible for asserting _boot_succeeded after
# the loop completes.
#
# `when: not _boot_succeeded` on the block is what makes the outer
# loop short-circuit after a successful attempt. Putting the gate on
# the include_tasks itself doesn't work: Ansible with loop+when on
# include_tasks unrolls *all* iterations upfront and then runs them in
# order, so the propagated `when` is evaluated per-task inside but
# doesn't actually skip subsequent loop iterations in the way you'd
# expect from a normal retry. Gating the block directly here is
# what makes "stop after first success" work — without it the loop
# blindly runs all N attempts (each doing a fresh PoE cycle that may
# fail), and the final board state depends on the *last* attempt
# rather than the first successful one. Verified buggy without this
# gate in iter 73 of #38.

- name: "{{ _phase_label }} attempt {{ _attempt_num }} block"
  when: not (_boot_succeeded | default(false))
  block:
    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — PoE cycle"
      ansible.builtin.include_role:
        name: routeros_poe
      vars:
        poe_action: cycle

    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — wait for board TCP/22"
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        timeout: "{{ boot_attempt_timeout | default(180) }}"
        state: started
      delegate_to: localhost

    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — succeeded"
      ansible.builtin.set_fact:
        _boot_succeeded: true

  rescue:
    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — failed, will retry if attempts remain"
      ansible.builtin.debug:
        msg: >-
          {{ _phase_label }} cold boot attempt {{ _attempt_num }} of
          {{ _boot_max_attempts }} failed (PoE cycle or TCP/22 timeout).
          Will continue to the next attempt if any remain.

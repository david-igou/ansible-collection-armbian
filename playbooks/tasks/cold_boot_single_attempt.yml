---
# One attempt at PoE cycle + wait_for TCP/22 + reachability probe.
# Wrapped in block/rescue so a failure here doesn't propagate up the
# include chain — the outer loop in cold_boot_with_retry.yml advances
# to the next attempt instead. Caller is responsible for asserting
# _boot_succeeded after the loop completes.
#
# Why three checks instead of two: in #38 we saw a class of failures
# (iters 77 and 80, both 4 A HAT) where wait_for TCP/22 succeeded —
# board briefly ACKed SYN to port 22 — but then the board fell off
# the network during late boot and the post-retry wait_for_connection
# saw `No route to host` for 300+ seconds. The original retry only
# covered PoE cycle + TCP/22 wait, so this failure mode wasn't
# caught and the play hard-failed on the unretried wait_for_connection.
#
# The reachability probe is a single 10s SSH connect attempt as the
# inventory user. We classify its outcome:
#   - Network-layer error ("No route to host", "Connection timed out",
#     "Network is unreachable")  → fail the block → rescue → retry the
#     whole boot.
#   - Anything else (auth success, "Permission denied", "Connection
#     refused" on the SSH banner, etc.) → board is reachable on the
#     network, continue past the block as a success. Auth failures
#     are *expected* on a freshly-flashed rootfs that needs
#     auto-bootstrap (the inventory user doesn't exist yet) and the
#     downstream auto-bootstrap chain in test_hardware_e2e.yml will
#     handle them.
#
# `when: not _boot_succeeded` on the block gates the entire attempt
# after the first success, so subsequent loop iterations cleanly
# skip both the block and its rescue (see prior commit message for
# why this has to live on the block, not on the outer include_tasks).

- name: "{{ _phase_label }} attempt {{ _attempt_num }} block"
  when: not (_boot_succeeded | default(false))
  block:
    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — PoE cycle"
      ansible.builtin.include_role:
        name: routeros_poe
      vars:
        poe_action: cycle

    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — wait for board TCP/22"
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        timeout: "{{ boot_attempt_timeout | default(180) }}"
        state: started
      delegate_to: localhost

    # Stability check via wait_for_connection. A single point-in-time
    # probe (or even a 30 s multi-probe window — iter 82, 84) missed
    # the "board responds briefly then falls off the network" failure
    # mode that wait_for_connection downstream then catches at 300+ s.
    # wait_for_connection is itself a sustained ssh-ping; if the board
    # can't successfully ssh-ping within ssh_wait_timeout seconds,
    # the task fails, the block's rescue catches it, and the outer
    # loop retries the whole PoE cycle.
    #
    # Trade-off: this uses the inventory user, so a fresh-rootfs
    # board (inv user doesn't exist yet) will fail wait_for_connection
    # on every attempt → retry exhausts → assert fails. Set
    # boot_retry_attempts=0 for fresh-rootfs flows (where the
    # downstream auto-bootstrap chain is supposed to handle the
    # auth gap). This is acceptable because the operational failure
    # mode driving the retry need (PoE-HAT cold-boot intermittency,
    # #38) only affects bootstrapped boards in practice.
    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — wait for SSH ready (stability)"
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: "{{ ssh_wait_timeout | default(90) }}"

    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — succeeded"
      ansible.builtin.set_fact:
        _boot_succeeded: true

  rescue:
    - name: "{{ _phase_label }} attempt {{ _attempt_num }} — failed, will retry if attempts remain"
      ansible.builtin.debug:
        msg: >-
          {{ _phase_label }} cold boot attempt {{ _attempt_num }} of
          {{ _boot_max_attempts }} failed (PoE cycle, TCP/22 timeout,
          or board fell off the network post-TCP/22). Will continue to
          the next attempt if any remain.

---
# Single-play-compatible body of converge_boot_mode.yml. Used by
# _lifecycle_set_and_verify.yml (Task 14), which wraps this in a
# block/rescue for auto-revert — import_playbook cannot appear inside a
# block, but include_tasks can.
#
# Behaviour is identical to converge_boot_mode.yml; only the play
# scaffolding differs. The four logical phases of the orchestration
# playbook are preserved in order:
#   1. Pre-flight plumbing check (router, delegated + run_once)
#   2. Render pxelinux.cfg locally + upload to router (per-host)
#   3. PoE cold-boot retry (optional, armbian_netboot_cycle_board)
#   4. Post-boot SSH wait (optional, armbian_netboot_cycle_board)
#   5. Verify rootfs matches declared mode (optional, armbian_netboot_verify_state)
#
# Caller contract:
#   - Include from a play whose hosts: is the target board (or board group).
#   - armbian_netboot_boot_mode must be set (from inventory or -e).
#   - armbian_netboot_router must be set (inventory hostvar pointing at the
#     RouterOS router to use for plumbing-check and pxelinux upload).
#   - vars/boards.yml must already be loaded (include_vars) before calling.
#
# Transport overrides (swappable, consistent with converge_boot_mode.yml):
#   armbian_netboot_plumbing_check_tasks  absolute path to tasks file for plumbing check
#                                         default: ../routeros/tasks/plumbing_check_one.yml
#                                                  (relative to this file's directory)
#   armbian_netboot_pxelinux_upload_tasks absolute path to tasks file for render+upload
#                                         default: render_and_upload_pxelinux.yml
#                                                  (relative to this file's directory)

- name: "converge[{{ armbian_netboot_boot_mode }}] — pre-flight plumbing check"
  ansible.builtin.include_tasks: >-
    {{ armbian_netboot_plumbing_check_tasks
       | default('../routeros/tasks/plumbing_check_one.yml') }}
  delegate_to: "{{ armbian_netboot_router }}"
  run_once: true

- name: "converge[{{ armbian_netboot_boot_mode }}] — render pxelinux.cfg + upload"
  ansible.builtin.include_tasks: >-
    {{ armbian_netboot_pxelinux_upload_tasks
       | default('render_and_upload_pxelinux.yml') }}

- name: "converge[{{ armbian_netboot_boot_mode }}] — PoE cycle + cold-boot retry"
  ansible.builtin.include_tasks: cold_boot_with_retry.yml
  vars:
    _phase_label: "converge[{{ armbian_netboot_boot_mode }}]"
    _boot_max_attempts: "{{ armbian_netboot_boot_retry_attempts | default(0) | int + 1 }}"
  when: armbian_netboot_cycle_board | default(true) | bool

- name: "converge[{{ armbian_netboot_boot_mode }}] — wait for SSH"
  ansible.builtin.include_tasks: wait_for_ssh_with_cycle_retry.yml
  vars:
    _phase_label: "converge[{{ armbian_netboot_boot_mode }}]"
    _wait_timeout: "{{ armbian_netboot_post_boot_wait_timeout | default(300) }}"
  when: armbian_netboot_cycle_board | default(true) | bool

- name: "converge[{{ armbian_netboot_boot_mode }}] — verify rootfs matches declared mode"
  ansible.builtin.include_role:
    name: board_boot_verify
  vars:
    boot_mode: "{{ armbian_netboot_boot_mode }}"
  when:
    - armbian_netboot_cycle_board | default(true) | bool
    - armbian_netboot_verify_state | default(true) | bool

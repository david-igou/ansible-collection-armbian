---
# Gathers a fixed set of operator-readable diagnostics from the target
# board and prints them as one debug message at the call site. Each
# gather command uses failed_when: false / changed_when: false so a
# missing tool (e.g., journalctl on a future minimal NFS rootfs) does
# not abort the test. Imported at every verify checkpoint in
# test_hardware_e2e.yml.
#
# Required: ansible.builtin.setup must have been called in the parent
# play before this task file runs (we read ansible_facts['mounts']).

- name: Diagnostic bundle — findmnt root source
  ansible.builtin.command: findmnt -no SOURCE /
  changed_when: false
  failed_when: false
  register: _diag_findmnt

- name: Diagnostic bundle — kernel cmdline
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: _diag_cmdline
  failed_when: false

- name: Diagnostic bundle — IPv4 routes
  ansible.builtin.command: ip -4 route
  changed_when: false
  failed_when: false
  register: _diag_route

- name: Diagnostic bundle — DNS resolver config
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: _diag_resolv
  failed_when: false

- name: Diagnostic bundle — block devices
  ansible.builtin.command: lsblk -no NAME,SIZE,TYPE,MOUNTPOINT
  changed_when: false
  failed_when: false
  register: _diag_lsblk

- name: Diagnostic bundle — installed U-Boot debs
  ansible.builtin.command: dpkg-query -W -f='${Package} ${Version}\n' linux-u-boot-*
  changed_when: false
  failed_when: false
  register: _diag_uboot

- name: Diagnostic bundle — last 100 journal lines this boot
  ansible.builtin.command: journalctl -b 0 --no-pager -n 100
  changed_when: false
  failed_when: false
  register: _diag_journal

# Router-side TFTP log entries help disambiguate failures that look
# similar from the board side: signature #5 (NetbootXYZ-fallback —
# U-Boot's PXE bootmeth lands on the router's default `netboot.xyz.kpxe`
# rule because the per-board pxelinux.cfg lookup didn't match) vs.
# signature #2 (PHY DMA stuck — board never sent BOOTP, so the router
# never logged a TFTP hit at all). The board-side diag can't tell
# those apart; the router's log can. failed_when:false keeps the bundle
# tolerant of a transient routeros disconnect or absent log entries.
# `when` guard so the bundle stays usable from playbooks that don't
# define `armbian_router` (currently only test_hardware_e2e.yml
# does, via the boards group_vars). delegate_to is evaluated before
# `when`, so we ALSO `| default(omit)` it to keep this task no-op-safe
# when the var is absent.
- name: Diagnostic bundle — router TFTP log entries
  community.routeros.command:
    commands:
      - '/log print without-paging where topics~"tftp"'
  delegate_to: "{{ armbian_router | default(omit) }}"
  register: _diag_tftp
  failed_when: false
  changed_when: false
  when: armbian_router is defined

- name: Diagnostic bundle — normalize router TFTP log output
  ansible.builtin.set_fact:
    _diag_tftp_lines: >-
      {{ ((_diag_tftp | default({})).stdout_lines | default([[]]))[0]
         | default(['(router unreachable, /log access blocked, or no /system/logging entry for tftp topic)']) }}

# Slurped from the serial host (the machine running socat), not the
# board. The log is owned root:root mode 0644 (pre-created in
# test_hardware_e2e.yml's start block) so no become is needed.
# failed_when:false + ignore_unreachable:true together keep the bundle
# tolerant of the absent-dongle / missing-log / unreachable-serial-host
# cases — none of those should abort an otherwise-successful test.
#
# The vars: block counter-overrides any block-level connection vars
# that may be in scope when this task is imported (e.g.
# test_hardware_e2e.yml Phase 2's verify-NFS-mounted-boot block sets
# ansible_user=root + ansible_password=armbian_default_password +
# StrictHostKeyChecking=no for the board-side SSH; without this
# counter-override those propagate to the delegated localhost SSH
# and cause `ssh root@localhost: Permission denied (publickey)` —
# observed as iter 9's only failure (#38)). Resolve back to whatever
# the serial host's inventory entry defines, and clear the inherited
# password + ssh_common_args.
- name: Diagnostic bundle — read recent serial log (serial host)
  ansible.builtin.slurp:
    src: "{{ _serial_log | default('/tmp/serial-' ~ inventory_hostname ~ '.log') }}"
  delegate_to: "{{ serial_host | default('localhost') }}"
  vars:
    ansible_user: "{{ hostvars[serial_host | default('localhost')]['ansible_user'] | default(omit) }}"
    ansible_password: ""
    ansible_ssh_common_args: ""
  run_once: true
  register: _diag_serial
  failed_when: false
  ignore_unreachable: true
  when: capture_serial | default(false) | bool

- name: Diagnostic bundle — print
  ansible.builtin.debug:
    msg:
      - "==== diagnostic bundle: {{ _diag_phase | default('unknown') }} ===="
      - "findmnt /:        {{ _diag_findmnt.stdout | default('(unavailable)') }}"
      - "rootfs (facts):   {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
                                            | map(attribute='device') | first | default('?') }}
                            ({{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
                                              | map(attribute='fstype') | first | default('?') }})"
      - "/proc/cmdline:    {{ _diag_cmdline.content | default('') | b64decode | trim }}"
      - "ip -4 route:      {{ _diag_route.stdout_lines | default([]) }}"
      - "resolv.conf:      {{ _diag_resolv.content | default('') | b64decode | trim }}"
      - "lsblk:            {{ _diag_lsblk.stdout_lines | default([]) }}"
      - "linux-u-boot-*:   {{ _diag_uboot.stdout_lines | default(['(none installed)']) }}"
      - "journal (b 0):    {{ _diag_journal.stdout_lines | default([]) }}"
      - "router TFTP log:  {{ _diag_tftp_lines | default(['(skipped — armbian_router undefined)']) }}"

- name: Diagnostic bundle — print serial tail (last 200 lines)
  ansible.builtin.debug:
    msg: "{{ ['==== serial tail (' ~ (serial_device | default('/dev/ttyUSB0'))
              ~ ' @ ' ~ (serial_baud | default(1500000)) ~ 'b): '
              ~ (_diag_phase | default('unknown')) ~ ' ===='] +
             (_diag_serial.content | default('') | b64decode).split('\n')[-200:] }}"
  when: capture_serial | default(false) | bool

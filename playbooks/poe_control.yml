---
# Top-level wrapper around the routeros reference playbook for PoE
# control. Users with non-RouterOS transport replace this with a
# wrapper pointing at their own poe_control reference.
#
# Usage:
#   ansible-playbook playbooks/poe_control.yml --limit rock-5b-01 \
#     -e armbian_netboot_poe_action=cycle
#   ansible-playbook playbooks/poe_control.yml --limit boards \
#     -e armbian_netboot_poe_action=off
#
# Options:
#   -e armbian_netboot_poe_action=on       enable PoE (default)
#   -e armbian_netboot_poe_action=off      disable PoE
#   -e armbian_netboot_poe_action=cycle    off → wait → on
#   -e armbian_netboot_poe_cycle_delay=5   seconds between off and on (default 5)

- import_playbook: "{{ armbian_netboot_poe_control_playbook | default('routeros/poe_control.yml') }}"

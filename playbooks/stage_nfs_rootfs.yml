---
# Stage NFS rootfs on the netboot server (TrueNAS).
#
# Downloads the Armbian .img.xz for each board model, extracts the
# per-model rootfs template, creates per-host rootfs clones, and
# stages kernel/initrd/dtb in a TrueNAS-side cache for later fetch
# to the control node.
#
# Pre-flights every armbian_netboot_image_urls entry before any
# destructive work; URL failures surface at config time.
#
# Usage:
#   ansible-playbook playbooks/stage_nfs_rootfs.yml
#
# To re-run only the per-host clone step (e.g. after adding a host):
#   ansible-playbook playbooks/stage_nfs_rootfs.yml --tags netboot_assets

- name: Extract netboot assets on TrueNAS and fetch SBC TFTP cache to control node
  hosts: netboot_server
  become: true
  gather_facts: false
  roles:
    - role: netboot_assets
      tags: netboot_assets

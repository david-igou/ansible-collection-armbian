---
# Enables network boot for one or more boards.
# Writes per-board pxelinux.cfg + /ip tftp row directly on rb5009 over
# network_cli, then reboots the boards to apply.
#
# Pre-condition: stage_netboot_assets.yml has run successfully so that
# the per-model kernel/initrd/dtb /ip tftp rows exist on rb5009. The
# plumbing-check preflight catches missing rows with an actionable
# error message.
#
# Usage:
#   # Enable NFS root mode for a specific board
#   ansible-playbook playbooks/enable_netboot.yml --limit orange-pi-5-pro-01
#
#   # Enable for all boards
#   ansible-playbook playbooks/enable_netboot.yml
#
#   # Enable without rebooting (e.g. board is currently off)
#   ansible-playbook playbooks/enable_netboot.yml \
#     --limit orange-pi-5-pro-01 \
#     -e netboot_reboot=false

- name: Configure SBC TFTP on rb5009 for each target board
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Plumbing check — assert per-model /ip tftp rows exist
      ansible.builtin.include_role:
        name: netboot_assets
        tasks_from: plumbing_check.yml
      vars:
        _check_models: >-
          {{ query('inventory_hostnames', target_hosts | default('boards'))
             | map('extract', hostvars, 'board_model')
             | list | unique }}
      run_once: true
      tags: preflight

    - name: Write per-board pxelinux.cfg + /ip tftp row
      ansible.builtin.include_role:
        name: routeros_dhcp
        tasks_from: write_pxelinux_cfg.yml
      vars:
        board_mac: "{{ hostvars[item]['board_mac'] }}"
        board_model: "{{ hostvars[item]['board_model'] }}"
        target_board_host: "{{ item }}"
      loop: "{{ query('inventory_hostnames', target_hosts | default('boards')) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item]['board_model'] }})"

- name: Reboot boards to apply PXE boot
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Reboot to trigger PXE
      ansible.builtin.command: reboot
      async: 1
      poll: 0
      ignore_errors: true # noqa: ignore-errors
      changed_when: true
      when: netboot_reboot | default(true) | bool

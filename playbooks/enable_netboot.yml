---
# Enables network boot for one or more boards.
#
# Two plays: pre-flight plumbing check on the netboot router, then a
# board-facing play that invokes the david_igou.armbian_netboot.board_boot_state
# role with boot_state=pxe. The role internally writes the per-board
# pxelinux.cfg + /ip tftp row on netboot_router (delegated from the
# boards play), then PoE-cycles the board and verifies the resulting
# NFS rootfs.
#
# Required inventory configuration:
#   - netboot_router (in group_vars/boards.yml): inventory hostname of
#     the RouterOS router that owns SBC TFTP/DHCP state.
#   See docs/board_boot_state-role.md for the full configuration matrix.
#
# Eventually-consistent against PoE-HAT cold-boot intermittency (issue
# #38) — set boot_retry_attempts > 0 to retry failed cold boots up to N
# additional times. See docs/retry-configuration.md for recommended
# combinations.
#
# Usage:
#   # Enable NFS root mode for a specific board, default knobs
#   ansible-playbook playbooks/enable_netboot.yml --limit orange-pi-5-pro-01
#
#   # With retries — try up to 3 cold-boot attempts before giving up
#   ansible-playbook playbooks/enable_netboot.yml \
#     --limit orange-pi-5-pro-01 \
#     -e boot_retry_attempts=2 -e poe_cycle_delay=60
#
#   # Configure rb5009 only — don't cycle the board (e.g. it's currently
#   # off; you want it to PXE-boot whenever it gets powered later)
#   ansible-playbook playbooks/enable_netboot.yml \
#     --limit orange-pi-5-pro-01 \
#     -e netboot_reboot=false

- name: Pre-flight — assert per-model /ip tftp rows exist on rb5009
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Plumbing check — assert per-model /ip tftp rows exist
      ansible.builtin.include_role:
        name: netboot_assets
        tasks_from: plumbing_check.yml
      vars:
        _check_models: >-
          {{ query('inventory_hostnames', target_hosts | default('boards'))
             | map('extract', hostvars, 'board_model')
             | list | unique }}
      run_once: true
      tags: preflight

- name: Bring board(s) into PXE/NFS-root state
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Apply PXE boot state
      ansible.builtin.include_role:
        name: board_boot_state
      vars:
        boot_state: pxe
        cycle_board: "{{ netboot_reboot | default(true) }}"

---
# Enables network boot for one or more boards.
# Writes per-host pxelinux.cfg directly on the netboot server over SSH,
# assigns the PXE DHCP option set on RouterOS, and optionally reboots
# boards to apply the change.
#
# Usage:
#   # Enable NFS root (diskless mode) for a specific board
#   ansible-playbook playbooks/enable_netboot.yml \
#     --limit rock-5b-01 \
#     -e netboot_mode=nfsroot
#
#   # Enable reprovision mode for all boards
#   ansible-playbook playbooks/enable_netboot.yml \
#     -e netboot_mode=reprovision
#
#   # Enable without rebooting (e.g. board is currently off)
#   ansible-playbook playbooks/enable_netboot.yml \
#     --limit orange-pi-5-01 \
#     -e netboot_mode=nfsroot \
#     -e netboot_reboot=false

# Per-board pxelinux.cfg files are written directly on the netboot
# server over SSH — no NFS mount on the control node.
- name: Write per-board pxelinux.cfg on the netboot server
  hosts: netboot_server
  become: true
  gather_facts: false
  tasks:
    - name: Generate pxelinux.cfg per target board
      ansible.builtin.include_role:
        name: routeros_dhcp
        tasks_from: write_pxelinux_cfg.yml
      vars:
        board_mac: "{{ hostvars[item]['board_mac'] }}"
        board_model: "{{ hostvars[item]['board_model'] }}"
        target_board_host: "{{ item }}"
      loop: "{{ query('inventory_hostnames', target_hosts | default('boards')) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item]['board_model'] }})"

- name: Configure PXE boot on RouterOS
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Enable netboot on RouterOS for each target board
      ansible.builtin.include_role:
        name: routeros_dhcp
        tasks_from: enable_netboot.yml
      vars:
        board_mac: "{{ hostvars[item]['board_mac'] }}"
      loop: "{{ query('inventory_hostnames', target_hosts | default('boards')) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item]['board_model'] }})"

- name: Reboot boards to apply PXE boot
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Reboot to trigger PXE
      ansible.builtin.command: reboot
      async: 1
      poll: 0
      ignore_errors: true # noqa: ignore-errors
      changed_when: true
      when: netboot_reboot | default(true) | bool

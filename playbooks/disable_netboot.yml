---
# Reverts boards to disk boot via the board_boot_state role.
#
# The role removes the per-board pxelinux.cfg + /ip tftp row from
# netboot_router (delegated from the boards play), then PoE-cycles
# the board and verifies the resulting disk rootfs. U-Boot's PXE
# bootmeth fast-404s through the fallback chain and falls through
# to MMC.
#
# Eventually-consistent against the PoE-HAT cold-boot intermittency
# documented in #38 — set boot_retry_attempts > 0 to retry failed
# cold boots up to N additional times.
#
# Required inventory configuration:
#   - netboot_router (in group_vars/boards.yml): inventory hostname of
#     the RouterOS router that owns SBC TFTP/DHCP state.
#
# Usage:
#   ansible-playbook playbooks/disable_netboot.yml --limit orange-pi-5-pro-01
#
#   # With retries
#   ansible-playbook playbooks/disable_netboot.yml \
#     --limit orange-pi-5-pro-01 -e boot_retry_attempts=2
#
#   # Configure rb5009 only — don't cycle the board
#   ansible-playbook playbooks/disable_netboot.yml \
#     --limit orange-pi-5-pro-01 -e netboot_reboot=false

- name: Bring board(s) into disk-boot state
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Apply disk boot state
      ansible.builtin.include_role:
        name: board_boot_state
      vars:
        boot_state: disk
        cycle_board: "{{ netboot_reboot | default(true) }}"

---
# Converge board(s) to their inventory-declared boot mode.
#
# Plays:
#   1. Pre-flight — refuse --limit on this composite playbook
#   2. Validate local_kernel inventory consistency (gated to local_kernel hosts)
#   3. Pre-flight plumbing check (router has /ip tftp rows)
#   4. Render per-board pxelinux.cfg locally (delegate_to localhost)
#   5. Upload pxelinux.cfg to router (reference playbook, swappable)
#   6. Persist U-Boot env for spi_flash hosts (no cycle; localcmd only
#      lands on local_kernel + persist_via=spi hosts)
#   7. PoE cycle + wait + verify on the board
#
# Pre-condition: stage_netboot_assets.yml + stage_router.yml have been
# run at least once, so the router has the per-host kernel/initrd/dtb
# /ip tftp rows. Play 3 asserts this before touching any board.
#
# Usage:
#   ansible-playbook playbooks/converge_boot_mode.yml -e target_hosts=orange-pi-5-pro-01
#   ansible-playbook playbooks/converge_boot_mode.yml
#   ansible-playbook playbooks/converge_boot_mode.yml \
#     -e target_hosts=orange-pi-5-pro-01 -e armbian_cycle_board=false
#
# Use -e target_hosts=... (not --limit). The seven plays in this composite
# target different host groups (router for plumbing/upload, boards for
# render/cycle/verify); --limit narrows ALL of them, silently skipping
# the router-side plays with "no hosts matched".
#
# For block/rescue callers (e.g. _lifecycle_set_and_verify.yml) that
# cannot use import_playbook inside a block, see:
#   playbooks/tasks/_converge_boot_mode.yml
# That file is the single-play-compatible alternative entry point with
# identical behaviour for single-board invocations.

- name: Pre-flight — refuse --limit on composite playbook
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: "Assert no --limit narrowing on composite playbook"
      ansible.builtin.include_tasks: tasks/_assert_no_limit.yml
      vars:
        _expected_pattern: "{{ target_hosts | default('boards') }}"

- name: Validate local_kernel inventory consistency
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  pre_tasks:
    - name: Resolve effective armbian_board_config
      ansible.builtin.include_tasks: tasks/_resolve_board_config.yml
  tasks:
    - name: Run local_kernel validation (gated to local_kernel hosts)
      ansible.builtin.include_tasks: tasks/validate_local_kernel.yml
      when: armbian_boot_mode == 'local_kernel'

- name: Pre-flight — assert router /ip tftp plumbing
  ansible.builtin.import_playbook: "{{ armbian_plumbing_check_playbook | default('routeros/plumbing_check.yml') }}"
  vars:
    armbian_tftp_check_models: >-
      {{ query('inventory_hostnames', target_hosts | default('boards')) }}

- name: Render per-board pxelinux.cfg locally
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  pre_tasks:
    - name: Resolve effective armbian_board_config
      ansible.builtin.include_tasks: tasks/_resolve_board_config.yml
  tasks:
    - name: Render pxelinux.cfg (delegated to localhost via block)
      delegate_to: localhost
      become: false
      block:
        - name: Include pxelinux_render
          ansible.builtin.include_role:
            name: pxelinux_render
          vars:
            pxelinux_render_board_mac: "{{ armbian_board_mac }}"
            pxelinux_render_boot_mode: "{{ armbian_boot_mode }}"
            pxelinux_render_nfs_server_ip: "{{ armbian_nfs_server_ip | default(armbian_server_ip) }}"
            pxelinux_render_nfs_root_path: "{{ armbian_nfs_rootfs_path }}"
            pxelinux_render_hostname: "{{ inventory_hostname }}"
            pxelinux_render_output_dir: "{{ armbian_tftp_cache_dir }}/pxelinux.cfg"
            pxelinux_render_sd_root: "{{ armbian_sd_root | default('LABEL=armbi_root') }}"
            pxelinux_render_local_root: "{{ armbian_local_root | default('LABEL=' ~ (armbian_local_disk_label | default('armbi_root_local'))) }}"
            pxelinux_render_pxe_verbose: "{{ armbian_pxe_verbose | default(false) }}"
            pxelinux_render_extra_modes: "{{ armbian_extra_modes | default({}) }}"

- name: Upload rendered pxelinux.cfg to router (reference playbook)
  ansible.builtin.import_playbook: "{{ armbian_pxelinux_upload_playbook | default('routeros/upload_pxelinux_cfg.yml') }}"
  vars:
    armbian_pxelinux_upload_boards: >-
      {{ query('inventory_hostnames', target_hosts | default('boards')) }}

- name: Persist U-Boot env for spi_flash hosts
  ansible.builtin.import_playbook: persist_uboot_env.yml
  vars:
    armbian_persist_uboot_env_cycle: false
  when: (armbian_persist_uboot_env | default('auto')) != 'never'

- name: Cycle, wait, verify
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Cycle PoE + cold-boot retry
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/cold_boot_with_retry.yml"
      vars:
        _phase_label: "converge[{{ armbian_boot_mode }}]"
        _boot_max_attempts: "{{ armbian_boot_retry_attempts | default(0) | int + 1 }}"
      when: armbian_cycle_board | default(true) | bool

    - name: Wait for SSH after cold boot
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/wait_for_ssh_with_cycle_retry.yml"
      vars:
        _phase_label: "converge[{{ armbian_boot_mode }}]"
        _wait_timeout: "{{ armbian_post_boot_wait_timeout | default(300) }}"
      when: armbian_cycle_board | default(true) | bool

    # local_kernel verify_match needs no explicit passthrough here: the
    # role falls back to armbian_board_config.local_kernel.verify_match,
    # and armbian_board_config was resolved (set_fact) in the render
    # play, persisting into this play for the same hosts.
    - name: Verify rootfs matches declared mode
      ansible.builtin.include_role:
        name: board_boot_verify
      vars:
        board_boot_verify_mode: "{{ armbian_boot_mode }}"
        board_boot_verify_extra_modes: "{{ armbian_extra_modes | default({}) }}"
      when:
        - armbian_cycle_board | default(true) | bool
        - armbian_verify_state | default(true) | bool

---
# Converge board(s) to their inventory-declared boot mode.
#
# Reads armbian_netboot_boot_mode from each board's inventory and
# renders the matching pxelinux.cfg on rb5009. When
# armbian_netboot_cycle_board is true (default), PoE-cycles the board
# and verifies the resulting rootfs matches the declared mode.
# Idempotent — re-running when state matches is a no-op.
#
# Pre-condition: stage_tftp_assets.yml has been run at least once, so
# rb5009 has the per-model kernel/initrd/dtb /ip tftp rows. The
# pre-flight play below asserts this before touching any board.
#
# Usage:
#   # Converge a single board
#   ansible-playbook playbooks/converge_boot_mode.yml --limit orange-pi-5-pro-01
#
#   # Converge all boards (reads each board's armbian_netboot_boot_mode)
#   ansible-playbook playbooks/converge_boot_mode.yml
#
#   # Write rb5009 state only — don't cycle the board
#   ansible-playbook playbooks/converge_boot_mode.yml \
#     --limit orange-pi-5-pro-01 \
#     -e armbian_netboot_cycle_board=false

- name: Pre-flight — assert per-model /ip tftp rows exist on rb5009
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Plumbing check
      ansible.builtin.include_role:
        name: netboot_assets
        tasks_from: plumbing_check.yml
      vars:
        _check_models: >-
          {{ query('inventory_hostnames', target_hosts | default('boards'))
             | map('extract', hostvars, 'armbian_netboot_board_model')
             | list | unique }}
      run_once: true
      tags: preflight

- name: Converge boot mode
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Apply boot mode from inventory
      ansible.builtin.include_role:
        name: boot_mode

---
# Stage per-model TFTP assets (kernel/initrd/dtb) on rb5009.
#
# Net_puts kernel/initrd/dtb from the control node's
# armbian_netboot_tftp_cache_dir to
# flash:/{{ armbian_netboot_tftp_flash_dir }}/armbian/<model>/ on rb5009,
# with /ip tftp row registration per file. Ends with a plumbing-check
# assertion that all expected rows exist.
#
# Pre-condition: stage_nfs_rootfs.yml has been run at least once (to
# populate the control-node TFTP cache).
#
# Usage:
#   ansible-playbook playbooks/stage_tftp_assets.yml

- name: Stage SBC TFTP assets on rb5009
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Net_put kernel/initrd/dtb + register /ip tftp rows
      ansible.builtin.include_role:
        name: netboot_assets
        tasks_from: stage_rb5009.yml
      tags: netboot_assets

    - name: Plumbing check — verify /ip tftp rows landed
      ansible.builtin.include_role:
        name: netboot_assets
        tasks_from: plumbing_check.yml
      tags: netboot_assets, preflight

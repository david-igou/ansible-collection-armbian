---
# Ansible-driven reprovision workflow:
#   1. Writes per-board pxelinux.cfg directly on the netboot server over SSH
#   2. Assigns the reprovision PXE DHCP option set on RouterOS
#   3. Reboots boards via SSH — they PXE boot into the NFS root environment
#   4. Waits for SSH to come up on each board, then downloads and flashes the
#      Armbian image directly via Ansible tasks (no scripts staged on the board)
#   5. Clears the PXE DHCP option on RouterOS
#   6. Reboots boards to the freshly flashed disk and verifies disk boot
#
# WIP: step 3 currently fails on Armbian Rockchip `current` U-Boot debs —
# bootflow scan walks mmc1 first and the SD card's boot.scr wins before
# PXE/DHCP are reached. See
# https://github.com/david-igou/ansible-collection-armbian_netboot/issues/3
#
# Usage:
#   ansible-playbook playbooks/reprovision.yml --limit rock-5b-01
#
# Multiple boards (processed in parallel up to ansible forks):
#   ansible-playbook playbooks/reprovision.yml --limit "rock-5b-01,orange-pi-5-01"
#
# Note: boards of the same model share the NFS rootfs export. Reprovision one
# model at a time to avoid log/state contention in the shared NFS root.

# Per-board pxelinux.cfg files are written directly on the netboot
# server over SSH — no NFS mount on the control node.
- name: Write reprovision pxelinux.cfg on the netboot server
  hosts: netboot_server
  become: true
  gather_facts: false
  tasks:
    - name: Generate pxelinux.cfg per target board
      ansible.builtin.include_role:
        name: routeros_dhcp
        tasks_from: write_pxelinux_cfg.yml
      vars:
        board_mac: "{{ hostvars[item]['board_mac'] }}"
        board_model: "{{ hostvars[item]['board_model'] }}"
        target_board_host: "{{ item }}"
        netboot_mode: reprovision
      loop: "{{ query('inventory_hostnames', target_hosts | default('boards')) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item]['board_model'] }})"

- name: Configure PXE reprovision boot on RouterOS
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Enable reprovision netboot for each target board
      ansible.builtin.include_role:
        name: routeros_dhcp
        tasks_from: enable_netboot.yml
      vars:
        board_mac: "{{ hostvars[item]['board_mac'] }}"
        netboot_mode: reprovision
      loop: "{{ query('inventory_hostnames', target_hosts | default('boards')) }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item]['board_model'] }})"

- name: Reboot boards into NFS root
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  tasks:
    - name: Reboot to trigger PXE boot
      ansible.builtin.command: reboot
      async: 1
      poll: 0
      ignore_errors: true # noqa: ignore-errors
      changed_when: true

- name: Flash Armbian image to disk
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  vars:
    ansible_user: root
    ansible_password: "{{ armbian_default_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_become: false
  tasks:
    - name: Wait for board to come up on NFS root
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 180

    - name: Gather facts for boot verification
      ansible.builtin.setup:

    - name: Verify board is booted from NFS
      ansible.builtin.assert:
        that:
          - ansible_mounts
            | selectattr('mount', 'equalto', '/')
            | map(attribute='fstype')
            | first in ['nfs', 'nfs4']
        fail_msg: >-
          Root filesystem on {{ inventory_hostname }} is not NFS — board did not
          PXE boot correctly. Check RouterOS DHCP options and TFTP connectivity.

    - name: Flash Armbian image
      ansible.builtin.include_role:
        name: reprovision

- name: Disable PXE boot on RouterOS
  hosts: routeros_routers
  gather_facts: false
  tasks:
    - name: Clear PXE DHCP option for each target board
      ansible.builtin.include_role:
        name: routeros_dhcp
        tasks_from: disable_netboot.yml
      vars:
        board_mac: "{{ hostvars[item]['board_mac'] }}"
      loop: "{{ query('inventory_hostnames', target_hosts | default('boards')) }}"
      loop_control:
        label: "{{ item }}"

- name: Reboot boards to freshly flashed disk
  hosts: "{{ target_hosts | default('boards') }}"
  gather_facts: false
  vars:
    ansible_user: root
    ansible_password: "{{ armbian_default_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_become: false
  tasks:
    - name: Reboot to flashed disk
      ansible.builtin.reboot:
        reboot_timeout: 300
        connect_timeout: 10
        post_reboot_delay: 15
        msg: "Reprovision complete — booting from freshly flashed disk"

    - name: Gather facts after disk boot
      ansible.builtin.setup:

    - name: Verify board booted from local disk
      ansible.builtin.assert:
        that:
          - ansible_mounts
            | selectattr('mount', 'equalto', '/')
            | map(attribute='fstype')
            | first not in ['nfs', 'nfs4']
        fail_msg: >-
          Root filesystem on {{ inventory_hostname }} is still NFS after reboot —
          board did not boot from disk. Check that RouterOS DHCP option was cleared.

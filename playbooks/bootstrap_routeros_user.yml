---
# Bootstrap a RouterOS user with key-based SSH access on one or more devices.
#
# Solves the chicken/egg of provisioning the `ansible-netboot` user that the
# rest of this collection assumes already exists. Connects as an existing
# admin user over SSH key auth, then creates / updates the target user,
# group, and SSH keys idempotently. All real work lives in the
# `bootstrap_routeros_user` role; this playbook only wires up the
# network_cli connection and supplies the SSH keys to register.
#
# Connection identity:
#   `ansible_user`, `ansible_host`, and `ansible_port` come from inventory
#   (`inventory/hosts.yml` host entries; group_vars/routeros.yml only pins
#   the network_cli connection plumbing). Override on the command line for
#   the bootstrap run if you must connect as an existing admin user with
#   different credentials, e.g.:
#       -e ansible_user=igou+cet1024w -e ansible_port=3480
#
#   The `+cet1024w` suffix on the username tells RouterOS to skip
#   terminal auto-detection and use a 1024-column dumb terminal, which
#   prevents network_cli command-timeout errors on long lines (RouterOS
#   otherwise wraps and redraws each line many times, exceeding the
#   prompt-match timeout). See
#   https://docs.ansible.com/projects/ansible/latest/network/user_guide/platform_routeros.html
#
# Role variables (override with -e or in inventory). See
# `roles/bootstrap_routeros_user/README.md` for the full list:
#   routeros_user_name             — user to create (default: ansible-netboot)
#   routeros_user_group_name       — group to create (default: same as user)
#   routeros_user_address_scope    — source address restriction
#   routeros_user_comment          — comment field on the user
#   routeros_user_policy           — comma-separated policy string; NO whitespace
#   routeros_user_ssh_keys         — list of public-key strings (required)
#   routeros_disable_password_ssh  — globally disable password SSH (opt-in)
#
# Example invocation (router and switch in one run — both want SSH-only key auth):
#
#   ansible-playbook playbooks/bootstrap_routeros_user.yml \
#     -e ansible_user=igou+cet1024w \
#     -e ansible_port=3480

- name: Bootstrap RouterOS user with key-based SSH access
  hosts: routeros_devices
  gather_facts: false
  connection: ansible.netcommon.network_cli

  vars:
    ansible_network_os: community.routeros.routeros

    routeros_user_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOWgNfV1zdod84sj28d+z7YBLkaD5ZImElWt8zHw+u7/"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINHO7UsiIgAepf5+s2z+1CbPQf2eqJo8aNK/vT9Oaf4B"

  roles:
    - role: bootstrap_routeros_user

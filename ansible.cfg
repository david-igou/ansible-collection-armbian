[defaults]
roles_path          = roles
collections_path    = ~/.ansible/collections
host_key_checking   = False
callbacks_enabled   = profile_tasks

[ssh_connection]
pipelining          = True
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s

# Persistent-connection daemon (used by community.routeros.command via
# network_cli) defaults are 30 s for both connect_timeout and
# command_timeout, which is tight for RouterOS — commands routinely
# take 5–15 s and the idle-timer fires on any gap between routeros
# calls (e.g. the gap between Phase 1's diag-bundle TFTP slurp and
# Phase 2's first write_pxelinux_cfg call in test_hardware_e2e.yml,
# which killed iter 8 with `ConnectionRefusedError on
# /home/igou/.ansible/pc/<id>`). Bumping to 120 s eliminates both
# timeout classes; combined with explicit `meta: reset_connection`
# at the start of every routeros writer role, the daemon-flake
# surface area shrinks substantially.
[persistent_connection]
connect_timeout     = 120
command_timeout     = 120

---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0
  # Inlined (instead of using ansible/ansible-content-actions/.../ansible_lint.yaml)
  # because that reusable workflow has no hook for installing collection
  # dependencies before lint. ansible-lint does NOT auto-install
  # requirements.yml even with offline=false, and we no longer use
  # mock_modules (it silently overwrites real installed modules with
  # zero-arg stubs), so collections must be explicitly installed first.
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: make yamllint
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Install ansible-core, ansible-lint, and collection deps
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r playbooks/routeros/requirements.yml
      - name: Run ansible-lint
        run: ansible-lint playbooks/ roles/
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0
  molecule-podman:
    runs-on: ubuntu-latest
    # Scenarios live at extensions/molecule/<scenario>/molecule.yml.
    # Invoke molecule from the collection root with a MOLECULE_GLOB
    # that matches that layout — this is the conventional molecule
    # + collection pattern, makes `molecule test --all` work, and
    # lets molecule auto-discover extensions/molecule/config.yml
    # (which only fires when invoked from collection root).
    env:
      MOLECULE_GLOB: extensions/molecule/*/molecule.yml
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - pxelinux_render
          - local_kernel_render
          - persist_uboot_env
          - board_boot_wait
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          ansible-galaxy collection install -r requirements.yml --force
          # Test-only deps (david_igou.molecule_provisioners) are
          # installed by molecule's own `dependency` step via
          # extensions/molecule/config.yml + requirements-test.yml.
          # Install the collection itself so molecule scenarios that
          # reference roles via FQCN (david_igou.armbian.<role>)
          # can resolve them.
          ansible-galaxy collection install . --force

      - name: Run molecule ${{ matrix.scenario }}
        run: molecule test -s ${{ matrix.scenario }}

  molecule-qemu:
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: extensions/molecule/*/molecule.yml
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - disk_image
          - disk_provision
          - image_build
          - rootfs_provision
          - board_boot_verify
          - bootstrap_armbian
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install host qemu tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            ovmf \
            sshpass

      - name: Expose Ubuntu OVMF firmware at the path molecule_provisioners expects
        # Ubuntu ships OVMF at /usr/share/OVMF/, molecule_provisioners defaults
        # to /usr/share/edk2/ovmf/ (Fedora/RHEL path). On Ubuntu 24.04 noble
        # the files are OVMF_CODE_4M.fd / OVMF_VARS_4M.fd (the 4M-flash
        # variant); older 22.04 used OVMF_CODE.fd / OVMF_VARS.fd. Detect
        # whichever the package shipped and symlink it.
        run: |
          set -e
          ls /usr/share/OVMF/
          sudo mkdir -p /usr/share/edk2/ovmf
          # Pick the file that actually exists (newer 4M variant preferred).
          for base in OVMF_CODE OVMF_VARS; do
            for src in "/usr/share/OVMF/${base}_4M.fd" "/usr/share/OVMF/${base}.fd"; do
              if [ -f "$src" ]; then
                sudo ln -sf "$src" "/usr/share/edk2/ovmf/${base}.fd"
                echo "Linked $src -> /usr/share/edk2/ovmf/${base}.fd"
                break
              fi
            done
          done
          for required in OVMF_CODE OVMF_VARS; do
            if [ ! -f "/usr/share/edk2/ovmf/${required}.fd" ]; then
              echo "::error::Missing /usr/share/edk2/ovmf/${required}.fd"
              exit 1
            fi
          done
          ls -laL /usr/share/edk2/ovmf/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          ansible-galaxy collection install -r requirements.yml --force
          ansible-galaxy collection install . --force

      - name: Run molecule ${{ matrix.scenario }}
        run: molecule test -s ${{ matrix.scenario }}

  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - yamllint
      - ansible-lint
      - molecule-podman
      - molecule-qemu
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.changelog.result }}',
          '${{ needs.build-import.result }}',
          '${{ needs.sanity.result }}',
          '${{ needs.yamllint.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.molecule-podman.result }}',
          '${{ needs.molecule-qemu.result }}',
          ])"

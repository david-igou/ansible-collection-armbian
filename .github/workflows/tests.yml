---
name: "CI"

# All jobs only read the repo; deny everything else by default.
permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # Run molecule from the collection root so it finds extensions/molecule/config.yml.
  MOLECULE_GLOB: extensions/molecule/*/molecule.yml

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0
    if: github.event_name == 'pull_request'

  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0

  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: make yamllint

  # Inlined because the reusable ansible-lint workflow cannot install the
  # collections the roles and scenarios reference.
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Install ansible-core and ansible-lint
        run: pip install ansible-core ansible-lint
      - name: Run ansible-lint over the repository
        run: make ansible-lint

  molecule-podman:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - board_config
          - pxelinux_render
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Install ansible-core and molecule
        run: pip install ansible-core molecule
      - name: Run molecule ${{ matrix.scenario }}
        run: molecule test -s ${{ matrix.scenario }}

  molecule-qemu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - board_boot_verify
          - board_boot_wait
          - bootstrap_armbian
          - disk_image
          - disk_provision
          - image_build
          - rootfs_provision
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Install qemu, OVMF and sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf sshpass
      # pycdlib builds the provisioner's cloud-init seed ISO.
      - name: Install ansible-core, molecule and pycdlib
        run: pip install ansible-core molecule pycdlib
      - name: Run molecule ${{ matrix.scenario }}
        run: molecule test -s ${{ matrix.scenario }}

  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - yamllint
      - ansible-lint
      - molecule-podman
      - molecule-qemu
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required job failed or was cancelled
        if: >-
          ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

---
# Build the docsite for a pull request, publish it to GitHub Pages under
# /pr/<pr#>/, and post a PR comment with a link and a rendered diff of which
# documentation files changed. Tears the preview down when the PR closes.
# Mirrors felixfontein/ansible-acme; uses the ansible-community/github-docs-build
# reusable workflows (pinned to a commit SHA with a `# main` comment for Renovate).

name: "Docs"

concurrency:
  group: docs-pr-${{ github.head_ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

env:
  GHP_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build-docs:
    permissions:
      contents: read
    name: Build Ansible Docs
    uses: ansible-community/github-docs-build/.github/workflows/_shared-docs-build-pr.yml@f724ea35f2f4f14a18c45ad363ffa5f76eabeec9 # main
    with:
      collection-name: david_igou.armbian
      init-lenient: false
      init-fail-on-error: true
      squash-hierarchy: true
      init-project: David_Igou.Armbian Collection
      init-copyright: david-igou.armbian contributors
      init-title: David_Igou.Armbian Collection Documentation
      init-html-short-title: David_Igou.Armbian Collection Docs
      init-extra-html-theme-options: |
        documentation_home_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch/main/
      # Trim the auto-generated role/plugin reference entries in the navigation
      # sidebar down to just their names (drop the "-- <short description>"
      # suffix). Leaves each page's own H1 heading untouched.
      init-append-conf-py: |
        def _trim_reference_sidebar_titles(app, env):
            import re
            from docutils import nodes
            targets = (' role', ' module', ' plugin', ' filter', ' lookup')
            sep = re.compile('\\s+(?:--|–|—)\\s+')

            def needs_trim(text):
                return sep.search(text) is not None and any(s in text for s in targets)

            for docname, title in list(env.titles.items()):
                text = title.astext()
                if needs_trim(text):
                    env.titles[docname] = nodes.title('', sep.split(text, 1)[0])
                    toc = env.tocs.get(docname)
                    if toc is not None:
                        for ref in toc.findall(nodes.reference):
                            rawtext = ref.astext()
                            if needs_trim(rawtext):
                                ref.children = [nodes.Text(sep.split(rawtext, 1)[0])]

        def setup(app):
            app.connect('env-check-consistency', _trim_reference_sidebar_titles)
      render-file-line: '> * `$<status>` [$<path_tail>](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ github.event.number }}/$<path_tail>)'

  publish-docs-gh-pages:
    # Skip on forks (no Pages / write token to publish to).
    if: github.repository == 'david-igou/ansible-collection-armbian'
    permissions:
      contents: write
      pages: write
      id-token: write
    needs: [build-docs]
    name: Publish Ansible Docs
    uses: ansible-community/github-docs-build/.github/workflows/_shared-docs-build-publish-gh-pages.yml@f724ea35f2f4f14a18c45ad363ffa5f76eabeec9 # main
    with:
      artifact-name: ${{ needs.build-docs.outputs.artifact-name }}
      action: ${{ (github.event.action == 'closed' || needs.build-docs.outputs.changed != 'true') && 'teardown' || 'publish' }}
      publish-gh-pages-branch: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  comment:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    needs: build-docs
    name: PR comments
    steps:
      - name: PR comment
        uses: ansible-community/github-docs-build/actions/ansible-docs-build-comment@f724ea35f2f4f14a18c45ad363ffa5f76eabeec9 # main
        with:
          body-includes: '## Docs Build'
          reactions: heart
          action: ${{ needs.build-docs.outputs.changed != 'true' && 'remove' || '' }}
          on-closed-body: |
            ## Docs Build 📝

            This PR is closed and any previously published docsite has been unpublished.
          on-merged-body: |
            ## Docs Build 📝

            This PR has been merged and the docs are now incorporated into `main`:
            ${{ env.GHP_BASE_URL }}/branch/main
          body: |
            ## Docs Build 📝

            The docs for **this PR** have been published here:
            ${{ env.GHP_BASE_URL }}/pr/${{ github.event.number }}

            You can compare to the docs for the `main` branch here:
            ${{ env.GHP_BASE_URL }}/branch/main

            The docsite for **this PR** is also available for download as an artifact from this run:
            ${{ needs.build-docs.outputs.artifact-url }}

            File changes:

            ${{ needs.build-docs.outputs.diff-files-rendered }}

            ${{ needs.build-docs.outputs.diff-rendered }}

---
# Block A — pre-flight validation. No side effects.
#
# Asserts:
#   1. disk_image_target_device exists and is a whole-disk block device.
#   2. Neither disk_image_target_device nor any of its partitions is currently
#      mounted (read from /proc/mounts).
#   3. disk_image_source is either an http(s):// URL or an absolute path.
#   4. disk_image_source ends in .img.xz or .img (extension-based, no
#      content sniffing).

- name: "Block A — stat disk_image_target_device"
  ansible.builtin.stat:
    path: "{{ disk_image_target_device }}"
  register: __disk_image_target_stat

- name: "Block A — assert disk_image_target_device is a block device"
  ansible.builtin.assert:
    that:
      - __disk_image_target_stat.stat.exists
      - __disk_image_target_stat.stat.isblk | default(false)
    fail_msg: "not a block device: {{ disk_image_target_device }}"

- name: "Block A — check /sys/class/block/<basename>/partition (whole-disk discriminator)"
  ansible.builtin.stat:
    path: "/sys/class/block/{{ disk_image_target_device | basename }}/partition"
  register: __disk_image_partition_sysfs

- name: "Block A — assert disk_image_target_device is a whole disk, not a partition"
  ansible.builtin.assert:
    that:
      - not __disk_image_partition_sysfs.stat.exists
    fail_msg: >-
      disk_image_target_device is a partition, not a whole disk: {{ disk_image_target_device }}.
      Pass the parent disk (e.g. /dev/mmcblk0, not /dev/mmcblk0p1).

- name: "Block A — enumerate disk_image_target_device + its partitions via lsblk"
  ansible.builtin.command: "lsblk -nro NAME {{ disk_image_target_device }}"
  register: __disk_image_lsblk_names
  changed_when: false

- name: "Block A — read /proc/mounts"
  ansible.builtin.slurp:
    src: /proc/mounts
  register: __disk_image_mounts_b64

- name: "Block A — derive the set of mount-source paths for target + partitions"
  ansible.builtin.set_fact:
    __disk_image_candidate_sources: >-
      {{ __disk_image_lsblk_names.stdout_lines | map('regex_replace', '^', '/dev/') | list }}
    __disk_image_proc_mounts: "{{ (__disk_image_mounts_b64.content | b64decode).splitlines() }}"

- name: "Block A — find any /proc/mounts line whose source matches target or a partition"
  ansible.builtin.set_fact:
    __disk_image_mounted_match: >-
      {{ __disk_image_proc_mounts
         | select('match', '^(' + (__disk_image_candidate_sources | join('|')) + ') ')
         | list }}

- name: "Block A — assert disk_image_target_device and its partitions are not mounted"
  ansible.builtin.assert:
    that:
      - __disk_image_mounted_match | length == 0
    fail_msg: >-
      target device {{ disk_image_target_device }} backs a mounted filesystem:
      {{ __disk_image_mounted_match | first | default('<unknown>') }}

- name: "Block A — classify disk_image_source (URL vs path)"
  ansible.builtin.set_fact:
    __disk_image_src_is_url: "{{ disk_image_source is match('^https?://') }}"
    __disk_image_src_is_path: "{{ disk_image_source is match('^/') }}"

- name: "Block A — fail when disk_image_source is neither URL nor abs path"
  ansible.builtin.fail:
    msg: "disk_image_source must be http(s):// URL or absolute path, got: {{ disk_image_source }}"
  when:
    - not __disk_image_src_is_url
    - not __disk_image_src_is_path

- name: "Block A — for path source, stat it and assert regular file"
  when: __disk_image_src_is_path
  block:
    - name: "Block A — stat disk_image_source path"
      ansible.builtin.stat:
        path: "{{ disk_image_source }}"
      register: __disk_image_src_stat

    - name: "Block A — assert disk_image_source path exists and is a regular file"
      ansible.builtin.assert:
        that:
          - __disk_image_src_stat.stat.exists
          - __disk_image_src_stat.stat.isreg | default(false)
        fail_msg: "disk_image_source path does not exist or is not a regular file: {{ disk_image_source }}"

- name: "Block A — classify format by extension"
  ansible.builtin.set_fact:
    # Single backslash, not double: Jinja's single-quoted-string parser
    # collapses `\\` to `\`, so '\\.img\\.xz$' delivers a regex of
    # "literal-backslash + any-char + img + literal-backslash + any-char
    # + xz" which never matches a real path/URL. Verified empirically
    # against actual disk_image invocations.
    __disk_image_fmt: >-
      {{ 'xz'  if disk_image_source | regex_search('\.img\.xz$')
         else 'raw' if disk_image_source | regex_search('\.img$')
         else 'unknown' }}

- name: "Block A — fail on unsupported format"
  ansible.builtin.fail:
    msg: "unsupported format; only .img and .img.xz: {{ disk_image_source }}"
  when: __disk_image_fmt == 'unknown'

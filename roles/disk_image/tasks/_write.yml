---
# Block B — stream and write.
#
# Four shell dispatch branches by (__disk_image_src_is_url, __disk_image_fmt). The three pipe
# branches use `set -o pipefail` so a curl 404 / xz CRC error / partial
# read is propagated to the task's rc, not swallowed by dd's zero exit.
# The path+raw branch has no pipe so pipefail is omitted there.
# become: true is required for dd-to-block-device.
#
# changed_when is derived from dd's stderr: dd writes a "<in>+<out>
# records in / <in>+<out> records out" pair. A genuine write reports
# non-zero counts; "0+0 records out" means dd ran but wrote nothing
# (no real change). This is a strict improvement over `changed_when:
# true`, which fired even on a degenerate zero-byte source.

- name: "Block B — path + raw .img → dd direct"
  ansible.builtin.shell:
    cmd: >-
      dd if={{ disk_image_source | quote }} of={{ disk_image_target_device | quote }}
      bs={{ disk_image_dd_bs | quote }} conv=fsync status=progress
    executable: /bin/bash
  become: true
  when:
    - __disk_image_src_is_path
    - __disk_image_fmt == 'raw'
  register: __disk_image_dd
  changed_when: >-
    'records out' in (__disk_image_dd.stderr | default(''))
    and '0+0 records out' not in (__disk_image_dd.stderr | default(''))

- name: "Block B — path + .img.xz → xz -dc | dd"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      xz -dc {{ disk_image_source | quote }}
      | dd of={{ disk_image_target_device | quote }}
      bs={{ disk_image_dd_bs | quote }} conv=fsync status=progress
    executable: /bin/bash
  become: true
  when:
    - __disk_image_src_is_path
    - __disk_image_fmt == 'xz'
  register: __disk_image_xz_dd
  changed_when: >-
    'records out' in (__disk_image_xz_dd.stderr | default(''))
    and '0+0 records out' not in (__disk_image_xz_dd.stderr | default(''))

- name: "Block B — URL + raw .img → curl | dd"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsSL {{ disk_image_source | quote }}
      | dd of={{ disk_image_target_device | quote }}
      bs={{ disk_image_dd_bs | quote }} conv=fsync status=progress
    executable: /bin/bash
  become: true
  when:
    - __disk_image_src_is_url
    - __disk_image_fmt == 'raw'
  register: __disk_image_curl_dd
  changed_when: >-
    'records out' in (__disk_image_curl_dd.stderr | default(''))
    and '0+0 records out' not in (__disk_image_curl_dd.stderr | default(''))

- name: "Block B — URL + .img.xz → curl | xz -dc | dd"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsSL {{ disk_image_source | quote }}
      | xz -dc
      | dd of={{ disk_image_target_device | quote }}
      bs={{ disk_image_dd_bs | quote }} conv=fsync status=progress
    executable: /bin/bash
  become: true
  when:
    - __disk_image_src_is_url
    - __disk_image_fmt == 'xz'
  register: __disk_image_curl_xz_dd
  changed_when: >-
    'records out' in (__disk_image_curl_xz_dd.stderr | default(''))
    and '0+0 records out' not in (__disk_image_curl_xz_dd.stderr | default(''))

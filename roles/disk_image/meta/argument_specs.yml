---
argument_specs:
  main:
    short_description: Stream an .img or .img.xz onto a whole block device
    description:
      - >-
        Streams an http(s) URL or local path onto a whole block device with
        C(curl -fsSL) or C(cat), an optional C(xz -dc) stage, and C(dd conv=fsync),
        then re-reads the partition table and waits for udev.
      - >-
        Refuses a target that is not a block device, is a partition node, or
        backs a mounted filesystem (itself or any of its partitions), a source
        that is neither an http(s) URL nor an absolute path, a source that does
        not end in .img or .img.xz, a local source that is not a regular file,
        and check mode.
      - >-
        Always writes; there is no idempotency cache. Runs as root on the host
        that owns the target device. Requires curl, xz, dd, lsblk, partprobe and
        udevadm on that host.
    options:
      disk_image_source:
        type: str
        required: true
        description:
          - An http(s):// URL or an absolute path on the target host.
          - The format is chosen by extension only, C(.img.xz) (decompressed with xz) or C(.img) (raw).
      disk_image_target_device:
        type: path
        required: true
        description:
          - Whole-disk block device to overwrite, for example C(/dev/mmcblk0).
      disk_image_dd_bs:
        type: str
        default: 4M
        description:
          - Block size passed to dd.

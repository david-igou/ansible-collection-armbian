---
# Name of the DHCP server on RouterOS to manage
routeros_dhcp_server_name: "dhcp1"

# DHCP option names created once during setup (setup_options.yml playbook)
routeros_opt_tftp_name: "armbian-tftp-server"
routeros_opt_set_nfsroot_prefix: "armbian-nfsroot"

# Boot mode pxelinux config path served from TFTP
netboot_modes:
  nfsroot: "pxelinux.cfg/nfsroot-default"

# TFTP server document root on the netboot server. Must match the TFTP
# daemon's --tftp-root. Default matches the netboot.xyz container layout.
# write_pxelinux_cfg.yml and remove_pxelinux_cfg.yml write/remove files
# relative to this path.
tftp_nfs_export: /mnt/ssd/containers/netbootxyz/config/menus

# NFS rootfs export root on the netboot server. pxelinux_cfg.j2 references
# this path when constructing the per-host nfsroot= kernel parameter.
# Default matches the netboot_assets role's default; override here or in
# inventory/group_vars/all.yml if your NFS layout differs.
nfs_rootfs_path: /mnt/ssd/netboot/rootfs

# CIDR of the RouterOS DHCP network the SBCs are attached to. Required.
# This network's `next-server` field is what populates BOOTP siaddr in
# DHCP replies, which U-Boot 2025.10's PXE bootmeth uses as the TFTP
# source (option 66 is silently ignored). The next-server value itself
# is owned by an external RouterOS-config repo; this role only asserts
# the value is correct via preflight_next_server.yml.
routeros_sbc_network_address: ""

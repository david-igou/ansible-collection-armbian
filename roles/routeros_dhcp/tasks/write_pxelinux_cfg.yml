---
# Writes the per-board pxelinux.cfg file to flash:/{{ sbc_tftp_flash_dir }}/
# pxelinux.cfg/01-<MAC> on rb5009, registers a /ip tftp row for it.
# Designed to be run from a play with hosts: routeros_routers,
# gather_facts: false.
#
# Required variables:
#   board_mac          MAC address of the board (drives 01-<mac> filename)
#   board_model        board model key (drives kernel/initrd/dtb paths
#                      embedded in the rendered template)
#   target_board_host  inventory hostname (drives nfsroot path + label)

- name: Load board configs
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/boards.yml"
  tags: pxelinux

- name: Compute pxelinux.cfg filename for {{ target_board_host }}
  ansible.builtin.set_fact:
    _pxe_filename: "01-{{ board_mac | lower | replace(':', '-') }}"
  tags: pxelinux

- name: Ensure local pxelinux.cfg cache directory exists on control node
  ansible.builtin.file:
    path: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  tags: pxelinux

- name: Render pxelinux.cfg locally for {{ target_board_host }}
  ansible.builtin.template:
    src: "{{ role_path }}/templates/pxelinux_cfg.j2"
    dest: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  tags: pxelinux

- name: Stat rendered pxelinux.cfg locally
  ansible.builtin.stat:
    path: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
  delegate_to: localhost
  become: false
  register: _pxe_local_stat
  tags: pxelinux

# All RouterOS-targeted tasks below carry a retries/until guard. ansible's
# network_cli persistent connection to RouterOS occasionally drops mid-play
# under both paramiko and pylibssh transports — observed failure modes are
# "command timeout triggered, timeout value is 30 secs", "No existing session",
# and "Unable to decode JSON from response to get_capabilities()". Each task
# retries 3x with a 5s backoff so a single dead session doesn't fail the play.
- name: Ensure pxelinux.cfg directory exists on rb5009 under flash:/{{ sbc_tftp_flash_dir }}
  community.routeros.command:
    commands:
      - >-
        :if ([/file find name="{{ sbc_tftp_flash_dir }}/pxelinux.cfg" type=directory] = "")
        do={/file add name="{{ sbc_tftp_flash_dir }}/pxelinux.cfg" type=directory}
  register: _pxe_dir_ensure
  retries: 3
  delay: 5
  until: _pxe_dir_ensure is succeeded
  changed_when: false
  tags: pxelinux

- name: Count router-side pxelinux.cfg matching local size
  community.routeros.command:
    commands:
      - >-
        /file print count-only where
        name="{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
        and size={{ _pxe_local_stat.stat.size }}
  register: _pxe_size_match
  retries: 3
  delay: 5
  until: _pxe_size_match is succeeded
  changed_when: false
  tags: pxelinux

- name: Upload pxelinux.cfg to rb5009 if size differs
  ansible.netcommon.net_put:
    src: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
    dest: "{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
  vars:
    ansible_command_timeout: 60
  register: _pxe_net_put
  retries: 3
  delay: 5
  until: _pxe_net_put is succeeded
  when: (_pxe_size_match.stdout[0] | trim | int) == 0
  tags: pxelinux

# req-filename uses a permissive regex (".*<filename>$") instead of the
# literal "pxelinux.cfg/<filename>". RouterOS' /ip tftp matches req-filename
# as a regex against the wire-level TFTP request, and U-Boot's PXE bootmeth
# sends a path that doesn't string-match the literal "pxelinux.cfg/01-<mac>"
# even though that's what U-Boot prints to the console (verified via TFTP
# logs: HITS=0 with the literal rule, requests succeed once the regex is
# permissive). Per-model rules (armbian/<model>/{vmlinuz,initrd,dtb}) are
# fetched relative to the pxelinux.cfg URL and do match their literal
# req-filename, so they're untouched. Anchored at $ to avoid matching
# if a longer path happens to contain this filename as a prefix.
- name: Count /ip tftp rows for {{ _pxe_filename }}
  community.routeros.command:
    commands:
      - >-
        /ip tftp print count-only where
        req-filename=".*{{ _pxe_filename }}$"
        and real-filename="{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
  register: _pxe_tftp_count
  retries: 3
  delay: 5
  until: _pxe_tftp_count is succeeded
  changed_when: false
  tags: pxelinux

- name: Add /ip tftp row (if absent) for board {{ _pxe_filename }}
  community.routeros.command:
    commands:
      - >-
        /ip tftp add
        req-filename=".*{{ _pxe_filename }}$"
        real-filename="{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
        allow=yes read-only=yes
  register: _pxe_tftp_add
  retries: 3
  delay: 5
  until: _pxe_tftp_add is succeeded
  when: (_pxe_tftp_count.stdout[0] | trim | int) == 0
  changed_when: true
  tags: pxelinux

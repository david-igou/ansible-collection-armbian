---
# Writes the per-board pxelinux.cfg via the NFS-mounted TFTP config directory,
# assigns the PXE DHCP option set on RouterOS, and reboots the board.
#
# Once `flash_bootloader.yml` has installed PXE-first U-Boot to the
# board's persistent storage (SPI / eMMC / SD), the DHCP option flip
# handled here is the only thing needed to switch the board into PXE
# mode — no board-side configuration change is required at this point.
#
# Required variables: board_mac, board_model, netboot_mode

- name: Validate netboot_mode
  ansible.builtin.assert:
    that:
      - netboot_mode is defined
      - netboot_mode in ['nfsroot', 'reprovision']
    fail_msg: "netboot_mode must be 'nfsroot' or 'reprovision'"
  tags: routeros, enable_netboot

- name: Ensure TFTP NFS mount directory exists
  delegate_to: localhost
  become: true
  ansible.builtin.file:
    path: "{{ tftp_base }}"
    state: directory
    mode: "0755"
  tags: routeros, enable_netboot

- name: Mount TFTP config directory from NFS
  delegate_to: localhost
  become: true
  ansible.posix.mount:
    src: "{{ netboot_server_ip }}:{{ tftp_nfs_export }}"
    path: "{{ tftp_base }}"
    fstype: nfs
    opts: "vers=4,rw"
    state: mounted
  tags: routeros, enable_netboot

- name: Ensure pxelinux.cfg directory exists on TFTP mount
  delegate_to: localhost
  become: true
  ansible.builtin.file:
    path: "{{ tftp_base }}/pxelinux.cfg"
    state: directory
    mode: "0755"
  tags: routeros, enable_netboot

- name: Generate pxelinux.cfg for {{ target_board_host }}
  delegate_to: localhost
  become: true
  ansible.builtin.template:
    src: "{{ role_path }}/templates/pxelinux_cfg.j2"
    dest: >-
      {{ tftp_base }}/pxelinux.cfg/01-{{
        board_mac | lower | replace(':', '-')
      }}
    mode: "0644"
  tags: routeros, enable_netboot

- name: Unmount TFTP config directory
  delegate_to: localhost
  become: true
  ansible.posix.mount:
    path: "{{ tftp_base }}"
    state: unmounted
  tags: routeros, enable_netboot

- name: Assign netboot DHCP option set for {{ board_mac }}
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server lease
        set [find mac-address="{{ board_mac }}"]
        dhcp-option="{{ routeros_opt_set_nfsroot_prefix
          if netboot_mode == 'nfsroot'
          else routeros_opt_set_reprovision_prefix }}"
  tags: routeros, enable_netboot

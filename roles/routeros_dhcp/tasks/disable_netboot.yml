---
# Removes the PXE DHCP option set from a board's static lease, reverting it
# to disk boot.
#
# Called via the disable_netboot.yml playbook to revert a board to disk boot.
#
# Required variables: board_mac

- name: Remove netboot DHCP option set for {{ board_mac }}
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server lease
        set [find mac-address="{{ board_mac }}"]
        dhcp-option=""
  tags: routeros, disable_netboot

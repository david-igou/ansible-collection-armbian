---
argument_specs:
  main:
    short_description: "Wait for a board to come up over TCP/22 + SSH."
    description:
      - >-
        Single-host role. Waits for the inventory host to accept TCP/22
        connections, then performs a wait_for_connection probe. No
        notion of how the board was powered — the caller cycles PoE
        (or the operator presses a button) before invoking this role.
      - >-
        Retry knobs share names with the playbook-level retry
        primitives in `playbooks/tasks/cold_boot_with_retry.yml` so an
        operator can override a single inventory variable to tune both
        the cold-boot loop and this final wait. See
        `docs/retry-configuration.md` for the full knob inventory.

    options:
      armbian_boot_attempt_timeout:
        type: int
        default: 180
      armbian_post_boot_wait_timeout:
        type: int
        default: 300

---
- name: Reset the boot state from any earlier call
  ansible.builtin.set_fact:
    __board_boot_wait_ready: false

# The skip after success lives inside attempt.yml: a when on a looped
# include is evaluated for every item before the first attempt runs.
- name: Boot the board until it is reachable
  ansible.builtin.include_tasks: attempt.yml
  loop: "{{ range(1, board_boot_wait_attempts + 1) | list }}"
  loop_control:
    loop_var: __board_boot_wait_attempt

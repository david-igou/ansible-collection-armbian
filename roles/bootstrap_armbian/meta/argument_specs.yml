---
argument_specs:
  main:
    short_description: Create a passwordless-sudo, SSH-key-only automation user on a fresh Armbian board.
    description:
      - Run as root on a freshly flashed board (stock Armbian accepts root with its default
        password). Creates the user, authorizes its keys, grants passwordless sudo through a
        visudo-validated drop-in and removes Armbian's first-login prompt.
      - Writes one sshd drop-in, validated with C(sshd -t), that disables password
        authentication and, with C(bootstrap_armbian_lock_root), root login. With
        C(bootstrap_armbian_lock_root) the root password is also locked.
      - Fails before changing anything when no SSH key is given, since the board would
        become unreachable.
    options:
      bootstrap_armbian_user:
        description: User to create. Match the C(ansible_user) later plays connect as.
        type: str
        default: armbian
      bootstrap_armbian_ssh_keys:
        description: Public keys to authorize for the user. Must not be empty.
        type: list
        elements: str
        required: true
      bootstrap_armbian_lock_root:
        description:
          - Also set C(PermitRootLogin no) and lock the root password.
          - Later plays must then connect as C(bootstrap_armbian_user).
        type: bool
        default: false

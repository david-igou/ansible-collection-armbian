---
- name: Assert at least one SSH key was provided
  ansible.builtin.assert:
    that:
      - bootstrap_armbian_ssh_keys | length > 0
    fail_msg: >-
      bootstrap_armbian_ssh_keys is empty; with password authentication
      disabled the board would be unreachable.
    quiet: true

- name: Create the automation user
  ansible.builtin.user:
    name: "{{ bootstrap_armbian_user }}"
    shell: /bin/bash
    create_home: true
    state: present

# NOPASSWD: ALL is intentional: this is the root-equivalent automation user.
- name: Grant the automation user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ bootstrap_armbian_user }}
    content: "{{ bootstrap_armbian_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Authorize the SSH keys
  ansible.posix.authorized_key:
    user: "{{ bootstrap_armbian_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ bootstrap_armbian_ssh_keys }}"
  loop_control:
    label: "{{ item.split() | last }}"

- name: Remove the Armbian first-login prompt
  ansible.builtin.file:
    path: /root/.not_logged_in_yet
    state: absent

- name: Configure sshd authentication
  ansible.builtin.template:
    src: sshd_config.conf.j2
    dest: "{{ __bootstrap_armbian_sshd_dropin }}"
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart sshd

- name: Lock the root password
  ansible.builtin.user:
    name: root
    password_lock: true
  when: bootstrap_armbian_lock_root

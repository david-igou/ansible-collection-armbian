---
- name: Validate that at least one SSH key was provided
  ansible.builtin.assert:
    that: armbian_bootstrap_ssh_keys | length > 0
    fail_msg: >-
      armbian_bootstrap_ssh_keys is empty. Pass at least one public key.

- name: Create user {{ armbian_bootstrap_user }}
  ansible.builtin.user:
    name: "{{ armbian_bootstrap_user }}"
    shell: /bin/bash
    create_home: true
    state: present

# NOPASSWD: ALL is intentional — the bootstrap user is the
# automation user, equivalent to root. Tighten via your own
# inventory post-deploy if you want a narrower scope; the role
# itself never re-touches this file once written.
- name: Grant passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ armbian_bootstrap_user }}"
    content: "{{ armbian_bootstrap_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Set authorized keys
  ansible.posix.authorized_key:
    user: "{{ armbian_bootstrap_user }}"
    state: present
    key: "{{ item }}"
    exclusive: false
  loop: "{{ armbian_bootstrap_ssh_keys }}"
  loop_control:
    label: "{{ item.split() | last | default('(no comment)') }}"

- name: Remove Armbian first-login TUI prompt
  ansible.builtin.file:
    path: /root/.not_logged_in_yet
    state: absent

- name: Disable password authentication in sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

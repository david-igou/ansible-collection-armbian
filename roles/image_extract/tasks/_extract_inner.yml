---
- name: Decompress image (creates {{ __image_extract_img_raw }})
  ansible.builtin.shell: |
    xz -dk "{{ __image_extract_img_cache }}"
  args:
    creates: "{{ __image_extract_img_raw }}"

- name: Attach .img to a loop device with partition scan
  ansible.builtin.shell: |
    losetup --find --show --partscan "{{ __image_extract_img_raw }}"
  register: __image_extract_loop_dev
  changed_when: true

- name: Mount the largest (rootfs) partition
  ansible.builtin.shell: |
    set -o pipefail
    PART=$(lsblk -ln -o NAME {{ __image_extract_loop_dev.stdout }} | tail -1)
    mount "/dev/${PART}" "{{ image_mount_dir }}"
  args:
    executable: /bin/bash
  changed_when: true

- name: Rsync rootfs into template_dir
  ansible.builtin.shell: |
    rsync -aHAX \
      --exclude '/proc/*' --exclude '/sys/*' \
      --exclude '/dev/*' --exclude '/run/*' \
      "{{ image_mount_dir }}/" "{{ template_dir }}/"
  changed_when: true

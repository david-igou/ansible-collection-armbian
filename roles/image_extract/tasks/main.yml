---
# image_extract — runs on a single host with sudo + losetup.
# Inputs documented in meta/argument_specs.yml.

- name: Compute per-invocation paths
  ansible.builtin.set_fact:
    __image_extract_img_cache: "{{ image_cache_dir }}/{{ model_name }}.img.xz"
    __image_extract_img_raw: "{{ image_cache_dir }}/{{ model_name }}.img"

- name: Force-refresh — remove stale state when requested
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ template_dir }}"
    - "{{ tftp_dir }}"
    - "{{ __image_extract_img_cache }}"
    - "{{ __image_extract_img_raw }}"
  when: force_refresh | bool

- name: Ensure working directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ image_cache_dir }}"
    - "{{ image_mount_dir }}"
    - "{{ template_dir }}"
    - "{{ tftp_dir }}"

- name: Probe sentinel file written at end of a previous successful run
  ansible.builtin.stat:
    path: "{{ template_dir }}/.armbian_extract_complete"
  register: __image_extract_sentinel

- name: Skip extraction when the sentinel exists
  ansible.builtin.set_fact:
    __image_extract_already_extracted: "{{ __image_extract_sentinel.stat.exists }}"

- name: Extract image when needed
  when: not __image_extract_already_extracted
  block:
    - name: Acquire .img.xz (download or copy)
      ansible.builtin.include_tasks: _download_or_copy.yml

    - name: Decompress, mount, rsync rootfs, copy kernel artifacts
      ansible.builtin.include_tasks: _extract_inner.yml

    - name: Copy vmlinuz / initrd / dtb to tftp_dir
      ansible.builtin.include_tasks: _copy_kernel_artifacts.yml

  always:
    - name: Tear down loop device and unmount (always)
      ansible.builtin.include_tasks: _cleanup.yml

- name: Strip /dev entries from template fstab (idempotent)
  ansible.builtin.lineinfile:
    path: "{{ template_dir }}/etc/fstab"
    regexp: "^/dev/"
    state: absent
  when: not __image_extract_already_extracted

- name: Write sentinel file marking a complete extraction
  ansible.builtin.copy:
    dest: "{{ template_dir }}/.armbian_extract_complete"
    content: "model={{ model_name }}\n"
    mode: "0644"
  when: not __image_extract_already_extracted

---
# Ensure the cache and output directories exist; clone or update
# armbian/build to the pinned ref. The build's Docker named volumes
# (armbian-cache, armbian-ccache) persist across runs for incremental
# builds; the role only manages the checkout and output directories.
#
# The actual paths used are the per-host suffixed variants computed in
# main.yml: __image_build_cache_dir_host (armbian_build_cache_dir/<host>)
# and __image_build_output_dir_host (armbian_build_output_dir/<host>).
# The base variables armbian_build_cache_dir and armbian_build_output_dir
# are never used directly here.
#
# All operations in this task file run as the connecting user (no become)
# because compile.sh requires user ownership of the build tree for
# Docker auto-delegation. The role assumes __image_build_cache_dir_host
# and __image_build_output_dir_host are writable by ansible_user — either
# point armbian_build_cache_dir / armbian_build_output_dir at a user-home
# path, or pre-create + chown them once if you want them under /var/lib/
# or similar.

- name: Ensure cache and output directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ __image_build_cache_dir_host }}"
    - "{{ __image_build_output_dir_host }}"

- name: Clone or update armbian/build at the pinned ref
  ansible.builtin.git:
    repo: https://github.com/armbian/build.git
    dest: "{{ __image_build_cache_dir_host }}/build"
    version: "{{ armbian_build_ref }}"
    force: false
    update: true
    depth: 1
  become: false
  # Shield the clone from the connecting user's global git config
  # (insteadOf rewrites, credential helpers, signing requirements) by
  # pointing GIT_CONFIG_GLOBAL at the same build-local config file
  # invoke_build.yml uses. The file does not need to exist — git treats
  # a missing GIT_CONFIG_GLOBAL target as an empty config.
  environment:
    GIT_CONFIG_GLOBAL: "{{ __image_build_cache_dir_host }}/.gitconfig"

---
- name: Prepare the build tree and decide whether to build
  ansible.builtin.import_tasks: plan.yml

- name: Build the image as the connecting user
  when: image_build_needed | bool
  become: false
  block:
    # compile.sh relaunches itself in Docker when run by a non-root user
    # in the docker group.
    - name: Run armbian/build compile.sh
      ansible.builtin.command:
        argv: "{{ __image_build_compile_argv }}"
        chdir: "{{ __image_build_checkout }}"
      environment: "{{ __image_build_git_env }}"
      async: "{{ image_build_timeout }}"
      poll: 30
      changed_when: true

    # The kernel version in the file name is not known in advance.
    - name: Find the image this run produced
      ansible.builtin.find:
        paths: "{{ __image_build_checkout }}/output/images"
        patterns: "(?i)Armbian.*{{ image_build_board }}.*{{ image_build_release }}.*{{ image_build_branch }}.*[.]img[.]xz$"
        use_regex: true
        age: -10m
      register: __image_build_produced

    - name: Assert exactly one image was produced
      ansible.builtin.assert:
        that:
          - __image_build_produced.files | length == 1
        fail_msg: >-
          Expected one .img.xz for {{ image_build_board }}/{{ image_build_release }}/{{ image_build_branch }},
          found {{ __image_build_produced.files | map(attribute='path') | list }}.

    - name: Stat the image's .sha sidecar
      ansible.builtin.stat:
        path: "{{ __image_build_produced.files[0].path }}.sha"
        get_checksum: false
      register: __image_build_sha

    - name: Move the image and its .sha sidecar into the output directory
      ansible.builtin.command:
        argv:
          - mv
          - "{{ item }}"
          - "{{ __image_build_output_dir }}/"
      loop: "{{ [__image_build_produced.files[0].path] + ([__image_build_produced.files[0].path ~ '.sha'] if __image_build_sha.stat.exists else []) }}"
      changed_when: true

    - name: Assemble the manifest
      ansible.builtin.set_fact:
        __image_build_new_manifest:
          board: "{{ image_build_board }}"
          name: "{{ image_build_name }}"
          branch: "{{ image_build_branch }}"
          release: "{{ image_build_release }}"
          armbian_build_ref: "{{ image_build_ref }}"
          image_filename: "{{ __image_build_produced.files[0].path | basename }}"
          built_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          inputs_hash: "{{ __image_build_inputs_hash }}"

    - name: Write manifest.json
      ansible.builtin.copy:
        dest: "{{ __image_build_manifest_path }}"
        content: "{{ __image_build_new_manifest | to_nice_json(sort_keys=true) }}\n"
        mode: "0644"

- name: Expose the manifest of the image in the output directory
  ansible.builtin.set_fact:
    image_build_manifest: "{{ __image_build_new_manifest if image_build_needed | bool else __image_build_existing_manifest }}"

# Runs whether or not this run built, so an existing tree converges too. A
# failed build never gets here and keeps its trees for the retry.
# compile.sh's container writes the compile trees as root.
- name: Remove the kernel and U-Boot compile trees
  ansible.builtin.file:
    path: "{{ __image_build_checkout }}/cache/sources/{{ item }}"
    state: absent
  become: true
  loop:
    - linux-kernel-worktree
    - u-boot-worktree
  when: not image_build_keep_compile_trees | bool

- name: Find the images in the output directory
  ansible.builtin.find:
    paths: "{{ __image_build_output_dir }}"
    patterns: "*.img.xz*"
  become: false
  register: __image_build_images

- name: Remove images the manifest does not name
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: false
  loop: >-
    {{ __image_build_images.files | map(attribute='path')
       | reject('in', [__image_build_current, __image_build_current ~ '.sha']) | sort }}
  vars:
    __image_build_current: "{{ __image_build_output_dir }}/{{ image_build_manifest.image_filename }}"

---
# Preflight: validate Docker daemon reachability, disk space, and egress
# before any expensive operation. All failures are hard fails with
# operator-actionable messages.

- name: Gather mount facts (free-space check)
  ansible.builtin.setup:
    filter: ansible_mounts
    gather_subset:
      - "!all"
      - "!min"
      - mounts

- name: Verify Docker daemon is reachable
  ansible.builtin.command: docker info
  changed_when: false
  register: __image_build_docker_info
  failed_when: __image_build_docker_info.rc != 0

- name: Resolve free space at armbian_build_cache_dir
  ansible.builtin.set_fact:
    __image_build_cache_mount: >-
      {{ ansible_mounts
         | sort(attribute='mount', reverse=true)
         | selectattr('mount', 'in', __image_build_cache_dir_host + '/')
         | list | first }}

- name: Assert sufficient free space at the cache dir
  ansible.builtin.assert:
    that:
      - __image_build_cache_mount is defined
      - (__image_build_cache_mount.size_available | int) >= (armbian_build_min_free_gb | int * 1024 * 1024 * 1024)
    fail_msg: >-
      Insufficient free space at {{ __image_build_cache_dir_host }}
      ({{ (__image_build_cache_mount.size_available | int / 1024 / 1024 / 1024) | round(1) }} GB available,
       {{ armbian_build_min_free_gb }} GB required)

- name: HEAD-check required egress hosts
  ansible.builtin.uri:
    url: "https://{{ item }}"
    method: HEAD
    status_code: [200, 301, 302, 404, 405]
    timeout: 10
  loop: "{{ armbian_build_required_egress_hosts }}"
  loop_control:
    label: "{{ item }}"

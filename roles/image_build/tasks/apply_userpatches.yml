---
# Drop each { dest, content } entry into <build_checkout>/userpatches/<dest>.
# This is the standard Armbian userpatches location — compile.sh's Docker
# mode auto-mounts ./userpatches into the build container, so placing
# files here ensures they're visible inside the container without needing
# USERPATCHES_DIR overrides.

- name: Assert userpatches dest paths are safe
  ansible.builtin.assert:
    that:
      - "'..' not in item.dest"
      - not item.dest.startswith('/')
    fail_msg: "Unsafe userpatches dest (must be relative and not contain '..'): {{ item.dest }}"
  loop: "{{ armbian_build_userpatches }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Ensure parent directories for userpatches files exist
  ansible.builtin.file:
    path: "{{ (__image_build_cache_dir_host + '/build/userpatches/' + item.dest) | dirname }}"
    state: directory
    mode: "0755"
  become: false
  loop: "{{ armbian_build_userpatches }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write userpatches files
  ansible.builtin.copy:
    dest: "{{ __image_build_cache_dir_host }}/build/userpatches/{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "0644"
  become: false
  loop: "{{ armbian_build_userpatches }}"
  loop_control:
    label: "{{ item.dest }}"

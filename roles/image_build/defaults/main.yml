---
# Bumping the pinned armbian/build ref is a deliberate role change.
image_build_ref: v26.2.0-trunk.844
image_build_branch: current
image_build_release: bookworm
image_build_output_dir: "{{ image_build_cache_dir }}/output"
image_build_userpatches: []
image_build_compile_args:
  KERNEL_CONFIGURE: "no"
  BUILD_DESKTOP: "no"
  BUILD_MINIMAL: "yes"
  COMPRESS_OUTPUTIMAGE: sha,xz
  EXPERT: "yes"
image_build_timeout: 7200
image_build_min_free_gb: 50
image_build_force: false
image_build_keep_compile_trees: false
image_build_required_egress_hosts:
  - github.com
  - apt.armbian.com
  - ghcr.io
  - registry-1.docker.io

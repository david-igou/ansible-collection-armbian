---
argument_specs:
  main:
    short_description: Build an Armbian image with armbian/build in Docker mode
    description:
      - >-
        Runs the C(plan) entry point, then, when C(image_build_needed) is true,
        runs C(compile.sh), moves the produced C(.img.xz) (and its C(.sha)
        sidecar) into C(<image_build_output_dir>/<image_build_name>/) and writes
        C(manifest.json) there.
      - >-
        Runs as the connecting user without privilege escalation; that user
        must be in the C(docker) group and own O(image_build_cache_dir) and
        O(image_build_output_dir). Not check-mode safe.
      - >-
        Sets the facts C(image_build_needed), C(image_build_inputs_hash) and
        C(image_build_manifest) (the manifest of the image in the output
        directory, newly written or existing).
    options: &image_build_options
      image_build_board:
        type: str
        required: true
        description:
          - Armbian board name, passed as C(BOARD=).
      image_build_name:
        type: str
        required: true
        description:
          - Directory name for this build target, normally the board's inventory hostname.
          - Keys C(<image_build_cache_dir>/<name>/) and C(<image_build_output_dir>/<name>/). Must not contain C(/).
      image_build_cache_dir:
        type: path
        required: true
        description:
          - Builder directory for the per-target armbian/build checkouts, writable by the connecting user.
      image_build_output_dir:
        type: path
        default: "{{ image_build_cache_dir }}/output"
        description:
          - Directory for C(<name>/<image>.img.xz), its C(.sha) sidecar and C(<name>/manifest.json).
      image_build_branch:
        type: str
        default: current
        description:
          - Kernel branch, passed as C(BRANCH=).
      image_build_release:
        type: str
        default: bookworm
        description:
          - Userspace release, passed as C(RELEASE=).
      image_build_ref:
        type: str
        default: v26.2.0-trunk.844
        description:
          - armbian/build git ref to check out.
      image_build_userpatches:
        type: list
        elements: dict
        default: []
        description:
          - Files to place under the checkout's C(userpatches/), each C({dest, content}). C(dest) is
            relative to C(userpatches/) and must not contain C(..).
          - Authoritative. Files under C(userpatches/) that are not listed are removed.
        options:
          dest:
            type: str
            required: true
            description:
              - Path relative to C(userpatches/).
          content:
            type: str
            required: true
            description:
              - File content, written verbatim.
      image_build_compile_args:
        type: dict
        default:
          KERNEL_CONFIGURE: "no"
          BUILD_DESKTOP: "no"
          BUILD_MINIMAL: "yes"
          COMPRESS_OUTPUTIMAGE: sha,xz
          EXPERT: "yes"
        description:
          - Extra C(KEY=value) arguments for compile.sh. Part of the inputs hash.
      image_build_timeout:
        type: int
        default: 7200
        description:
          - Seconds compile.sh may run.
      image_build_min_free_gb:
        type: int
        default: 50
        description:
          - Minimum free GiB at the cache directory.
      image_build_force:
        type: bool
        default: false
        description:
          - Build even when the manifest's inputs hash matches and its image exists.
      image_build_required_egress_hosts:
        type: list
        elements: str
        default:
          - github.com
          - apt.armbian.com
          - ghcr.io
          - registry-1.docker.io
        description:
          - Hosts that must answer an HTTPS HEAD request before the build.
  plan:
    short_description: Prepare the armbian/build tree and decide whether a build is needed
    description:
      - >-
        Checks free space, the Docker daemon and egress, checks out armbian/build
        at O(image_build_ref), writes O(image_build_userpatches) and removes
        undeclared files under C(userpatches/), then compares the inputs hash
        with the existing C(manifest.json). Does not run compile.sh.
      - >-
        The inputs hash is the sha256 of the JSON of the board, branch, release,
        ref, userpatches and compile args. Sets the facts
        C(image_build_inputs_hash) and C(image_build_needed) (true when forced,
        when the manifest is missing or its C(inputs_hash) differs, or when the
        image it names is missing).
    options: *image_build_options

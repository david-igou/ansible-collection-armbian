---
# Naming note — armbian_build_host (role input vs. inventory variable):
#
# This role accepts an argument named armbian_build_host (type: str).
# As a ROLE INPUT it is the inventory_hostname string of the board being
# built for (e.g. "orange-pi-5-pro-01"). It drives the per-host output
# path (armbian_build_output_dir/<host>/) and per-host checkout dir so
# concurrent builds don't collide.
#
# Separately, the inventory layer may define an armbian_build_host
# HOST VARIABLE (a dict) on each board host. That dict is consumed by
# _resolve_build_profile.yml to merge per-host build overrides on top of
# the family/model layers. The two usages are safe because Ansible's
# role-vars task-scope shadows inventory-vars for the duration of an
# include_role: call — the role never sees the inventory dict under the
# same name.
#
# Playbook-level preconditions (not validated by the role itself):
#
# image_build expects callers to pre-resolve the per-host build profile
# via playbooks/tasks/_resolve_build_profile.yml and the per-host board
# config via playbooks/tasks/_resolve_board_config.yml before invoking
# this role. The resolved armbian_build and armbian_board_config facts
# drive armbian_build_userpatches content (e.g. __999_local_kernel_bake
# and __999_uboot_env_check hooks reference armbian_board_config fields).
# See playbooks/build_and_publish_from_inventory.yml for the canonical
# caller pattern.

argument_specs:
  main:
    short_description: >-
      Build a custom Armbian image with caller-supplied userpatches via
      armbian/build (Docker mode)
    description:
      - >-
        Single-purpose, intent-agnostic role. The caller supplies the board,
        host, branch, release, and userpatches list; the role enforces the
        desired output state under armbian_build_output_dir/<host>/.
      - >-
        Workflow playbooks (e.g. playbooks/build_and_publish_from_inventory.yml)
        pre-resolve armbian_build and armbian_board_config via the resolver
        primitives in playbooks/tasks/ and inject the resolved
        armbian_build_userpatches before invoking this role. The role
        itself is agnostic to the content of those patches.
    options:
      armbian_build_board:
        type: str
        required: true
        description: >-
          Armbian board identifier passed as BOARD= to compile.sh.
          Must match a supported board in the armbian/build tree at
          armbian_build_ref.

      armbian_build_host:
        type: str
        required: true
        description: >-
          inventory_hostname of the host this build is for. Drives the
          per-host output path under armbian_build_output_dir/<host>/
          and the per-host checkout dir under armbian_build_cache_dir/<host>/.
          Used so concurrent per-host builds don't collide and so secret-
          bearing userpatches in one host's tree never see another host's.

      armbian_build_branch:
        type: str
        required: false
        default: current
        description: >-
          Armbian kernel branch (current, edge, legacy, vendor).
          Passed as BRANCH= to compile.sh.

      armbian_build_release:
        type: str
        required: false
        default: bookworm
        description: >-
          Debian/Ubuntu release codename. Passed as RELEASE= to compile.sh.

      armbian_build_userpatches:
        type: list
        required: false
        default: []
        description: >-
          List of userpatches to apply before the build. Each entry is a
          mapping with keys dest (path relative to USERPATCHES_DIR, no
          leading slash, no ..) and content (raw file text).
          Patch content MAY contain Jinja referencing the host's resolved
          armbian_board_config fact (e.g. armbian_board_config.console);
          apply_userpatches.yml's ansible.builtin.copy with `content:`
          renders these references at the point the file lands on the
          builder. The role itself is fully agnostic to what the patches do.
        elements: dict

      armbian_build_ref:
        type: str
        required: false
        default: v26.2.0-trunk.844
        description: >-
          armbian/build git ref to checkout. Pinned for reproducibility;
          bumping is a deliberate role-level change.

      armbian_build_cache_dir:
        type: str
        required: false
        default: /home/{{ ansible_user }}/armbian_build
        description: >-
          Directory on the builder host for the armbian/build checkout,
          cache, and userpatches tree. Must be writable by the
          connecting user — the role does not escalate privileges. The
          default lives under $HOME so this holds with no setup; if you
          relocate it under a root-owned path like /var/lib, pre-create
          + chown the path before the first run.

      armbian_build_output_dir:
        type: str
        required: false
        default: /home/{{ ansible_user }}/armbian_build/output
        description: >-
          Directory where the final .img.xz and manifest.json are
          written. Same writability requirement as
          armbian_build_cache_dir.

      armbian_build_user:
        type: str
        required: false
        default: ""
        description: >-
          User that owns the build tree and runs compile.sh. Must be in
          the docker group on the builder host. Defaults to ansible_user
          when empty.

      armbian_build_min_free_gb:
        type: int
        required: false
        default: 50
        description: >-
          Minimum free disk space (GiB) required on the builder before
          starting the build. Preflight fails if the threshold is not met.

      armbian_build_required_egress_hosts:
        type: list
        required: false
        description: >-
          Hostnames that must be TCP-reachable from the builder before the
          build starts. Defaults to github.com, apt.armbian.com, ghcr.io,
          and registry-1.docker.io.
        elements: str

      armbian_build_compile_args:
        type: dict
        required: false
        description: >-
          Extra key=value arguments passed verbatim to compile.sh. Not
          folded into the patch_hash; changing these forces a rebuild only
          when armbian_build_force is true.

      armbian_build_timeout:
        type: int
        required: false
        default: 7200
        description: >-
          Maximum seconds to wait for compile.sh to complete. 7200 (2 h)
          covers cold-cache full builds.

      armbian_build_force:
        type: bool
        required: false
        default: false
        description: >-
          Set to true (e.g. via -e armbian_build_force=true) to bypass
          the manifest-match skip logic and force a full rebuild.

---
galaxy_info:
  role_name: netboot_assets
  author: David Igou
  description: >-
    Populate netboot-server NFS exports with Armbian rootfs (default
    entry point); a secondary tasks_from entry point populates rb5009
    TFTP with kernel/initrd/dtb. Together they provide everything an
    Armbian SBC needs to PXE-boot into an NFS rootfs.
  license: GPL-3.0-or-later
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - bookworm
    - name: Ubuntu
      versions:
        - jammy
        - noble

  galaxy_tags:
    - linux
    - networking
    - infrastructure
    - armbian
    - nfs
    - netboot

dependencies: []

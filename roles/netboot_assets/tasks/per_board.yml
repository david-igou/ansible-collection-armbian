---
# Runs once per board model (_model variable set by include loop in main.yml).
# Populates the per-model rootfs template and the TFTP tree for this model
# from an Armbian image. The per-host rootfs clones are created in a later
# pass by per_host.yml. All operations run locally on the netboot server.

- name: Set per-model facts for {{ _model }}
  ansible.builtin.set_fact:
    _bc: "{{ board_configs[_model] }}"
    _template_dir: "{{ nfs_rootfs_path }}/_templates/{{ _model }}"
    _tftp_truenas_cache: "{{ armbian_image_cache }}/sbc-tftp/{{ _model }}"
    _image_cache: "{{ armbian_image_cache }}/{{ _model }}.img.xz"

- name: Ensure per-model template and TrueNAS cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ _template_dir }}"
    - "{{ _tftp_truenas_cache }}"

- name: Check if rootfs template is already populated for {{ _model }}
  ansible.builtin.stat:
    path: "{{ _template_dir }}/bin/bash"
  register: _template_populated

- name: Check if SBC TFTP cache is already populated for {{ _model }}
  ansible.builtin.stat:
    path: "{{ _tftp_truenas_cache }}/vmlinuz"
  register: _tftp_cache_populated

- name: Populate rootfs template + TFTP cache from Armbian image
  when: not _template_populated.stat.exists or not _tftp_cache_populated.stat.exists
  block:
    - name: Download Armbian image for {{ _model }}
      ansible.builtin.get_url:
        url: "{{ armbian_image_urls[_model] }}"
        dest: "{{ _image_cache }}"
        mode: "0644"
        timeout: 600

    - name: Decompress image
      ansible.builtin.shell: |
        xz -dk "{{ _image_cache }}"
      args:
        creates: "{{ armbian_image_cache }}/{{ _model }}.img"

    - name: Set up loop device
      ansible.builtin.shell: |
        losetup --find --show --partscan \
          "{{ armbian_image_cache }}/{{ _model }}.img"
      register: _loop_dev
      changed_when: true

    - name: Mount Armbian image rootfs partition
      ansible.builtin.shell: |
        set -o pipefail
        PART=$(lsblk -ln -o NAME {{ _loop_dev.stdout }} | tail -1)
        mount /dev/${PART} "{{ armbian_image_mount }}"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Rsync rootfs into per-model template
      ansible.builtin.shell: |
        rsync -aHAX --exclude '/proc/*' --exclude '/sys/*' \
          --exclude '/dev/*' --exclude '/run/*' \
          "{{ armbian_image_mount }}/" "{{ _template_dir }}/"
      changed_when: true

    - name: Copy kernel and initrd to TrueNAS cache
      ansible.builtin.shell: |
        cp "{{ armbian_image_mount }}"/boot/vmlinuz-* "{{ _tftp_truenas_cache }}/vmlinuz"
        cp "{{ armbian_image_mount }}"/boot/initrd.img-* "{{ _tftp_truenas_cache }}/initrd.img"
      changed_when: true

    # Armbian images can place DTBs at several locations depending on the
    # kernel package: /boot/dtb/<dtb>, /boot/dtb-<version>/<dtb>, or
    # /boot/dtbs/<version>/<dtb>. Try each and fail loudly if none match —
    # silently shipping a missing DTB causes a kernel panic at PXE boot
    # time, which is much harder to diagnose than an Ansible failure here.
    - name: Copy board DTB to TFTP tree
      ansible.builtin.shell: |
        set -e
        ROOT="{{ armbian_image_mount }}"
        DTB="{{ _bc.dtb }}"
        for CANDIDATE in \
            "${ROOT}/boot/dtb/${DTB}" \
            "${ROOT}/boot/dtbs/${DTB}" \
            $(ls "${ROOT}"/boot/dtb-*/"${DTB}" 2>/dev/null) \
            $(ls "${ROOT}"/boot/dtbs/*/"${DTB}" 2>/dev/null); do
          if [ -f "${CANDIDATE}" ]; then
            cp "${CANDIDATE}" "{{ _tftp_truenas_cache }}/board.dtb"
            echo "DTB copied from ${CANDIDATE}"
            exit 0
          fi
        done
        echo "ERROR: DTB ${DTB} not found under ${ROOT}/boot/{dtb,dtbs,dtb-*}" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: true

    - name: Unmount Armbian image and detach loop device
      ansible.builtin.shell: |
        umount "{{ armbian_image_mount }}" || true
        losetup -d "{{ _loop_dev.stdout }}" || true
      changed_when: true

    - name: Remove local disk entries from rootfs template fstab
      ansible.builtin.lineinfile:
        path: "{{ _template_dir }}/etc/fstab"
        regexp: "^/dev/"
        state: absent

- name: Ensure control-node SBC TFTP cache for {{ _model }} exists
  ansible.builtin.file:
    path: "{{ sbc_tftp_cache_dir }}/{{ _model }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Fetch SBC TFTP assets from TrueNAS to control-node cache
  ansible.builtin.fetch:
    src: "{{ _tftp_truenas_cache }}/{{ item }}"
    dest: "{{ sbc_tftp_cache_dir }}/{{ _model }}/{{ item }}"
    flat: true
  loop:
    - vmlinuz
    - initrd.img
    - board.dtb

- name: Copy Armbian image to assets for HTTP download
  ansible.builtin.copy:
    src: "{{ _image_cache }}"
    dest: "{{ nfs_assets_export }}/images/{{ _model }}.img.xz"
    mode: "0644"
    remote_src: true

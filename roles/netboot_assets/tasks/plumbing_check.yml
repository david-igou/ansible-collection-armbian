---
# Asserts rb5009 has /ip tftp rows registered for the per-model SBC TFTP
# assets. Catches "operator forgot to run stage_netboot_assets.yml"
# before per-board enable_netboot operations would fail mysteriously.
#
# Run from a play with hosts: routeros_routers, gather_facts: false.
#
# Required facts (set via vars in the calling play):
#   _check_models: list of board_model strings to verify

- name: Resolve models to verify
  ansible.builtin.set_fact:
    _check_models: >-
      {{ _check_models | default(
           groups['boards']
           | map('extract', hostvars, 'board_model')
           | list | unique
         ) }}

# Retry guard: network_cli persistent connections to RouterOS sometimes
# drop mid-play under both paramiko and pylibssh transports.
- name: Count /ip tftp rows per (model, asset) pair
  community.routeros.command:
    commands:
      - >-
        /ip tftp print count-only where
        req-filename="armbian/{{ item.0 }}/{{ item.1 }}"
  register: _plumbing_row_count
  retries: 3
  delay: 5
  until: _plumbing_row_count is succeeded
  changed_when: false
  loop: "{{ _check_models | product(['vmlinuz', 'initrd.img', 'board.dtb']) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"

- name: Assert each (model, asset) pair has at least one /ip tftp row
  ansible.builtin.assert:
    that:
      - (item.stdout[0] | trim | int) >= 1
    fail_msg: >-
      rb5009 has no /ip tftp row for armbian/{{ item.item.0 }}/{{ item.item.1 }}.
      Run playbooks/stage_netboot_assets.yml to populate per-model SBC
      TFTP assets before invoking enable_netboot.
  loop: "{{ _plumbing_row_count.results }}"
  loop_control:
    label: "{{ item.item.0 }}/{{ item.item.1 }}"

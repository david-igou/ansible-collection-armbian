---
# Populates the netboot server's NFS exports with Armbian rootfs and the
# TFTP kernel/DTB/initrd assets. Runs ON the netboot server (no NFS client
# mount on the control node) and operates on the export paths directly.
#
# Two-pass structure:
#   1. Per board model: extract the Armbian image once into a template
#      directory (_templates/<model>) and copy kernel/initrd/DTB to TFTP.
#   2. Per inventory host: cp --reflink the model template into a per-host
#      rootfs directory, then customise hostname/machine-id/SSH keys so
#      multiple same-model boards have independent identities on the wire.

- name: Load board configs
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/boards.yml"

- name: Gather unique board models from inventory
  ansible.builtin.set_fact:
    _board_models: >-
      {{ groups['boards']
         | map('extract', hostvars, 'armbian_netboot_board_model')
         | list | unique }}

# ── Preflight ─────────────────────────────────────────────────────────
# Validate every board model's image URL before any destructive work.
# Failures here are cheap to fix; failures during extraction on a board
# half-way through the workflow are not.
- name: Preflight — validate image URLs
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure local working directories exist on the netboot server
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ armbian_netboot_image_cache }}"
    - "{{ armbian_netboot_image_mount }}"
    - "{{ armbian_netboot_nfs_rootfs_path }}/_templates"

- name: Ensure assets images directory exists
  ansible.builtin.file:
    path: "{{ armbian_netboot_nfs_assets_export }}/images"
    state: directory
    mode: "0755"

# ── Pass 1: per-model template extraction ─────────────────────────────
- name: Extract per-model rootfs templates
  ansible.builtin.include_tasks: per_board.yml
  loop: "{{ _board_models }}"
  loop_control:
    loop_var: _model

# ── Pass 2: per-host rootfs clones ────────────────────────────────────
# Each host of every model gets its own NFS export under
# armbian_netboot_nfs_rootfs_path/<hostname>, reflink-copied from the model template
# and customised so identities (hostname, machine-id, SSH host keys)
# are unique on the wire. Hosts of the same model share storage on
# reflink-capable filesystems.
- name: Build per-host rootfs clones
  ansible.builtin.include_tasks: per_host.yml
  loop: "{{ groups['boards'] }}"
  loop_control:
    loop_var: _host
    label: "{{ _host }} ({{ hostvars[_host]['armbian_netboot_board_model'] }})"

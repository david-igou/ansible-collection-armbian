---
# Runs once per inventory host in the boards group (_host variable set by
# include loop in main.yml). Clones the per-model template into a per-host
# rootfs directory using cp --reflink=auto (zero-cost copy on XFS, btrfs,
# ZFS — full copy on ext4) and customises the host's identity so multiple
# same-model boards have unique hostname, machine-id, and SSH host keys
# on the wire.

- name: Set per-host facts for {{ _host }}
  ansible.builtin.set_fact:
    _host_model: "{{ hostvars[_host].board_model }}"
    _host_template_dir: "{{ nfs_rootfs_path }}/_templates/{{ hostvars[_host].board_model }}"
    _host_rootfs_dir: "{{ nfs_rootfs_path }}/{{ _host }}"

- name: Verify model template exists for {{ _host }}
  ansible.builtin.stat:
    path: "{{ _host_template_dir }}/bin/bash"
  register: _host_template_stat

- name: Fail if model template is missing
  ansible.builtin.fail:
    msg: >-
      Per-model template {{ _host_template_dir }} was not populated.
      per_board.yml must run successfully before per_host.yml — check
      earlier output for that model's extraction.
  when: not _host_template_stat.stat.exists

- name: Check whether per-host rootfs already exists
  ansible.builtin.stat:
    path: "{{ _host_rootfs_dir }}/bin/bash"
  register: _host_rootfs_stat

- name: Clone model template into per-host rootfs (reflink where supported)
  when: not _host_rootfs_stat.stat.exists
  block:
    - name: Ensure per-host rootfs parent exists
      ansible.builtin.file:
        path: "{{ _host_rootfs_dir }}"
        state: directory
        mode: "0755"

    # cp -a --reflink=auto: zero-cost CoW snapshot on XFS/btrfs/ZFS, full
    # copy on ext4. Either way the result is an independent rootfs the
    # host can mutate without affecting the template or other hosts.
    - name: Reflink-clone template to per-host rootfs
      ansible.builtin.shell: |
        set -o pipefail
        cp -a --reflink=auto "{{ _host_template_dir }}/." "{{ _host_rootfs_dir }}/"
      args:
        executable: /bin/bash
      changed_when: true

# Per-host identity customisation runs every time (idempotent), so an
# operator can rerun populate_nfs_content.yml after renaming a host without
# needing to nuke the rootfs.
- name: Set per-host /etc/hostname
  ansible.builtin.copy:
    dest: "{{ _host_rootfs_dir }}/etc/hostname"
    content: "{{ _host }}\n"
    mode: "0644"

- name: Set per-host /etc/hosts entry
  ansible.builtin.lineinfile:
    path: "{{ _host_rootfs_dir }}/etc/hosts"
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ _host }}"
    create: false
  failed_when: false  # not all base images ship /etc/hosts pre-populated

- name: Remove machine-id files (regenerated on first boot)
  ansible.builtin.file:
    path: "{{ _host_rootfs_dir }}/{{ item }}"
    state: absent
  loop:
    - etc/machine-id
    - var/lib/dbus/machine-id

- name: Remove SSH host keys (regenerated by ssh-keygen at first boot)
  ansible.builtin.shell: |
    rm -f "{{ _host_rootfs_dir }}"/etc/ssh/ssh_host_*
  args:
    executable: /bin/bash
  changed_when: true

- name: Per-host rootfs ready
  ansible.builtin.debug:
    msg: >-
      {{ _host }} ({{ _host_model }}) rootfs:
      {{ _host_rootfs_dir }} (cloned from {{ _host_template_dir }}).

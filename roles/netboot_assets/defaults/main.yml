---
# Working paths on the netboot server used while extracting an Armbian
# image. armbian_netboot_image_cache also persists between runs so re-runs can
# skip the download. On TrueNAS, override both to a path on a data pool —
# the boot pool is small and not appropriate for caching multi-GB images.
#
# Cross-role variables this role reads (NFS rootfs path, HTTP assets export,
# TFTP flash dir on rb5009, control-node TFTP cache dir, image URL map, board
# model host vars, etc.) live in inventory group_vars/all.yml (or host scope)
# as armbian_netboot_* names — they are not duplicated in role defaults.
armbian_netboot_image_cache: /mnt/ssd/netboot/cache
armbian_netboot_image_mount: /mnt/ssd/netboot/.loop-mount

# Opt-in toggle to force re-extraction of the per-model rootfs templates,
# the TrueNAS-side TFTP asset cache, and per-host rootfs clones. With the
# default (false) the role's existence-check gates skip those steps when
# the target directories already look populated — fast on re-runs but
# silently retains stale assets after a rebuild of the source .img.xz.
# Set to true (typically via `-e armbian_netboot_force_refresh=true`) to
# nuke and rebuild every per-model template, TFTP cache, cached image
# blob, and per-host rootfs clone for every model/host in inventory.
armbian_netboot_force_refresh: false

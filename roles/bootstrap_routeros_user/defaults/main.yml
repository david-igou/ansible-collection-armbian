---
# Name of the RouterOS user to create / update.
routeros_user_name: "ansible-netboot"

# Name of the RouterOS user group (defaults to matching the user).
routeros_user_group_name: "{{ routeros_user_name }}"

# Source-address restriction on the user.
routeros_user_address_scope: "10.10.0.0/16"

# Comment field on the user.
routeros_user_comment: "ansible armbian_netboot collection"

# Comma-separated RouterOS policy string. NO whitespace.
# Default grants SSH + read/write; rest-api and the legacy api are denied.
routeros_user_policy: "read,write,ssh,!local,!telnet,!ftp,!reboot,!policy,!test,!winbox,!password,!web,!sniff,!sensitive,!romon,!rest-api,!api"

# List of SSH public-key strings to register for the user. Required — caller
# must set this (typically in a playbook vars block or group_vars).
routeros_user_ssh_keys: []

# Set true to also disable password SSH globally (/ip ssh always-allow-
# password-login=no). Verify key auth works for ALL users first.
routeros_disable_password_ssh: false

# Placeholder password applied at /user add time on first creation only.
# Required because some RouterOS builds (notably factory-software 7.4.x+,
# e.g. RB5009UG+S+) prompt interactively for a password when /user add
# omits one — and that prompt hangs network_cli. The default below is a
# random throwaway regenerated per-run; the user is provisioned with SSH
# keys and `routeros_user_policy` denies the `password` privilege, so this
# value is unreachable for login. Override only if you specifically want
# a known password (e.g. for break-glass console access).
routeros_user_initial_password: >-
  {{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}

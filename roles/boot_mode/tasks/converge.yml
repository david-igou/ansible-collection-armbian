---
# Converge per-board pxelinux.cfg on rb5009.
#
# Delegates to armbian_netboot_router via block-level delegate_to
# (Ansible 2.20+ removed delegate_to on include_role).
#
# Delegation works because group_vars/routeros.yml sets
# ansible_connection: ansible.netcommon.network_cli on all RouterOS
# hosts — the delegated tasks pick up the router's connection settings
# automatically.

- name: "boot_mode[{{ armbian_netboot_boot_mode }}] — write pxelinux.cfg + /ip tftp row"
  delegate_to: "{{ armbian_netboot_router }}"
  block:
    - name: "boot_mode[{{ armbian_netboot_boot_mode }}] — include routeros_pxe_config"
      ansible.builtin.include_role:
        name: routeros_pxe_config
      vars:
        _target_host: "{{ inventory_hostname }}"

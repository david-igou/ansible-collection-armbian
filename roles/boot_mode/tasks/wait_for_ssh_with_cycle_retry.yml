---
# Second-layer retry for the post-boot SSH wait.
#
# After the first-layer cold_boot_with_retry succeeds (board's TCP/22
# + sustained ssh-ping passed), this file wraps the longer
# wait_for_connection in a block/rescue so that a late-falling board
# triggers another cold cycle and one more attempt.
#
# Bounded retry — one extra cycle-and-wait at this layer. If the board
# is genuinely too sick to come up cleanly after both the first-layer
# retry and a fresh cycle, that's a hardware issue to investigate.
#
# Inputs (vars from caller):
#   _phase_label    human label
#   _wait_timeout   post-boot wait_for_connection timeout

- name: "{{ _phase_label }} — wait for SSH (with cycle retry on failure)"
  block:
    - name: "{{ _phase_label }} — wait for SSH (first attempt)"
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: "{{ _wait_timeout }}"

  rescue:
    - name: "{{ _phase_label }} — SSH wait failed, cycle and retry"
      ansible.builtin.debug:
        msg: >-
          {{ _phase_label }}: post-boot SSH wait failed (typical mode:
          board passed the first-layer retry check then fell off the
          network during the longer wait_for_connection window).
          PoE-cycling the board via cold_boot_with_retry, then trying
          the SSH wait one more time.

    - name: "{{ _phase_label }} — capture nested-cycle label"
      ansible.builtin.set_fact:
        _ssh_retry_label: "{{ _phase_label }} SSH-wait retry"

    - name: "{{ _phase_label }} — second-layer cold cycle"
      ansible.builtin.include_tasks: cold_boot_with_retry.yml
      vars:
        _phase_label: "{{ _ssh_retry_label }}"
        _boot_max_attempts: "{{ armbian_netboot_ssh_wait_retry_attempts | default(armbian_netboot_boot_retry_attempts) | int + 1 }}"

    - name: "{{ _phase_label }} — wait for SSH (second attempt, post cycle)"
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: "{{ _wait_timeout }}"

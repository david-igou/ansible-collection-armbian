---
# Two-layer retry around the cold boot:
#   Layer 1 (cold_boot_with_retry.yml): PoE cycle + wait_for TCP/22 +
#     sustained ssh-ping, retried up to boot_retry_attempts+1 times.
#   Layer 2 (wait_for_ssh_with_cycle_retry.yml): post-boot
#     wait_for_connection with one additional PoE-cycle-and-retry on
#     failure.
# See docs/retry-configuration.md "How the two retry layers interact"
# for the failure-mode rationale.

- name: "boot_mode[{{ armbian_netboot_boot_mode }}] — layer 1 (cold boot with retry)"
  ansible.builtin.include_tasks: cold_boot_with_retry.yml
  vars:
    _phase_label: "boot_mode[{{ armbian_netboot_boot_mode }}]"
    _boot_max_attempts: "{{ armbian_netboot_boot_retry_attempts | int + 1 }}"

- name: "boot_mode[{{ armbian_netboot_boot_mode }}] — layer 2 (post-boot SSH wait with cycle retry)"
  ansible.builtin.include_tasks: wait_for_ssh_with_cycle_retry.yml
  vars:
    _phase_label: "boot_mode[{{ armbian_netboot_boot_mode }}]"
    _wait_timeout: "{{ armbian_netboot_post_boot_wait_timeout }}"

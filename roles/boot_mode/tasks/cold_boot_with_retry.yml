---
# Reusable cold-boot-with-retry sequence.
#
# Wraps a routeros_poe cycle + wait_for TCP/22 in a retry loop. The
# dominant failure mode in #38 is "board didn't come up after PoE
# cycle" — recurrence ~30-40 % on marginal PoE-HATs. Retrying the
# cold boot converts the dominant hard-fail into eventually-consistent
# automation.
#
# Inputs (vars from caller):
#   _phase_label         human label (e.g. "boot_mode[nfs]")
#   _boot_max_attempts   total attempts incl. first; 1 = no retry,
#                        2 = one retry, etc.
#
# Outputs:
#   _boot_succeeded      fact set true if any attempt succeeded.
#                        Asserted at the end of this file.

- name: "{{ _phase_label }} — initialize boot tracking"
  ansible.builtin.set_fact:
    _boot_succeeded: false

- name: "{{ _phase_label }} — attempt boot ({{ _boot_max_attempts }} max)"
  ansible.builtin.include_tasks: cold_boot_single_attempt.yml
  loop: "{{ range(1, _boot_max_attempts | int + 1) | list }}"
  loop_control:
    loop_var: _attempt_num
    label: "{{ _phase_label }} attempt {{ _attempt_num }}/{{ _boot_max_attempts }}"
  when: not _boot_succeeded

- name: "{{ _phase_label }} — assert boot succeeded"
  ansible.builtin.assert:
    that: _boot_succeeded
    fail_msg: >-
      {{ _phase_label }} cold boot failed after {{ _boot_max_attempts }}
      attempt(s). Each attempt = routeros_poe cycle (off →
      armbian_netboot_poe_cycle_delay drain → on) + wait_for TCP/22
      ({{ armbian_netboot_boot_attempt_timeout | default(180) }}s timeout).
      Either raise armbian_netboot_boot_retry_attempts (if iters are
      hardware-flaky but eventually consistent), raise
      armbian_netboot_boot_attempt_timeout (if your board genuinely takes
      longer to come up), or investigate the underlying boot stall
      (serial trace, board hardware, PSU sufficiency).

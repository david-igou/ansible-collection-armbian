---
# Rootfs assertion. Gathers facts, captures the / mount, and asserts:
#   armbian_netboot_boot_mode == nfs → fstype is nfs|nfs4
#   armbian_netboot_boot_mode == sd  → fstype is not nfs, device matches /dev/<block>

- name: "boot_mode[{{ armbian_netboot_boot_mode }}] verify — gather facts"
  ansible.builtin.setup:

- name: "boot_mode[{{ armbian_netboot_boot_mode }}] verify — capture root mount"
  ansible.builtin.set_fact:
    _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                     | map(attribute='fstype') | first }}"
    _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                     | map(attribute='device') | first }}"

- name: "boot_mode[nfs] verify — assert NFS rootfs"
  when: armbian_netboot_boot_mode == 'nfs'
  ansible.builtin.assert:
    that:
      - _root_fstype in ['nfs', 'nfs4']
    fail_msg: >-
      boot_mode[nfs]: expected NFS rootfs after PoE cycle but got
      {{ _root_device }} ({{ _root_fstype }}). pxelinux.cfg was written
      to {{ armbian_netboot_router }} with default=nfs (converge.yml
      succeeded), so the board's PXE bootflow either skipped pxelinux.cfg
      or fell through to local boot. Check {{ armbian_netboot_router }}'s
      /ip tftp hit counters and recent tftp,error log entries for clues.

- name: "boot_mode[sd] verify — assert local block device rootfs"
  when: armbian_netboot_boot_mode == 'sd'
  ansible.builtin.assert:
    that:
      - _root_fstype not in ['nfs', 'nfs4']
      - _root_device is match('^/dev/')
    fail_msg: >-
      boot_mode[sd]: expected local block device rootfs (/dev/<block>)
      after PoE cycle but got {{ _root_device }} ({{ _root_fstype }}).
      pxelinux.cfg was written to {{ armbian_netboot_router }} with
      default=sd (converge.yml succeeded), so the board should have
      booted the sd label. Check that armbian_netboot_sd_root (if set
      as a host-level override) resolves to a partition the board can
      mount, and that the SD card is healthy. Default cmdline is
      root=LABEL=armbi_root; if multiple drives carry that label the
      kernel may pick the wrong one.

---
# Writes the per-board pxelinux.cfg file to flash:/{{ sbc_tftp_flash_dir }}/
# pxelinux.cfg/01-<MAC> on rb5009, registers a /ip tftp row for it.
# Designed to be run from a play with hosts: routeros_routers,
# gather_facts: false.
#
# Required variables:
#   board_mac          MAC address of the board (drives 01-<mac> filename)
#   board_model        board model key (drives kernel/initrd/dtb paths
#                      embedded in the rendered template)
#   target_board_host  inventory hostname (drives nfsroot path + label)

- name: Load board configs
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/boards.yml"
  tags: pxelinux

- name: Compute pxelinux.cfg filename for {{ target_board_host }}
  ansible.builtin.set_fact:
    _pxe_filename: "01-{{ board_mac | lower | replace(':', '-') }}"
  tags: pxelinux

# pxelinux_verbose=true requires per-board earlycon metadata. Without
# it the rendered APPEND line ends up with an empty `earlycon=` arg,
# which the kernel silently ignores and the operator never sees the
# diagnostics they asked for. Assert here so it fails loudly at render
# time, with a pointer to vars/boards.yml.
- name: Resolve effective verbose flag for {{ target_board_host }}
  ansible.builtin.set_fact:
    _pxe_verbose: >-
      {{ (hostvars[target_board_host].pxelinux_verbose
          | default(pxelinux_verbose | default(false)))
         | bool }}
  tags: pxelinux

- name: Assert per-board earlycon is defined when pxelinux_verbose is true
  ansible.builtin.assert:
    that:
      - board_configs[board_model].earlycon is defined
      - board_configs[board_model].earlycon | length > 0
    fail_msg: >-
      pxelinux_verbose=true was requested for {{ target_board_host }}
      ({{ board_model }}) but board_configs.{{ board_model }}.earlycon is
      not set in vars/boards.yml. Add it (format: <driver>,<bus>,<mmio_addr>,
      e.g. uart8250,mmio32,0xfeb50000 for RK3588S UART2) or unset
      pxelinux_verbose for this board.
  when: _pxe_verbose | bool
  tags: pxelinux

- name: Ensure local pxelinux.cfg cache directory exists on control node
  ansible.builtin.file:
    path: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  tags: pxelinux

- name: Render pxelinux.cfg locally for {{ target_board_host }}
  ansible.builtin.template:
    src: "{{ role_path }}/templates/pxelinux_cfg.j2"
    dest: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  tags: pxelinux

- name: Stat rendered pxelinux.cfg locally
  ansible.builtin.stat:
    path: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
  delegate_to: localhost
  become: false
  register: _pxe_local_stat
  tags: pxelinux

# Each routeros-targeted task below is preceded by an explicit
# `meta: reset_connection`, forcing a fresh persistent-connection
# daemon for every command. Iter 12 (#38) showed that PR #46's
# role-entry reset wasn't enough — the daemon can die *between* tasks
# inside a routeros burst (paramiko disconnect, RouterOS-side idle
# eviction, OOM, etc.) and the existing per-task `retries:3
# until:succeeded` guards only cover module-level failures, not
# connection-establishment failures (`ConnectionRefusedError [Errno
# 111]` on `~/.ansible/pc/<id>`). Resetting per-task makes every
# command start with a known-fresh daemon — the daemon only has to
# survive one command instead of a burst, eliminating the inherited-
# dead-daemon failure class entirely. Cost: ~1 s per reset × 5 tasks
# = ~5 s additional latency per write. Acceptable.
- name: Reset persistent connection before pxelinux dir ensure
  ansible.builtin.meta: reset_connection

- name: Ensure pxelinux.cfg directory exists on rb5009 under flash:/{{ sbc_tftp_flash_dir }}
  community.routeros.command:
    commands:
      - >-
        :if ([/file find name="{{ sbc_tftp_flash_dir }}/pxelinux.cfg" type=directory] = "")
        do={/file add name="{{ sbc_tftp_flash_dir }}/pxelinux.cfg" type=directory}
  register: _pxe_dir_ensure
  retries: 3
  delay: 5
  until: _pxe_dir_ensure is succeeded
  changed_when: false
  tags: pxelinux

- name: Reset persistent connection before pxelinux size check
  ansible.builtin.meta: reset_connection

- name: Count router-side pxelinux.cfg matching local size
  community.routeros.command:
    commands:
      - >-
        /file print count-only where
        name="{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
        and size={{ _pxe_local_stat.stat.size }}
  register: _pxe_size_match
  retries: 3
  delay: 5
  until: _pxe_size_match is succeeded
  changed_when: false
  tags: pxelinux

- name: Reset persistent connection before pxelinux net_put
  ansible.builtin.meta: reset_connection
  when: (_pxe_size_match.stdout[0] | trim | int) == 0

- name: Upload pxelinux.cfg to rb5009 if size differs
  ansible.netcommon.net_put:
    src: "{{ sbc_tftp_cache_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
    dest: "{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
  vars:
    ansible_command_timeout: 60
  register: _pxe_net_put
  retries: 3
  delay: 5
  until: _pxe_net_put is succeeded
  when: (_pxe_size_match.stdout[0] | trim | int) == 0
  tags: pxelinux

# req-filename uses a permissive regex (".*<filename>") instead of the
# literal "pxelinux.cfg/<filename>". RouterOS' /ip tftp matches req-filename
# as a regex against the wire-level TFTP request, and U-Boot's PXE bootmeth
# sends a path that doesn't string-match the literal "pxelinux.cfg/01-<mac>"
# even though that's what U-Boot prints to the console (verified via TFTP
# logs: HITS=0 with the literal rule, requests succeed once the regex is
# permissive). Per-model rules (armbian/<model>/{vmlinuz,initrd,dtb}) are
# fetched relative to the pxelinux.cfg URL and do match their literal
# req-filename, so they're untouched. The MAC-bearing filename is unique
# enough that an end-anchor is unnecessary — and "$" must be avoided
# because RouterOS' shell interprets "$" inside double-quoted strings as
# a variable reference, mangling the rule (req-filename and real-filename
# get concatenated, real-filename ends up empty).
- name: Reset persistent connection before /ip tftp count
  ansible.builtin.meta: reset_connection

- name: Count /ip tftp rows for {{ _pxe_filename }}
  community.routeros.command:
    commands:
      - >-
        /ip tftp print count-only where
        req-filename=".*{{ _pxe_filename }}"
        and real-filename="{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
  register: _pxe_tftp_count
  retries: 3
  delay: 5
  until: _pxe_tftp_count is succeeded
  changed_when: false
  tags: pxelinux

- name: Reset persistent connection before /ip tftp add
  ansible.builtin.meta: reset_connection
  when: (_pxe_tftp_count.stdout[0] | trim | int) == 0

- name: Add /ip tftp row (if absent) for board {{ _pxe_filename }}
  community.routeros.command:
    commands:
      - >-
        /ip tftp add
        req-filename=".*{{ _pxe_filename }}"
        real-filename="{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"
        allow=yes read-only=yes
  register: _pxe_tftp_add
  retries: 3
  delay: 5
  until: _pxe_tftp_add is succeeded
  when: (_pxe_tftp_count.stdout[0] | trim | int) == 0
  changed_when: true
  tags: pxelinux

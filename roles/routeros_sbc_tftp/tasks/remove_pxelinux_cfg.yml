---
# Removes the per-board pxelinux.cfg /ip tftp row + flash file from
# rb5009. Sibling to write_pxelinux_cfg.yml.
#
# Order: /ip tftp remove BEFORE /file remove. Mid-teardown failure
# fails closed (no row → no serve), so a board mid-decommission can't
# accidentally reach a stale config.
#
# Required variables:
#   board_mac          MAC address (drives 01-<mac> filename)
#   target_board_host  inventory hostname (label only; logging)
#
# Run from a play with hosts: routeros_routers, gather_facts: false.

- name: Compute pxelinux.cfg filename for {{ target_board_host }}
  ansible.builtin.set_fact:
    _pxe_filename: "01-{{ board_mac | lower | replace(':', '-') }}"
  tags: pxelinux

# Per-task `meta: reset_connection` mirrors the pattern in
# write_pxelinux_cfg.yml — see the comment block there for the
# rationale (iter 12 #38: PR #46's role-entry reset wasn't enough,
# the daemon can die mid-burst and module-level retries don't catch
# connection-establishment failures).
- name: Reset persistent connection before /ip tftp remove
  ansible.builtin.meta: reset_connection

- name: Remove /ip tftp row for {{ _pxe_filename }}
  community.routeros.command:
    commands:
      - >-
        /ip tftp remove [find req-filename=".*{{ _pxe_filename }}"]
  register: _pxe_tftp_rm
  retries: 3
  delay: 5
  until: _pxe_tftp_rm is succeeded
  changed_when: false  # idempotent — RouterOS returns no output when find is empty
  tags: pxelinux

- name: Reset persistent connection before /file remove
  ansible.builtin.meta: reset_connection

- name: Remove pxelinux.cfg flash file for board {{ _pxe_filename }}
  community.routeros.command:
    commands:
      - >-
        /file remove [find name="{{ sbc_tftp_flash_dir }}/pxelinux.cfg/{{ _pxe_filename }}"]
  register: _pxe_file_rm
  retries: 3
  delay: 5
  until: _pxe_file_rm is succeeded
  changed_when: false  # idempotent — same as above
  tags: pxelinux

---
- name: Validate the inputs
  ansible.builtin.import_tasks: _validate.yml

- name: Create the cache entry directory
  ansible.builtin.file:
    path: "{{ __rootfs_provision_img_xz | dirname }}"
    state: directory
    mode: "0755"

# Runs every time. With a checksum get_url only downloads on a mismatch;
# without one, force makes it revalidate the cached copy (If-Modified-Since
# for http, a content compare for a local path) so a republished image at
# the same source is picked up.
- name: Fetch the source image into the cache
  ansible.builtin.get_url:
    url: "{{ rootfs_provision_src if __rootfs_provision_src_is_url else 'file://' ~ rootfs_provision_src }}"
    dest: "{{ __rootfs_provision_img_xz }}"
    checksum: "{{ rootfs_provision_checksum }}"
    force: "{{ rootfs_provision_checksum | length == 0 }}"
    mode: "0644"
    timeout: 600

- name: Hash the cached image
  ansible.builtin.stat:
    path: "{{ __rootfs_provision_img_xz }}"
    checksum_algorithm: sha256
  register: __rootfs_provision_img_stat

- name: Stat the provision sentinel
  ansible.builtin.stat:
    path: "{{ __rootfs_provision_sentinel }}"
  register: __rootfs_provision_sentinel_stat

- name: Read the provision sentinel
  ansible.builtin.slurp:
    src: "{{ __rootfs_provision_sentinel }}"
  register: __rootfs_provision_sentinel_raw
  when: __rootfs_provision_sentinel_stat.stat.exists

- name: Decide whether the target is already provisioned from this image
  ansible.builtin.set_fact:
    __rootfs_provision_current: >-
      {{ not rootfs_provision_force | bool
         and __rootfs_provision_previous.src | default('') == rootfs_provision_src
         and __rootfs_provision_previous.image_sha256 | default('') == __rootfs_provision_img_stat.stat.checksum
         and __rootfs_provision_previous.hostname | default('') == rootfs_provision_hostname }}
  vars:
    __rootfs_provision_previous: >-
      {{ __rootfs_provision_sentinel_raw.content | b64decode | from_json
         if __rootfs_provision_sentinel_stat.stat.exists else {} }}

- name: Extract the rootfs and stage the boot files
  ansible.builtin.import_tasks: _extract.yml
  when: not __rootfs_provision_current

- name: Reset the host identity in the rootfs
  ansible.builtin.import_tasks: _identity.yml
  when: not __rootfs_provision_current

- name: Write the provision sentinel
  ansible.builtin.copy:
    dest: "{{ __rootfs_provision_sentinel }}"
    content: "{{ __rootfs_provision_sentinel_data | to_nice_json(sort_keys=true) }}\n"
    mode: "0644"
  vars:
    __rootfs_provision_sentinel_data:
      src: "{{ rootfs_provision_src }}"
      image_sha256: "{{ __rootfs_provision_img_stat.stat.checksum }}"
      hostname: "{{ rootfs_provision_hostname }}"
      provisioned_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  when: not __rootfs_provision_current

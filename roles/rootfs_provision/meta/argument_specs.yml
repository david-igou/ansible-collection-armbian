---
argument_specs:
  main:
    short_description: Provision a per-host NFS rootfs and TFTP boot files from an .img.xz
    description:
      - >-
        Fetches the image into a cache keyed by the source string, and unless
        the target's sentinel already records the same source, image sha256 and
        hostname, extracts the image's largest partition into
        O(rootfs_provision_target_dir) with C(rsync --delete), removes C(/dev/)
        entries from its C(/etc/fstab), stages C(vmlinuz), C(initrd.img) and
        optionally C(board.dtb) into O(rootfs_provision_tftp_dir), resets the
        host identity (hostname, C(/etc/hosts), machine-id, SSH host keys,
        Armbian first-login prompt) and writes the sentinel
        C(.rootfs_provision.json) in the target.
      - >-
        Runs as root on the host that exports the NFS rootfs. Needs xz,
        losetup, lsblk, udevadm, rsync and ssh-keygen there, and gathers the
        C(mounts) fact subset itself. Refuses a target directory that is a
        mountpoint. Not check-mode safe. Sets no facts.
    options:
      rootfs_provision_src:
        type: str
        required: true
        description:
          - The C(.img.xz) to provision from, an http(s) URL or an absolute path on the host.
      rootfs_provision_checksum:
        type: str
        default: ""
        description:
          - Passed to C(ansible.builtin.get_url) as C(checksum), for example C(sha256:https://host/image.img.xz.sha).
          - When empty, the cached image is revalidated on every run (If-Modified-Since for a URL, a content
            compare for a path).
      rootfs_provision_hostname:
        type: str
        required: true
        description:
          - Hostname written into the rootfs.
      rootfs_provision_target_dir:
        type: path
        required: true
        description:
          - Per-host NFS rootfs directory. Its contents are replaced by the image's.
      rootfs_provision_tftp_dir:
        type: path
        required: true
        description:
          - Per-host directory that receives C(vmlinuz), C(initrd.img) and C(board.dtb).
      rootfs_provision_cache_dir:
        type: path
        required: true
        description:
          - Download cache. The image is kept at C(<cache_dir>/<sha256 of src>/<basename of src>).
      rootfs_provision_dtb:
        type: str
        default: ""
        description:
          - DTB path relative to the image's DTB directory, for example C(rockchip/rk3588-rock-5b.dtb), staged as
            C(board.dtb). It is looked up under C(boot/dtb/), C(boot/dtbs/), C(boot/dtb-*/) and C(boot/dtbs/*/).
          - Empty stages no DTB and removes a previously staged one.
      rootfs_provision_mount_dir:
        type: path
        default: /mnt/rootfs_provision
        description:
          - Where the image's root partition is mounted read-only during extraction.
      rootfs_provision_force:
        type: bool
        default: false
        description:
          - Re-extract even when the sentinel matches.

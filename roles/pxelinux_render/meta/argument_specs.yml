---
argument_specs:
  main:
    short_description: Render one board's pxelinux.cfg to a local directory.
    description:
      - Writes C(01-<mac>) with a label for every boot mode (C(nfs), C(sd), C(local),
        C(local_kernel) and each key of C(pxelinux_render_extra_modes)) and a C(default)
        line selecting C(pxelinux_render_boot_mode). Never uploads; the caller moves the
        file to its TFTP server.
      - Usually run with C(delegate_to=localhost) inside a play on the boards, so each
        board's variables are in scope.
      - Sets the facts C(pxelinux_render_file) (full path of the rendered file) and
        C(pxelinux_render_filename) (C(01-<mac>)).
    options:
      pxelinux_render_board_mac:
        description: Board MAC address; the file is named C(01-<mac>), lower case with dashes.
        type: str
        required: true
      pxelinux_render_boot_mode:
        description:
          - Label selected by the C(default) line. C(nfs), C(sd), C(local), C(local_kernel)
            or a key of C(pxelinux_render_extra_modes).
          - C(local_kernel) is a C(localboot 0) label; U-Boot's C(localcmd) decides what boots.
        type: str
        required: true
      pxelinux_render_console:
        description: Kernel C(console=) value, for example C(ttyS2,1500000).
        type: str
        required: true
      pxelinux_render_earlycon:
        description: Kernel C(earlycon=) value. Required when C(pxelinux_render_pxe_verbose) is true.
        type: str
        default: ""
      pxelinux_render_board_name:
        description: Board name shown in the file's header comment. Omitted when empty.
        type: str
        default: ""
      pxelinux_render_nfs_server_ip:
        description: NFS server address written into C(nfsroot=).
        type: str
        required: true
      pxelinux_render_nfs_root_path:
        description: NFS export root; the board's root is C(<path>/<pxelinux_render_hostname>).
        type: str
        required: true
      pxelinux_render_nfs_version:
        description: NFS protocol version written as C(nfsvers=).
        type: int
        default: 3
      pxelinux_render_hostname:
        description: Board name used for the per-host NFS directory and the menu labels.
        type: str
        required: true
      pxelinux_render_output_dir:
        description: Local directory the file is written to.
        type: path
        required: true
      pxelinux_render_extra_modes:
        description:
          - Additional labels, keyed by label name. Each value has C(menu_label), C(root),
            optional C(rootfstype) (default C(ext4)) and optional C(extra_append).
        type: dict
        default: {}
      pxelinux_render_sd_root:
        description: C(root=) argument of the C(sd) label.
        type: str
        default: LABEL=armbi_root
      pxelinux_render_local_root:
        description: C(root=) argument of the C(local) label; must match the label C(disk_provision) writes.
        type: str
        default: LABEL=armbi_root_local
      pxelinux_render_pxe_verbose:
        description: Append C(earlycon) and verbose kernel and systemd logging arguments to every kernel label.
        type: bool
        default: false
      pxelinux_render_tftp_kernel:
        description: TFTP path of the kernel.
        type: str
        default: armbian/{{ inventory_hostname }}/vmlinuz
      pxelinux_render_tftp_initrd:
        description: TFTP path of the initrd.
        type: str
        default: armbian/{{ inventory_hostname }}/initrd.img
      pxelinux_render_tftp_dtb:
        description: TFTP path of the device tree. Empty renders no C(fdt) line.
        type: str
        default: armbian/{{ inventory_hostname }}/board.dtb

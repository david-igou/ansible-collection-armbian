---
pxelinux_render_earlycon: ""
pxelinux_render_board_name: ""
pxelinux_render_extra_modes: {}
pxelinux_render_nfs_version: 3
pxelinux_render_sd_root: LABEL=armbi_root
# Must match the label disk_provision writes.
pxelinux_render_local_root: LABEL=armbi_root_local
pxelinux_render_pxe_verbose: false
# TFTP-relative paths the board requests, not paths on the rendering host.
pxelinux_render_tftp_kernel: "armbian/{{ inventory_hostname }}/vmlinuz"
pxelinux_render_tftp_initrd: "armbian/{{ inventory_hostname }}/initrd.img"
# Empty renders no fdt line (boards without a device tree).
pxelinux_render_tftp_dtb: "armbian/{{ inventory_hostname }}/board.dtb"

---
# Render-time knobs. All inputs that have inventory-level analogues
# default to undefined here and are validated as required in argspec.
#
# v4.0.0 breaking change: every external pxelinux_render variable
# is now `pxelinux_render_*`-prefixed. Callers must update their
# `vars:` blocks accordingly. See the role README for the full table.

# Per-board kernel command-line knob: which device specifier the
# kernel uses to find the root filesystem when booting from local SD.
# Default LABEL=armbi_root works for stock Armbian; per-host overrides
# (PARTUUID=, UUID=, PARTLABEL=) handle multi-drive boards.
pxelinux_render_sd_root: "LABEL=armbi_root"

# Per-host kernel command-line knob: which device specifier the
# kernel uses to find the root filesystem when pxelinux_render_boot_mode=local.
# Default LABEL=armbi_root_local matches disk_provision's default
# label; override per-host (UUID=, PARTUUID=, PARTLABEL=) when needed.
pxelinux_render_local_root: "LABEL=armbi_root_local"

# When true, append earlycon + verbose kernel params to both labels.
pxelinux_render_pxe_verbose: false

# Required when pxelinux_render_pxe_verbose=true.
# Format: <driver>,<bus>,<mmio_addr>.
pxelinux_render_earlycon: ""

# TFTP-relative paths written verbatim into pxelinux.cfg. These are
# strings the netboot client passes to the TFTP server — not local FS
# paths on the rendering host. Defaults assume armbian/<model>/<file>.
pxelinux_render_tftp_kernel: "armbian/{{ pxelinux_render_model_name }}/vmlinuz"
pxelinux_render_tftp_initrd: "armbian/{{ pxelinux_render_model_name }}/initrd.img"
pxelinux_render_tftp_dtb: "armbian/{{ pxelinux_render_model_name }}/board.dtb"

# User-defined extra boot modes. Each key becomes a pxelinux label
# coexisting with nfs/sd/local. Empty by default.
pxelinux_render_extra_modes: {}

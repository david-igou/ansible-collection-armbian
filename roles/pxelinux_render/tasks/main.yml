---
- name: "Validate pxelinux_render_boot_mode is built-in or in pxelinux_render_extra_modes"
  ansible.builtin.assert:
    that:
      - pxelinux_render_boot_mode in (['nfs', 'sd', 'local', 'local_kernel'] + (pxelinux_render_extra_modes | default({}) | dict2items | map(attribute='key') | list))
    fail_msg: >-
      pxelinux_render_boot_mode={{ pxelinux_render_boot_mode }} is not valid. Must be one of
      nfs|sd|local|local_kernel or a key in pxelinux_render_extra_modes.
      Defined extra_modes keys:
      {{ pxelinux_render_extra_modes | default({}) | dict2items | map(attribute='key') | list }}.

- name: Validate pxelinux_render_earlycon is set when pxelinux_render_pxe_verbose is true
  ansible.builtin.assert:
    that:
      - pxelinux_render_earlycon | length > 0
    fail_msg: >-
      pxelinux_render_pxe_verbose=true was requested but
      pxelinux_render_earlycon was not supplied. Set it to
      <driver>,<bus>,<mmio_addr> (e.g. uart8250,mmio32,0xfeb50000
      for RK3588S UART2) or unset pxelinux_render_pxe_verbose.
  when: pxelinux_render_pxe_verbose | bool

- name: Compute pxelinux filename
  ansible.builtin.set_fact:
    __pxelinux_render_pxe_filename: "01-{{ pxelinux_render_board_mac | lower | replace(':', '-') }}"

- name: Ensure pxelinux_render_output_dir exists
  ansible.builtin.file:
    path: "{{ pxelinux_render_output_dir }}"
    state: directory
    mode: "0755"

- name: Render pxelinux.cfg for {{ pxelinux_render_hostname }}
  ansible.builtin.template:
    src: pxelinux_cfg.j2
    dest: "{{ pxelinux_render_output_dir }}/{{ __pxelinux_render_pxe_filename }}"
    mode: "0644"

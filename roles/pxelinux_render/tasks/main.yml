---
- name: Assert the boot mode and verbose inputs are consistent
  ansible.builtin.assert:
    that:
      - pxelinux_render_boot_mode in __pxelinux_render_modes
      - not pxelinux_render_pxe_verbose or pxelinux_render_earlycon | length > 0
    fail_msg: >-
      pxelinux_render_boot_mode must be one of {{ __pxelinux_render_modes | join(', ') }}
      (got {{ pxelinux_render_boot_mode }}), and pxelinux_render_pxe_verbose needs
      pxelinux_render_earlycon (e.g. uart8250,mmio32,0xfeb50000).
    quiet: true

- name: Ensure the output directory exists
  ansible.builtin.file:
    path: "{{ pxelinux_render_output_dir }}"
    state: directory
    mode: "0755"

- name: Render the pxelinux.cfg
  ansible.builtin.template:
    src: pxelinux_cfg.j2
    dest: "{{ pxelinux_render_output_dir }}/{{ __pxelinux_render_filename }}"
    mode: "0644"

- name: Publish the rendered file path
  ansible.builtin.set_fact:
    pxelinux_render_filename: "{{ __pxelinux_render_filename }}"
    pxelinux_render_file: "{{ pxelinux_render_output_dir }}/{{ __pxelinux_render_filename }}"

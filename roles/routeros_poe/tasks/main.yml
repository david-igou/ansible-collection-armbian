---
# Controls PoE power state on a RouterOS switch port connected to an
# Armbian board. Delegates to the switch identified by poe_switch.
#
# Required host variables: poe_switch, poe_port
# Role variable: poe_action (on|off|cycle)

- name: Validate required PoE host variables
  ansible.builtin.assert:
    that:
      - poe_switch is defined
      - poe_switch | length > 0
      - poe_port is defined
      - poe_port | length > 0
    fail_msg: >-
      poe_switch and poe_port must be defined as host variables.
      Set them in inventory for {{ inventory_hostname }}.
  tags: poe

- name: Validate poe_action
  ansible.builtin.assert:
    that:
      - poe_action in ['on', 'off', 'cycle']
    fail_msg: "poe_action must be 'on', 'off', or 'cycle'. Got: '{{ poe_action }}'"
  tags: poe

# Retry guards on each routeros command — network_cli persistent connections
# to RouterOS drop intermittently mid-play; one transient drop should not
# fail a PoE cycle. See routeros_dhcp/write_pxelinux_cfg.yml for the failure
# modes documented from hardware testing.
- name: Power on PoE port
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ poe_port }}"] poe-out=auto'
  delegate_to: "{{ poe_switch }}"
  register: _poe_on
  retries: 3
  delay: 5
  until: _poe_on is succeeded
  when: poe_action == 'on'
  tags: poe

- name: Power off PoE port
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ poe_port }}"] poe-out=off'
  delegate_to: "{{ poe_switch }}"
  register: _poe_off
  retries: 3
  delay: 5
  until: _poe_off is succeeded
  when: poe_action == 'off'
  tags: poe

- name: Power cycle — disable PoE on {{ poe_port }}
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ poe_port }}"] poe-out=off'
  delegate_to: "{{ poe_switch }}"
  register: _poe_cycle_off
  retries: 3
  delay: 5
  until: _poe_cycle_off is succeeded
  when: poe_action == 'cycle'
  tags: poe

- name: Power cycle — wait for capacitors to drain
  ansible.builtin.pause:
    seconds: "{{ poe_cycle_delay }}"
  when: poe_action == 'cycle'
  tags: poe

- name: Power cycle — re-enable PoE on {{ poe_port }}
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ poe_port }}"] poe-out=auto'
  delegate_to: "{{ poe_switch }}"
  register: _poe_cycle_on
  retries: 3
  delay: 5
  until: _poe_cycle_on is succeeded
  when: poe_action == 'cycle'
  tags: poe

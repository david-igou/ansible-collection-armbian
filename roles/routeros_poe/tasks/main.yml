---
# Controls PoE power state on a RouterOS switch port connected to an
# Armbian board. Delegates to the switch identified by armbian_netboot_poe_switch.
#
# Required host variables: armbian_netboot_poe_switch, armbian_netboot_poe_port
# Role variable: armbian_netboot_poe_action (on|off|cycle)

- name: Validate required PoE host variables
  ansible.builtin.assert:
    that:
      - armbian_netboot_poe_switch is defined
      - armbian_netboot_poe_switch | length > 0
      - armbian_netboot_poe_port is defined
      - armbian_netboot_poe_port | length > 0
    fail_msg: >-
      armbian_netboot_poe_switch and armbian_netboot_poe_port must be defined as host variables.
      Set them in inventory for {{ inventory_hostname }}.
  tags: poe

- name: Validate armbian_netboot_poe_action
  ansible.builtin.assert:
    that:
      - armbian_netboot_poe_action in ['on', 'off', 'cycle']
    fail_msg: "armbian_netboot_poe_action must be 'on', 'off', or 'cycle'. Got: '{{ armbian_netboot_poe_action }}'"
  tags: poe

# Retry guards on each routeros command — network_cli persistent connections
# to RouterOS drop intermittently mid-play; one transient drop should not
# fail a PoE cycle. See routeros_pxe_config/tasks/main.yml for the failure
# modes documented from hardware testing.
- name: Power on PoE port
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ armbian_netboot_poe_port }}"] poe-out=auto'
  delegate_to: "{{ armbian_netboot_poe_switch }}"
  register: _poe_on
  retries: 3
  delay: 5
  until: _poe_on is succeeded
  when: armbian_netboot_poe_action == 'on'
  tags: poe

- name: Power off PoE port
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ armbian_netboot_poe_port }}"] poe-out=off'
  delegate_to: "{{ armbian_netboot_poe_switch }}"
  register: _poe_off
  retries: 3
  delay: 5
  until: _poe_off is succeeded
  when: armbian_netboot_poe_action == 'off'
  tags: poe

- name: Power cycle — disable PoE on {{ armbian_netboot_poe_port }}
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ armbian_netboot_poe_port }}"] poe-out=off'
  delegate_to: "{{ armbian_netboot_poe_switch }}"
  register: _poe_cycle_off
  retries: 3
  delay: 5
  until: _poe_cycle_off is succeeded
  when: armbian_netboot_poe_action == 'cycle'
  tags: poe

- name: Power cycle — wait for capacitors to drain
  ansible.builtin.pause:
    seconds: "{{ armbian_netboot_poe_cycle_delay }}"
  when: armbian_netboot_poe_action == 'cycle'
  tags: poe

- name: Power cycle — re-enable PoE on {{ armbian_netboot_poe_port }}
  community.routeros.command:
    commands:
      - '/interface ethernet poe set [find name="{{ armbian_netboot_poe_port }}"] poe-out=auto'
  delegate_to: "{{ armbian_netboot_poe_switch }}"
  register: _poe_cycle_on
  retries: 3
  delay: 5
  until: _poe_cycle_on is succeeded
  when: armbian_netboot_poe_action == 'cycle'
  tags: poe

---
- name: Gather facts
  ansible.builtin.setup:

- name: Capture root mount
  ansible.builtin.set_fact:
    _root_fstype: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                     | map(attribute='fstype') | first }}"
    _root_device: "{{ ansible_mounts | selectattr('mount', 'equalto', '/')
                                     | map(attribute='device') | first }}"

- name: Assert NFS rootfs when boot_mode=nfs
  ansible.builtin.assert:
    that:
      - _root_fstype in ['nfs', 'nfs4']
    fail_msg: >-
      boot_mode[nfs]: expected NFS rootfs but got
      {{ _root_device }} ({{ _root_fstype }}). The pxelinux.cfg upload
      step succeeded, so the board either skipped pxelinux.cfg or fell
      through to local boot. Check the TFTP server's request log.
  when: boot_mode == 'nfs'

- name: Assert local block-device rootfs when boot_mode=sd
  ansible.builtin.assert:
    that:
      - _root_fstype not in ['nfs', 'nfs4']
      - _root_device is match('^/dev/')
    fail_msg: >-
      boot_mode[sd]: expected local block device rootfs but got
      {{ _root_device }} ({{ _root_fstype }}). Default kernel cmdline
      is root=LABEL=armbi_root; override per-host with sd_root if the
      board has multiple drives carrying LABEL=armbi_root.
  when: boot_mode == 'sd'

- name: Assert local block-device rootfs when boot_mode=local
  ansible.builtin.assert:
    that:
      - _root_fstype not in ['nfs', 'nfs4']
      - _root_device is match('^/dev/')
    fail_msg: >-
      boot_mode[local]: expected local block device rootfs but got
      {{ _root_device }} ({{ _root_fstype }}). Default kernel cmdline
      is root=LABEL=armbi_root_local; override per-host with local_root
      if disk_provision used a different label. If you got an NFS
      rootfs, the kernel couldn't find the labeled partition — verify
      the target disk was provisioned via provision_local_disk.yml.
  when: boot_mode == 'local'

- name: Assert NVMe rootfs when boot_mode=local_kernel
  ansible.builtin.assert:
    that:
      - _root_fstype not in ['nfs', 'nfs4']
      - _root_device is match('^/dev/nvme')
    fail_msg: >-
      boot_mode[local_kernel]: expected NVMe rootfs but got
      {{ _root_device }} ({{ _root_fstype }}). The local_kernel label
      runs `localboot 0`, which executes U-Boot's `localcmd`. If
      _root_device is on the SD card or eMMC, `bootflow scan` likely
      picked up the wrong bootdev — constrain localcmd to NVMe
      (e.g. `nvme scan; bootflow scan -b nvme0.blk`). If you got an
      NFS rootfs, U-Boot fell through to PXE — check localcmd is
      actually set in the U-Boot binary's default environment.
  when: boot_mode == 'local_kernel'

- name: "Assert custom mode rootfs source matches verify_match"
  ansible.builtin.assert:
    that:
      - extra_modes[boot_mode] is defined
      - extra_modes[boot_mode].verify_match is defined
      - _root_device is match(extra_modes[boot_mode].verify_match)
    fail_msg: >-
      boot_mode[{{ boot_mode }}]: _root_device={{ _root_device }}
      does not match verify_match regex
      '{{ extra_modes[boot_mode].verify_match | default('<unset>') }}'.
      Define armbian_netboot_extra_modes[{{ boot_mode }}].verify_match
      so this role can assert the rootfs source.
  when: boot_mode not in ['nfs', 'sd', 'local', 'local_kernel']

---
- name: Assert a root match is set for a custom mode
  ansible.builtin.assert:
    that:
      - board_boot_verify_mode in __board_boot_verify_modes or __board_boot_verify_match | length > 0
    fail_msg: >-
      board_boot_verify_mode={{ board_boot_verify_mode }} is a custom mode;
      set board_boot_verify_root_match to the expected root device regex.
    quiet: true

- name: Gather the mount facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - mounts

- name: Assert the root filesystem matches the boot mode
  ansible.builtin.assert:
    that:
      - __board_boot_verify_root | length > 0
      - __board_boot_verify_spec.nfs_root is not defined
        or (__board_boot_verify_root.fstype in __board_boot_verify_nfs_fstypes) == __board_boot_verify_spec.nfs_root
      - __board_boot_verify_match | length == 0 or __board_boot_verify_root.device is match(__board_boot_verify_match)
    fail_msg: >-
      board_boot_verify_mode[{{ board_boot_verify_mode }}]: root is
      {{ __board_boot_verify_root.device | default('not mounted') }}
      ({{ __board_boot_verify_root.fstype | default('none') }}); expected
      {{ __board_boot_verify_spec.expect | default('a root') }}{{ (" matching '" ~ __board_boot_verify_match ~ "'")
      if __board_boot_verify_match | length > 0 else '' }}. {{ __board_boot_verify_spec.hint | default('') }}
    quiet: true

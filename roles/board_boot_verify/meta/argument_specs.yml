---
argument_specs:
  main:
    short_description: "Assert a board's rootfs matches the declared boot mode."
    description:
      - >-
        Single-host role. Gathers facts, inspects ansible_mounts['/'],
        and asserts that the rootfs fstype matches the declared
        boot_mode (nfs|nfs4 for nfs; not nfs for sd, local, or
        local_kernel; for local_kernel additionally asserts the
        device path starts with /dev/nvme).

    options:
      boot_mode:
        type: str
        required: true
        choices: [nfs, sd, local, local_kernel]
        description: >-
          The declared boot mode. `local_kernel` asserts NVMe rootfs
          (the local_kernel pxelinux label hands off to U-Boot's
          extlinux bootmeth which loads kernel+rootfs off NVMe).
      extra_modes:
        type: dict
        default: {}
        description: >-
          Mirrors armbian_netboot_extra_modes for verify_match lookups.
          When boot_mode is a key in extra_modes, this role reads the
          mode's `verify_match` regex and asserts ansible_mounts['/'].
          device matches it.

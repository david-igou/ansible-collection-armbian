---
argument_specs:
  main:
    short_description: Assert a board's root filesystem matches the declared boot mode.
    description:
      - Gathers only the C(mounts) fact subset and asserts the C(/) mount against the mode.
      - C(nfs) requires an C(nfs)/C(nfs4) root. C(sd) and C(local) require a non-NFS root
        whose device matches C(^/dev/); C(local_kernel) requires a non-NFS root matching
        C(^/dev/nvme).
      - Any other mode name is a custom mode; its root device must match
        C(board_boot_verify_root_match), which is then required.
    options:
      board_boot_verify_mode:
        description: The boot mode the board is expected to be in.
        type: str
        required: true
      board_boot_verify_root_match:
        description:
          - Regex the root device must match, replacing the mode's default.
          - Required for custom modes. Example for an eMMC fallback C(^/dev/(nvme|mmcblk0)).
        type: str

---
# Allwinner-style eMMC bootloader install: write the U-Boot binary into
# the eMMC user-data area at sector emmc_seek_sectors (typically 16 on
# sunxi). No boot partition / force_ro toggle involved.
#
# IMPORTANT: this writes to the start of the user data area, which sits
# in front of any partition table. It is the operator's responsibility
# to make sure no critical data sits in the first
# (emmc_seek_sectors + image_size_sectors) 512-byte sectors. On a clean
# Armbian install the layout reserves this region by convention.

- name: Resolve eMMC target device path
  ansible.builtin.set_fact:
    _emmc_target_device: >-
      {{ _board.emmc_target_device | default('/dev/mmcblk0') }}
    _emmc_seek_sectors: >-
      {{ _board.emmc_seek_sectors | default(_board.sd_uboot_seek_sectors) }}

- name: Verify eMMC target device exists
  ansible.builtin.stat:
    path: "{{ _emmc_target_device }}"
  register: _emmc_dev_stat

- name: Fail if eMMC target device missing or not a block device
  ansible.builtin.fail:
    msg: >-
      {{ _emmc_target_device }} not found (or not a block device) on
      {{ inventory_hostname }}. The board claims has_emmc=true but the
      kernel did not enumerate the eMMC device. Override emmc_target_device
      via host_board_overrides if your unit exposes it at a different path.
  when: not _emmc_dev_stat.stat.exists or not _emmc_dev_stat.stat.isblk

- name: Flash U-Boot to eMMC user area at sector {{ _emmc_seek_sectors }}
  ansible.builtin.shell: |
    dd if="{{ _uboot_disk_image_path }}" of="{{ _emmc_target_device }}" \
       bs=512 seek={{ _emmc_seek_sectors }} conv=notrunc
    sync
  args:
    executable: /bin/bash
  register: _emmc_flash_result
  changed_when: _emmc_flash_result.rc == 0

- name: Report eMMC flash complete
  ansible.builtin.debug:
    msg: >-
      eMMC flash complete: {{ _uboot_disk_image_path }} →
      {{ _emmc_target_device }} (seek={{ _emmc_seek_sectors }})

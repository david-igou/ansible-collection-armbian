---
# Read back the flashed region and compare its checksum against the source
# binary to catch silent write failures.
#
# Required variables from caller:
#   _verify_device   — device that was written to
#   _verify_offset   — sector offset (512-byte sectors); 0 for SPI/boot partitions
#   _verify_source   — path to the source binary that was flashed
#   _verify_bs       — block size used for the flash (default 512)

- name: Compute source binary size for verification
  ansible.builtin.command:
    cmd: "stat -c%s {{ _verify_source }}"
  register: _verify_src_size
  changed_when: false
  check_mode: false

- name: Compute source binary checksum for verification
  ansible.builtin.shell: |
    set -o pipefail
    md5sum "{{ _verify_source }}" | awk '{print $1}'
  args:
    executable: /bin/bash
  register: _verify_src_md5
  changed_when: false
  check_mode: false

- name: Read back flashed region and compute checksum
  ansible.builtin.shell: |
    set -o pipefail
    bs={{ _verify_bs | default(512) }}
    skip={{ _verify_offset | default(0) }}
    size={{ _verify_src_size.stdout }}
    count=$(( (size + bs - 1) / bs ))
    dd if="{{ _verify_device }}" bs=${bs} skip=${skip} count=${count} 2>/dev/null | \
      head -c ${size} | md5sum | awk '{print $1}'
  args:
    executable: /bin/bash
  register: _verify_dev_md5
  changed_when: false
  check_mode: false

- name: Fail if flash verification checksum mismatch
  ansible.builtin.fail:
    msg: >-
      FLASH VERIFICATION FAILED on {{ inventory_hostname }}:
      device={{ _verify_device }}, offset={{ _verify_offset | default(0) }} sectors.
      Expected md5={{ _verify_src_md5.stdout }},
      got md5={{ _verify_dev_md5.stdout }}.
      The write may have silently failed (bad flash chip, worn SD card, or
      I/O error). Retry the flash or replace the storage media.
  when: _verify_dev_md5.stdout != _verify_src_md5.stdout

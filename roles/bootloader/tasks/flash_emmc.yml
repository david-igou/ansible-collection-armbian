---
# Dispatch to the per-SoC-family eMMC write strategy.
# Strategies live in flash_emmc_<strategy>.yml; the strategy name comes
# from _board.emmc_strategy (resolved from socs/<family>.yml unless the
# board overrides it).
#
# Currently implemented:
#   boot_partition  — Rockchip RK3588/3399/356x: dd to /dev/mmcblkNboot0
#   user_area_seek  — Allwinner sunxi: dd to /dev/mmcblkN with seek=N

- name: Locate eMMC U-Boot image from installed package
  ansible.builtin.find:
    paths: "{{ uboot_package_lib_dir }}/{{ _board.uboot_install_dir }}"
    patterns: "{{ _board.uboot_disk_image }}"
    recurse: true
  register: _uboot_disk_image_find

- name: Fail if eMMC image not found
  ansible.builtin.fail:
    msg: >-
      Could not find {{ _board.uboot_disk_image }} under
      {{ uboot_package_lib_dir }}/{{ _board.uboot_install_dir }}.
  when: _uboot_disk_image_find.files | length == 0

- name: Set eMMC image source path
  ansible.builtin.set_fact:
    _uboot_disk_image_path: "{{ _uboot_disk_image_find.files[0].path }}"

- name: Dispatch to eMMC flash strategy
  ansible.builtin.include_tasks: "flash_emmc_{{ _board.emmc_strategy }}.yml"

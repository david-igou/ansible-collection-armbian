---
- name: Load board configuration
  ansible.builtin.include_vars:
    file: boards.yml
  tags: bootloader

- name: Look up board entry for {{ board_model }}
  ansible.builtin.set_fact:
    _board_entry: "{{ board_configs[board_model] | default({}) }}"
  tags: bootloader

- name: Fail if board_model is not recognised
  ansible.builtin.fail:
    msg: >-
      board_model '{{ board_model }}' not found in
      roles/bootloader/vars/boards.yml. Add an entry there or correct the
      hostvar.
  when: _board_entry == {}
  tags: bootloader

- name: Load SoC family defaults for {{ _board_entry.soc_family }}
  ansible.builtin.include_vars:
    file: "socs/{{ _board_entry.soc_family }}.yml"
    name: _soc_defaults
  tags: bootloader

# Resolution: SoC defaults < board entry < per-host overrides.
# host_board_overrides is an optional dict in host_vars; use it for
# SKU-level variation (e.g. one Rock 5B unit has SPI populated, another
# doesn't) without forking boards.yml.
- name: Resolve effective board config
  ansible.builtin.set_fact:
    _board: >-
      {{ _soc_defaults
         | combine(_board_entry)
         | combine(host_board_overrides | default({})) }}
  tags: bootloader

- name: Warn on non-standard Armbian support tier
  ansible.builtin.debug:
    msg: >-
      NOTE: {{ board_model }} is Armbian-tier
      '{{ _board.armbian_support | default("unknown") }}'.
      Community/wip boards may break on Armbian release bumps; pin image
      and U-Boot package versions if you need stability.
  when: _board.armbian_support | default('community') != 'standard'
  tags: bootloader

- name: Install Armbian U-Boot package
  ansible.builtin.apt:
    name: "{{ _board.uboot_apt_package }}"
    state: present
    update_cache: true
  tags: bootloader

- name: Detect SPI flash availability
  ansible.builtin.include_tasks: detect_spi.yml
  when: _board.has_spi | default(false)
  tags: bootloader

# Resolve which storage to flash. Honour explicit user choice; otherwise
# prefer the most permanent on-board storage available, then fall back
# to writing the SD card the board is currently booted from. The SD
# path requires the board to be running off a removable SD card and
# is the only viable target for boards with no SPI/eMMC populated.
- name: Resolve effective bootloader flash target
  ansible.builtin.set_fact:
    _effective_target: >-
      {%- if bootloader_target == 'spi' -%}spi
      {%- elif bootloader_target == 'emmc' -%}emmc
      {%- elif bootloader_target == 'sd' -%}sd
      {%- elif _board.has_spi | default(false)
              and _spi_available | default(false) -%}spi
      {%- elif _board.has_emmc | default(false) -%}emmc
      {%- else -%}sd
      {%- endif -%}
  tags: bootloader

- name: Validate effective target against board capabilities
  ansible.builtin.fail:
    msg: >-
      Cannot flash {{ board_model }}: bootloader_target='{{ bootloader_target }}'
      resolved to '{{ _effective_target }}', but the board's capability flags
      (has_spi={{ _board.has_spi | default(false) }},
      has_emmc={{ _board.has_emmc | default(false) }})
      do not allow it. Adjust bootloader_target, host_board_overrides, or
      check that SPI is detected (run with -vv to see detect_spi output).
  when: >-
    (_effective_target == 'spi' and not (_spi_available | default(false))) or
    (_effective_target == 'emmc' and not (_board.has_emmc | default(false)))
  tags: bootloader

- name: Flash bootloader to SPI
  ansible.builtin.include_tasks: flash_spi.yml
  when: _effective_target == 'spi'
  tags: bootloader

# eMMC strategy varies by SoC family. flash_emmc.yml dispatches to the
# right per-strategy task file based on _board.emmc_strategy.
- name: Flash bootloader to eMMC
  ansible.builtin.include_tasks: flash_emmc.yml
  when: _effective_target == 'emmc'
  tags: bootloader

# SD card path: writes U-Boot to the SD card the board is currently
# booted from, in place. Used for boards with no SPI/eMMC populated;
# the operator is expected to have flashed Armbian to the SD card
# manually before this point.
- name: Flash bootloader to SD card
  ansible.builtin.include_tasks: flash_sd.yml
  when: _effective_target == 'sd'
  tags: bootloader

# Trigger the reboot handler if any flash was performed. The handler
# checks bootloader_reboot to decide whether to actually reboot.
# include_tasks cannot directly notify handlers, so this sentinel task
# evaluates the registered results from the flash paths.
- name: Signal bootloader change for reboot handler
  ansible.builtin.debug:
    msg: "Bootloader flash completed on {{ inventory_hostname }} (target={{ _effective_target }})"
  changed_when: >-
    (_spi_flash_result is defined and _spi_flash_result is changed) or
    (_sd_flash_result is defined and _sd_flash_result is changed) or
    (_emmc_flash_result is defined and _emmc_flash_result is changed)
  notify: bootloader changed
  tags: bootloader

---
- name: Locate SPI U-Boot image from installed package
  ansible.builtin.find:
    paths: "{{ uboot_package_lib_dir }}/{{ _board.uboot_install_dir }}"
    patterns: "{{ _board.uboot_spi_image }}"
    recurse: true
  register: _uboot_spi_image_find

- name: Fail if SPI image not found
  ansible.builtin.fail:
    msg: >
      Could not find {{ _board.uboot_spi_image }} under
      {{ uboot_package_lib_dir }}/{{ _board.uboot_install_dir }}.
      Is the package installed?
  when: _uboot_spi_image_find.files | length == 0

- name: Set SPI image path
  ansible.builtin.set_fact:
    _uboot_spi_image_path: "{{ _uboot_spi_image_find.files[0].path }}"

- name: Flash U-Boot to SPI ({{ _spi_mtd_device }})
  ansible.builtin.shell: |
    dd if="{{ _uboot_spi_image_path }}" of="{{ _spi_mtd_device }}" bs=4096 conv=notrunc
    sync
  args:
    executable: /bin/bash
  register: _spi_flash_result
  changed_when: _spi_flash_result.rc == 0

- name: Verify SPI flash completed
  ansible.builtin.debug:
    msg: "SPI flash complete: {{ _uboot_spi_image_path }} → {{ _spi_mtd_device }}"

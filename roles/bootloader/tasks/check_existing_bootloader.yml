---
# Compare the on-device bootloader region against the source binary to
# determine whether flashing can be skipped. Sets _bootloader_matches (bool).
#
# Required variables from caller:
#   _check_device   — block/char device to read from
#   _check_offset   — sector offset (512-byte sectors) to start reading; 0 for SPI/boot partitions
#   _check_source   — path to the source binary to compare against
#   _check_bs       — block size for dd reads (default 512)

- name: Compute source binary size and checksum
  ansible.builtin.shell: |
    set -o pipefail
    size=$(stat -c%s "{{ _check_source }}")
    cksum=$(md5sum "{{ _check_source }}" | awk '{print $1}')
    echo "${size} ${cksum}"
  args:
    executable: /bin/bash
  register: _src_info
  changed_when: false
  check_mode: false

- name: Parse source binary metadata
  ansible.builtin.set_fact:
    _src_size: "{{ _src_info.stdout.split()[0] }}"
    _src_md5: "{{ _src_info.stdout.split()[1] }}"

- name: Read on-device bootloader region and checksum it
  ansible.builtin.shell: |
    set -o pipefail
    bs={{ _check_bs | default(512) }}
    skip={{ _check_offset | default(0) }}
    count=$(( ({{ _src_size }} + bs - 1) / bs ))
    dd if="{{ _check_device }}" bs=${bs} skip=${skip} count=${count} 2>/dev/null | \
      head -c {{ _src_size }} | md5sum | awk '{print $1}'
  args:
    executable: /bin/bash
  register: _dev_md5_result
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine if on-device bootloader matches source
  ansible.builtin.set_fact:
    _bootloader_matches: "{{ _dev_md5_result.rc == 0 and _dev_md5_result.stdout == _src_md5 }}"

- name: Report bootloader match status
  ansible.builtin.debug:
    msg: >-
      {{ 'On-device bootloader matches source — skipping flash.'
         if _bootloader_matches | bool
         else 'On-device bootloader differs from source — will flash.' }}
  when: bootloader_skip_if_present | bool

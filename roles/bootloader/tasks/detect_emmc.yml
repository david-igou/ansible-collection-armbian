---
# Determine which /dev/mmcblkN is the eMMC (not the SD card). On boards
# with both SD and eMMC populated, mmcblk probe order is not guaranteed
# (depends on DT alias ordering and driver probe sequence). Detection
# reads /sys/block/mmcblk*/device/type: "MMC" = eMMC, "SD" = SD card.
#
# Sets:
#   _emmc_available    — bool, true if an eMMC device was found
#   _emmc_device       — e.g. /dev/mmcblk1
#   _emmc_boot_part    — e.g. /dev/mmcblk1boot0 (for boot_partition strategy)

- name: Detect eMMC device by /sys type attribute
  ansible.builtin.shell: |
    set -o pipefail
    for dev in /sys/block/mmcblk[0-9]*; do
      [ -d "$dev" ] || continue
      # Skip boot partitions (mmcblk0boot0 etc.)
      case "$(basename "$dev")" in
        *boot*|*rpmb*) continue ;;
      esac
      type_file="$dev/device/type"
      [ -f "$type_file" ] || continue
      devtype=$(cat "$type_file" 2>/dev/null || true)
      if [ "$devtype" = "MMC" ]; then
        echo "$(basename "$dev")"
        exit 0
      fi
    done
    exit 1
  args:
    executable: /bin/bash
  register: _emmc_detect_result
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set eMMC availability and device facts
  ansible.builtin.set_fact:
    _emmc_available: "{{ _emmc_detect_result.rc == 0 }}"
    _emmc_device: >-
      {{ '/dev/' + _emmc_detect_result.stdout
         if _emmc_detect_result.rc == 0
         else '' }}
    _emmc_boot_part: >-
      {{ '/dev/' + _emmc_detect_result.stdout + 'boot0'
         if _emmc_detect_result.rc == 0
         else (_board.emmc_boot_partition | default(emmc_boot_partition)) }}

- name: Report eMMC detection status
  ansible.builtin.debug:
    msg: >-
      eMMC {{ 'found at /dev/' + _emmc_detect_result.stdout
              if _emmc_detect_result.rc == 0
              else 'not found' }}
      on {{ inventory_hostname }} ({{ board_model }}).
      {{ 'Boot partition: ' + _emmc_boot_part
         if _emmc_detect_result.rc == 0 else '' }}

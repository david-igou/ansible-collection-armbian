---
# Rockchip-style eMMC bootloader install: write the disk U-Boot binary
# to /dev/mmcblkNboot0 (the eMMC boot hardware partition) at offset 0,
# toggling /sys/block/.../force_ro around the dd to allow the write.

- name: Resolve eMMC boot partition path
  ansible.builtin.set_fact:
    _emmc_boot_partition: >-
      {{ _board.emmc_boot_partition | default(emmc_boot_partition) }}

# Hard guard: eMMC may be advertised in boards.yml but not actually
# populated on this specific unit. Confirm both the boot partition and
# its force_ro attribute exist before doing anything destructive.
- name: Verify eMMC boot partition exists
  ansible.builtin.stat:
    path: "{{ _emmc_boot_partition }}"
  register: _emmc_part_stat

- name: Fail if eMMC boot partition is missing
  ansible.builtin.fail:
    msg: >-
      {{ _emmc_boot_partition }} not found on {{ inventory_hostname }}.
      The board claims has_emmc=true but no eMMC boot partition is exposed.
      Either eMMC is unpopulated, the kernel did not enumerate it, or the
      device path differs (e.g. mmcblk1boot0). Set has_emmc=false via
      host_board_overrides or set emmc_boot_partition correctly.
  when: not _emmc_part_stat.stat.exists

- name: Resolve eMMC force_ro sysfs attribute
  ansible.builtin.set_fact:
    _emmc_force_ro: "/sys/block/{{ _emmc_boot_partition | basename }}/force_ro"

- name: Verify eMMC force_ro attribute exists
  ansible.builtin.stat:
    path: "{{ _emmc_force_ro }}"
  register: _emmc_force_ro_stat

- name: Fail if force_ro attribute missing
  ansible.builtin.fail:
    msg: >-
      {{ _emmc_force_ro }} not found. Cannot safely write to the eMMC boot
      partition without disabling its read-only guard. Aborting.
  when: not _emmc_force_ro_stat.stat.exists

- name: Disable eMMC boot0 write protection
  ansible.builtin.copy:
    dest: "{{ _emmc_force_ro }}"
    content: "0"
    mode: "0644"
  changed_when: true

- name: Flash U-Boot to eMMC boot partition
  ansible.builtin.shell: |
    dd if="{{ _uboot_disk_image_path }}" of="{{ _emmc_boot_partition }}" bs=512
    sync
  args:
    executable: /bin/bash
  register: _emmc_flash_result
  changed_when: _emmc_flash_result.rc == 0

- name: Re-enable eMMC boot0 write protection
  ansible.builtin.copy:
    dest: "{{ _emmc_force_ro }}"
    content: "1"
    mode: "0644"
  changed_when: true

- name: Report eMMC flash complete
  ansible.builtin.debug:
    msg: "eMMC flash complete: {{ _uboot_disk_image_path }} → {{ _emmc_boot_partition }}"

---
# HTTP URL from which the board (booted into NFS root) downloads the Armbian
# image. The default matches the netboot.xyz container layout: nginx listens
# on port 80 with document root `/assets/`, so a fetch for
# `<host>/images/<file>` resolves to `/assets/images/<file>` on disk —
# exactly where `populate_nfs_content.yml` writes via `nfs_assets_export`.
#
# Override per-deployment if you serve images from a different host, port,
# or URL prefix (e.g. an external nginx with `location /assets/`).
image_server_url: "http://{{ tftp_server_ip | default(netboot_server_ip) }}/images"

# Maximum time in seconds to wait for the image download to complete.
# A 1 GB compressed image at 100 Mbps takes ~80 s; 300 s is a safe margin.
flash_download_timeout: 300

# Maximum time in seconds to wait for the xz | dd flash to complete.
# A 16 GB NVMe at ~200 MB/s takes ~80 s decompressed; 900 s covers slow media.
flash_timeout: 900

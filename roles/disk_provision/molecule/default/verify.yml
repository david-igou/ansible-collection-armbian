---
- name: Verify disk_provision render-only output
  hosts: localhost
  gather_facts: false
  vars:
    __repart_dir: /run/disk_provision/null/repart.d
  tasks:
    - name: List rendered .repart.d files
      ansible.builtin.find:
        paths: "{{ __repart_dir }}"
        patterns: "*.conf"
      register: __rendered

    - name: Assert exactly two .repart.d configs were rendered
      ansible.builtin.assert:
        that:
          - (__rendered.files | length) == 2
        fail_msg: >-
          Expected 2 .repart.d/*.conf files under {{ __repart_dir }},
          got {{ __rendered.files | length }}:
          {{ __rendered.files | map(attribute='path') | list }}

    - name: Read each rendered config
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: __slurps
      loop: "{{ __rendered.files | map(attribute='path') | sort | list }}"

    - name: Decode rendered configs
      ansible.builtin.set_fact:
        __confs: >-
          {{ __slurps.results | map(attribute='content') | map('b64decode') | list }}

    - name: Assert ESP config carries the expected fields
      ansible.builtin.assert:
        that:
          - "'Type=esp' in __confs[0]"
          - "'Format=vfat' in __confs[0]"
          - "'Label=ESP' in __confs[0]"
          - "'SizeMinBytes=256M' in __confs[0] or 'SizeMaxBytes=256M' in __confs[0]"
        fail_msg: |
          ESP config drift. Rendered:
          {{ __confs[0] }}

    - name: Assert root config carries the expected fields
      ansible.builtin.assert:
        that:
          - "'Type=root' in __confs[1]"
          - "'Format=ext4' in __confs[1]"
          - "'Label=armbi_root_local' in __confs[1]"
        fail_msg: |
          Root config drift. Rendered:
          {{ __confs[1] }}

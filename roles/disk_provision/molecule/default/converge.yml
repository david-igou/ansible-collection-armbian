---
- name: Render disk_provision configs in render_only mode
  hosts: localhost
  gather_facts: true   # role needs ansible_mounts for _validate.yml
  tasks:
    - name: Include disk_provision in render-only mode
      ansible.builtin.include_role:
        name: disk_provision
      vars:
        disk_binding:
          device: /dev/null   # render_only short-circuits before any I/O on this
          wipe: true
          force: false
          fast_wipe: false
          layout:
            - id: 01-esp
              size: 256MiB
              type: esp
              format: vfat
              label: ESP
              mount: /boot/efi
              mount_opts: "defaults,noatime"
            - id: 02-root
              size: grow
              type: root
              format: ext4
              label: armbi_root_local
              mount: /
        source: /
        armbian_installed_marker: false
        reset_identity: false
        render_only: true

---
argument_specs:
  main:
    short_description: Partition one block device from a declarative layout and populate it from a rootfs
    description:
      - >-
        Validates the layout, renders one systemd-repart definition per layout
        entry under C(/run/disk_provision/<device>/repart.d/), runs
        systemd-repart against the device, mounts the new filesystems by label,
        rsyncs O(disk_provision_source) onto them with C(--delete), writes an
        C(/etc/fstab) on the root filesystem that references every mounted
        entry by C(LABEL=), and unmounts.
      - >-
        Without preserved partitions the partition table is rebuilt from
        scratch. When an entry has O(disk_provision_disk_binding.layout[].preserve_on_reprovision=true)
        and its label already exists on the device, that partition keeps its
        data and is not mounted or copied; every other entry is deleted,
        re-created and reformatted (systemd-repart C(--factory-reset)).
      - >-
        Gathers the C(mounts) fact subset itself and refuses to wipe the disk
        that backs C(/). Needs root (tasks use C(become)), and systemd-repart,
        rsync, lsblk, blkid, partprobe and blkdiscard on the host; installs the
        C(systemd-repart) package when the binary is missing. One disk per
        call; loop the role for several disks. Always writes, so it is not
        idempotent.
    options:
      disk_provision_disk_binding:
        type: dict
        required: true
        description:
          - The device to provision and its layout.
        options:
          device:
            type: path
            required: true
            description:
              - Whole-disk path, for example C(/dev/nvme0n1). Partition paths are rejected.
          force:
            type: bool
            default: false
            description:
              - Ignore O(disk_provision_disk_binding.layout[].preserve_on_reprovision) and rebuild every partition.
          fast_wipe:
            type: bool
            default: true
            description:
              - When nothing is preserved, discard the whole device with C(blkdiscard) first and skip the
                per-partition discards of systemd-repart and mkfs.ext4.
              - Set false for devices whose TRIM support hangs.
          layout:
            type: list
            elements: dict
            required: true
            description:
              - Partitions in on-disk order. Exactly one entry must mount at C(/).
            options:
              id:
                type: str
                required: true
                description:
                  - Unique within the layout; names the rendered C(NN-<id>.conf) definition.
              size:
                type: str
                required: true
                description:
                  - C(<number>MiB), C(<number>GiB) or C(<number>TiB), or C(grow) (at least 4G, fills the
                    remaining space; at most one per layout).
              type:
                type: str
                required: true
                choices:
                  - esp
                  - linux
                  - root
                  - var
                  - home
                  - srv
                  - swap
                description:
                  - GPT partition type; systemd-repart picks the architecture-specific GUID.
              format:
                type: str
                required: true
                choices:
                  - vfat
                  - ext4
                  - xfs
                  - btrfs
                  - swap
                description:
                  - Filesystem to create.
              label:
                type: str
                description:
                  - Filesystem and partition label. Required for mounted and preserved entries.
                  - vfat labels must be uppercase and at most 11 characters.
              mount:
                type: path
                description:
                  - Absolute mount path written to C(/etc/fstab). Omit for unmounted entries such as swap.
              mount_opts:
                type: str
                description:
                  - fstab options. Defaults to C(defaults,noatime) for ext4, xfs and vfat,
                    C(defaults,noatime,compress=zstd) for btrfs and C(sw) for swap.
              preserve_on_reprovision:
                type: bool
                default: false
                description:
                  - Keep this partition and its data when a partition with the same label already exists.
      disk_provision_source:
        type: path
        default: /
        description:
          - Directory holding the rootfs to copy, usually C(/) on a host booted from NFS.
      disk_provision_installed_marker:
        type: bool
        default: true
        description:
          - Set C(INSTALLED=true) in C(/etc/armbian-image-release) on the new root, when that file exists,
            so armbian-resize-filesystem does not resize the partition.
      disk_provision_reset_identity:
        type: bool
        default: false
        description:
          - Empty C(/etc/machine-id) and C(/var/lib/dbus/machine-id) on the new root. Leave false when
            the disk is for the same machine as the source.
      disk_provision_mount_dir_base:
        type: path
        default: /var/lib/armbian/disk_provision_mnt
        description:
          - Directory under which the new filesystems are mounted temporarily, at C(<base>/<device basename>).
      disk_provision_render_only:
        type: bool
        default: false
        description:
          - Validate the layout and render the repart definitions, then stop. Does not gather facts,
            touch the device or require it to exist.

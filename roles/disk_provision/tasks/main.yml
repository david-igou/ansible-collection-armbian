---
# disk_provision — partition + format + rsync rootfs to a block device.
# Role contract: see meta/argument_specs.yml.
#
# Idempotency model: keyed on `label`. If the disk already has a
# partition whose filesystem label equals `label`, the role skips the
# destructive block. Set `force: true` to wipe + repartition + recopy
# unconditionally.

- name: Assert device exists and is a block device
  ansible.builtin.stat:
    path: "{{ device }}"
  register: _device_stat
  become: true

- name: Fail if device missing or not block
  ansible.builtin.fail:
    msg: >-
      device {{ device }} does not exist or is not a block device.
      Pass the whole-disk path (e.g. /dev/nvme0n1), not a partition.
  when: not _device_stat.stat.exists or not _device_stat.stat.isblk

- name: Assert source exists and is a directory
  ansible.builtin.stat:
    path: "{{ source }}"
  register: _source_stat
  become: true

- name: Fail if source missing or not a directory
  ansible.builtin.fail:
    msg: "source {{ source }} does not exist or is not a directory."
  when: not _source_stat.stat.exists or not _source_stat.stat.isdir

# Partition naming: nvme0n1 → nvme0n1p1, sda → sda1, mmcblk0 → mmcblk0p1.
# Convention: append `p1` when the disk name ends in a digit, else `1`.
- name: Derive partition device path from device
  ansible.builtin.set_fact:
    _partition: "{{ device }}{{ 'p1' if device[-1] in '0123456789' else '1' }}"

# Idempotency: skip the destructive block if a partition already exists
# with the requested label. `lsblk -no LABEL` returns empty for an
# unformatted/missing partition (rc=0 still) and the requested label
# for a matching one.
- name: Read existing filesystem label on target partition
  ansible.builtin.command: "lsblk -no LABEL {{ _partition }}"
  register: _existing_label
  changed_when: false
  failed_when: false
  become: true

- name: Decide whether destructive provisioning is needed
  ansible.builtin.set_fact:
    _needs_provision: "{{ force | bool or (_existing_label.stdout | trim) != label }}"

- name: Report provisioning decision
  ansible.builtin.debug:
    msg: >-
      device={{ device }} partition={{ _partition }}
      existing_label='{{ _existing_label.stdout | trim }}'
      requested_label='{{ label }}'
      force={{ force }} → needs_provision={{ _needs_provision }}

- name: Provision disk (wipe + partition + format + rsync)
  when: _needs_provision
  become: true
  block:
    # Wipe first 10MiB to clear GPT header, MBR, and any stray
    # bootloader bits. Matches armbian-install's `dd if=/dev/zero of=…
    # bs=1M count=10`. Cheap and deterministic.
    - name: Wipe partition table header (10 MiB)
      ansible.builtin.command:
        cmd: "dd if=/dev/zero of={{ device }} bs=1M count=10 conv=fsync status=none"
      changed_when: true

    # GPT label + single partition spanning the disk. parted -s for
    # scripted mode (no interactive prompts). Matches armbian-install
    # exactly: `parted /dev/<disk>` with `mktable gpt; mkpart primary
    # ext4 0% 100%`.
    - name: Create GPT label + single partition spanning the disk
      ansible.builtin.command:
        cmd: "parted -s {{ device }} mklabel gpt mkpart primary {{ fstype }} 0% 100%"
      changed_when: true

    - name: Force partition table re-read
      ansible.builtin.command:
        cmd: "partprobe -s {{ device }}"
      changed_when: false
      failed_when: false

    - name: Wait for partition device to appear
      ansible.builtin.wait_for:
        path: "{{ _partition }}"
        state: present
        timeout: 10

    # mkfs.ext4 -L <label> -F. -F bypasses "device already contains
    # data" prompt that mkfs uses in interactive mode. Other fstypes
    # need different flag handling — gate by choices in argument_specs.
    - name: Format partition with filesystem label
      ansible.builtin.command:
        cmd: "mkfs.{{ fstype }} -F -L {{ label }} {{ _partition }}"
      changed_when: true

    - name: Ensure mount point exists
      ansible.builtin.file:
        path: "{{ mount_dir }}"
        state: directory
        mode: "0755"

    # Mount + rsync + unmount as one block/always so the partition is
    # always unmounted even if rsync fails. Mount via shell (not
    # ansible.posix.mount) to avoid touching the host's /etc/fstab.
    - name: Mount, populate, and unmount target
      block:
        - name: Mount partition at temporary mount point
          ansible.builtin.command:
            cmd: "mount {{ _partition }} {{ mount_dir }}"
          changed_when: true

        - name: Write rsync exclude file
          ansible.builtin.copy:
            dest: "{{ mount_dir }}.excludes"
            content: "{{ excludes | join('\n') }}\n"
            mode: "0644"

        # rsync flags:
        #  -a   archive (recursive, preserve perms/times/links)
        #  -A   ACLs
        #  -X   xattrs
        #  --numeric-ids  preserve UID/GID numerically (matters when
        #                 source and target have different /etc/passwd
        #                 UID mappings — uncommon but possible)
        #  --one-file-system  don't follow mounts (don't recurse into
        #                     /proc, NFS-mounted submounts, etc.)
        #  --delete  remove target files absent from source (clean
        #            mid-run state if a previous failed run left junk)
        #  --info=progress2  human-readable progress (logged, not shown)
        - name: Rsync source rootfs to mounted partition
          ansible.builtin.command:
            cmd: >-
              rsync -aAX --numeric-ids --one-file-system --delete
              --exclude-from={{ mount_dir }}.excludes
              {{ source }}/ {{ mount_dir }}/
          changed_when: true

        # Re-create the virtual filesystem mountpoints rsync skipped.
        # Without these, the kernel can't mount /proc, /sys, /dev,
        # /run, /tmp on the target's first boot — boot stalls before
        # systemd reaches a usable state.
        - name: Re-create required mount-point directories on target
          ansible.builtin.file:
            path: "{{ mount_dir }}/{{ item }}"
            state: directory
            mode: "{{ '1777' if item == 'tmp' else '0755' }}"
          loop:
            - dev
            - proc
            - sys
            - run
            - tmp
            - mnt
            - media

        - name: Write generated /etc/fstab on target
          ansible.builtin.template:
            src: fstab.j2
            dest: "{{ mount_dir }}/etc/fstab"
            mode: "0644"

        # Prevents armbian-resize-filesystem.service from trying to
        # expand the partition on first boot (it already spans the
        # disk). Same marker armbian-install sets.
        - name: Mark rootfs as installed (skip armbian-resize-filesystem)
          ansible.builtin.lineinfile:
            path: "{{ mount_dir }}/etc/armbian-image-release"
            regexp: "^INSTALLED="
            line: "INSTALLED=true"
            create: false
          when: armbian_installed_marker | bool
          failed_when: false  # /etc/armbian-image-release may not exist on non-Armbian sources

        # Zero (don't delete) machine-id files. Empty matches what
        # Armbian ships and what systemd treats as ConditionFirstBoot=
        # yes, gating sshd-keygen.service and other first-boot
        # oneshots. Matches the pattern used by rootfs_clone.
        - name: Reset machine-id files when requested
          ansible.builtin.copy:
            dest: "{{ mount_dir }}/{{ item }}"
            content: ""
            mode: "0444"
            force: true
          loop:
            - etc/machine-id
            - var/lib/dbus/machine-id
          when: reset_identity | bool

        - name: Sync to ensure rsync data hits the disk
          ansible.builtin.command:
            cmd: "sync"
          changed_when: false

      always:
        - name: Unmount target partition
          ansible.builtin.command:
            cmd: "umount {{ mount_dir }}"
          changed_when: true
          failed_when: false

        - name: Remove exclude file
          ansible.builtin.file:
            path: "{{ mount_dir }}.excludes"
            state: absent

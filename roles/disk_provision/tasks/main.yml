---
- name: Gather mount facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - mounts
  when: not disk_provision_render_only | bool

- name: Validate the disk binding
  ansible.builtin.import_tasks: _validate.yml

- name: Remove previously rendered repart definitions
  ansible.builtin.file:
    path: "{{ __disk_provision_repart_dir }}"
    state: absent
  become: true

- name: Create the repart definitions directory
  ansible.builtin.file:
    path: "{{ __disk_provision_repart_dir }}"
    state: directory
    mode: "0755"
  become: true

# The numeric prefix orders the partitions on disk.
- name: Render one repart definition per layout entry
  ansible.builtin.template:
    src: repart.conf.j2
    dest: "{{ __disk_provision_repart_dir }}/{{ '%02d' | format(idx * 10 + 10) }}-{{ partition.id }}.conf"
    mode: "0644"
  loop: "{{ __disk_provision_layout }}"
  loop_control:
    loop_var: partition
    label: "{{ partition.id }}"
    index_var: idx
  become: true

- name: Partition and format the device
  ansible.builtin.import_tasks: _repart.yml
  when: not disk_provision_render_only | bool

- name: Populate the new filesystems
  ansible.builtin.import_tasks: _populate.yml
  when: not disk_provision_render_only | bool

---
# Invoke systemd-repart against the device. Handles two modes:
#   - No preserves: --empty=force wipes the partition table from
#     scratch; all partitions are created per the .repart.d configs.
#   - Some preserves: --empty=refuse requires an existing GPT
#     (preserves it) and only writes the non-preserved slots in
#     the filtered definitions dir. Aborts if disk is blank.

# On Debian 12 (Bookworm), systemd-repart shipped inside the main
# `systemd` package. On Debian 13 (Trixie, what current Armbian
# builds against), it was split into a standalone `systemd-repart`
# package. Install it idempotently so this role works on both.
# failed_when:false here because the package doesn't exist on
# Bookworm — the next assert catches the real "binary missing" case.
# update_cache:true is load-bearing: on a freshly-cloned NFS rootfs
# (test_fleet_e2e.yml Phase 1 force_refresh state), the apt list is
# the source image's stale cache and doesn't know about the package.
# Without a refresh the install silently no-ops here and Phase 5
# fails at the next task's "systemd-repart binary missing" assert.
- name: "Apply repart: ensure systemd-repart package is installed"
  ansible.builtin.apt:
    name: systemd-repart
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  failed_when: false

- name: "Apply repart: assert systemd-repart binary is available"
  ansible.builtin.command: "systemd-repart --version"
  register: _dp_repart_version
  changed_when: false
  failed_when: _dp_repart_version.rc != 0

- name: "Apply repart: build filtered definitions dir (excludes preserved ids)"
  ansible.builtin.file:
    path: "{{ _dp_repart_dir }}.filtered"
    state: directory
    mode: "0755"
  become: true
  when: _dp_preserve_ids | length > 0

- name: "Apply repart: symlink non-preserved configs into filtered dir"
  ansible.builtin.file:
    src: "{{ _dp_repart_dir }}/{{ '%02d' | format(idx * 10 + 10) }}-{{ partition.id }}.conf"
    dest: "{{ _dp_repart_dir }}.filtered/{{ '%02d' | format(idx * 10 + 10) }}-{{ partition.id }}.conf"
    state: link
  loop: "{{ disk_binding.layout }}"
  loop_control:
    loop_var: partition
    label: "{{ partition.id }}"
    index_var: idx
  when:
    - _dp_preserve_ids | length > 0
    - partition.id not in _dp_preserve_ids
  become: true

- name: "Apply repart: determine effective definitions dir and empty mode"
  ansible.builtin.set_fact:
    _dp_repart_defs: >-
      {{ _dp_repart_dir + '.filtered' if _dp_preserve_ids | length > 0 else _dp_repart_dir }}
    _dp_repart_empty: >-
      {{ 'refuse' if _dp_preserve_ids | length > 0 else 'force' }}

# Fast-wipe path: pre-discard the whole device directly using the
# storage's native chunk size (NVMe = 2 TiB chunks; one ioctl wipes
# the whole disk in ~seconds). After this, both systemd-repart's
# --discard=yes and mkfs.ext4's -E discard become no-ops. Without
# this, the slow path runs through systemd-repart's loop-device
# view of the disk whose BLKDISCARD chunk is hard-capped at 128 KiB
# — for a 477 GiB NVMe that's ~3.7M ioctls × wbt_wait throttling,
# clocking ~30 min instead of ~2 min. See
# docs/end-to-end-fleet-test.html §6 deep-dive.
- name: "Apply repart: pre-discard whole disk (fast_wipe)"
  ansible.builtin.command:
    cmd: "blkdiscard {{ disk_binding.device }}"
  become: true
  when:
    - _dp_preserve_ids | length == 0     # only safe when nothing to preserve
    - (disk_binding.fast_wipe | default(true)) | bool
  register: _dp_blkdiscard
  changed_when: true
  failed_when:
    - _dp_blkdiscard.rc != 0
    - _dp_blkdiscard.rc != 2    # rc=2 = device doesn't support discard; not fatal

- name: "Apply repart: run systemd-repart"
  ansible.builtin.command:
    cmd: >-
      systemd-repart
      --definitions={{ _dp_repart_defs }}
      --empty={{ _dp_repart_empty }}
      --dry-run=no
      --discard={{ 'no' if _dp_fast_wipe else 'yes' }}
      {{ disk_binding.device }}
  environment:
    # SYSTEMD_REPART_MKFS_OPTIONS_EXT4 is appended AFTER the device
    # in mkfs.ext4's argv. With glibc getopt's default permutation
    # this normally works, but in practice we still observed
    # per-partition BLKDISCARD when --discard=yes was kept — the
    # call comes from systemd-repart itself, not from mkfs. So we
    # turn --discard=no above and leave the env var as a belt-and-
    # suspenders override for the mkfs side.
    SYSTEMD_REPART_MKFS_OPTIONS_EXT4: "{{ '-E nodiscard' if _dp_fast_wipe else '' }}"
  vars:
    _dp_fast_wipe: "{{ (_dp_preserve_ids | length == 0) and (disk_binding.fast_wipe | default(true)) | bool }}"
  become: true
  register: _dp_repart_run
  changed_when: true

- name: "Apply repart: report what repart did"
  ansible.builtin.debug:
    msg: "{{ _dp_repart_run.stdout_lines | join('\n') }}"

- name: "Apply repart: force partition-table re-read"
  ansible.builtin.command: "partprobe -s {{ disk_binding.device }}"
  changed_when: false
  failed_when: false
  become: true

- name: "Apply repart: wait for all expected partitions to appear by label"
  ansible.builtin.command: "blkid -L {{ partition.label }}"
  register: _dp_blkid
  retries: 5
  delay: 1
  until: _dp_blkid.rc == 0
  loop: "{{ disk_binding.layout }}"
  loop_control:
    loop_var: partition
    label: "{{ partition.id }}"
  when: partition.label is defined
  changed_when: false
  become: true

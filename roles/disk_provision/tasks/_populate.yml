---
- name: Create the mount points under the mount root
  ansible.builtin.file:
    path: "{{ __disk_provision_mount_root }}{{ p.mount }}"
    state: directory
    mode: "0755"
  loop: "{{ __disk_provision_mounts }}"
  loop_control:
    loop_var: p
    label: "{{ p.id }}"
  become: true

- name: Mount, populate and unmount the new filesystems
  become: true
  block:
    - name: Mount each new filesystem by label
      ansible.posix.mount:
        path: "{{ __disk_provision_mount_root }}{{ p.mount }}"
        src: "LABEL={{ p.label }}"
        fstype: "{{ p.format }}"
        state: ephemeral
      loop: "{{ __disk_provision_mounts | rejectattr('id', 'in', __disk_provision_preserve_ids) | list }}"
      loop_control:
        loop_var: p
        label: "{{ p.id }}"

    # Preserved filesystems are not mounted; excluding their contents keeps
    # rsync --delete from touching the empty mount point directories.
    - name: Write the rsync exclude list
      ansible.builtin.copy:
        dest: "{{ __disk_provision_excludes_file }}"
        content: |
          /dev/*
          /proc/*
          /sys/*
          /run/*
          /tmp/*
          /mnt/*
          /media/*
          /var/log/journal
          {% for p in __disk_provision_mounts | selectattr('id', 'in', __disk_provision_preserve_ids) %}
          {{ p.mount }}/*
          {% endfor %}
        mode: "0644"

    # command, not ansible.posix.synchronize: synchronize wraps rsync for
    # controller-to-host copies, this copy is local to the host.
    - name: Copy the source rootfs onto the new filesystems
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --xattrs
          - --acls
          - --numeric-ids
          - --one-file-system
          - --delete
          - --itemize-changes
          - "--exclude-from={{ __disk_provision_excludes_file }}"
          - "{{ disk_provision_source }}/"
          - "{{ __disk_provision_mount_root }}/"
      register: __disk_provision_rsync
      changed_when: __disk_provision_rsync.stdout_lines | length > 0

    - name: Recreate the virtual filesystem mount points
      ansible.builtin.file:
        path: "{{ __disk_provision_mount_root }}/{{ item }}"
        state: directory
        mode: "{{ '1777' if item == 'tmp' else '0755' }}"
      loop:
        - dev
        - proc
        - sys
        - run
        - tmp
        - mnt
        - media

    - name: Write /etc/fstab on the new root
      ansible.builtin.template:
        src: fstab.j2
        dest: "{{ __disk_provision_mount_root }}/etc/fstab"
        mode: "0644"

    - name: Stat the boot and release files the role may rewrite
      ansible.builtin.stat:
        path: "{{ __disk_provision_mount_root }}/{{ item }}"
        get_checksum: false
      loop:
        - boot/extlinux/extlinux.conf
        - etc/armbian-image-release
      register: __disk_provision_optional_files

    - name: Point extlinux.conf at the new root label
      ansible.builtin.replace:
        path: "{{ __disk_provision_mount_root }}/boot/extlinux/extlinux.conf"
        regexp: 'root=\S+'
        replace: "root=LABEL={{ __disk_provision_root_label }}"
      when: __disk_provision_optional_files.results[0].stat.exists

    # INSTALLED=true stops armbian-resize-filesystem from resizing the
    # partition repart already sized.
    - name: Mark the Armbian install as complete
      ansible.builtin.lineinfile:
        path: "{{ __disk_provision_mount_root }}/etc/armbian-image-release"
        regexp: "^INSTALLED="
        line: INSTALLED=true
      when:
        - disk_provision_installed_marker | bool
        - __disk_provision_optional_files.results[1].stat.exists

    - name: Empty the machine-id files
      ansible.builtin.copy:
        dest: "{{ __disk_provision_mount_root }}/{{ item }}"
        content: ""
        mode: "0444"
      loop:
        - etc/machine-id
        - var/lib/dbus/machine-id
      when: disk_provision_reset_identity | bool

    - name: Flush the copied data to disk
      ansible.builtin.command: sync
      changed_when: false
  always:
    - name: Unmount the new filesystems, children first
      ansible.posix.mount:
        path: "{{ __disk_provision_mount_root }}{{ p.mount }}"
        state: unmounted
      loop: "{{ __disk_provision_mounts | rejectattr('id', 'in', __disk_provision_preserve_ids) | reverse | list }}"
      loop_control:
        loop_var: p
        label: "{{ p.id }}"

    - name: Remove the rsync exclude list
      ansible.builtin.file:
        path: "{{ __disk_provision_excludes_file }}"
        state: absent

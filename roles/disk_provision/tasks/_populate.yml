---
# Mount partitions in dependency order, rsync source rootfs onto root,
# write /etc/fstab, rewrite /boot/extlinux/extlinux.conf root= reference,
# unmount in reverse order.

- name: "Populate: define per-device mount root"
  ansible.builtin.set_fact:
    __disk_provision_mount_root: "{{ mount_dir_base }}/{{ __disk_provision_device_basename }}"

- name: "Populate: ensure mount root exists"
  ansible.builtin.file:
    path: "{{ __disk_provision_mount_root }}"
    state: directory
    mode: "0755"
  become: true

- name: "Populate: build ordered mount list (by path depth)"
  ansible.builtin.set_fact:
    __disk_provision_mount_order: >-
      {{ disk_binding.layout
         | selectattr('mount', 'defined')
         | sort(attribute='mount')
         | list }}

- name: "Populate: mount partitions in dependency order"
  block:
    - name: "Populate: ensure each mount point exists under mount_root"
      ansible.builtin.file:
        path: "{{ __disk_provision_mount_root }}{{ p.mount }}"
        state: directory
        mode: "0755"
      loop: "{{ __disk_provision_mount_order }}"
      loop_control:
        loop_var: p
        label: "{{ p.id }}"
      become: true

    - name: "Populate: mount each partition by label"
      ansible.posix.mount:
        path: "{{ __disk_provision_mount_root }}{{ p.mount }}"
        src: "LABEL={{ p.label }}"
        fstype: "{{ p.format }}"
        state: ephemeral
      loop: "{{ __disk_provision_mount_order }}"
      loop_control:
        loop_var: p
        label: "{{ p.id }}"
      when: p.id not in __disk_provision_preserve_ids
      become: true

    - name: "Populate: write rsync exclude file"
      ansible.builtin.copy:
        dest: "{{ __disk_provision_mount_root }}.excludes"
        content: |
          /dev/*
          /proc/*
          /sys/*
          /run/*
          /tmp/*
          /mnt/*
          /media/*
          /var/log/journal
          {% for p in __disk_provision_mount_order %}{% if p.id in __disk_provision_preserve_ids %}{{ p.mount }}/*
          {% endif %}{% endfor %}
        mode: "0644"
      become: true

    - name: "Populate: rsync source into mounted root"
      # ansible.posix.synchronize has known --rsh splitting bugs in this
      # collection (see playbooks/build_image.yml:525), so we keep
      # command: rsync but use argv form (declarative tokenisation) and
      # --itemize-changes so changed_when reflects whether any file
      # actually transferred.
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --xattrs
          - --acls
          - --numeric-ids
          - --one-file-system
          - --delete
          - --itemize-changes
          - "--exclude-from={{ __disk_provision_mount_root }}.excludes"
          - "{{ source }}/"
          - "{{ __disk_provision_mount_root }}/"
      register: __disk_provision_rsync
      changed_when: (__disk_provision_rsync.stdout_lines | length) > 0
      become: true

    - name: "Populate: recreate virtual mount-point directories on target"
      ansible.builtin.file:
        path: "{{ __disk_provision_mount_root }}/{{ item }}"
        state: directory
        mode: "{{ '1777' if item == 'tmp' else '0755' }}"
      loop:
        - dev
        - proc
        - sys
        - run
        - tmp
        - mnt
        - media
      become: true

    - name: "Populate: write generated /etc/fstab on target root"
      ansible.builtin.template:
        src: fstab.j2
        dest: "{{ __disk_provision_mount_root }}/etc/fstab"
        mode: "0644"
      become: true

    - name: "Populate: rewrite /boot/extlinux/extlinux.conf root= if present"
      ansible.builtin.replace:
        path: "{{ __disk_provision_mount_root }}/boot/extlinux/extlinux.conf"
        regexp: 'root=\S+'
        replace: "root=LABEL={{ __disk_provision_root_label }}"
      vars:
        __disk_provision_root_label: "{{ disk_binding.layout | selectattr('mount', 'equalto', '/') | map(attribute='label') | first }}"
      failed_when: false  # extlinux.conf may not exist; not on boot path under passthrough model
      become: true

    - name: "Populate: write INSTALLED=true marker on target"
      ansible.builtin.lineinfile:
        path: "{{ __disk_provision_mount_root }}/etc/armbian-image-release"
        regexp: "^INSTALLED="
        line: "INSTALLED=true"
        create: false
      when: armbian_installed_marker | bool
      failed_when: false
      become: true

    - name: "Populate: reset machine-id files if requested"
      ansible.builtin.copy:
        dest: "{{ __disk_provision_mount_root }}/{{ item }}"
        content: ""
        mode: "0444"
        force: true
      loop:
        - etc/machine-id
        - var/lib/dbus/machine-id
      when: reset_identity | bool
      become: true

    - name: "Populate: sync to flush rsync data"
      ansible.builtin.command: "sync"
      changed_when: false
      become: true

  always:
    - name: "Populate: unmount in reverse order"
      ansible.posix.mount:
        path: "{{ __disk_provision_mount_root }}{{ p.mount }}"
        state: unmounted
      loop: "{{ __disk_provision_mount_order | reverse | list }}"
      loop_control:
        loop_var: p
        label: "{{ p.id }}"
      when: p.id not in __disk_provision_preserve_ids
      failed_when: false
      become: true

    - name: "Populate: remove excludes file"
      ansible.builtin.file:
        path: "{{ __disk_provision_mount_root }}.excludes"
        state: absent
      become: true

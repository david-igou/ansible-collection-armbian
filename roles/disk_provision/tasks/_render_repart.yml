---
# Render one .repart.d/<NN>-<id>.conf per layout entry, into a
# per-device subdirectory under /run/disk_provision/. Numeric prefix
# orders the partitions on disk.

- name: "Render: derive device basename"
  ansible.builtin.set_fact:
    __disk_provision_device_basename: "{{ disk_provision_disk_binding.device | basename }}"

- name: "Render: define repart.d directory path"
  ansible.builtin.set_fact:
    __disk_provision_repart_dir: "/run/disk_provision/{{ __disk_provision_device_basename }}/repart.d"

- name: "Render: ensure repart.d directory exists"
  ansible.builtin.file:
    path: "{{ __disk_provision_repart_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: "Render: emit one .conf per layout entry"
  ansible.builtin.template:
    src: repart.conf.j2
    dest: "{{ __disk_provision_repart_dir }}/{{ '%02d' | format(idx * 10 + 10) }}-{{ partition.id }}.conf"
    mode: "0644"
  loop: "{{ disk_provision_disk_binding.layout }}"
  loop_control:
    loop_var: partition
    label: "{{ partition.id }}"
    index_var: idx
  become: true

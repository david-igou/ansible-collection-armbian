---
- name: Assert the device is a whole-disk path under /dev
  ansible.builtin.assert:
    that:
      - disk_provision_disk_binding.device.startswith('/dev/')
      - disk_provision_disk_binding.device is not match('/dev/(nvme[0-9]+n[0-9]+p|mmcblk[0-9]+p|loop[0-9]+p|sd[a-z]|vd[a-z]|hd[a-z])[0-9]+$')
    fail_msg: >-
      device must be a whole-disk path under /dev/ (e.g. /dev/nvme0n1), not a
      partition. Got: {{ disk_provision_disk_binding.device }}.

- name: Assert entry ids are unique
  ansible.builtin.assert:
    that:
      - __disk_provision_layout | map(attribute='id') | unique | length == __disk_provision_layout | length
    fail_msg: "Duplicate id values in the layout for {{ disk_provision_disk_binding.device }}."

- name: Assert at most one entry uses size grow
  ansible.builtin.assert:
    that:
      - __disk_provision_layout | selectattr('size', 'equalto', 'grow') | list | length <= 1
    fail_msg: "More than one layout entry for {{ disk_provision_disk_binding.device }} has size: grow."

- name: Assert exactly one entry mounts at /
  ansible.builtin.assert:
    that:
      - __disk_provision_mounts | selectattr('mount', 'equalto', '/') | list | length == 1
    fail_msg: "The layout for {{ disk_provision_disk_binding.device }} needs exactly one entry with mount: /."

# fstab and the mounts use LABEL=, and preserve detection is keyed on it.
- name: Assert mounted and preserved entries have absolute mounts and labels
  ansible.builtin.assert:
    that:
      - item.label | default('') | length > 0
      - item.mount is not defined or item.mount.startswith('/')
    fail_msg: >-
      Layout entry id={{ item.id }} needs a non-empty label (it is mounted or
      preserved) and an absolute mount path.
  loop: >-
    {{ __disk_provision_mounts
       + __disk_provision_layout | selectattr('preserve_on_reprovision', 'defined') | selectattr('preserve_on_reprovision') | list }}
  loop_control:
    label: "{{ item.id }}"

# systemd-repart uppercases FAT labels, which would break the LABEL= lookups.
- name: Assert vfat labels are uppercase and at most 11 characters
  ansible.builtin.assert:
    that:
      - item.label == item.label | upper
      - item.label | length <= 11
    fail_msg: >-
      Layout entry id={{ item.id }} has vfat label {{ item.label }}; FAT labels
      must be uppercase and at most 11 characters, e.g. {{ (item.label | upper)[:11] }}.
  loop: "{{ __disk_provision_layout | selectattr('format', 'equalto', 'vfat') | selectattr('label', 'defined') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: Stat the device
  ansible.builtin.stat:
    path: "{{ disk_provision_disk_binding.device }}"
  register: __disk_provision_device_stat
  become: true
  when: not disk_provision_render_only | bool

- name: Assert the device is a block device
  ansible.builtin.assert:
    that:
      - __disk_provision_device_stat.stat.isblk | default(false)
    fail_msg: "{{ disk_provision_disk_binding.device }} is not a block device; check the path with lsblk."
  when: not disk_provision_render_only | bool

- name: Refuse to wipe the disk the host booted from
  ansible.builtin.assert:
    that:
      - not __disk_provision_root_source.startswith(disk_provision_disk_binding.device)
    fail_msg: >-
      REFUSING: / is on {{ __disk_provision_root_source }}, which is on
      {{ disk_provision_disk_binding.device }}. Boot from another rootfs (NFS or
      another disk) before provisioning this one.
  vars:
    __disk_provision_root_source: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}"
  when: not disk_provision_render_only | bool

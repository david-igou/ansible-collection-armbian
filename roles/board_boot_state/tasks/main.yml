---
# board_boot_state role — dispatcher.
#
# Inputs validated by meta/argument_specs.yml at role-include time:
#   boot_state (required: pxe|disk)
#   netboot_router (required: inventory hostname of RouterOS router)
#   boot_retry_attempts, boot_attempt_timeout, ssh_wait_timeout,
#   ssh_wait_retry_attempts, post_boot_wait_timeout, poe_cycle_delay
#   cycle_board (default true), verify_state (default true)
#
# Flow:
#   1. Configure rb5009 — delegate to netboot_router, write or remove
#      the per-board pxelinux.cfg + /ip tftp row depending on boot_state.
#   2. (when cycle_board) PoE-cycle the board and wait for it to come up,
#      using the 2-layer retry primitives.
#   3. (when verify_state) Assert the rootfs matches the declared state.

- name: "board_boot_state[{{ boot_state }}] — configure rb5009"
  ansible.builtin.include_tasks: "configure_{{ boot_state }}.yml"

- name: "board_boot_state[{{ boot_state }}] — cycle and verify"
  when: cycle_board | bool
  block:
    - name: "board_boot_state[{{ boot_state }}] — power-cycle and wait for boot"
      ansible.builtin.include_tasks: cycle_and_wait.yml

    - name: "board_boot_state[{{ boot_state }}] — verify rootfs matches state"
      ansible.builtin.include_tasks: verify_state.yml
      when: verify_state | bool

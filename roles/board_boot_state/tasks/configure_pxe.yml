---
# Write per-board pxelinux.cfg + /ip tftp row on the netboot router.
#
# `delegate_to: netboot_router` works because group_vars/routeros.yml
# sets ansible_connection: ansible.netcommon.network_cli on all
# RouterOS hosts — the delegated task picks up the router's connection
# settings automatically. Same pattern as routeros_poe.
#
# board_mac / board_model / target_board_host are passed explicitly so
# the included role works regardless of whose hostvars are in scope on
# the delegate side.

- name: "board_boot_state[pxe] — write per-board pxelinux.cfg + /ip tftp row"
  ansible.builtin.include_role:
    name: routeros_sbc_tftp
    tasks_from: write_pxelinux_cfg.yml
  vars:
    board_mac: "{{ hostvars[inventory_hostname].board_mac }}"
    board_model: "{{ hostvars[inventory_hostname].board_model }}"
    target_board_host: "{{ inventory_hostname }}"
  delegate_to: "{{ netboot_router }}"

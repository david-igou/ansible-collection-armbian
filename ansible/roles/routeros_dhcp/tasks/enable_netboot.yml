---
# Writes the per-board pxelinux.cfg, assigns the PXE DHCP option set on
# RouterOS, and reboots the board.
#
# For SPI boards: U-Boot in SPI handles PXE automatically once DHCP options
# are set — no board-side configuration change is needed.
#
# For non-SPI boards: a prepared SD card (see prepare_sd_card.yml) must be
# physically inserted before the board is rebooted. The SD card U-Boot has
# PXE as its first boot target so DHCP controls the mode identically to SPI.
#
# Required variables: board_mac, board_model, netboot_mode

- name: Validate netboot_mode
  ansible.builtin.assert:
    that:
      - netboot_mode is defined
      - netboot_mode in ['nfsroot', 'reprovision']
    fail_msg: "netboot_mode must be 'nfsroot' or 'reprovision'"
  tags: routeros, enable_netboot

- name: Generate pxelinux.cfg for {{ inventory_hostname }}
  delegate_to: "{{ groups['netboot_server'][0] }}"
  ansible.builtin.template:
    src: "{{ role_path }}/templates/pxelinux_cfg.j2"
    dest: >-
      {{ tftp_base }}/pxelinux.cfg/01-{{
        board_mac | lower | replace(':', '-')
      }}
    mode: "0644"
  tags: routeros, enable_netboot

- name: Assign netboot DHCP option set for {{ board_mac }}
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server lease
        set [find mac-address="{{ board_mac }}"]
        dhcp-option="{{ routeros_opt_set_nfsroot_prefix
          if netboot_mode == 'nfsroot'
          else routeros_opt_set_reprovision_prefix }}"
  tags: routeros, enable_netboot

- name: Remind operator to insert SD card (non-SPI board)
  ansible.builtin.debug:
    msg: >-
      {{ board_model }} has no SPI flash. Ensure the PXE boot SD card
      is inserted into the board before it reboots. See prepare_sd_card.yml.
  when: not (board_configs[board_model].has_spi | default(false))
  tags: routeros, enable_netboot

- name: Reboot board to trigger PXE
  when: netboot_reboot | default(true) | bool
  delegate_to: "{{ inventory_hostname }}"
  ansible.builtin.reboot:
    reboot_timeout: 60
    connect_timeout: 10
    post_reboot_delay: 0
  tags: routeros, enable_netboot

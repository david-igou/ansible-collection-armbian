---
# Assigns the correct DHCP option set to a board's static lease and
# (for non-SPI U-Boot boards) adjusts the boot_targets U-Boot env var
# so the board tries PXE on the next reboot.
#
# Required variables (set per-host in inventory or passed as extra vars):
#   board_mac        — MAC address of the board
#   board_model      — model string matching boards.yml
#   netboot_mode     — "nfsroot" or "reprovision"
#
# Run against: routeros hosts (for DHCP) and board hosts (for fw_setenv)

- name: Validate netboot_mode
  ansible.builtin.assert:
    that:
      - netboot_mode is defined
      - netboot_mode in ['nfsroot', 'reprovision']
    fail_msg: "netboot_mode must be 'nfsroot' or 'reprovision'"
  tags: routeros, enable_netboot

- name: Generate pxelinux.cfg for {{ inventory_hostname }}
  delegate_to: "{{ groups['netboot_server'][0] }}"
  ansible.builtin.template:
    src: "{{ role_path }}/templates/pxelinux_cfg.j2"
    dest: >-
      {{ tftp_base }}/pxelinux.cfg/01-{{
        board_mac | lower | replace(':', '-')
      }}
    mode: "0644"
  tags: routeros, enable_netboot

- name: Assign netboot DHCP option set for {{ board_mac }}
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server lease
        set [find mac-address="{{ board_mac }}"]
        dhcp-option="{{ routeros_opt_set_nfsroot_prefix
          if netboot_mode == 'nfsroot'
          else routeros_opt_set_reprovision_prefix }}"
  tags: routeros, enable_netboot

- name: Set PXE-first boot order on board (non-SPI U-Boot boards only)
  when: not (board_configs[board_model].has_spi | default(false))
  delegate_to: "{{ inventory_hostname }}"
  ansible.builtin.command:
    cmd: "fw_setenv boot_targets '{{ uboot_boot_targets_pxe }}'"
  changed_when: true
  tags: routeros, enable_netboot

- name: Reboot board to trigger PXE
  when: netboot_reboot | default(true) | bool
  delegate_to: "{{ inventory_hostname }}"
  ansible.builtin.reboot:
    reboot_timeout: 60
    connect_timeout: 10
    post_reboot_delay: 0
  tags: routeros, enable_netboot

---
# Removes the PXE DHCP option set from a board's static lease, reverting it
# to normal disk boot.
#
# Called automatically by reprovision.sh after flashing (via RouterOS REST API).
# Can also be run manually via the disable_netboot.yml playbook to cancel a
# queued netboot.
#
# For non-SPI boards: the SD card can remain inserted — when DHCP provides no
# next-server, U-Boot's PXE attempt fails gracefully and it falls through to
# the local disk.
#
# Required variables: board_mac

- name: Remove netboot DHCP option set for {{ board_mac }}
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server lease
        set [find mac-address="{{ board_mac }}"]
        dhcp-option=""
  tags: routeros, disable_netboot

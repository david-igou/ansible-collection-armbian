---
# Creates the reusable DHCP option objects on RouterOS.
# Run once (or after a RouterOS reset) before using enable/disable netboot.
#
# RouterOS DHCP option structure for PXE:
#   option 66 (TFTP server)  → routeros_opt_tftp_name
#   option 67 (boot file)    → one per mode (nfsroot, reprovision)
#   option sets              → bundle option 66 + 67 per mode

- name: Create DHCP option — TFTP server (option 66)
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server option
        add name="{{ routeros_opt_tftp_name }}"
        code=66
        value="'{{ netboot_server_ip }}'"
  register: _opt_tftp
  changed_when: "'already have' not in (_opt_tftp.stdout | default(''))"
  failed_when: >
    _opt_tftp.rc != 0 and
    'already have' not in (_opt_tftp.stdout | default(''))
  tags: routeros, routeros_setup

- name: Create DHCP options — boot file per mode (option 67)
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server option
        add name="{{ routeros_opt_set_nfsroot_prefix }}-bootfile"
        code=67
        value="'{{ netboot_modes.nfsroot }}'"
      - >
        /ip dhcp-server option
        add name="{{ routeros_opt_set_reprovision_prefix }}-bootfile"
        code=67
        value="'{{ netboot_modes.reprovision }}'"
  register: _opt_bootfile
  changed_when: "'already have' not in (_opt_bootfile.stdout | default(''))"
  failed_when: >
    _opt_bootfile.rc != 0 and
    'already have' not in (_opt_bootfile.stdout | default(''))
  tags: routeros, routeros_setup

- name: Create DHCP option sets — bundle TFTP + boot file per mode
  community.routeros.command:
    commands:
      - >
        /ip dhcp-server option sets
        add name="{{ routeros_opt_set_nfsroot_prefix }}"
        options="{{ routeros_opt_tftp_name }},{{ routeros_opt_set_nfsroot_prefix }}-bootfile"
      - >
        /ip dhcp-server option sets
        add name="{{ routeros_opt_set_reprovision_prefix }}"
        options="{{ routeros_opt_tftp_name }},{{ routeros_opt_set_reprovision_prefix }}-bootfile"
  register: _opt_sets
  changed_when: "'already have' not in (_opt_sets.stdout | default(''))"
  failed_when: >
    _opt_sets.rc != 0 and
    'already have' not in (_opt_sets.stdout | default(''))
  tags: routeros, routeros_setup

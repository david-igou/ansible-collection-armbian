---
- name: Install Docker prerequisites
  ansible.builtin.include_tasks: docker.yml
  tags: netbootxyz

- name: Create netboot.xyz directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ netbootxyz_install_dir }}"
    - "{{ netbootxyz_config_dir }}"
    - "{{ netbootxyz_config_dir }}/armbian"
    - "{{ netbootxyz_config_dir }}/pxelinux.cfg"
    - "{{ netbootxyz_assets_dir }}"
    - "{{ netbootxyz_assets_dir }}/menus"
  tags: netbootxyz

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ netbootxyz_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart netbootxyz
  tags: netbootxyz

- name: Deploy custom Armbian iPXE menus
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ netbootxyz_assets_dir }}/menus/{{ item | basename }}"
    mode: "0644"
  with_fileglob:
    - "{{ playbook_dir }}/../../netbootxyz/assets/menus/*.ipxe"
  notify: Restart netbootxyz
  tags: netbootxyz

- name: Start netboot.xyz container
  community.docker.docker_compose_v2:
    project_src: "{{ netbootxyz_install_dir }}"
    state: present
  tags: netbootxyz

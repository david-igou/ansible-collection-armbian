---
# Writes reprovision assets into the already-mounted NFS reprovision export
# for a specific board. Called from reprovision.yml after nfs_content has
# run (which mounts the NFS shares and populates the base rootfs).
#
# Assumes the NFS reprovision export is mounted at:
#   {{ nfs_local_mount }}/reprovision/{{ board_model }}
#
# Required variable: board_model

- name: Load board configs
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../bootloader/vars/boards.yml"
  tags: reprovision

- name: Set reprovision mount path
  ansible.builtin.set_fact:
    _reprovision_mount: "{{ nfs_local_mount }}/reprovision/{{ board_model }}"
  tags: reprovision

- name: Mount NFS reprovision export for {{ board_model }}
  ansible.posix.mount:
    src: "{{ netboot_server_ip }}:{{ nfs_reprovision_path }}/{{ board_model }}"
    path: "{{ _reprovision_mount }}"
    fstype: nfs
    opts: "vers=4,rw"
    state: mounted
  tags: reprovision

- name: Write RouterOS credentials to reprovision rootfs
  ansible.builtin.copy:
    dest: "{{ _reprovision_mount }}/etc/reprovision.conf"
    content: |
      ROUTEROS_HOST={{ routeros_host }}
      ROUTEROS_USER={{ routeros_api_user }}
      ROUTEROS_PASS={{ routeros_api_password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: reprovision

- name: Install reprovision script
  ansible.builtin.copy:
    src: reprovision.sh
    dest: "{{ _reprovision_mount }}/usr/local/sbin/reprovision.sh"
    mode: "0755"
  tags: reprovision

- name: Install reprovision systemd unit
  ansible.builtin.copy:
    dest: "{{ _reprovision_mount }}/etc/systemd/system/reprovision.service"
    content: |
      [Unit]
      Description=Armbian Disk Reprovision
      After=network-online.target
      Wants=network-online.target
      ConditionKernelCommandLine=reprovision=1

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/reprovision.sh
      StandardOutput=journal+console
      StandardError=journal+console
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  tags: reprovision

- name: Enable reprovision service in rootfs
  ansible.builtin.file:
    src: /etc/systemd/system/reprovision.service
    dest: >-
      {{ _reprovision_mount
        }}/etc/systemd/system/multi-user.target.wants/reprovision.service
    state: link
  tags: reprovision

- name: Unmount NFS reprovision export for {{ board_model }}
  ansible.posix.mount:
    path: "{{ _reprovision_mount }}"
    state: unmounted
  tags: reprovision

---
# HTTP URL from which reprovision.sh (running on the board) downloads the
# Armbian image. The image is placed in the netboot.xyz assets directory by
# the nfs_content role and served from netboot's built-in HTTP server.
# Adjust the port if your netboot.xyz instance uses a different HTTP port.
image_server_url: "http://{{ netboot_server_ip }}:8080/assets/images"

# How long to wait for reprovision to complete (seconds)
reprovision_timeout: 1800

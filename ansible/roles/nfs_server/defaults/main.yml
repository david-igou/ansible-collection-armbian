---
nfs_export_base: "/exports"
nfs_rootfs_path: "{{ nfs_export_base }}/rootfs"
nfs_reprovision_path: "{{ nfs_export_base }}/reprovision"

# Clients allowed to mount the NFS exports.
# Adjust to your subnet.
nfs_allowed_clients: "192.168.1.0/24"

# Kernel and DTB files are extracted from the Armbian image and placed here
tftp_armbian_dir: "{{ tftp_base }}/{{ tftp_armbian_dir | default('armbian') }}"

# Mount point used temporarily when extracting the Armbian image
armbian_image_mount: "/mnt/armbian-image"

# Armbian image cache directory on the server
armbian_image_cache: "/var/cache/armbian-images"

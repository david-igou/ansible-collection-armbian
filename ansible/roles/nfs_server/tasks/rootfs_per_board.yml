---
# Runs once per board model (_model variable set by include loop).

- name: Set board facts for {{ _model }}
  ansible.builtin.set_fact:
    _bc: "{{ board_configs[_model] }}"
    _rootfs_dir: "{{ nfs_rootfs_path }}/{{ _model }}"
    _reprovision_dir: "{{ nfs_reprovision_path }}/{{ _model }}"
    _tftp_dir: "{{ tftp_base }}/armbian/{{ _model }}"
    _image_cache: "{{ armbian_image_cache }}/{{ _model }}.img.xz"

- name: Create per-board rootfs and reprovision directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ _rootfs_dir }}"
    - "{{ _reprovision_dir }}"

- name: Check if rootfs is already populated for {{ _model }}
  ansible.builtin.stat:
    path: "{{ _rootfs_dir }}/bin/bash"
  register: _rootfs_populated

- name: Discover latest Armbian image URL for {{ _model }}
  ansible.builtin.shell: |
    set -euo pipefail
    BASE="{{ armbian_image_base_url }}/{{ _bc.armbian_dl_dir }}/"
    LISTING=$(curl -sf "${BASE}")
    # Try preferred variant + release first, then release only
    for FILTER in "{{ armbian_image_variant }}" ""; do
      MATCH=$(echo "${LISTING}" \
        | grep -oP 'Armbian[^"]+\.img\.xz' \
        | grep -i '{{ armbian_release }}' \
        | { [ -n "${FILTER}" ] && grep -i "${FILTER}" || cat; } \
        | sort -r \
        | head -1)
      [ -n "${MATCH}" ] && break
    done
    if [ -z "${MATCH}" ]; then
      echo "ERROR: No image found at ${BASE} matching release={{ armbian_release }}" >&2
      echo "Available files:" >&2
      echo "${LISTING}" | grep -oP 'Armbian[^"]+\.img\.xz' >&2 || true
      exit 1
    fi
    echo "${BASE}${MATCH}"
  args:
    executable: /bin/bash
  register: _discovered_image_url
  changed_when: false
  when:
    - not _rootfs_populated.stat.exists
    - (armbian_image_overrides | default({}))[_model] is not defined

- name: Set image URL for {{ _model }}
  ansible.builtin.set_fact:
    _image_url: >-
      {{
        (armbian_image_overrides | default({}))[_model]
        if (armbian_image_overrides | default({}))[_model] is defined
        else _discovered_image_url.stdout | default('') | trim
      }}
  when: not _rootfs_populated.stat.exists

- name: Download Armbian image for {{ _model }}
  ansible.builtin.get_url:
    url: "{{ _image_url }}"
    dest: "{{ _image_cache }}"
    mode: "0644"
    timeout: 600
  when: not _rootfs_populated.stat.exists

- name: Decompress and mount Armbian image for {{ _model }}
  when: not _rootfs_populated.stat.exists
  block:
    - name: Decompress image
      ansible.builtin.shell: |
        xz -dk "{{ _image_cache }}"
      args:
        creates: "{{ armbian_image_cache }}/{{ _model }}.img"

    - name: Set up loop device and partition maps
      ansible.builtin.shell: |
        LOOPDEV=$(losetup --find --show --partscan \
          "{{ armbian_image_cache }}/{{ _model }}.img")
        echo "${LOOPDEV}"
      register: _loop_dev
      changed_when: true

    - name: Mount rootfs partition
      ansible.builtin.shell: |
        PART=$(lsblk -ln -o NAME {{ _loop_dev.stdout }} | tail -1)
        mount /dev/${PART} "{{ armbian_image_mount }}"
      changed_when: true

    - name: Copy rootfs to NFS export
      ansible.builtin.shell: |
        rsync -aHAX --exclude '/proc/*' --exclude '/sys/*' \
          --exclude '/dev/*' --exclude '/run/*' \
          "{{ armbian_image_mount }}/" "{{ _rootfs_dir }}/"
      changed_when: true

    - name: Copy kernel and initrd to TFTP tree
      ansible.builtin.shell: |
        cp "{{ armbian_image_mount }}"/boot/vmlinuz-* \
           "{{ _tftp_dir }}/vmlinuz"
        cp "{{ armbian_image_mount }}"/boot/initrd.img-* \
           "{{ _tftp_dir }}/initrd.img"
      changed_when: true

    - name: Copy board DTB to TFTP tree
      ansible.builtin.shell: |
        DTB_SRC="{{ armbian_image_mount }}/boot/dtb/{{ _bc.dtb }}"
        if [ -f "${DTB_SRC}" ]; then
          cp "${DTB_SRC}" "{{ _tftp_dir }}/board.dtb"
        else
          echo "WARNING: DTB not found at ${DTB_SRC}" >&2
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: Unmount and detach loop device
      ansible.builtin.shell: |
        umount "{{ armbian_image_mount }}" || true
        losetup -d "{{ _loop_dev.stdout }}" || true
      changed_when: true

- name: Prepare NFS rootfs fstab (disable local disk mounts)
  ansible.builtin.lineinfile:
    path: "{{ _rootfs_dir }}/etc/fstab"
    regexp: "^/dev/"
    state: absent

- name: Deploy reprovision script into reprovision rootfs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/reprovision/files/reprovision.sh"
    dest: "{{ _reprovision_dir }}/usr/local/sbin/reprovision.sh"
    mode: "0755"
  when: _rootfs_populated.stat.exists or true

- name: Symlink reprovision rootfs to main rootfs for shared base
  ansible.builtin.shell: |
    rsync -aHAX --exclude '/proc/*' --exclude '/sys/*' \
      --exclude '/dev/*' --exclude '/run/*' \
      "{{ _rootfs_dir }}/" "{{ _reprovision_dir }}/"
  args:
    executable: /bin/bash
  when: not _rootfs_populated.stat.exists
  changed_when: true

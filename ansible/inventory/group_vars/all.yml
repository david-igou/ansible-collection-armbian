---
# Network
netboot_server_ip: "192.168.1.10"
routeros_host: "192.168.1.1"
routeros_api_user: "ansible"
routeros_dhcp_server_name: "dhcp1"

# NFS paths on the server
nfs_export_base: "/exports"
nfs_rootfs_path: "/exports/rootfs"
nfs_reprovision_path: "/exports/reprovision"

# TFTP paths within the netboot.xyz config volume
tftp_base: "/opt/netbootxyz/config"
tftp_armbian_dir: "armbian"
tftp_pxelinux_cfg_dir: "pxelinux.cfg"

# Armbian image source
armbian_image_base_url: "https://dl.armbian.com"
# Distro release to select when discovering images (bookworm or noble)
armbian_release: "bookworm"
armbian_branch: "current"
# Image variant to prefer: "server" (headless) or "minimal"
armbian_image_variant: "server"

# Per-board image URL overrides — set these to skip auto-discovery and pin
# to a specific image.  Leave empty ({}) to always discover the latest.
# Example:
#   armbian_image_overrides:
#     rock-5b: "https://dl.armbian.com/rock-5b/Armbian_25.02_rock-5b_bookworm_6.1.75_server.img.xz"
armbian_image_overrides: {}

# Image server (nginx on the netboot server) for reprovision downloads
image_server_url: "http://{{ netboot_server_ip }}/images"
image_server_root: "/var/www/netboot/images"

# RouterOS credentials (override with ansible-vault)
routeros_api_password: "changeme"

# Board SSH defaults
ansible_user: "armbian"
ansible_become: true
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

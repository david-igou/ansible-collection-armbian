---
- name: Verify board_boot_verify against a VM with a block-device root
  hosts: molecule
  gather_facts: false
  vars:
    passing_cases:
      - mode: local
      - mode: local_kernel
        root_match: ^/dev/
      - mode: fixture_custom
        root_match: ^/dev/
    failing_cases:
      - mode: nfs
        error: "expected an NFS root. The board skipped its pxelinux.cfg"
      - mode: local_kernel
        error: "expected a non-NFS root matching '^/dev/nvme'."
      - mode: sd
        root_match: ^/dev/mmcblk
        error: "expected a non-NFS root matching '^/dev/mmcblk'."
      - mode: fixture_custom
        error: "fixture_custom is a custom mode; set board_boot_verify_root_match"
  tasks:
    - name: Accept a matching root
      ansible.builtin.include_role:
        name: david_igou.armbian.board_boot_verify
      vars:
        board_boot_verify_mode: "{{ item.mode }}"
        board_boot_verify_root_match: "{{ item.root_match | default('') }}"
      loop: "{{ passing_cases }}"

    - name: Reject a mismatched root
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      loop: "{{ failing_cases }}"
      loop_control:
        loop_var: case

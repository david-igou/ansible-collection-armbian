---
# qemu (not podman) because the role's `ansible.builtin.setup:` task
# needs a real `/` entry in /proc/mounts. Containers may not expose
# `/` as a mount entry; a real VM with a debian rootfs does.
all:
  children:
    molecule:
      hosts:
        instance:
          mp:
            qemu:
              image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
              disk_size: 4G

---
- name: Converge — render local_kernel dispatch table from fixture inventory
  hosts: all
  gather_facts: false
  become: false

  vars:
    # Fixture: three board configs, two opted in (local_kernel block present),
    # one not (rock-5a — expected to produce no dispatch row).
    armbian_netboot_board_configs:
      orange-pi-5-max:
        armbian_dl_dir: orangepi5-max
        armbian_board_name: orangepi5-max
        armbian_support: community
        dtb: rockchip/rk3588-orangepi-5-max.dtb
        console: ttyS2,1500000n8
        earlycon: uart8250,mmio32,0xfeb50000
        local_kernel:
          storage: "nvme 0:1"
          storage_scan: "nvme scan"
        uboot_env:
          storage: nowhere
      rock-5b:
        armbian_dl_dir: rock-5b
        armbian_board_name: rock-5b
        armbian_support: standard
        dtb: rockchip/rk3588-rock-5b.dtb
        console: ttyS2,1500000n8
        earlycon: uart8250,mmio32,0xfeb50000
        local_kernel:
          storage: "nvme 0:1"
          storage_scan: "nvme scan"
        uboot_env:
          storage: spi_flash
      rock-5a:
        armbian_dl_dir: rock-5a
        armbian_board_name: rock-5a
        armbian_support: standard
        dtb: rockchip/rk3588s-rock-5a.dtb
        console: ttyS2,1500000n8
        earlycon: uart8250,mmio32,0xfeb50000
        # NO local_kernel block — must produce no dispatch row.

    _board_models:
      - orange-pi-5-max
      - rock-5b
      - rock-5a

  tasks:
    - name: Render the dispatch table via the shared macro
      # ansible.builtin.template renders on the controller.  Jinja2's
      # FileSystemLoader searches scenario/templates/ (the src's directory),
      # so 'from render_localcmd_chain.j2 import ...' in dispatch_table.j2
      # resolves via the symlink at templates/render_localcmd_chain.j2 ->
      # ../../../../roles/image_build/templates/render_localcmd_chain.j2.
      # Absolute-path imports and ansible_search_path manipulation both
      # fail here; the symlink is the cleanest option.
      ansible.builtin.template:
        src: templates/dispatch_table.j2
        dest: /tmp/dispatch_table.txt
        mode: "0644"

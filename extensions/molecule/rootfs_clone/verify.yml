---
- name: Verify — assert clone state and identity reset
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Stat target tree members that must exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _must_exist
      loop:
        - /tmp/fixture/clone/bin/bash
        - /tmp/fixture/clone/etc/hostname
        - /tmp/fixture/clone/root/.no_armbian_first_login

    - name: Assert each must-exist path is present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "{{ item.item }} should exist after clone but does not"
      loop: "{{ _must_exist.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read cloned /etc/hostname
      ansible.builtin.slurp:
        src: /tmp/fixture/clone/etc/hostname
      register: _clone_hostname

    - name: Assert /etc/hostname matches the requested hostname
      ansible.builtin.assert:
        that:
          - (_clone_hostname.content | b64decode | trim) == 'smoke-host'
        fail_msg: >-
          /etc/hostname is {{ (_clone_hostname.content | b64decode | trim) }};
          expected smoke-host.

    - name: Read machine-id files (must be zeroed out, not deleted)
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: _machine_ids
      loop:
        - /tmp/fixture/clone/etc/machine-id
        - /tmp/fixture/clone/var/lib/dbus/machine-id

    - name: Assert machine-id files are empty (first-boot trigger)
      ansible.builtin.assert:
        that:
          - (item.content | b64decode) == ''
        fail_msg: >-
          {{ item.item }} is not empty; expected zeroed machine-id for
          first-boot trigger. Got: {{ item.content | b64decode | truncate(40) }}
      loop: "{{ _machine_ids.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat regenerated SSH host keys (must exist after keygen)
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _ssh_keys
      loop:
        - /tmp/fixture/clone/etc/ssh/ssh_host_rsa_key
        - /tmp/fixture/clone/etc/ssh/ssh_host_ecdsa_key
        - /tmp/fixture/clone/etc/ssh/ssh_host_ed25519_key

    - name: Assert SSH host keys were regenerated
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: >-
          {{ item.item }} missing or empty after identity reset;
          ssh-keygen step may have failed.
      loop: "{{ _ssh_keys.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read regenerated SSH host keys to confirm they are not stale
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: _ssh_key_contents
      loop:
        - /tmp/fixture/clone/etc/ssh/ssh_host_rsa_key
        - /tmp/fixture/clone/etc/ssh/ssh_host_ed25519_key

    - name: Assert regenerated keys do not contain stale fixture content
      ansible.builtin.assert:
        that:
          - "'STALE-KEY-FIXTURE' not in (item.content | b64decode)"
        fail_msg: >-
          {{ item.item }} still contains stale fixture key content;
          remove-and-regen step did not run.
      loop: "{{ _ssh_key_contents.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read /etc/hosts to confirm 127.0.1.1 line was updated
      ansible.builtin.slurp:
        src: /tmp/fixture/clone/etc/hosts
      register: _clone_hosts

    - name: Assert /etc/hosts contains the new hostname on 127.0.1.1
      ansible.builtin.assert:
        that:
          - "'127.0.1.1\tsmoke-host' in (_clone_hosts.content | b64decode)"
        fail_msg: >-
          /etc/hosts 127.0.1.1 line is not "smoke-host". Got:
          {{ _clone_hosts.content | b64decode }}

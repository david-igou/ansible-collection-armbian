---
- name: Converge — clone the synthetic template
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Apply rootfs_clone role
      ansible.builtin.include_role:
        name: david_igou.armbian.rootfs_clone
      vars:
        template_dir: /tmp/fixture/template
        target_dir: /tmp/fixture/clone
        hostname: smoke-host

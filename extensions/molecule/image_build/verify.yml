---
- name: Verify
  hosts: all
  gather_facts: false
  become: false
  vars:
    __userpatches_dir: "{{ image_build_cache_dir }}/{{ image_build_name }}/build/userpatches"
    __output_dir: "{{ image_build_cache_dir }}/output/{{ image_build_name }}"
  tasks:
    - name: Read the manifest
      ansible.builtin.slurp:
        src: "{{ __output_dir }}/manifest.json"
      register: __manifest_raw

    - name: Assert converge kept the seeded manifest
      ansible.builtin.assert:
        that:
          - (__manifest_raw.content | b64decode | from_json).built_at == 'PRESEED'

    - name: Look for compile.sh logs
      ansible.builtin.stat:
        path: "{{ image_build_cache_dir }}/{{ image_build_name }}/build/output/logs"
        get_checksum: false
      register: __logs

    - name: Assert compile.sh never ran
      ansible.builtin.assert:
        that:
          - not __logs.stat.exists

    - name: Stat the seeded compile tree and images
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "{{ image_build_cache_dir }}/{{ image_build_name }}/build/cache/sources/linux-kernel-worktree"
        - "{{ __output_dir }}/Armbian_OLD_Orangepi5pro_bookworm_current.img.xz"
        - "{{ __output_dir }}/Armbian_OLD_Orangepi5pro_bookworm_current.img.xz.sha"
        - "{{ __output_dir }}/Armbian_PRESEED_Orangepi5pro_bookworm_current.img.xz"
      register: __leftovers

    - name: Assert converge removed everything but the manifest's image
      ansible.builtin.assert:
        that:
          - __leftovers.results | selectattr('stat.exists') | map(attribute='item') | map('basename')
            == ['Armbian_PRESEED_Orangepi5pro_bookworm_current.img.xz']
        fail_msg: "left behind: {{ __leftovers.results | selectattr('stat.exists') | map(attribute='item') }}"

    - name: Read the written userpatches
      ansible.builtin.slurp:
        src: "{{ __userpatches_dir }}/{{ item.dest }}"
      loop: "{{ scenario_userpatches }}"
      loop_control:
        label: "{{ item.dest }}"
      register: __written

    - name: Assert every userpatch was written verbatim
      ansible.builtin.assert:
        that:
          - (item.content | b64decode) == item.item.content
        fail_msg: "{{ item.item.dest }} differs from the declared content"
      loop: "{{ __written.results }}"
      loop_control:
        label: "{{ item.item.dest }}"

    - name: Check the rebuild decision for each kind of input change
      ansible.builtin.include_tasks: tasks/plan_case.yml
      loop:
        - name: unchanged inputs
          needed: false
        - name: a changed compile arg
          compile_args: "{{ scenario_compile_args | combine({'BUILD_MINIMAL': 'no'}) }}"
          needed: true
        - name: changed userpatch content
          userpatches:
            - dest: "{{ scenario_userpatches[0].dest }}"
              content: "{{ scenario_userpatches[0].content }}# changed\n"
            - "{{ scenario_userpatches[1] }}"
          needed: true
        - name: image_build_force
          force: true
          needed: true
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Drop a file into userpatches/ that nobody declared
      ansible.builtin.copy:
        dest: "{{ __userpatches_dir }}/stray.conf"
        content: "not declared\n"
        mode: "0644"

    - name: Plan with the second userpatch dropped
      ansible.builtin.include_tasks: tasks/plan_case.yml
      vars:
        case:
          name: a dropped userpatch
          userpatches:
            - "{{ scenario_userpatches[0] }}"
          needed: true

    - name: Stat the userpatches that are no longer declared
      ansible.builtin.stat:
        path: "{{ __userpatches_dir }}/{{ item }}"
        get_checksum: false
      loop:
        - "{{ scenario_userpatches[1].dest }}"
        - stray.conf
      register: __pruned

    - name: Assert undeclared userpatches were removed
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "{{ item.item }} is still in userpatches/"
      loop: "{{ __pruned.results }}"
      loop_control:
        label: "{{ item.item }}"

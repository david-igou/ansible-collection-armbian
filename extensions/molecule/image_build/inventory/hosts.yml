---
# image_build is HEAVY. The Armbian build inside this VM requires
# substantial CPU/RAM/disk; defaults below are sized for the build.
# Running this scenario takes hours on TCG and ~30+ minutes on KVM.
# Gated behind manual invocation, not in default CI.
all:
  children:
    molecule:
      hosts:
        armbian-builder:
          mp:
            qemu:
              image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
              disk_size: 100G

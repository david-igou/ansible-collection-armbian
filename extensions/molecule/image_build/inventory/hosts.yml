---
# image_build runs through the role's skip-build short-circuit (see
# prepare.yml + verify.yml); no real Armbian build happens. disk_size is
# kept at 100G to satisfy the role's 50 GB preflight free-space assert
# without overriding armbian_build_min_free_gb. The qcow2 is sparse so
# the actual host footprint is much smaller.
all:
  children:
    molecule:
      hosts:
        armbian-builder:
          mp:
            qemu:
              image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
              disk_size: 100G

---
# Skip-build scenario for the image_build role on a qemu VM. Exercises
# preflight + manage_checkout + apply_userpatches + compute_inputs +
# check_manifest (the skip-build short-circuit) without invoking
# compile.sh. prepare.yml pre-seeds a manifest.json + placeholder .img.xz
# so the role's check_manifest decides to skip invoke_build.
#
# Real-image production is intentionally out of scope; that belongs to
# playbooks/build_image.yml against the armbian_builders inventory.
#
# Run with:  molecule test --scenario-name image_build
#
# Wall time: ~5–7 minutes (Docker install + shallow armbian/build clone).
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  name: image_build
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy

verifier:
  name: ansible

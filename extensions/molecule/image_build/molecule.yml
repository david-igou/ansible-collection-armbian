---
# Real-build scenario for the armbian_build role on a qemu VM.
# Manual / not-CI by design — wall time is dominated by the upstream
# Armbian kernel build and is measured in tens of minutes to hours.
#
# Run with:  MOLECULE_SCENARIO=image_build make molecule-qemu
#   or:      cd extensions/molecule/image_build && molecule create
#
# Resources: 8 vCPUs, 16 GB RAM, 100 GB disk. Requires a host with
# KVM acceleration — TCG will be impractically slow.
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  name: image_build
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy

verifier:
  name: ansible

---
- name: Prepare molecule instances
  import_playbook: david_igou.molecule_provisioners.prepare

- name: Install Docker for the debian user
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install the Docker apt prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
        state: present
        update_cache: true

    - name: Add the Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add the Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable"
        filename: docker
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-ce
          - docker-ce-cli
        state: present

    - name: Start Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Add debian to the docker group
      ansible.builtin.user:
        name: debian
        groups: docker
        append: true

    - name: Reconnect so the new group membership applies
      ansible.builtin.meta: reset_connection

# The seeded manifest uses the hash the role itself computes, so the
# scenario repeats neither the pinned ref nor the hash formula.
- name: Seed a manifest that matches the current inputs
  hosts: all
  gather_facts: false
  become: false
  vars:
    __output_dir: "{{ image_build_cache_dir }}/output/{{ image_build_name }}"
  tasks:
    - name: Plan the build
      ansible.builtin.include_role:
        name: david_igou.armbian.image_build
        tasks_from: plan

    - name: Assert a build is needed before anything is seeded
      ansible.builtin.assert:
        that:
          - image_build_needed | bool

    - name: Write a placeholder image
      ansible.builtin.copy:
        dest: "{{ __output_dir }}/Armbian_PRESEED_Orangepi5pro_bookworm_current.img.xz"
        content: ""
        mode: "0644"

    - name: Write the seeded manifest
      ansible.builtin.copy:
        dest: "{{ __output_dir }}/manifest.json"
        content: "{{ __manifest | to_nice_json(sort_keys=true) }}\n"
        mode: "0644"
      vars:
        __manifest:
          board: "{{ image_build_board }}"
          name: "{{ image_build_name }}"
          branch: current
          release: bookworm
          armbian_build_ref: preseeded
          image_filename: Armbian_PRESEED_Orangepi5pro_bookworm_current.img.xz
          built_at: PRESEED
          inputs_hash: "{{ image_build_inputs_hash }}"

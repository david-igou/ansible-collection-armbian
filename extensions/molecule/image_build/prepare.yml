---
# Scenario-specific prepare. Two plays:
#   1. Import the molecule_provisioners prepare (SSH wait + ephemeral inventory).
#   2. Install Docker CE on Debian trixie, configure binfmt_misc cross-arch
#      emulation, and verify Docker is reachable as the `debian` user.
#
# Notes on porting from the kubevirt/CentOS scenario:
#   - No separate scratch disk: the single 100G qcow2 is the only disk.
#     /var/lib/armbian_build lives on the root filesystem.
#   - SELinux: not present on Debian; skip setenforce/lineinfile.
#   - ext4 module: built into the Debian trixie kernel; no modprobe needed.
#   - Docker CE apt repo: same as the kubevirt scenario but Debian-flavoured.
#   - MTU: qemu SLIRP networking uses 1500-byte MTU on the guest interface
#     (unlike OVN's 1400-byte MTU in KubeVirt). Still detect and configure
#     docker daemon.json to match so the logic stays correct if the interface
#     MTU changes (e.g. bridged networking in future).
#   - binfmt_misc + tonistiigi/binfmt: preserved verbatim — required for
#     armbian/build's cross-arch docker container to register aarch64 binfmts.
#   - cloud-user → debian: Debian trixie cloud images use the `debian` user.

- name: Prepare molecule instances
  import_playbook: david_igou.molecule_provisioners.prepare

- name: Install Docker and armbian/build prerequisites
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Install Docker, git, make, build dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - make
          - rsync
          - xz-utils
        state: present
        update_cache: true

    - name: Add Docker apt repo key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository (Debian trixie)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian trixie stable"
        state: present
        filename: docker
        update_cache: true

    - name: Install Docker engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    # armbian/build's check_filesystem_compatibility_on_host greps
    # /proc/filesystems for ROOTFS_TYPE (default ext4). On Debian trixie
    # ext4 is compiled in (not a module), so it is always present. No
    # modprobe needed — but we assert it exists for early failure.
    - name: Confirm ext4 is in /proc/filesystems
      ansible.builtin.command:
        cmd: grep -wq ext4 /proc/filesystems
      changed_when: false

    # armbian/build inside its build container calls
    # update-binfmts --enable qemu-{arm,aarch64,riscv64,loongarch64} and
    # then arch-test arm64. update-binfmts fails inside the container on
    # this kernel (writes to /proc/sys/fs/binfmt_misc/register get rejected
    # despite --privileged), so arch-test never finds a working aarch64
    # interpreter and the build aborts. Standard fix: pre-register all
    # qemu-* binfmts on the HOST kernel via the tonistiigi/binfmt image.
    # Once registered (with the F flag, which embeds the qemu binary into
    # the registration), the build container sees them already present
    # and the per-arch update-binfmts calls become no-ops.
    #
    # binfmt_misc may not be mounted on cloud images — load + mount first
    # so the tonistiigi/binfmt install survives container exit.
    - name: Load binfmt_misc kernel module
      ansible.builtin.command:
        cmd: modprobe binfmt_misc
      changed_when: false

    - name: Mount binfmt_misc on /proc/sys/fs/binfmt_misc
      ansible.posix.mount:
        path: /proc/sys/fs/binfmt_misc
        src: binfmt_misc
        fstype: binfmt_misc
        state: mounted

    # Detect and configure Docker bridge MTU to match the VM's uplink.
    # On qemu SLIRP the guest interface is typically enp*s0 at 1500 bytes;
    # on some hypervisor-specific setups it may differ. We detect at runtime
    # and write daemon.json so Docker's docker0 picks up the same MTU —
    # preventing silent TCP fragmentation drops inside build containers.
    - name: Detect VM uplink interface name (first non-loopback)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip -o link show | awk -F': ' '$2 !~ /^lo$/ {print $2; exit}'
      changed_when: false
      register: _uplink_iface

    - name: Detect VM uplink MTU
      ansible.builtin.command:
        cmd: "ip -o link show {{ _uplink_iface.stdout | trim }}"
      changed_when: false
      register: _uplink_link

    - name: Extract uplink MTU
      ansible.builtin.set_fact:
        _vm_mtu: "{{ _uplink_link.stdout | regex_search('mtu (\\d+)', '\\1') | first | int }}"

    - name: Configure docker bridge MTU to match VM uplink
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "mtu": {{ _vm_mtu }}
          }
        mode: "0644"
      register: _daemon_json

    - name: Enable and start docker.service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Restart docker if daemon.json changed
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when: _daemon_json.changed

    - name: Confirm docker0 picked up the new MTU
      ansible.builtin.command:
        cmd: ip -o link show docker0
      changed_when: false
      register: _docker0_link

    - name: Assert docker0 MTU matches VM uplink
      ansible.builtin.assert:
        that:
          - ('mtu ' ~ _vm_mtu) in _docker0_link.stdout
        fail_msg: >-
          docker0 MTU did not pick up the daemon.json setting.
          Got: {{ _docker0_link.stdout }}, expected mtu={{ _vm_mtu }}

    - name: Add debian user to docker group
      ansible.builtin.user:
        name: debian
        groups: docker
        append: true

    - name: Reset SSH connection so debian user picks up the docker group
      ansible.builtin.meta: reset_connection

    - name: Pre-register cross-architecture qemu binfmts on the host
      ansible.builtin.command:
        cmd: docker run --rm --privileged docker.io/tonistiigi/binfmt:latest --install all
      changed_when: true
      register: _binfmt_install

    - name: Confirm aarch64 binfmt is registered
      ansible.builtin.stat:
        path: /proc/sys/fs/binfmt_misc/qemu-aarch64
      register: _aarch64_binfmt

    - name: Assert aarch64 binfmt registration
      ansible.builtin.assert:
        that: _aarch64_binfmt.stat.exists
        fail_msg: >-
          qemu-aarch64 binfmt is not registered on the host kernel — armbian/build's arch-test will fail.
          tonistiigi/binfmt stdout: {{ _binfmt_install.stdout | default('') }}
          stderr: {{ _binfmt_install.stderr | default('') }}

    - name: Verify Docker reachability as debian user
      ansible.builtin.command:
        cmd: docker info
      become: false
      changed_when: false
      register: _docker_info

    - name: Assert Docker info reports a running daemon
      ansible.builtin.assert:
        that:
          - _docker_info.rc == 0
          - "'Server Version' in _docker_info.stdout"
        fail_msg: >-
          docker info as debian user did not report a running daemon.
          Got rc={{ _docker_info.rc }}, stdout={{ _docker_info.stdout | default('') }}

    - name: Ensure /var/lib/armbian_build exists
      ansible.builtin.file:
        path: /var/lib/armbian_build
        state: directory
        mode: "0755"

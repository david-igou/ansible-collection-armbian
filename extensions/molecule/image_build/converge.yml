---
- name: Converge
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Run image_build
      ansible.builtin.include_role:
        name: david_igou.armbian.image_build

    - name: Assert the seeded manifest made the role skip the build
      ansible.builtin.assert:
        that:
          - not image_build_needed | bool
          - image_build_manifest.built_at == 'PRESEED'
        fail_msg: "needed={{ image_build_needed }}, manifest={{ image_build_manifest }}"

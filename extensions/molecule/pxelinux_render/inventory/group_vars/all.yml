---
mp_defaults:
  podman:
    command: sleep infinity
    privileged: false

fixture_output_base: /tmp/pxelinux_render
fixture_common:
  pxelinux_render_board_mac: AA:BB:CC:DD:EE:FF
  pxelinux_render_console: ttyS2,1500000
  pxelinux_render_earlycon: uart8250,mmio32,0xfeb50000
  pxelinux_render_board_name: rock-5b
  pxelinux_render_nfs_server_ip: 192.0.2.10
  pxelinux_render_nfs_root_path: /srv/netboot/rootfs
  pxelinux_render_hostname: board-01
fixture_cases:
  nfs:
    pxelinux_render_boot_mode: nfs
  sd:
    pxelinux_render_boot_mode: sd
  local:
    pxelinux_render_boot_mode: local
  local_kernel:
    pxelinux_render_boot_mode: local_kernel
  verbose:
    pxelinux_render_boot_mode: nfs
    pxelinux_render_pxe_verbose: true
  no_dtb_nfs4:
    pxelinux_render_boot_mode: nfs
    pxelinux_render_tftp_dtb: ""
    pxelinux_render_nfs_version: 4
    pxelinux_render_board_name: ""
  extra:
    pxelinux_render_boot_mode: usb_rescue
    pxelinux_render_extra_modes:
      usb_rescue:
        menu_label: USB rescue rootfs
        root: LABEL=rescue_root

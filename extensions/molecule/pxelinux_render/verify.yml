---
- name: Verify pxelinux_render
  hosts: molecule
  gather_facts: false
  vars:
    rendered: "{{ dict(fixture_cases.keys() | zip(__slurped.results | map(attribute='content') | map('b64decode') | map('split', '\n'))) }}"
    nfs_append: "  append root=/dev/nfs nfsroot=192.0.2.10:/srv/netboot/rootfs/board-01,nfsvers=3,rw ip=dhcp rootwait rw console=ttyS2,1500000"
  tasks:
    - name: Read every rendered file
      ansible.builtin.slurp:
        src: "{{ fixture_output_base }}/{{ item }}/01-aa-bb-cc-dd-ee-ff"
      loop: "{{ fixture_cases.keys() }}"
      register: __slurped

    - name: Assert the nfs render matches the reference file exactly
      ansible.builtin.assert:
        that:
          - rendered.nfs == lookup('ansible.builtin.file', 'expected/nfs', rstrip=false).split('\n')
        fail_msg: "nfs render differs from expected/nfs:\n{{ rendered.nfs | join('\n') }}"

    - name: Assert each case selects its mode on exactly one default line
      ansible.builtin.assert:
        that:
          - rendered[item.key] | select('match', '^default ') | list == ['default ' ~ item.value.pxelinux_render_boot_mode]
        fail_msg: "{{ item.key }}: {{ rendered[item.key] | select('match', '^default ') | list }}"
      loop: "{{ fixture_cases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert the built-in labels are identical across the built-in modes
      ansible.builtin.assert:
        that:
          - rendered[item] | reject('match', '^default ') | list == rendered.nfs | reject('match', '^default ') | list
        fail_msg: "{{ item }} differs from nfs outside the default line"
      loop:
        - sd
        - local
        - local_kernel

    - name: Assert verbose mode appends earlycon to the three kernel labels only
      ansible.builtin.assert:
        that:
          - rendered.verbose | select('search', ' earlycon=uart8250,mmio32,0xfeb50000 loglevel=8 ') | list | length == 3
          - rendered.verbose | select('match', '^  append ') | list | length == 3
          - (nfs_append ~ ' earlycon=uart8250,mmio32,0xfeb50000 loglevel=8 ignore_loglevel initcall_debug printk.devkmsg=on'
             ~ ' systemd.log_level=debug systemd.log_target=console systemd.journald.forward_to_console=1') in rendered.verbose
        fail_msg: "{{ rendered.verbose | join('\n') }}"

    - name: Assert an empty dtb drops the fdt lines and NFS version 4 is honoured
      ansible.builtin.assert:
        that:
          - rendered.no_dtb_nfs4 | select('match', '^  fdt') | list == []
          - nfs_append | replace('nfsvers=3', 'nfsvers=4') in rendered.no_dtb_nfs4
          - "'# pxelinux.cfg for board-01' in rendered.no_dtb_nfs4"
        fail_msg: "{{ rendered.no_dtb_nfs4 | join('\n') }}"

    - name: Assert the extra mode renders its own label after the built-ins
      ansible.builtin.assert:
        that:
          - rendered.extra[:-1] | reject('match', '^default ') | list
            == (rendered.nfs | reject('match', '^default ') | list)[:-1] + extra_stanza
        fail_msg: "{{ rendered.extra | join('\n') }}"
      vars:
        extra_stanza:
          - ""
          - label usb_rescue
          - "  menu label USB rescue rootfs (board-01)"
          - "  kernel armbian/instance/vmlinuz"
          - "  initrd armbian/instance/initrd.img"
          - "  fdt    armbian/instance/board.dtb"
          - "  append root=LABEL=rescue_root rootfstype=ext4 rootwait rw console=ttyS2,1500000"

    - name: Render once more to read the output facts
      ansible.builtin.include_role:
        name: david_igou.armbian.pxelinux_render
      vars:
        pxelinux_render_output_dir: "{{ fixture_output_base }}/facts"
        pxelinux_render_board_mac: AA:BB:CC:DD:EE:FF
        pxelinux_render_boot_mode: sd
        pxelinux_render_console: ttyS2,1500000
        pxelinux_render_nfs_server_ip: 192.0.2.10
        pxelinux_render_nfs_root_path: /srv/netboot/rootfs
        pxelinux_render_hostname: board-01

    - name: Assert the output facts name the rendered file
      ansible.builtin.assert:
        that:
          - pxelinux_render_filename == '01-aa-bb-cc-dd-ee-ff'
          - pxelinux_render_file == fixture_output_base ~ '/facts/01-aa-bb-cc-dd-ee-ff'

    - name: Reject invalid inputs
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      loop:
        - name: unknown mode
          vars:
            pxelinux_render_boot_mode: nfs4
        - name: verbose without earlycon
          vars:
            pxelinux_render_boot_mode: nfs
            pxelinux_render_pxe_verbose: true
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

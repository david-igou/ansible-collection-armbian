---
- name: Verify — pxelinux.cfg output for both modes
  hosts: all
  gather_facts: false
  become: false

  vars:
    _nfs_file: /tmp/fixture/pxelinux.cfg_nfs/01-aa-bb-cc-dd-ee-ff
    _sd_file: /tmp/fixture/pxelinux.cfg_sd/01-aa-bb-cc-dd-ee-ff
    _verbose_file: /tmp/fixture/pxelinux.cfg_verbose/01-aa-bb-cc-dd-ee-ff

  tasks:
    - name: Slurp all three rendered files
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: _renders
      loop:
        - "{{ _nfs_file }}"
        - "{{ _sd_file }}"
        - "{{ _verbose_file }}"

    - name: Decode contents
      ansible.builtin.set_fact:
        _nfs_content: "{{ _renders.results[0].content | b64decode }}"
        _sd_content: "{{ _renders.results[1].content | b64decode }}"
        _verbose_content: "{{ _renders.results[2].content | b64decode }}"

    - name: Assert nfs-mode file has default=nfs and both labels
      ansible.builtin.assert:
        that:
          - "'default nfs' in _nfs_content"
          - "'label nfs' in _nfs_content"
          - "'label sd' in _nfs_content"
          - "'nfsroot=10.0.0.10:/mnt/ssd/netboot/rootfs/smoke-host' in _nfs_content"
          - "'kernel armbian/instance/vmlinuz' in _nfs_content"
          - "'fdt    armbian/instance/board.dtb' in _nfs_content"
          - "'console=ttyS2,1500000' in _nfs_content"
          - "'root=LABEL=armbi_root' in _nfs_content"
        fail_msg: "nfs render is wrong:\n{{ _nfs_content }}"

    - name: Assert sd-mode file flips only default; keeps both label bodies
      ansible.builtin.assert:
        that:
          - "'default sd' in _sd_content"
          - "'label nfs' in _sd_content"
          - "'label sd' in _sd_content"
          - "'default nfs' not in _sd_content"
        fail_msg: "sd render is wrong:\n{{ _sd_content }}"

    - name: Assert verbose render contains the earlycon suffix on all built-in labels
      ansible.builtin.assert:
        that:
          - "'earlycon=uart8250,mmio32,0xfeb50000' in _verbose_content"
          - "'loglevel=8' in _verbose_content"
          - _verbose_content.split('earlycon=uart8250,mmio32,0xfeb50000') | length == 4  # 3 occurrences (nfs/sd/local) = 4 splits
        fail_msg: "verbose render is wrong:\n{{ _verbose_content }}"

    - name: Slurp local_kernel rendered file
      ansible.builtin.slurp:
        src: /tmp/fixture/pxelinux.cfg_local_kernel/01-aa-bb-cc-dd-ee-ff
      register: _local_kernel_render

    - name: Decode local_kernel content
      ansible.builtin.set_fact:
        _local_kernel_content: "{{ _local_kernel_render.content | b64decode }}"

    - name: Assert local_kernel render emits localboot-only label and selects it
      ansible.builtin.assert:
        that:
          - "'default local_kernel' in _local_kernel_content"
          - "'label local_kernel' in _local_kernel_content"
          - "'localboot 0' in _local_kernel_content"
          # Built-in labels still rendered so the operator can flip back
          # without re-uploading.
          - "'label nfs' in _local_kernel_content"
          - "'label sd' in _local_kernel_content"
          - "'label local' in _local_kernel_content"
        fail_msg: "local_kernel render is wrong:\n{{ _local_kernel_content }}"

    - name: Assert local_kernel label body has no kernel/initrd/fdt/append directives
      vars:
        # After the label header, find the next label boundary. Use
        # '\nlabel ' (newline + 'label ') to avoid false-matching the
        # `menu label` directive within the same body.
        _after_header: "{{ _local_kernel_content.split('label local_kernel')[1] }}"
        _local_kernel_body: "{{ _after_header.split('\nlabel ')[0] }}"
      ansible.builtin.assert:
        that:
          - "'localboot 0' in _local_kernel_body"
          # Indented directives — won't match the label header line itself.
          - "'\n  kernel ' not in _local_kernel_body"
          - "'\n  initrd ' not in _local_kernel_body"
          - "'\n  fdt ' not in _local_kernel_body"
          - "'\n  append ' not in _local_kernel_body"
        fail_msg: |
          local_kernel label body should contain only `localboot 0`.
          Got:
          {{ _local_kernel_body }}

    - name: Slurp extra_modes rendered file
      ansible.builtin.slurp:
        src: /tmp/fixture/pxelinux.cfg_extra/01-aa-bb-cc-dd-ee-ff
      register: _extra_render

    - name: Decode extra_modes content
      ansible.builtin.set_fact:
        _extra_content: "{{ _extra_render.content | b64decode }}"

    - name: Assert extra_modes render has usb_rescue label active and correct append
      ansible.builtin.assert:
        that:
          - "'default usb_rescue' in _extra_content"
          - "'label usb_rescue' in _extra_content"
          - "'append root=LABEL=rescue_root' in _extra_content"
        fail_msg: "extra_modes render is wrong:\n{{ _extra_content }}"

---
- name: Converge
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Render one pxelinux.cfg per case
      ansible.builtin.include_role:
        name: david_igou.armbian.pxelinux_render
      vars:
        pxelinux_render_output_dir: "{{ fixture_output_base }}/{{ item.key }}"
        pxelinux_render_board_mac: "{{ fixture_common.pxelinux_render_board_mac }}"
        pxelinux_render_console: "{{ fixture_common.pxelinux_render_console }}"
        pxelinux_render_earlycon: "{{ fixture_common.pxelinux_render_earlycon }}"
        pxelinux_render_board_name: "{{ item.value.pxelinux_render_board_name | default(fixture_common.pxelinux_render_board_name) }}"
        pxelinux_render_nfs_server_ip: "{{ fixture_common.pxelinux_render_nfs_server_ip }}"
        pxelinux_render_nfs_root_path: "{{ fixture_common.pxelinux_render_nfs_root_path }}"
        pxelinux_render_hostname: "{{ fixture_common.pxelinux_render_hostname }}"
        pxelinux_render_boot_mode: "{{ item.value.pxelinux_render_boot_mode }}"
        pxelinux_render_pxe_verbose: "{{ item.value.pxelinux_render_pxe_verbose | default(false) }}"
        pxelinux_render_nfs_version: "{{ item.value.pxelinux_render_nfs_version | default(3) }}"
        pxelinux_render_tftp_dtb: "{{ item.value.pxelinux_render_tftp_dtb | default('armbian/' ~ inventory_hostname ~ '/board.dtb') }}"
        pxelinux_render_extra_modes: "{{ item.value.pxelinux_render_extra_modes | default({}) }}"
      loop: "{{ fixture_cases | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

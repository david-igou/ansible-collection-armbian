---
# Pure fact resolution: the boards are local-connection hosts, so no
# instance is created and the runtime inventory is not loaded. destroy
# matches no instance but resets molecule's state, so prepare (which starts
# the fixture server) runs on every test.
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
  playbooks:
    cleanup: cleanup.yml

scenario:
  name: board_config
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

---
# Pure fact resolution: the boards are local-connection hosts, so no
# instance is created and the runtime inventory is not loaded.
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
  playbooks:
    cleanup: cleanup.yml

scenario:
  name: board_config
  test_sequence:
    - dependency
    - syntax
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup

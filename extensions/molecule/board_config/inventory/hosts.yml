---
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    rk3588:
      hosts:
        board-full:
          board_config_host:
            extras:
              storage: nvme 0:4
          board_config_build_host:
            compile_args:
              BUILD_MINIMAL: "no"
            userpatches:
              - dest: customize-image.sh
                template: customize-image.sh.j2
          fixture_hook_message: hello from the host layer
        board-dup-dest:
          board_config_build_host:
            userpatches:
              - dest: config/boards/rock-5b.conf
                content: collides with the model layer
          negative_entry: build
          negative_error: >-
            duplicate userpatch dest across the build layers. dests =
            ['config/sources/families/rockchip-rk3588.conf', 'config/boards/rock-5b.conf',
            'config/boards/rock-5b.conf']
        board-no-manifest:
          negative_entry: rootfs_src
          negative_error: no manifest at http://127.0.0.1:18580/images/board-no-manifest/manifest.json (HTTP 404)
    rock_5b:
      hosts:
        board-full:
        board-dup-dest:
        board-no-manifest:
    board_override:
      hosts:
        board-override:
          board_config_model:
            armbian_board_name: generic-x86
            console: ttyS0,115200
          board_config_rootfs_src_override: https://images.example.com/generic.img.xz
          board_config_rootfs_checksum_override: sha256:0123abcd
    case_ok:
      hosts:
        board-full:
        board-override:
    case_negative:
      hosts:
        board-dup-dest:
        board-no-manifest:
        board-no-console:
          board_config_model:
            armbian_board_name: no-console
          negative_entry: main
          negative_error: missing required field(s) console.
        board-bad-manifest:
          board_config_assets_base_url: http://127.0.0.1:18580/
          negative_entry: rootfs_src
          negative_error: manifest at http://127.0.0.1:18580/images/board-bad-manifest/manifest.json has no image_filename

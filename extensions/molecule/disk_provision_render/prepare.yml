---
- name: Prepare disk-provision-render instance
  hosts: all
  gather_facts: false

  tasks:
    - name: Update apt cache
      ansible.builtin.raw: apt-get update -qq
      changed_when: true

    - name: Bootstrap python3 (no python available yet in debian:12 base)
      ansible.builtin.raw: apt-get install -y --no-install-recommends python3
      changed_when: true

    - name: Ensure sudo is installed
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: false

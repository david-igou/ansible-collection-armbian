---
- name: Converge
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Bootstrap the board
      ansible.builtin.include_role:
        name: david_igou.armbian.bootstrap_armbian
      vars:
        bootstrap_armbian_user: ansibletest
        bootstrap_armbian_ssh_keys:
          - "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/fixture_user_key.pub') }}"

---
# Not the provisioner's prepare: the Armbian image has no cloud-init, so the
# provisioner's user does not exist. Connect as root with Armbian's first-boot
# password, plant the run's key for root, and point the runtime inventory at
# root.
- name: Read the runtime inventory and create the fixture key pair
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/molecule_runtime.yml"
  tasks:
    - name: Load the runtime inventory
      ansible.builtin.set_fact:
        fixture_runtime: "{{ lookup('ansible.builtin.file', runtime_file) | from_yaml }}"

    - name: Create the key pair the bootstrapped user logs in with
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - fixture@bootstrap_armbian
          - -f
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fixture_user_key"
        creates: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fixture_user_key"

- name: Plant the run's key for root using the first-boot password
  hosts: molecule
  gather_facts: false
  vars:
    ansible_user: root
    ansible_password: "1234"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o PreferredAuthentications=password -o PubkeyAuthentication=no
  tasks:
    - name: Wait for root SSH with the first-boot password
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 15
        sleep: 5

    - name: Authorize the run's key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('ansible.builtin.file', ansible_ssh_private_key_file ~ '.pub') }}"
        state: present

    - name: Ensure the first-login prompt is present, as on a fresh image
      ansible.builtin.copy:
        dest: /root/.not_logged_in_yet
        content: ""
        force: false
        mode: "0644"

- name: Point the runtime inventory at root
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root_user:
      all:
        hosts:
          instance:
            ansible_user: root
  tasks:
    - name: Rewrite the runtime inventory
      ansible.builtin.copy:
        dest: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory/molecule_runtime.yml"
        content: "{{ fixture_runtime | ansible.builtin.combine(root_user, recursive=true) | to_nice_yaml }}"
        mode: "0600"

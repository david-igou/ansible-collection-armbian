---
# The Armbian UEFI x86 image itself, booted as shipped: no cloud-init, root
# with the first-boot password (see prepare.yml).
all:
  children:
    molecule:
      hosts:
        instance:
          mp:
            qemu:
              image: https://dl.armbian.com/uefi-x86/Trixie_cloud_minimal-qcow2
              firmware: uefi

---
all:
  children:
    molecule:
      hosts:
        instance:
          mp:
            qemu:
              image: https://dl.armbian.com/uefi-x86/Trixie_cloud_minimal-qcow2
              firmware: uefi
              # No disk_size — the Armbian image has a 16 GiB virtual disk;
              # specifying a smaller value would trigger a shrink (unsupported
              # without --shrink) and a larger resize is unnecessary.

---
# Layer 2: privileged container + loop device + real systemd-repart.
# CI risk noted in spec: losetup may be blocked by kernel seccomp.
# Per spec, this scenario is hardware-only fallback if CI proves flaky.

dependency:
  name: galaxy
  options:
    requirements-file: extensions/molecule/provisioners/${PROVISIONER:-podman}/requirements.yml
    force: true

driver:
  name: default
  options:
    managed: true
    ansible_connection_options:
      connection: local

platforms:
  - name: disk-provision-loopback
    podman:
      image: docker.io/library/debian:12
      command: sleep 1d
      privileged: true
      capabilities:
        - SYS_ADMIN
      volumes:
        - /dev:/dev

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    create: ../provisioners/${PROVISIONER:-podman}/create.yml
    destroy: ../provisioners/${PROVISIONER:-podman}/destroy.yml
    prepare: prepare.yml
    verify: verify.yml
  inventory:
    links:
      group_vars: ../provisioners/${PROVISIONER:-podman}/group_vars/

verifier:
  name: ansible

scenario:
  name: disk_provision_loopback
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy

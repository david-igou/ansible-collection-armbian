---
- name: Prepare disk-provision-loopback instance
  hosts: all
  gather_facts: false

  tasks:
    - name: Update apt cache
      ansible.builtin.raw: apt-get update -qq
      changed_when: true

    - name: Bootstrap python3 (no python available yet in debian:12 base)
      ansible.builtin.raw: apt-get install -y --no-install-recommends python3
      changed_when: true

- name: Install packages and create loopback device
  hosts: all
  gather_facts: true

  tasks:
    - name: "Install systemd-repart, util-linux, rsync, e2fsprogs, dosfstools"
      ansible.builtin.apt:
        name:
          - systemd
          - util-linux
          - rsync
          - e2fsprogs
          - dosfstools
        state: present
        update_cache: false

    - name: "Create a 2 GiB sparse file"
      ansible.builtin.command: "truncate -s 2G /tmp/loopback.img"
      changed_when: true

    - name: "Attach as a loop device"
      ansible.builtin.command: "losetup -f --show /tmp/loopback.img"
      register: _loop
      changed_when: true

    - name: "Persist the loop device path for converge + verify"
      ansible.builtin.copy:
        dest: /tmp/loop_device
        content: "{{ _loop.stdout }}\n"
        mode: "0644"

---
# Creates a KubeVirt VM using a containerDisk root.
#
# When `vm.kubevirt.scratch_disk_size` is set, an additional `emptyDisk`
# is attached as `/dev/vdb` (raw, unformatted). The scenario's prepare
# playbook is responsible for partitioning, formatting, and mounting it.
# Used for build scratch space when the cluster does not grant
# DataVolume/PVC create perms in the molecule namespace.
#
# Cloud-init uses the `packages:` directive to install `qemu-guest-agent`
# (package-manager-agnostic, runs idempotently before runcmd) and
# `runcmd` only for things `packages:` cannot express (hostname, daemon
# enable). This is intentionally distro-agnostic so a future Ubuntu/Debian
# platform requires no provisioner code changes.
#
# Disk format/mount is intentionally NOT done in cloud-init: cc_disk_setup
# in cloud-init 24.x has a known bug on RHEL/CentOS images where it bails
# on a fresh empty disk with `sfdisk: does not contain a recognized
# partition table`. Doing it in Ansible afterwards is more reliable and
# keeps the provisioner agnostic to filesystem choice.
#
# Example platform entry:
#
#   kubevirt:
#     image: quay.io/containerdisks/centos-stream:10
#     namespace: molecule
#     ssh_service: { type: NodePort }
#     ansible_user: cloud-user
#     memory: 16Gi
#     cpu_cores: 8
#     scratch_disk_size: 100Gi

- name: Determine whether this VM has a scratch disk
  ansible.builtin.set_fact:
    __kubevirt_has_scratch: "{{ (vm.kubevirt.scratch_disk_size | default('')) | length > 0 }}"

- name: Build VM disk list
  ansible.builtin.set_fact:
    __kubevirt_disks: >-
      {{
        [{'disk': {'bus': 'virtio'}, 'name': 'containerdisk'}]
        + ([{'disk': {'bus': 'virtio'}, 'name': 'scratchdisk'}] if __kubevirt_has_scratch else [])
        + [{'disk': {'bus': 'virtio'}, 'name': 'cloudinitdisk'}]
      }}

- name: Build VM volume list
  ansible.builtin.set_fact:
    __kubevirt_volumes: >-
      {{
        [{'name': 'containerdisk',
          'containerDisk': {'image': vm.kubevirt.image}}]
        + ([{'name': 'scratchdisk',
             'emptyDisk': {'capacity': vm.kubevirt.scratch_disk_size}}] if __kubevirt_has_scratch else [])
        + [{'name': 'cloudinitdisk',
            'cloudInitNoCloud': {'userData': __kubevirt_cloudinit}}]
      }}
  vars:
    __kubevirt_cloudinit: |
      #cloud-config
      preserve_hostname: true
      hostname: "{{ vm.name }}"
      fqdn: "{{ vm.name }}"
      prefer_fqdn_over_hostname: true
      users:
        - default
        - name: {{ vm.kubevirt.ansible_user }}
          lock_passwd: true
          sudo: ALL=(ALL) NOPASSWD:ALL
          ssh_authorized_keys:
            - "{{ temporary_ssh_public_key }}"
      packages:
        - qemu-guest-agent
      runcmd:
        - ["hostnamectl", "set-hostname", "{{ vm.name }}"]
        - ["systemctl", "enable", "--now", "qemu-guest-agent"]

- name: Create VM in KubeVirt
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        labels:
          kubevirt.io/domain: "{{ vm.name }}"
        name: "{{ vm.name }}"
        namespace: "{{ vm.kubevirt.namespace }}"
      spec:
        running: true
        template:
          metadata:
            labels:
              kubevirt.io/domain: "{{ vm.name }}"
          spec:
            domain:
              cpu:
                cores: "{{ vm.kubevirt.cpu_cores | default(1) | int }}"
              devices:
                disks: "{{ __kubevirt_disks }}"
              resources:
                requests:
                  memory: "{{ vm.kubevirt.memory | default('1Gi') }}"
            volumes: "{{ __kubevirt_volumes }}"

- name: Fetch VM pod info
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    label_selectors:
      - "vm.kubevirt.io/name={{ vm.name }}"
    namespace: "{{ vm.kubevirt.namespace }}"
  register: __kubevirt_vm_pod_info
  until:
    - __kubevirt_vm_pod_info.resources | default([]) | length > 0
    - __kubevirt_vm_pod_info.resources[0].spec.nodeName is defined
  retries: 60
  delay: 5

- name: Extract the node name from the VM pod info
  ansible.builtin.set_fact:
    __kubevirt_nodeport_host: >-
      {{ __kubevirt_vm_pod_info.resources | map(attribute='spec.nodeName') | list | first }}

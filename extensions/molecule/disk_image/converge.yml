---
- name: Converge
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Read the fixture loop devices
      ansible.builtin.slurp:
        src: /tmp/disk_image_targets.json
      register: __targets_raw

    - name: Write the raw image and the xz image to their own targets
      ansible.builtin.include_role:
        name: david_igou.armbian.disk_image
      vars:
        disk_image_source: "/tmp/{{ item.source }}"
        disk_image_target_device: "{{ (__targets_raw.content | b64decode | from_json)[item.target] }}"
      loop:
        - source: test.img
          target: target_raw
        - source: test.img.xz
          target: target_xz

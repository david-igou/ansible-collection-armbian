---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  vars:
    __targets: "{{ __targets_raw.content | b64decode | from_json }}"
  tasks:
    - name: Read the fixture loop devices
      ansible.builtin.slurp:
        src: /tmp/disk_image_targets.json
      register: __targets_raw

    - name: Compare each target's first 64 MiB with the source image
      ansible.builtin.command:
        argv:
          - cmp
          - --bytes=67108864
          - /tmp/test.img
          - "{{ __targets[item] }}"
      loop:
        - target_raw
        - target_xz
      changed_when: false

    - name: Partition the raw target so a partition node exists
      ansible.builtin.command:
        argv:
          - parted
          - --script
          - "{{ __targets.target_raw }}"
          - mklabel
          - msdos
          - mkpart
          - primary
          - ext4
          - 1MiB
          - 100%
      changed_when: true

    - name: Re-read the raw target's partition table
      ansible.builtin.command:
        argv:
          - partprobe
          - "{{ __targets.target_raw }}"
      changed_when: false

    - name: Wait for the partition node
      ansible.builtin.wait_for:
        path: "{{ __targets.target_raw }}p1"
        timeout: 10

    - name: Reject inputs that do not need a mounted target
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      loop:
        - name: source is neither URL nor absolute path
          source: not-a-url-and-not-a-path.img.xz
          target: "{{ __targets.target_xz }}"
          expect: disk_image_source must be
        - name: source has an unsupported extension
          source: /tmp/test.iso
          target: "{{ __targets.target_xz }}"
          expect: unsupported format
        - name: local source does not exist
          source: /tmp/missing.img.xz
          target: "{{ __targets.target_xz }}"
          expect: not a regular file
        - name: target is not a block device
          source: /tmp/test.img.xz
          target: /tmp/test.img
          expect: not a block device
        - name: target is a partition node
          source: /tmp/test.img.xz
          target: "{{ __targets.target_raw }}p1"
          expect: is a partition
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Format the raw target's partition
      ansible.builtin.command:
        argv:
          - mkfs.ext4
          - -q
          - "{{ __targets.target_raw }}p1"
      changed_when: true

    - name: Mount the raw target's partition
      ansible.posix.mount:
        path: /mnt/disk_image_busy
        src: "{{ __targets.target_raw }}p1"
        fstype: ext4
        state: ephemeral

    - name: Reject a target whose partition is mounted
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        case:
          name: target backs a mounted filesystem
          source: /tmp/test.img.xz
          target: "{{ __targets.target_raw }}"
          expect: backs a mounted filesystem

    - name: Unmount the raw target's partition
      ansible.posix.mount:
        path: /mnt/disk_image_busy
        state: unmounted

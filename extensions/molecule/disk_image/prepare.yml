---
- name: Prepare molecule instances
  import_playbook: david_igou.molecule_provisioners.prepare

- name: Build the image and loop-device fixtures
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install the tools the role and the fixtures need
      ansible.builtin.apt:
        name:
          - curl
          - parted
          - util-linux
          - xz-utils
        state: present
        update_cache: true

    - name: Write a 64 MiB random raw image
      ansible.builtin.command:
        argv:
          - dd
          - if=/dev/urandom
          - of=/tmp/test.img
          - bs=1M
          - count=64
        creates: /tmp/test.img

    - name: Compress a copy of the image to test.img.xz
      ansible.builtin.command:
        argv:
          - xz
          - --keep
          - -T0
          - /tmp/test.img
        creates: /tmp/test.img.xz

    - name: Create sparse 1 GiB target files
      ansible.builtin.command:
        argv:
          - truncate
          - --size=1G
          - "/tmp/{{ item }}.img"
        creates: "/tmp/{{ item }}.img"
      loop:
        - target_raw
        - target_xz

    - name: Attach the target files as loop devices
      ansible.builtin.command:
        argv:
          - losetup
          - --find
          - --show
          - "/tmp/{{ item }}.img"
      loop:
        - target_raw
        - target_xz
      register: __fixture_loops
      changed_when: true

    - name: Record the loop device of each target
      ansible.builtin.copy:
        dest: /tmp/disk_image_targets.json
        content: >-
          {{ dict(__fixture_loops.results | map(attribute='item')
                  | zip(__fixture_loops.results | map(attribute='stdout')))
             | to_json }}
        mode: "0644"

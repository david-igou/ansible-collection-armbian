---
# A VM, not a container: the role must probe a real sshd through the
# forwarded port and log in over SSH.
all:
  children:
    molecule:
      hosts:
        instance:
          mp:
            qemu:
              image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
              disk_size: 4G

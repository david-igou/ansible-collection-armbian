---
- name: Verify board_boot_wait
  hosts: molecule
  gather_facts: false
  vars:
    count_hook: "{{ playbook_dir }}/tasks/count_power_cycle.yml"
  tasks:
    - name: Reset the power-cycle counter
      ansible.builtin.set_fact:
        fixture_power_cycles: 0

    - name: Boot a reachable instance
      ansible.builtin.include_role:
        name: david_igou.armbian.board_boot_wait
      vars:
        board_boot_wait_power_cycle_tasks: "{{ count_hook }}"
        board_boot_wait_attempts: 3
        board_boot_wait_port_timeout: 30
        board_boot_wait_ssh_timeout: 30

    - name: Assert a reachable instance needs exactly one attempt
      ansible.builtin.assert:
        that:
          - fixture_power_cycles | int == 1
        fail_msg: "Expected 1 power cycle, got {{ fixture_power_cycles }}"

    - name: Reset the power-cycle counter
      ansible.builtin.set_fact:
        fixture_power_cycles: 0

    - name: Retry an unroutable board and fail at the port stage
      block:
        - name: Wait for an unroutable board
          ansible.builtin.include_role:
            name: david_igou.armbian.board_boot_wait
          vars:
            # TEST-NET-2 (RFC 5737): nothing answers.
            ansible_host: 198.51.100.99
            board_boot_wait_power_cycle_tasks: "{{ count_hook }}"
            board_boot_wait_attempts: 2
            board_boot_wait_port_timeout: 3

        - name: Fail because the role accepted an unroutable board
          ansible.builtin.fail:
            msg: SENTINEL board_boot_wait accepted an unroutable board
      rescue:
        - name: Assert both attempts ran and the port stage is named
          ansible.builtin.assert:
            that:
              - fixture_power_cycles | int == 2
              - "'after 2 attempt(s): the port stage timed out' in ansible_failed_result.msg"
            fail_msg: "cycles={{ fixture_power_cycles }} msg={{ ansible_failed_result.msg }}"

    - name: Fail at the ssh stage when the inventory user cannot log in
      block:
        - name: Wait as a user that does not exist
          ansible.builtin.include_role:
            name: david_igou.armbian.board_boot_wait
          vars:
            ansible_user: fixture-no-such-user
            board_boot_wait_port_timeout: 30
            board_boot_wait_ssh_timeout: 5

        - name: Fail because the role accepted a failed login
          ansible.builtin.fail:
            msg: SENTINEL board_boot_wait accepted a failed login
      rescue:
        - name: Assert the ssh stage is named
          ansible.builtin.assert:
            that:
              - "'after 1 attempt(s): the ssh stage timed out' in ansible_failed_result.msg"
            fail_msg: "msg={{ ansible_failed_result.msg }}"

    - name: Skip the login wait when board_boot_wait_ssh is false
      ansible.builtin.include_role:
        name: david_igou.armbian.board_boot_wait
      vars:
        ansible_user: fixture-no-such-user
        board_boot_wait_ssh: false
        board_boot_wait_port_timeout: 30

    - name: Reset the power-cycle counter
      ansible.builtin.set_fact:
        fixture_power_cycles: 0

    - name: Propagate a power-cycle failure without retrying
      block:
        - name: Boot through a failing power-cycle hook
          ansible.builtin.include_role:
            name: david_igou.armbian.board_boot_wait
          vars:
            board_boot_wait_power_cycle_tasks: "{{ playbook_dir }}/tasks/failing_power_cycle.yml"
            board_boot_wait_attempts: 3

        - name: Fail because the hook failure was swallowed
          ansible.builtin.fail:
            msg: SENTINEL board_boot_wait swallowed a power-cycle failure
      rescue:
        - name: Assert the hook failure propagated after one attempt
          ansible.builtin.assert:
            that:
              - fixture_power_cycles | int == 1
              - ansible_failed_result.msg == 'FIXTURE power controller unreachable'
            fail_msg: "cycles={{ fixture_power_cycles }} msg={{ ansible_failed_result.msg }}"

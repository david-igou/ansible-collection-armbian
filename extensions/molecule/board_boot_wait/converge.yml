---
- name: Converge
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Boot the instance through the power-cycle hook
      ansible.builtin.include_role:
        name: david_igou.armbian.board_boot_wait
      vars:
        board_boot_wait_power_cycle_tasks: "{{ playbook_dir }}/tasks/count_power_cycle.yml"
        board_boot_wait_attempts: 3
        board_boot_wait_port_timeout: 60
        board_boot_wait_ssh_timeout: 60

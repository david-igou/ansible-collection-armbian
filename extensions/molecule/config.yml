---
# Shared base config. Molecule discovers it only when run from the collection
# root and deep-merges it into every scenario's molecule.yml; relative playbook
# paths resolve against the scenario directory.
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: ../shared/create.yml
    destroy: ../shared/destroy.yml
    # Most scenarios build a fixture after the provisioner's prepare, so the
    # default is scenario-local; scenarios without fixtures point at
    # ../shared/prepare.yml.
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible

---
# Shared base config — molecule auto-discovers this at
# extensions/molecule/config.yml in collections and deep-merges it
# into every scenario's molecule.yml.
#
# Molecule runs its own `dependency` step before each scenario,
# installing the test-only collections listed in
# extensions/molecule/requirements-test.yml via ansible-galaxy.
# Paths in molecule config are resolved relative to molecule's
# working directory; scenarios in this collection are invoked
# from the collection root (see extensions/molecule/README.md),
# which is where the requirements file lives.
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml

---
# Shared base config — molecule auto-discovers this at
# extensions/molecule/config.yml in collections and deep-merges it
# into every scenario's molecule.yml. Keeps test-only dependencies
# (molecule_provisioners) out of the root requirements.yml so strict
# consumers of the collection don't auto-pull them.
dependency:
  name: galaxy
  options:
    # Point both the collections requirements-file AND the legacy
    # role-file at the same yaml — the file has only a `collections:`
    # block, so ansible-galaxy role install is a no-op, but pointing
    # role-file at an existing file suppresses molecule's "Missing
    # roles requirements file" warning.
    requirements-file: extensions/molecule/requirements-test.yml
    role-file: extensions/molecule/requirements-test.yml

---
# Shared base config — molecule auto-discovers this at
# extensions/molecule/config.yml in collections and deep-merges it
# into every scenario's molecule.yml.
#
# The `dependency` action is disabled here on purpose. Test-only
# collections live in extensions/molecule/requirements-test.yml and
# are installed once via the Makefile (`make install-test`) or the
# CI workflow's `Install dependencies` step, never by molecule itself.
#
# Why: molecule's galaxy dependency action calls
# `ansible-galaxy collection install -r <file>`, which for git-source
# requirements unconditionally `shutil.rmtree`s the destination before
# reinstalling. That blows up when a developer has the provisioner
# checked out and symlinked into ~/.ansible/collections/... for local
# iteration (Python's rmtree refuses to traverse a symlink, so the
# install crashes with rc=250). External-install + skip-if-present
# (see Makefile `install-test`) avoids the reinstall path entirely.
dependency:
  enabled: false

---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  vars:
    __state_files:
      hostname: "{{ rootfs_provision_target_dir }}/etc/hostname"
      hosts: "{{ rootfs_provision_target_dir }}/etc/hosts"
      fstab: "{{ rootfs_provision_target_dir }}/etc/fstab"
      machine_id: "{{ rootfs_provision_target_dir }}/etc/machine-id"
      dbus_machine_id: "{{ rootfs_provision_target_dir }}/var/lib/dbus/machine-id"
      ed25519_key: "{{ rootfs_provision_target_dir }}/etc/ssh/ssh_host_ed25519_key"
      ed25519_pub: "{{ rootfs_provision_target_dir }}/etc/ssh/ssh_host_ed25519_key.pub"
      rsa_key: "{{ rootfs_provision_target_dir }}/etc/ssh/ssh_host_rsa_key"
      first_login: "{{ rootfs_provision_target_dir }}/root/.no_armbian_first_login"
      only_in_v1: "{{ rootfs_provision_target_dir }}/etc/only-in-v1"
      only_in_v2: "{{ rootfs_provision_target_dir }}/etc/only-in-v2"
      decoy: "{{ rootfs_provision_target_dir }}/decoy-marker"
      local_edit: "{{ rootfs_provision_target_dir }}/etc/local-edit"
      sentinel: "{{ rootfs_provision_target_dir }}/.rootfs_provision.json"
      vmlinuz: "{{ rootfs_provision_tftp_dir }}/vmlinuz"
      initrd: "{{ rootfs_provision_tftp_dir }}/initrd.img"
      dtb: "{{ rootfs_provision_tftp_dir }}/board.dtb"
  tasks:
    - name: Read the state after converge
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Hash the published v1 image
      ansible.builtin.stat:
        path: "{{ rootfs_provision_src }}"
        checksum_algorithm: sha256
      register: __src_v1

    - name: Assert the v1 image was provisioned with a fresh identity
      ansible.builtin.assert:
        that:
          - __state.hostname == "board-01\n"
          - __state.hosts is search('(?m)^127[.]0[.]1[.]1\s+board-01$')
          - __state.machine_id == ''
          - __state.dbus_machine_id == ''
          - __state.ed25519_key != "stale-key\n"
          - "'ed25519_pub' in __state"
          - "'rsa_key' in __state"
          - "'first_login' in __state"
          - "'only_in_v1' in __state"
          - "'decoy' not in __state"
          - (__state.sentinel | from_json).src == rootfs_provision_src
          - (__state.sentinel | from_json).hostname == 'board-01'
          - (__state.sentinel | from_json).image_sha256 == __src_v1.stat.checksum
        fail_msg: "Provisioned state: {{ __state | dict2items | rejectattr('key', 'in', ['ed25519_key', 'rsa_key']) | items2dict }}"

    - name: Assert fstab lost only its /dev/ entries
      ansible.builtin.assert:
        that:
          - __state.fstab.splitlines() == ['LABEL=data /data ext4 defaults 0 2', 'tmpfs /tmp tmpfs defaults,nosuid 0 0']
        fail_msg: "fstab is {{ __state.fstab.splitlines() }}"

    - name: Assert the v1 kernel, initrd and DTB were staged for TFTP
      ansible.builtin.assert:
        that:
          - __state.vmlinuz == "kernel-v1\n"
          - __state.initrd == "initrd-v1\n"
          - __state.dtb == "dtb-v1\n"
        fail_msg: "TFTP files: {{ __state.vmlinuz | default('missing') }} {{ __state.initrd | default('missing') }} {{ __state.dtb | default('missing') }}"

    - name: Edit the provisioned rootfs locally
      ansible.builtin.copy:
        dest: "{{ __state_files.local_edit }}"
        content: "local\n"
        mode: "0644"

    - name: Re-run the role with the same image
      ansible.builtin.include_role:
        name: david_igou.armbian.rootfs_provision

    - name: Read the state after the unchanged re-run
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Assert the unchanged re-run skipped extraction
      ansible.builtin.assert:
        that:
          - "'local_edit' in __state"
        fail_msg: The rootfs was re-extracted although src, image and hostname were unchanged.

    - name: Publish v2 at the same source path
      ansible.builtin.copy:
        src: /tmp/fixtures/v2.img.xz
        dest: "{{ rootfs_provision_src }}"
        remote_src: true
        mode: "0644"

    - name: Hash the published v2 image
      ansible.builtin.stat:
        path: "{{ rootfs_provision_src }}"
        checksum_algorithm: sha256
      register: __src_v2

    - name: Re-run the role with the new image bytes and no DTB
      ansible.builtin.include_role:
        name: david_igou.armbian.rootfs_provision
      vars:
        rootfs_provision_dtb: ""

    - name: Read the state after the v2 run
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Assert v2 replaced the rootfs and the TFTP files
      ansible.builtin.assert:
        that:
          - __src_v2.stat.checksum != __src_v1.stat.checksum
          - (__state.sentinel | from_json).image_sha256 == __src_v2.stat.checksum
          - "'only_in_v2' in __state"
          - "'only_in_v1' not in __state"
          - "'local_edit' not in __state"
          - __state.vmlinuz == "kernel-v2\n"
          - __state.initrd == "initrd-v2\n"
          - "'dtb' not in __state"
        fail_msg: "State after v2: {{ __state.keys() | list }}, kernel {{ __state.vmlinuz | default('missing') }}"

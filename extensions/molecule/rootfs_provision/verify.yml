---
- hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Resolve test paths
      ansible.builtin.set_fact:
        _target: "{{ armbian_nfs_rootfs_path }}/{{ inventory_hostname }}"
        _tftp:   "{{ armbian_image_cache }}/sbc-tftp/{{ inventory_hostname }}"

    - name: Stat expected rootfs and TFTP artifact paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _stats
      loop:
        - "{{ _target }}/etc/hostname"
        - "{{ _target }}/etc/machine-id"
        - "{{ _target }}/.armbian_rootfs_provision_complete"
        - "{{ _tftp }}/vmlinuz"
        - "{{ _tftp }}/initrd.img"
        - "{{ _tftp }}/board.dtb"

    - name: Assert every expected file is present
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} is missing"
      loop: "{{ _stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read hostname file content
      ansible.builtin.command: "cat {{ _target }}/etc/hostname"
      register: _hostname_content
      changed_when: false

    - name: Assert hostname file contains inventory_hostname
      ansible.builtin.assert:
        that: _hostname_content.stdout == inventory_hostname
        fail_msg: >-
          Expected hostname {{ inventory_hostname }};
          got {{ _hostname_content.stdout }}

    - name: Stat machine-id for size check
      ansible.builtin.stat:
        path: "{{ _target }}/etc/machine-id"
      register: _mid_stat

    - name: Assert machine-id is zero-byte
      ansible.builtin.assert:
        that: _mid_stat.stat.size == 0
        fail_msg: "machine-id should be zero-byte; got {{ _mid_stat.stat.size }}"

    - name: Stat SSH host key (ed25519)
      ansible.builtin.stat:
        path: "{{ _target }}/etc/ssh/ssh_host_ed25519_key"
      register: _ssh_key_stat

    - name: Assert SSH host key was generated
      ansible.builtin.assert:
        that: _ssh_key_stat.stat.exists
        fail_msg: "ssh_host_ed25519_key is missing under {{ _target }}/etc/ssh/"

---
- name: Prepare molecule instances
  import_playbook: david_igou.molecule_provisioners.prepare

- name: Build two versions of a synthetic Armbian image
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install the tools the role and the fixtures need
      ansible.builtin.apt:
        name:
          - e2fsprogs
          - openssh-client
          - parted
          - rsync
          - xz-utils
        state: present
        update_cache: true

    - name: Create the fixture and source directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/fixtures
        - "{{ rootfs_provision_src | dirname }}"

    - name: Build the fixture images
      ansible.builtin.include_tasks: tasks/build_fixture.yml
      loop:
        - v1
        - v2
      loop_control:
        loop_var: version

    - name: Publish v1 at the source path
      ansible.builtin.copy:
        src: /tmp/fixtures/v1.img.xz
        dest: "{{ rootfs_provision_src }}"
        remote_src: true
        mode: "0644"

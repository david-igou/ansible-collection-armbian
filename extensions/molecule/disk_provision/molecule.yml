---
scenario:
  name: disk_provision
  # disk_provision always repartitions and reformats the device, so a
  # second converge cannot report zero changes; the shared idempotence step
  # is left out on purpose.
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
ansible:
  playbooks:
    prepare: prepare.yml

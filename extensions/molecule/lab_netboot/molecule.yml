---
prerun: false
dependency:
  name: shell
  command: bash ${MOLECULE_PROJECT_DIRECTORY}/extensions/molecule/lab_netboot/dependency.sh
  enabled: ${MOLECULE_DEPENDENCY_ENABLED:-true}
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
ansible:
  cfg:
    defaults:
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
      host_key_checking: false
      callbacks_enabled: ansible.posix.profile_tasks
    ssh_connection:
      pipelining: true
    persistent_connection:
      connect_timeout: 120
      command_timeout: 120
  playbooks:
    side_effect: side_effect.yml
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - side_effect
    - verify
    - destroy

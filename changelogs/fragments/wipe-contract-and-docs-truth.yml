---
breaking_changes:
  - >-
    disk_provision - the ``disk_binding.wipe`` sub-option has been
    removed. It was documented as a read-only "audit mode" safety
    switch (``wipe: false`` would fail instead of repartitioning), but
    no task ever consumed it — the role always applied the declared
    layout regardless of its value, so an operator relying on the
    documented audit mode would have had their disk wiped. Because
    argument-spec validation rejects unknown sub-options, remove any
    ``wipe:`` keys from ``armbian_local_disks`` entries in your
    inventory when upgrading. A real audit mode may return as an
    explicitly implemented option in a future release.
  - >-
    board_boot_verify - the ``boot_mode`` option no longer carries a
    ``choices:`` constraint. The constraint rejected user-defined
    modes at argument-spec validation before the role's documented
    ``extra_modes`` branch could run, making custom
    ``verify_match`` modes unusable. Built-in modes (``nfs``, ``sd``,
    ``local``, ``local_kernel``) behave exactly as before.
removed_features:
  - >-
    image_build - removed the unused ``armbian_build_user`` variable
    from ``defaults/main.yml`` and ``meta/argument_specs.yml``. It was
    documented ("user that owns the build tree") but never referenced
    by any task; compile.sh runs as the connecting ``ansible_user``.
  - >-
    inventory (sample) - removed the unused ``armbian_branch`` variable
    from ``inventory/group_vars/all.yml``. Nothing consumed it, and its
    comment pointed at an ``uboot_apt_package`` field that does not
    exist. Per-board U-Boot branch selection lives in
    ``armbian_build_model.branch``.
bugfixes:
  - >-
    disk_provision - the ``fast_wipe`` documentation claimed the role
    passes ``-K`` to mkfs.ext4; the actual mechanism is ``-E
    nodiscard`` via the ``SYSTEMD_REPART_MKFS_OPTIONS_EXT4``
    environment variable. Documentation now matches the
    implementation. No behavior change.
  - >-
    docs - the per-model-template + reflink-clone description of
    ``rootfs_provision`` (CLAUDE.md, README.md, playbooks/README.md,
    the docsite intro page, the role's own argument_specs, the sample
    inventory header, and test-harness comments) has been replaced
    with the implemented per-host-extraction model: the rootfs is
    extracted directly into a per-host directory, and same-URL hosts
    share only the ``.img.xz`` download via a URL-keyed cache.
  - >-
    docs - the TFTP layout prose (CLAUDE.md rb5009 section,
    ``upload_tftp_assets.yml`` header and task names) now describes
    the implemented per-host ``armbian/<inventory_hostname>/`` layout
    instead of the retired per-model ``armbian/<model>/`` layout. The
    ``armbian_tftp_upload_models`` parameter name is unchanged
    (documented as holding hostnames for backwards compatibility).
  - >-
    docs - ``cleanup_boot_files.yml`` is now described accurately
    (prunes stale published ``.img.xz`` files on the netboot server
    per each board's manifest.json); CLAUDE.md previously claimed it
    removed pxelinux.cfg files and TFTP rows from the router.
  - >-
    docs - corrected drifted play/phase counts in
    ``converge_boot_mode.yml`` (seven plays, including the ``--limit``
    guard) and ``playbooks/tasks/_converge_boot_mode.yml`` (six
    phases), removed stale internal ticket references ("Task 7/8/14")
    from comments, fixed the stale ``playbooks/test_fleet_e2e.yml``
    path in ``examples/disk_image.yml``, corrected
    ``playbooks/routeros/tasks/README.md``'s claim about who consumes
    ``plumbing_check_one.yml``, and renamed the converge play that
    imports ``persist_uboot_env.yml`` to reflect that it converges env
    for all ``spi_flash`` hosts (localcmd only lands on
    ``local_kernel`` + ``persist_via=spi`` hosts).
  - >-
    inventory (sample) - the ``armbian_persist_uboot_env`` comment now
    documents the implemented behavior (``never`` skips the
    persist_uboot_env.yml import; any other value behaves like
    ``auto`` — per-host spi_flash gating lives inside the imported
    playbook). The previously documented ``always`` value and "step
    3.5" reference matched no implemented semantics.

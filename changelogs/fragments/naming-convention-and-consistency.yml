---
breaking_changes:
  - >-
    disk_image - the role input parameters ``image_source`` and
    ``target_device`` have been renamed to ``disk_image_source`` and
    ``disk_image_target_device`` respectively, so every public input
    carries the role-name prefix (``disk_image_dd_bs`` already did).
    Update any ``vars:`` block that calls the role, plus any
    ``-e image_source=`` / ``-e target_device=`` overrides.
  - >-
    board_boot_verify - the role input parameters ``boot_mode``,
    ``extra_modes``, and ``local_kernel_verify_match`` have been renamed
    to ``board_boot_verify_mode``, ``board_boot_verify_extra_modes``,
    and ``board_boot_verify_local_kernel_match`` respectively. Update
    any ``vars:`` block that calls the role. Built-in modes (``nfs``,
    ``sd``, ``local``, ``local_kernel``), the
    ``armbian_board_config.local_kernel.verify_match`` fallback, and
    the custom-mode ``verify_match`` behaviour are unchanged.
  - >-
    disk_provision - the role input parameter ``disk_binding`` has been
    renamed to ``disk_provision_disk_binding``. Update any ``vars:``
    block that calls the role; the entry shape (``device``, ``layout``,
    ``force``, ``fast_wipe``) is unchanged.
minor_changes:
  - >-
    board_boot_verify - added the missing ``board_boot_verify_extra_modes``
    key to ``defaults/main.yml`` for spec/defaults parity, and normalized
    the role-internal facts to the ``__board_boot_verify_*`` prefix.
  - >-
    disk_image - normalized the role-internal validation facts/registers
    (``_partition_sysfs``, ``_lsblk_names``, ``_mounts_b64``,
    ``_proc_mounts``, ``_candidate_sources``, ``_mounted_match``,
    ``_src_stat``) to the ``__disk_image_*`` prefix.
  - >-
    docs - added a "Variable naming convention" section to CLAUDE.md
    documenting the four tiers (``armbian_*`` inventory vars,
    ``<role>_*`` role inputs, ``__<role>_*`` role internals, and ``_foo``
    include-time parameters).
  - >-
    consistency - named the remaining unnamed tasks across the composite
    playbooks and localhost contract tests, converted legacy top-level
    fact references (``ansible_mounts``, ``ansible_date_time``,
    ``ansible_env.HOME``) to the ``ansible_facts['...']`` bracket form,
    and switched bare ``import_playbook:`` occurrences to the FQCN
    ``ansible.builtin.import_playbook:``.
  - >-
    bootstrap_armbian - the ``Restart sshd`` handler now uses the
    collection ``<role> | <name>`` naming pattern with a ``listen:``
    topic, so existing ``notify: Restart sshd`` strings keep working.
  - >-
    pxelinux_render - the managed-file header now renders first via
    ``{{ ansible_managed | comment }}``. Rendered pxelinux directives are
    unchanged.
  - >-
    image_build - added the missing ``default:`` values for
    ``armbian_build_required_egress_hosts`` and
    ``armbian_build_compile_args`` in ``meta/argument_specs.yml`` so the
    argument spec matches ``defaults/main.yml``.
  - >-
    converge_boot_mode - the inline ``pxelinux_render`` call now passes
    ``pxelinux_render_extra_modes`` so it renders identically to the
    ``render_and_upload_pxelinux.yml`` entry point.
  - >-
    argument_specs - removed trailing periods from the ``short_description``
    of seven roles (board_boot_verify, board_boot_wait, bootstrap_armbian,
    disk_image, disk_provision, pxelinux_render, rootfs_provision).

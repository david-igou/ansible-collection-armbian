---
breaking_changes:
  - >-
    rootfs_provision - inputs are renamed from C(armbian_rootfs_*) to
    C(rootfs_provision_*) (C(rootfs_provision_hostname) replaces
    C(armbian_rootfs_host), C(rootfs_provision_force) replaces
    C(armbian_rootfs_force_refresh), C(rootfs_provision_cache_dir) replaces
    C(armbian_rootfs_image_cache)). C(rootfs_provision_target_dir),
    C(rootfs_provision_tftp_dir) and C(rootfs_provision_cache_dir) are required;
    the role no longer reads C(armbian_nfs_rootfs_path) or C(armbian_image_cache).
  - >-
    rootfs_provision - C(rootfs_provision_dtb) is optional; when empty no
    C(board.dtb) is staged and a previously staged one is removed.
  - >-
    rootfs_provision - the sentinel is now C(.rootfs_provision.json) with
    C(src), C(image_sha256), C(hostname) and C(provisioned_at); targets
    provisioned by earlier versions are extracted once more.
minor_changes:
  - >-
    rootfs_provision - new C(rootfs_provision_checksum) input passed to
    C(get_url); the fetch runs on every invocation and the skip decision
    compares the image sha256, so a republished image at the same source is
    picked up.
  - >-
    rootfs_provision - extraction mirrors the image with C(rsync --delete),
    picks the largest partition from C(lsblk --json), and the role uses four
    task files.

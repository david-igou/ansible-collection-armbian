---
minor_changes:
  - >-
    image_build - ``armbian_build_board`` and ``armbian_build_host`` no
    longer have empty-string defaults, so the ``required: true``
    declaration in ``meta/argument_specs.yml`` is actually enforced;
    omitting either now fails argument-spec validation with a clear
    message instead of relying solely on the in-role assert.
  - >-
    bootstrap_armbian - ``armbian_bootstrap_user`` is now correctly
    declared as optional with default ``armbian`` in
    ``meta/argument_specs.yml`` (the spec previously claimed
    ``required: true`` while a default existed, making the requirement
    unenforceable). No behavior change.
  - >-
    rootfs_provision - document the ``armbian_rootfs_mount_dir`` option
    in ``meta/argument_specs.yml`` (it was previously an undocumented
    default).
  - >-
    disk_provision - the internal ``__disk_provision_default_mount_opts``
    constant moved from ``defaults/main.yml`` to ``vars/main.yml`` so the
    defaults file only contains the role's public options. No behavior
    change.
  - >-
    pxelinux_render - the pxelinux.cfg template factors the repeated
    board-config lookups into top-level Jinja variables; rendered output
    is unchanged.
  - >-
    image_build - the armbian/build clone now shields itself from the
    connecting user's global git config via ``GIT_CONFIG_GLOBAL``
    (matching the compile.sh invocation) instead of blanking ``HOME``.
trivial:
  - >-
    test_resolve_rootfs_src.yml now pins ``armbian_assets_base_url: ""``
    at play scope in its guard case, so the test passes under any
    inventory instead of requiring an isolated ``-i localhost,`` run.
  - >-
    ``build`` (local docsite output) and ``docs/superpowers`` (internal
    design documents) are excluded from the built collection tarball.
  - >-
    Molecule scenario configs share their common executor/test-sequence
    shape via ``extensions/molecule/config.yml`` instead of duplicating
    it in every scenario.
  - >-
    Removed unused ansible-creator test scaffolding (placeholder pytest
    suites, ``test-requirements.txt``) and stale references to it in
    ``galaxy.yml``, ``.ansible-lint``, and the ``Makefile``.
  - >-
    tox-ansible.ini now documents that it feeds the sanity CI matrix and
    skips the py3.12-devel combination (ansible-core devel requires
    Python >= 3.13 since June 2026, but tox-ansible still generates the
    cell).
  - >-
    CI workflow now declares least-privilege read-only permissions.
  - >-
    MAINTAINERS file populated; CONTRIBUTING.md updated to match the
    current inventory-driven board-metadata model and molecule scenario
    layout.

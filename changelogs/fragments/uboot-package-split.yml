---
breaking_changes:
  - >-
    ``board_configs.<model>.uboot_package`` (in
    ``roles/bootloader/vars/boards.yml``) has been removed and replaced by two
    fields, ``uboot_apt_package`` and ``uboot_install_dir``. Armbian publishes
    each U-Boot deb under one name (``linux-u-boot-<board>-<branch>``) but
    installs its binaries under a directory whose segments are swapped
    (``/usr/lib/linux-u-boot-<branch>-<board>``). The single-field schema
    forced an incorrect value at one or both call sites — every previous
    ``uboot_package`` value happened to use the install-dir format, so the
    ``apt install`` step in the ``bootloader`` role failed for all boards.
    Custom boards.yml entries must now set both fields explicitly. Verify by
    extracting the deb (``dpkg-deb -c``) — segment dashing inside the board
    name is inconsistent across boards (``orangepi5pro`` vs.
    ``orangepi5-max``).

bugfixes:
  - >-
    Corrected ``board_configs.orange-pi-5-pro.has_spi`` from ``true`` to
    ``false``. The Orange Pi 5 Pro spec sheet lists "SPI NOR Flash footprint"
    — most retail units ship without the chip populated, so the SD-card
    bootloader path is the safer default. Override to ``true`` in inventory
    when a specific board is known to have SPI populated.
  - >-
    Corrected the U-Boot apt package and install-dir names for every board
    in ``roles/bootloader/vars/boards.yml``. The previous values used the
    install-dir naming format only and would not have installed via
    ``apt``. In particular, ``orange-pi-5-pro`` now points at the ``edge``
    branch (no ``current`` deb is published for that board) and uses the
    correct undashed segment ``orangepi5pro``.

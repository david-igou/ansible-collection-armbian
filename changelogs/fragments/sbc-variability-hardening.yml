---
breaking_changes:
  - >-
    Renamed the per-board ``uboot_emmc_image`` field in
    ``roles/bootloader/vars/boards.yml`` to ``uboot_disk_image``. The same
    binary is written to eMMC, SD card, and (where supported) NVMe — the
    "eMMC" name was misleading. Custom boards.yml entries must rename the
    field; tasks now look for ``_board.uboot_disk_image``.
  - >-
    ``inventory/group_vars/rk3588.yml`` no longer carries the per-board
    "defaults" ``emmc_device``, ``nvme_device``, ``board_console``,
    ``uboot_sd_env_offset``, ``uboot_sd_env_size``, and
    ``uboot_boot_targets_pxe``. None were actually consumed by tasks (the
    live values came from per-board fields, ``/etc/fw_env.config``, or
    inline ternaries) and they misled contributors into assuming
    SoC-level uniformity that does not hold across RK3588 boards. The
    boot-targets list is now per-board (``board_configs.<model>.boot_targets_pxe``);
    the env offset/size are read dynamically from each rootfs.

minor_changes:
  - >-
    Added ``has_emmc`` capability flag and ``flash_target_device``,
    ``boot_targets_pxe``, ``armbian_support`` per-board fields in
    ``roles/bootloader/vars/boards.yml``. The bootloader role now routes
    to SPI vs. eMMC based on ``has_spi``/``has_emmc`` rather than implicit
    fall-through, hard-failing when neither is populated and the user
    must use ``prepare_sd_card.yml`` instead.
  - >-
    Added ``host_board_overrides`` mechanism. Set this dict in a host's
    vars to shadow individual ``board_configs`` fields for that one host
    (e.g. a single Rock 5B unit with unpopulated SPI). The bootloader,
    reprovision, and prepare_sd_card task files merge it on top of the
    model defaults when resolving ``_board``. See ``CLAUDE.md``.
  - >-
    Bootloader role now warns when running against a board whose
    ``armbian_support`` tier is not ``standard`` (``community``, ``wip``,
    etc.). Image and U-Boot package versions should be pinned for those
    boards since they may change without notice.

bugfixes:
  - >-
    SPI MTD device is now detected by ``/sys/class/mtd/mtd*/name`` label
    rather than always assuming ``/dev/mtd0``. The configured
    ``spi_mtd_device`` (per-board override or role default) is used as
    a fallback only when no labeled partition matches.
  - >-
    ``flash_emmc.yml`` now stat-checks both the eMMC boot partition and
    its ``force_ro`` sysfs attribute before any destructive operation.
    On a board without populated eMMC the previous code disabled
    ``force_ro`` on a possibly non-existent path and proceeded to ``dd``
    to whatever ``/dev/mmcblk0boot0`` resolved to — which on a non-eMMC
    board could have written U-Boot blob bytes to the SD card.
  - >-
    ``reprovision`` role now uses the per-board ``flash_target_device``
    instead of inferring ``/dev/nvme0n1`` vs. ``/dev/mmcblk0`` from
    ``primary_storage``. It also stat-checks that the target is a block
    device and refuses to flash a removable device (which guards against
    the PXE SD card being treated as primary storage when NVMe is
    missing or named differently).
  - >-
    ``netboot_assets`` now tries multiple known DTB locations in the
    Armbian rootfs (``/boot/dtb/<dtb>``, ``/boot/dtbs/<dtb>``,
    ``/boot/dtb-<version>/<dtb>``, ``/boot/dtbs/<version>/<dtb>``) and
    hard-fails if none match, instead of silently logging a warning and
    shipping a TFTP tree without a board DTB (which caused a kernel
    panic at PXE boot rather than a clean Ansible failure).

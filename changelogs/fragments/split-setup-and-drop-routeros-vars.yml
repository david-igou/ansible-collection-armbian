---
breaking_changes:
  - >-
    ``playbooks/setup_netboot.yml`` has been split into two separate
    playbooks: ``populate_nfs_content.yml`` (runs against the netboot
    server to populate NFS rootfs / TFTP content) and
    ``setup_routeros_dhcp.yml`` (runs against RouterOS to create the
    shared DHCP option objects). Each is responsible for one role's
    state and runs against one set of hosts. Update any external
    automation or runbooks that called ``setup_netboot.yml``.
  - >-
    The ``routeros_host``, ``routeros_ssh_user``, and
    ``routeros_ssh_port`` variables have been removed from
    ``inventory/group_vars/all.yml``. SSH connection details for the
    RouterOS host now go directly on the host entry in
    ``inventory/hosts.yml`` as standard Ansible ``ansible_host``,
    ``ansible_user``, and ``ansible_port`` values.
    ``inventory/group_vars/routeros.yml`` now pins only the network_cli
    connection plumbing (``ansible_connection``, ``ansible_network_os``).

minor_changes:
  - >-
    ``playbooks/bootstrap_routeros_user.yml`` now defaults its
    ``hosts:`` to ``routeros_devices`` to match the existing inventory
    parent group; previously it pointed at ``routeros_netboot``, which
    did not exist in the sample inventory.
  - >-
    The README has been restructured around a numbered lifecycle (1.
    bootstrap_routeros_user → 2. populate_nfs_content →
    3. setup_routeros_dhcp → 4. flash_bootloader → 5. reprovision)
    with an order column on the playbooks table so the run sequence
    is unambiguous. Phase 0 of the lifecycle splits NFS content
    population from RouterOS DHCP setup into separate steps.

bugfixes:
  - >-
    ``roles/routeros_dhcp/tasks/enable_netboot.yml`` no longer prints
    a now-stale "insert the prepared SD card" reminder for non-SPI
    boards. The bootloader role flashes the SD card the board is
    already booted from, in place; there is no separate SD card to
    insert at netboot time.

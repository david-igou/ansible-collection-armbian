---
minor_changes:
  - >-
    image_build / compose_uboot_env_vars - the rendered U-Boot ``localcmd``
    supports an ordered list of storage candidates
    (``local_kernel.storage_candidates``, entries of ``{scan, dev}``) with
    boot fallback - a later candidate only runs when an earlier one fails
    to load. The legacy single ``{storage, storage_scan}`` pair is treated
    as a one-element candidate list and renders an equivalent chain (now
    wrapped in if/fi, which also stops ``booti`` running after a failed
    load).
  - >-
    board_boot_verify - the ``local_kernel`` rootfs assertion pattern is
    configurable via ``local_kernel_verify_match`` (or
    ``armbian_board_config.local_kernel.verify_match``), defaulting to the
    previous hardcoded ``^/dev/nvme``, so boards with eMMC fallback can
    assert ``^/dev/(nvme|mmcblk0)``.

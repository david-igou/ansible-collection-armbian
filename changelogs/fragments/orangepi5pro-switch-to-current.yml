---
minor_changes:
  - >-
    ``board_configs.orange-pi-5-pro`` in ``roles/bootloader/vars/boards.yml``
    now points at ``linux-u-boot-orangepi5pro-current`` /
    ``linux-u-boot-current-orangepi5pro`` instead of the ``-edge`` branch.
    Armbian now publishes a ``current`` deb for this board, and ``-edge``
    conflicts with ``-current`` on install — re-running ``flash_bootloader``
    on a board provisioned from the standard ``current`` Armbian image
    previously caused apt to remove the working ``-current`` package and
    install ``-edge``. Override per-host via ``host_board_overrides`` if a
    specific unit needs to stay on ``-edge``.

---
breaking_changes:
  - >-
    Introduced SoC family abstraction. ``board_configs.<model>`` now
    requires a ``soc_family`` field naming a vars file under
    ``roles/bootloader/vars/socs/`` (currently ``rockchip``, ``allwinner``).
    SoC-family defaults (``uboot_spi_image``, ``uboot_disk_image``,
    ``sd_uboot_seek_sectors``, ``emmc_strategy``) are inherited from the
    family file unless overridden per-board. Custom boards.yml entries
    must add ``soc_family`` and may drop the inherited fields.
  - >-
    NFS rootfs layout changed. Per-model templates now live at
    ``nfs_rootfs_path/_templates/<board_model>/`` and each inventory host
    gets its own rootfs at ``nfs_rootfs_path/<inventory_hostname>/``,
    cloned via ``cp --reflink=auto``. The PXE pxelinux.cfg ``nfsroot=``
    path now points at the per-host directory. Two same-model boards no
    longer share hostname, machine-id, or SSH host keys on the wire.
    NFS exports of ``nfs_rootfs_path`` continue to cover everything;
    no NFS-server config change is required for filesystems that support
    reflinks (XFS, btrfs, ZFS) — disk usage stays at one rootfs per
    model. ext4 falls back to a full copy per host.
  - >-
    Removed ``inventory/group_vars/rk3588.yml``. The remaining
    SoC-agnostic values (``armbian_apt_suite``, ``fw_env_config``) moved
    to ``inventory/group_vars/all.yml``. Inventories that referenced the
    ``rk3588`` group purely for the vars file should drop the group; the
    per-model groups under ``boards`` still work for ``--limit``.
  - >-
    ``flash_emmc.yml`` is now a dispatcher — the actual write logic
    moved into ``flash_emmc_boot_partition.yml`` (Rockchip, formerly
    inline) and ``flash_emmc_user_area_seek.yml`` (Allwinner, new).
    Custom callers that re-used ``flash_emmc.yml`` still work; the
    public surface is unchanged.

minor_changes:
  - >-
    Added ``roles/netboot_assets/tasks/preflight.yml`` (run automatically at
    the start of ``setup_netboot.yml``). Fetches Armbian's apt
    ``Packages.gz`` once and asserts every board's ``uboot_apt_package``
    exists; HEAD-checks every ``armbian_image_urls`` entry. Fail-fast
    before any image download or NFS write. Override the apt index URL
    with ``armbian_apt_packages_url`` if mirroring internally.
  - >-
    Added Allwinner H618 example board ``orange-pi-zero-3``. Demonstrates
    the SoC family abstraction (binary ``u-boot-sunxi-with-spl.bin``,
    seek=16, no SPI, no eMMC, SD-only flash target). The bootloader role
    fail-fasts on this board with a pointer to ``prepare_sd_card.yml``.
  - >-
    Sample inventory ``inventory/hosts.yml`` now demonstrates multiple
    hosts of the same model (orange-pi-5-01/-02, rock-5b-01/-02) and
    a per-host ``host_board_overrides`` example. Each host gets its own
    NFS rootfs at ``nfs_rootfs_path/<hostname>``.
  - >-
    Reprovision role now skips the removable-device safety check when
    ``primary_storage == 'sd'`` (e.g. Orange Pi Zero 3). Boards that
    legitimately reprovision to SD are no longer blocked by the guard
    that protects against clobbering the PXE SD card on
    NVMe/eMMC-primary boards.
  - >-
    Renamed playbook variable ``inventory_hostname`` references in
    ``pxelinux_cfg.j2`` to a new explicit ``target_board_host`` var,
    plumbed from ``enable_netboot.yml`` so the template knows the actual
    board hostname (the role itself runs on the routeros host).

bugfixes:
  - >-
    ``prepare_sd_card.yml`` now reads ``/etc/fw_env.config`` from the
    per-model rootfs template (``nfs_rootfs_path/_templates/<model>/``)
    instead of the formerly-shared per-model rootfs path. This is the
    correct location post-rootfs-split.

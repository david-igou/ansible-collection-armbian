---
bugfixes:
  - disk_image, disk_provision, image_build, rootfs_provision - the role metadata
    declared ``min_ansible_version`` 2.15 while the collection requires
    ansible-core 2.19.
known_issues:
  - The ``local_kernel`` boot mode needs a U-Boot that defines ``localcmd``.
    Stock Armbian U-Boot does not, and the collection does not ship one; add it
    through an Armbian userpatch.
doc_changes:
  - bootstrap_armbian - documented that password login needs ``sshpass`` on the
    control node.

---
minor_changes:
  - >-
    ``roles/bootloader`` now runs ``tasks/detect_emmc.yml`` when a
    board has ``has_emmc: true``, walking
    ``/sys/block/mmcblk*/device/type`` to find a device of type ``MMC``
    (vs. ``SD``). Sets ``_emmc_available`` /  ``_emmc_device`` /
    ``_emmc_boot_part`` facts and falls through to SD when ``has_emmc``
    is declared but the chip is not actually populated. Mirrors the
    existing ``detect_spi.yml`` pattern. Boards declared
    ``has_emmc: false`` skip detection entirely.

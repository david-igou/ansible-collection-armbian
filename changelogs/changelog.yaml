ancestor: null
releases:
  0.0.3-alpha:
    changes:
      breaking_changes:
      - 'Inventory group names (``boards``, ``netboot_server``,

        ``armbian_builders``) are now parameterised via

        ``armbian_boards_group``, ``armbian_netboot_server_group``, and

        ``armbian_builders_group`` (defaults shipped in

        ``inventory/group_vars/all.yml``). Operators with non-default group

        naming can override per-collection rather than forking playbooks.

        '
      - 'The ``armbian_build`` profile (branch, release, userpatches,

        compile_args) follows the same family/model/host layered shape as

        ``armbian_board_config``, with a fourth ``armbian_build_defaults`` layer

        shipped in ``inventory/group_vars/all.yml``. The

        ``playbooks/tasks/_resolve_build_profile.yml`` resolver merges all

        layers; userpatches are list-concatenated with a hard-fail on duplicate

        ``dest`` paths.

        '
      - 'The ``armbian_image_urls`` model-keyed dict is gone. Per-host

        ``armbian_rootfs_src`` (URL or path) replaces it, resolved by a new

        ``playbooks/tasks/_resolve_rootfs_src.yml`` with precedence: host_vars >

        published-manifest-derived path > fail.

        '
      - 'The ``image_build`` role no longer uses ``become: true`` anywhere.

        ``armbian_build_cache_dir`` and ``armbian_build_output_dir`` must

        be writable by ``ansible_user`` on the builder host. Operators

        keeping the ``/var/lib/armbian_build`` defaults must pre-create

        and ``chown`` the directories once before the first run; pointing

        them at a path under the user''s home (e.g.

        ``/home/{{ ansible_user }}/armbian_build``) avoids that one-time

        setup.

        '
      - 'The ``image_build`` role re-keyed by host. New required input

        ``armbian_build_host`` (must be ``inventory_hostname``). Output paths

        now suffix per-host (``<cache_dir>/<host>/build/`` and

        ``<output_dir>/<host>/...img.xz``). Manifest gains a ``host:`` field in

        the rebuild-decision tuple. Path-safety validation against ``/`` and

        ``..`` in the host string.

        '
      - 'The ``image_extract`` and ``rootfs_clone`` roles have been deleted and

        replaced by a single ``rootfs_provision`` role. The new role accepts a

        direct ``armbian_rootfs_src``, extracts to a per-host directory, stages

        per-host TFTP artifacts, and resets host identity (hostname, machine-id,

        ssh host keys) inline. Sentinel-based idempotent skip; URL-keyed shared

        download cache; mount-aware safety guard.

        '
      - 'The ``playbooks/`` directory has been reorganized into three

        purpose-based buckets. Top level now holds only operational

        workflow playbooks. The per-role demo playbooks moved to

        ``playbooks/examples/`` (``board_boot_verify.yml``,

        ``board_boot_wait.yml``, ``disk_image.yml``, ``disk_provision.yml``,

        ``image_build.yml``, ``pxelinux_render.yml``,

        ``rootfs_provision.yml``), and the hardware E2E playbooks moved to

        ``playbooks/tests/`` alongside the existing localhost var-contract

        tests (``test_fleet_e2e.yml``, ``test_hardware_e2e.yml``,

        ``test_manual_psu_cold_boot.yml``, ``test_reprovision_e2e.yml``).

        Only top-level playbooks are addressable by FQCN

        (``david_igou.armbian.<name>``); update any scripts, CI, or

        ``ansible-playbook`` invocations that referenced the old paths.

        '
      - 'The collection is re-keyed from per-model to per-host as the unit of work

        for image building and rootfs provisioning. Operators can now build and

        roll out completely different images for hosts of the same hardware

        model, with the full build profile expressed in inventory via a

        three-layer family/model/host merge.

        '
      - 'The top-level ``playbooks/poe_control.yml`` wrapper has been removed.

        Nothing imported it (in-play power cycling goes through

        ``routeros/tasks/poe_cycle.yml`` via the ``armbian_poe_cycle_tasks_file``

        hook), so the only effect is that ad-hoc PoE control is now run

        directly against the reference playbook:

        ``ansible-playbook playbooks/routeros/poe_control.yml --limit <host>

        -e armbian_poe_action=cycle``. The ``armbian_poe_control_playbook``

        swap variable no longer exists.

        '
      - '``playbooks/build_image.yml`` (the simplified single-board build

        companion) has been removed. Use

        ``playbooks/build_and_publish_from_inventory.yml`` for

        inventory-driven builds, or ``playbooks/examples/image_build.yml``

        for a minimal single-role demo.

        '
      - '``playbooks/build_image.yml`` has been renamed to

        ``playbooks/build_and_publish_from_inventory.yml`` to reflect what

        it actually does (iterates every board in ``groups[''boards'']`` and

        publishes images to the netboot server). The ``build_image.yml``

        path is now occupied by a new, simplified single-board build

        playbook (see Minor Changes). Update scripts or CI invocations

        referring to the old path. The sibling

        ``playbooks/tests/test_build_image_vars.yml`` has been renamed to

        ``test_build_and_publish_vars.yml``, and the Makefile target

        ``test-build-image-vars`` to ``test-build-and-publish-vars``.

        '
      - '``playbooks/scripts/run-iter.sh`` (the per-iter hardware-E2E driver

        wrapper) and ``playbooks/test_connection.yaml`` (an unreferenced

        ad-hoc RouterOS reachability check superseded by

        ``playbooks/routeros/plumbing_check.yml``) have been removed.

        '
      - '``pxelinux_render`` role consumes the resolved ``armbian_board_config``

        fact directly. Three caller-supplied inputs are removed:

        ``board_console``, ``pxelinux_render_model_name``,

        ``pxelinux_render_earlycon``. Callers must run

        ``_resolve_board_config.yml`` in pre_tasks before invoking the role.

        '
      - '``vars/boards.yml`` (the per-board catalogue) has been deleted. Per-model

        hardware facts move to operator inventory under

        ``inventory/group_vars/<family>.yml`` (``armbian_board_config_family``) and

        ``inventory/group_vars/<model_group>.yml``

        (``armbian_board_config_model``). A new resolver task

        (``playbooks/tasks/_resolve_board_config.yml``) merges

        family/model/host layers into the per-host ``armbian_board_config`` fact.

        '
      bugfixes:
      - 'Fixed the ``image_build`` role README example to set the required

        ``armbian_build_host`` input (the role''s argument_specs marks it

        ``required: true``; the example previously omitted it).

        '
      - 'Fixed the ``pxelinux_render`` role README example, which put

        ``delegate_to: localhost`` directly on ``include_role`` (rejected with

        "''delegate_to'' is not a valid attribute for a IncludeRole"). The render

        is now wrapped in a delegated ``block``, matching

        ``converge_boot_mode.yml``.

        '
      - '``playbooks/provision_local_disk.yml`` now invokes the

        ``disk_provision`` role through its current ``disk_binding``

        interface (device + declarative ``layout``) instead of the removed

        flat ``device``/``label``/``force`` vars, which left the playbook

        broken after the per-host provisioning refactor. The ad-hoc input

        variables (``armbian_local_disk_device``, ``armbian_local_disk_label``,

        ``armbian_local_disk_force``) are unchanged; the playbook synthesizes

        the canonical single grow-to-fill ext4 root layout from them. A new

        optional ``armbian_local_disk_fast_wipe`` (default true) exposes the

        role''s blkdiscard fast path.

        '
      - "``rootfs_provision``'s mountpoint guard used substring matching\n(``'MOUNTED'
        in stdout``) which spuriously matched ``NOT_MOUNTED``\n\u2014 the guard fired
        on every fresh run rather than only on\nactually-mounted targets. Fixed with
        exact-string comparison plus\na switch to ``/proc/mounts`` (more reliable
        than ``mountpoint -q``\nin some VM kernels).\n"
      doc_changes:
      - 'Every role README example is now a complete, runnable playbook.

        The ``disk_image`` and ``image_build`` examples gained the missing

        play scaffolding (``hosts``/``become``/``gather_facts`` and explicit

        ``vars``) and use the fully-qualified role name; ``board_boot_verify``

        and ``board_boot_wait`` examples make their fact/timeout inputs

        explicit.

        '
      - 'Rewrote the docsite Getting started page to match the verbose

        copy-paste style of the netboot page. Each step (Setup, Build,

        Flash, Bootstrap) carries a self-contained playbook with every

        variable spelled out inline plus the resulting state on the

        builder or board. The same concrete board (``orange-pi-5-pro-01``)

        threads through both pages.

        '
      - 'Rewrote the docsite ``netboot`` page so every step is copy-paste-able.

        Each section now carries a self-contained playbook with explicit

        ``vars:`` values (no inventory resolution required to read it),

        followed by the resulting file tree on the netboot server or router

        and the rendered ``pxelinux.cfg`` for a concrete board threaded

        through every section (``orange-pi-5-pro-01`` with MAC

        ``aa:bb:cc:dd:ee:ff``).

        '
      - 'Roles that generate files now document what they produce, with an

        example file tree plus a snippet of the generated content:

        ``pxelinux_render`` (the rendered ``01-<mac>`` pxelinux.cfg with

        per-host TFTP paths), ``rootfs_provision`` (per-host rootfs identity

        files, TFTP staging, and the provision sentinel JSON),

        ``disk_provision`` (the transient ``.repart.d`` configs and the

        generated ``/etc/fstab``), ``image_build`` (the per-host output

        directory), and ``bootstrap_armbian`` (``authorized_keys`` and the

        ``sudoers.d`` drop-in).

        '
      - "Split the docsite operator guide in two. The Getting started page now\nwalks
        through the simplest end-to-end use \u2014 build a custom Armbian\nimage with
        the ``image_build`` role, flash it to an SD card, and\nbootstrap a login user
        \u2014 with no netboot server or RouterOS router in\nplay. A new ``netboot``
        page covers the full PXE workflow in three\nsections (Build, Rootfs, PXE assets),
        each pointing at the role and\nworkflow playbook that owns it.\n"
      - "The collection's operator guide is now published to the rendered docsite\non
        GitHub Pages, alongside the auto-generated collection and role\nreference.
        The previous repo-only markdown is consolidated into a single\ngetting-started
        ``guide`` page under a ``General`` section, with a\ncurated short-titled page
        per role under a ``Roles`` section \u2014 mirroring\n``felixfontein/ansible-acme``'s
        ``extra-docs.yml`` layout.\n"
      known_issues:
      - 'Tested primarily on Rockchip RK3588(s) boards (Orange Pi 5 Pro /

        Max, Rock 5A/B). Other Armbian-supported boards should work but

        have not all been brought up end-to-end.

        '
      - "The ``bootstrap_armbian`` role grants the created user unrestricted\n``NOPASSWD:
        ALL`` sudo \u2014 the user is automation-root by design.\nTighten the ``/etc/sudoers.d/<user>``
        entry out-of-band post-deploy\nif your threat model wants narrower scope.\n"
      - '``armbian_default_password`` is the upstream Armbian default

        (``"1234"``). Encrypt it with ansible-vault in any real inventory.

        '
      major_changes:
      - 'Always-netboot model: every onboarded board always has a

        per-board ``pxelinux.cfg/01-<MAC>`` on the RouterOS router; the

        ``default`` directive inside it selects ``nfs``, ``sd``, ``local``,

        or ``local_kernel`` boot. Convergence rewrites the same file rather

        than adding/removing files to flip modes.

        '
      - 'Ansible collection for end-to-end management of Armbian-based ARM

        SBCs: custom image build, per-host rootfs provisioning,

        netboot/SD/local-disk boot-mode convergence, and PoE-driven hardware

        lifecycle.

        '
      - 'Nine single-purpose, single-host, transport-agnostic roles:

        ``image_build``, ``image_extract``, ``disk_image``,

        ``disk_provision``, ``rootfs_clone``, ``pxelinux_render``,

        ``bootstrap_armbian``, ``board_boot_wait``, ``board_boot_verify``.

        '
      - 'RouterOS-specific behaviour (TFTP/pxelinux uploads, PoE control,

        user bootstrap) lives in swappable reference playbooks under

        ``playbooks/routeros/``. Replace the directory to support a

        different switching ecosystem.

        '
      minor_changes:
      - 'Added a single-purpose demo playbook for each role that lacked one, so

        every role now has a same-named ``playbooks/<role>.yml`` showing minimal

        known-good usage with concrete, logical variable values:

        ``board_boot_wait.yml``, ``board_boot_verify.yml``, ``disk_image.yml``,

        ``disk_provision.yml``, ``image_build.yml``, ``pxelinux_render.yml``, and

        ``rootfs_provision.yml`` (``bootstrap_armbian.yml`` already existed). Each

        mirrors its role README example and cross-references the richer workflow

        playbook that composes the same role.

        '
      - 'Fleet-wide armbian/build userpatches now live in

        ``inventory/group_vars/armbian.yml`` under a new ``armbian``

        parent group (covering both ``armbian_builders`` and ``boards``),

        rather than as a ``vars:`` block inside the build playbook. The

        rk3588 family overlay (PXE-first boot order, local_kernel localcmd

        bake, uboot_env drift check, bcmdhd DKMS suppression) is unchanged

        in content; only its location moved.

        '
      - 'Inventory-contract test

        (``playbooks/tests/test_build_and_publish_vars.yml``) gains a new

        assertion that ``build_userpatches_common`` is visible on a

        representative boards host via the new ``armbian`` parent group.

        '
      - "New ``playbooks/build_image.yml`` is a simplified single-board\nbuild companion
        to\n``playbooks/build_and_publish_from_inventory.yml``. Edit the\n``armbian_build_*``
        vars at the top of the file (board, branch,\ncache + output dirs, userpatches)
        \u2014 no inventory resolution, no\npre-task templating, no Jinja inside the
        userpatches list.\nDefaults target ``orangepi5pro`` and write to\n``/home/{{
        ansible_user }}/armbian_build``.\n"
      - 'New resolver task files in ``playbooks/tasks/``:

        ``_resolve_board_config.yml``, ``_resolve_build_profile.yml``,

        ``_resolve_rootfs_src.yml``. Pure transforms; no SSH side effects.

        '
      - 'New role ``rootfs_provision`` (single primitive replacing

        ``image_extract`` + ``rootfs_clone``). See its README and

        ``meta/argument_specs.yml`` for the contract.

        '
      - "The ``image_build`` role now defaults ``armbian_build_cache_dir`` and\n``armbian_build_output_dir``
        to ``{{ ansible_env.HOME }}/armbian_build``\n(and ``/output``) instead of
        ``/var/lib/armbian_build``, so the role\nruns become-free out of the box \u2014
        the build tree lands under the\nconnecting user's real ``$HOME`` (resolved
        from facts, correct for\n``root`` and non-``/home`` homes alike), which ``compile.sh``
        needs to\nown for Docker auto-delegation.\n"
      - 'The ``inventory/`` documentation-only catalogue gains

        ``rk3588.yml`` and ``rk3588s.yml`` family group_vars files, plus

        ``rk3588`` / ``rk3588s`` intermediate groups under ``boards`` in

        ``hosts.yml`` so per-model groups inherit family-level defaults.

        '
      - 'Two new molecule scenarios under ``extensions/molecule/``:

        ``board_boot_verify`` (qemu/Debian, exercises the assertion role

        via real ``ansible_mounts[''/'']``) and ``board_boot_wait`` (podman,

        happy-path + timeout-path via TEST-NET-2 unroutable address).

        Existing role-level molecule directories under ``roles/*/molecule/``

        have been consolidated into ``extensions/molecule/`` for a single

        source of test scenarios.

        '
      - '``armbian_tftp_cache_dir`` now defaults to the absolute ``/tmp/sbc-tftp``

        instead of an ``inventory_dir``-relative ``.cache/sbc-tftp`` path. A

        single constant value resolves identically in the ``stage_router.yml``

        fetch play and the imported ``routeros/upload_tftp_assets.yml`` upload

        play (whose ``playbook_dir`` differs), and avoids a split when the

        inventory directory is a symlink.

        '
      - '``disk_image`` role input ``dd_bs`` renamed to ``disk_image_dd_bs``

        for the same namespace-hygiene reason.

        '
      - '``disk_provision`` role inputs are now prefixed with the role name:

        ``disk_provision_source``, ``disk_provision_reset_identity``,

        ``disk_provision_mount_dir_base``, ``disk_provision_render_only``,

        ``disk_provision_installed_marker``. The unprefixed ``source``

        variable in particular was prone to collision and is now safe.

        '
      release_summary: 'First release with consolidated notes, rolling up all changes
        since the ``v0.0.1-alpha`` tag: a per-host refactor of the build and rootfs
        pipeline, a reorganized ``playbooks/`` layout, complete role READMEs with
        generated-asset snippets, and a published antsibull-docs / Sphinx docsite
        on GitHub Pages with copy-paste-able getting-started and PXE netboot guides.


        This is an early-stage (alpha) release. Inventory variable names,

        default values, group names, role names, and playbook names may all

        shift between 0.0.x releases without long deprecation windows. Pin to

        a specific version in your ``requirements.yml``.

        '
    fragments:
    - 0.0.1-alpha.yml
    - armbian-cache-dir-defaults.yml
    - guide-page-concrete.yml
    - netboot-page-concrete.yml
    - netboot-page-split.yml
    - per-host-build-refactor.yml
    - per-role-demo-playbooks.yml
    - publish-docsite-extra-pages.yml
    - refactor-build-image-pipeline.yml
    - reorganize-playbooks-dir.yml
    - role-readme-examples.yml
    release_date: '2026-05-30'
  0.0.4-alpha:
    changes:
      bugfixes:
      - "Fixed ``disk_provision`` ``fast_wipe`` failing on partitioned disks\nwhen
        running against a util-linux 2.41+ rootfs (Debian trixie,\nArmbian edge builds).
        util-linux 2.41 (released 2025-03-18) added\na partition-table guard to ``blkdiscard``
        that refuses a whole\ndisk carrying a GPT unless ``--force`` is given. The
        role's\n``Apply repart: pre-discard whole disk (fast_wipe)`` task now\npasses
        ``-f``; the ``when:`` clause already gates this on\n``__disk_provision_preserve_ids``
        being empty (nothing to\npreserve), so bypassing the guard matches the role's
        intent \u2014\n``fast_wipe`` is an explicit destructive opt-in. Affected callers:\n``test_fleet_e2e.yml``
        Phase 5, ``reprovision_to_local.yml``,\n``provision_local_disk.yml``. (igou-io/igou-ansible#201)\n"
      - 'Fixed ``playbooks/tasks/render_and_upload_pxelinux.yml`` resolving

        ``routeros/tasks/upload_pxelinux_one.yml`` via ``{{ playbook_dir }}``,

        which broke whenever the helper was included from a playbook outside

        ``playbooks/`` (e.g. anything under ``playbooks/tests/``). The path

        is now relative to the helper file itself (``../routeros/...``),

        matching the sibling pattern used in

        ``playbooks/tasks/cold_boot_with_retry.yml``.

        '
      - 'Fixed ``playbooks/tests/test_hardware_e2e.yml`` hardcoding ``sd`` as

        the baseline boot mode for Pre-flight / Phase 3 / Cleanup pxelinux

        convergence. Boards declared as ``armbian_boot_mode: local_kernel``

        (NVMe with ``armbi_root_local``, no working ``armbi_root`` SD card)

        could not boot the SD label and timed out at TCP/22. The test now

        parameterises baseline off the host''s inventory ``armbian_boot_mode``

        (override with ``-e baseline_mode=<mode>``), bypasses ``known_hosts``

        for the duration of the play so rootfs-identity swaps between

        baseline and NFS don''t trip ``StrictHostKeyChecking`` mismatches,

        passes ``_skip_ssh_stability_check: true`` to ``cold_boot_with_retry``

        on the three phases that chain ``auto_bootstrap_if_needed`` (so a

        fresh per-host NFS rootfs gets the inventory user provisioned

        before any wait_for_connection that needs it), and defaults

        ``armbian_boot_retry_attempts`` to ``1`` (matching ``test_fleet_e2e.yml``

        convention for transient cold-boot flakes).

        '
      doc_changes:
      - 'Link the new docsite PXE netboot guide alongside the SD-boot

        getting-started guide in the top-level ``README.md`` and

        ``playbooks/README.md``, and drop the stale "mental model" framing

        on the getting-started link (the guide is now a copy-paste

        walkthrough).

        '
      minor_changes:
      - "Composite multi-play playbooks now refuse ``--limit`` and fail fast\nwith
        a clear ``-e target_hosts=<pattern>`` suggestion when invoked\nwith the wrong
        knob. Previously, ``--limit`` silently emptied the\nplays targeting the router
        or netboot_server because ``--limit`` is\nglobal while ``target_hosts`` is
        intentionally per-play. Affected\nplaybooks: ``converge_boot_mode.yml``,\n``build_and_publish_from_inventory.yml``,
        ``stage_router.yml``,\n``tests/test_fleet_e2e.yml``. Implemented via the shared\n``playbooks/tasks/_assert_no_limit.yml``
        task file, which compares\nthe inventory-resolved host count for the caller's
        expected pattern\nagainst ``ansible_play_hosts_all``. Same-group multi-play
        playbooks\n(``reprovision_to_local.yml``, ``tests/test_reprovision_e2e.yml``)\nare
        unaffected \u2014 their docstrings continue to document ``--limit``.\n"
      release_summary: "Bug-fix release closing three regressions exposed by running\n``test_hardware_e2e.yml``
        end-to-end on a ``local_kernel``-only\nboard, plus a util-linux 2.41 incompatibility
        in\n``roles/disk_provision`` that affected every caller (Phase 5 of\n``test_fleet_e2e.yml``,
        ``reprovision_to_local.yml``,\n``provision_local_disk.yml``).\n\nAll four
        fixes were verified end-to-end on real hardware (Orange\nPi 5 Pro): ``test_hardware_e2e.yml``
        cycles baseline \u2192 NFS \u2192\nbaseline cleanly on a ``local_kernel``
        board, and\n``reprovision_to_local.yml`` reprovisions an already-partitioned\nNVMe
        without the ``blkdiscard`` failure.\n"
    fragments:
    - 0.0.4-alpha.yml
    - composite-playbook-guard-and-test-hardware-e2e.yml
    - disk-provision-blkdiscard-force.yml
    - readme-link-netboot-guide.yml
    release_date: '2026-05-31'
  0.0.5-alpha:
    changes:
      breaking_changes:
      - board_boot_verify - the ``boot_mode`` option no longer carries a ``choices:``
        constraint. The constraint rejected user-defined modes at argument-spec validation
        before the role's documented ``extra_modes`` branch could run, making custom
        ``verify_match`` modes unusable. Built-in modes (``nfs``, ``sd``, ``local``,
        ``local_kernel``) behave exactly as before.
      - board_boot_verify - the role input parameters ``boot_mode``, ``extra_modes``,
        and ``local_kernel_verify_match`` have been renamed to ``board_boot_verify_mode``,
        ``board_boot_verify_extra_modes``, and ``board_boot_verify_local_kernel_match``
        respectively. Update any ``vars:`` block that calls the role. Built-in modes
        (``nfs``, ``sd``, ``local``, ``local_kernel``), the ``armbian_board_config.local_kernel.verify_match``
        fallback, and the custom-mode ``verify_match`` behaviour are unchanged.
      - disk_image - the role input parameters ``image_source`` and ``target_device``
        have been renamed to ``disk_image_source`` and ``disk_image_target_device``
        respectively, so every public input carries the role-name prefix (``disk_image_dd_bs``
        already did). Update any ``vars:`` block that calls the role, plus any ``-e
        image_source=`` / ``-e target_device=`` overrides.
      - "disk_provision - the ``disk_binding.wipe`` sub-option has been removed. It
        was documented as a read-only \"audit mode\" safety switch (``wipe: false``
        would fail instead of repartitioning), but no task ever consumed it \u2014
        the role always applied the declared layout regardless of its value, so an
        operator relying on the documented audit mode would have had their disk wiped.
        Because argument-spec validation rejects unknown sub-options, remove any ``wipe:``
        keys from ``armbian_local_disks`` entries in your inventory when upgrading.
        A real audit mode may return as an explicitly implemented option in a future
        release."
      - disk_provision - the role input parameter ``disk_binding`` has been renamed
        to ``disk_provision_disk_binding``. Update any ``vars:`` block that calls
        the role; the entry shape (``device``, ``layout``, ``force``, ``fast_wipe``)
        is unchanged.
      bugfixes:
      - disk_provision - the ``fast_wipe`` documentation claimed the role passes ``-K``
        to mkfs.ext4; the actual mechanism is ``-E nodiscard`` via the ``SYSTEMD_REPART_MKFS_OPTIONS_EXT4``
        environment variable. Documentation now matches the implementation. No behavior
        change.
      - docs - ``cleanup_boot_files.yml`` is now described accurately (prunes stale
        published ``.img.xz`` files on the netboot server per each board's manifest.json);
        CLAUDE.md previously claimed it removed pxelinux.cfg files and TFTP rows from
        the router.
      - docs - corrected drifted play/phase counts in ``converge_boot_mode.yml`` (seven
        plays, including the ``--limit`` guard) and ``playbooks/tasks/_converge_boot_mode.yml``
        (six phases), removed stale internal ticket references ("Task 7/8/14") from
        comments, fixed the stale ``playbooks/test_fleet_e2e.yml`` path in ``examples/disk_image.yml``,
        corrected ``playbooks/routeros/tasks/README.md``'s claim about who consumes
        ``plumbing_check_one.yml``, and renamed the converge play that imports ``persist_uboot_env.yml``
        to reflect that it converges env for all ``spi_flash`` hosts (localcmd only
        lands on ``local_kernel`` + ``persist_via=spi`` hosts).
      - docs - the TFTP layout prose (CLAUDE.md rb5009 section, ``upload_tftp_assets.yml``
        header and task names) now describes the implemented per-host ``armbian/<inventory_hostname>/``
        layout instead of the retired per-model ``armbian/<model>/`` layout. The ``armbian_tftp_upload_models``
        parameter name is unchanged (documented as holding hostnames for backwards
        compatibility).
      - 'docs - the per-model-template + reflink-clone description of ``rootfs_provision``
        (CLAUDE.md, README.md, playbooks/README.md, the docsite intro page, the role''s
        own argument_specs, the sample inventory header, and test-harness comments)
        has been replaced with the implemented per-host-extraction model: the rootfs
        is extracted directly into a per-host directory, and same-URL hosts share
        only the ``.img.xz`` download via a URL-keyed cache.'
      - "inventory (sample) - the ``armbian_persist_uboot_env`` comment now documents
        the implemented behavior (``never`` skips the persist_uboot_env.yml import;
        any other value behaves like ``auto`` \u2014 per-host spi_flash gating lives
        inside the imported playbook). The previously documented ``always`` value
        and \"step 3.5\" reference matched no implemented semantics."
      minor_changes:
      - argument_specs - removed trailing periods from the ``short_description`` of
        seven roles (board_boot_verify, board_boot_wait, bootstrap_armbian, disk_image,
        disk_provision, pxelinux_render, rootfs_provision).
      - board_boot_verify - added the missing ``board_boot_verify_extra_modes`` key
        to ``defaults/main.yml`` for spec/defaults parity, and normalized the role-internal
        facts to the ``__board_boot_verify_*`` prefix.
      - board_boot_verify - the ``local_kernel`` rootfs assertion pattern is configurable
        via ``local_kernel_verify_match`` (or ``armbian_board_config.local_kernel.verify_match``),
        defaulting to the previous hardcoded ``^/dev/nvme``, so boards with eMMC fallback
        can assert ``^/dev/(nvme|mmcblk0)``.
      - 'bootstrap_armbian - ``armbian_bootstrap_user`` is now correctly declared
        as optional with default ``armbian`` in ``meta/argument_specs.yml`` (the spec
        previously claimed ``required: true`` while a default existed, making the
        requirement unenforceable). No behavior change.'
      - 'bootstrap_armbian - the ``Restart sshd`` handler now uses the collection
        ``<role> | <name>`` naming pattern with a ``listen:`` topic, so existing ``notify:
        Restart sshd`` strings keep working.'
      - consistency - named the remaining unnamed tasks across the composite playbooks
        and localhost contract tests, converted legacy top-level fact references (``ansible_mounts``,
        ``ansible_date_time``, ``ansible_env.HOME``) to the ``ansible_facts['...']``
        bracket form, and switched bare ``import_playbook:`` occurrences to the FQCN
        ``ansible.builtin.import_playbook:``.
      - converge_boot_mode - the inline ``pxelinux_render`` call now passes ``pxelinux_render_extra_modes``
        so it renders identically to the ``render_and_upload_pxelinux.yml`` entry
        point.
      - converge_boot_mode.yml / _converge_boot_mode.yml - the post-boot verify step
        now passes ``board_boot_verify_extra_modes`` (from ``armbian_extra_modes``),
        so user-defined extra boot modes verify correctly during convergence instead
        of failing as an unknown mode.
      - disk_image - normalized the role-internal validation facts/registers (``_partition_sysfs``,
        ``_lsblk_names``, ``_mounts_b64``, ``_proc_mounts``, ``_candidate_sources``,
        ``_mounted_match``, ``_src_stat``) to the ``__disk_image_*`` prefix.
      - disk_provision - the internal ``__disk_provision_default_mount_opts`` constant
        moved from ``defaults/main.yml`` to ``vars/main.yml`` so the defaults file
        only contains the role's public options. No behavior change.
      - docs - added a "Variable naming convention" section to CLAUDE.md documenting
        the four tiers (``armbian_*`` inventory vars, ``<role>_*`` role inputs, ``__<role>_*``
        role internals, and ``_foo`` include-time parameters).
      - examples/board_boot_verify.yml - the demo now resolves ``armbian_board_config``
        before invoking the role, so boards that widen the ``local_kernel`` device
        regex via ``armbian_board_config.local_kernel.verify_match`` (e.g. an eMMC
        fallback in the localcmd storage-candidate chain) verify correctly from the
        example too, matching the converge playbooks' behavior.
      - 'image_build - ``armbian_build_board`` and ``armbian_build_host`` no longer
        have empty-string defaults, so the ``required: true`` declaration in ``meta/argument_specs.yml``
        is actually enforced; omitting either now fails argument-spec validation with
        a clear message instead of relying solely on the in-role assert.'
      - image_build - added the missing ``default:`` values for ``armbian_build_required_egress_hosts``
        and ``armbian_build_compile_args`` in ``meta/argument_specs.yml`` so the argument
        spec matches ``defaults/main.yml``.
      - image_build - the armbian/build clone now shields itself from the connecting
        user's global git config via ``GIT_CONFIG_GLOBAL`` (matching the compile.sh
        invocation) instead of blanking ``HOME``.
      - image_build / compose_uboot_env_vars - the rendered U-Boot ``localcmd`` supports
        an ordered list of storage candidates (``local_kernel.storage_candidates``,
        entries of ``{scan, dev}``) with boot fallback - a later candidate only runs
        when an earlier one fails to load. The legacy single ``{storage, storage_scan}``
        pair is treated as a one-element candidate list and renders an equivalent
        chain (now wrapped in if/fi, which also stops ``booti`` running after a failed
        load).
      - pxelinux_render - the managed-file header now renders first via ``{{ ansible_managed
        | comment }}``. Rendered pxelinux directives are unchanged.
      - pxelinux_render - the pxelinux.cfg template factors the repeated board-config
        lookups into top-level Jinja variables; rendered output is unchanged.
      - rootfs_provision - document the ``armbian_rootfs_mount_dir`` option in ``meta/argument_specs.yml``
        (it was previously an undocumented default).
      release_summary: "Review-driven consistency release. Rolls up the multi-skill
        collection review: the inert ``disk_binding.wipe`` option is removed (it promised
        a read-only audit mode that was never implemented), every role input now carries
        its role-name prefix (``disk_image_*``, ``board_boot_verify_*``, ``disk_provision_*``),
        legacy fact access moved to ``ansible_facts[...]`` bracket notation collection-wide,
        and a docs-truth sweep realigned CLAUDE.md/README/docsite prose with the implemented
        per-host rootfs-extraction and per-host TFTP layouts. Also includes the ordered
        ``storage_candidates`` localcmd fallback (with ``board_boot_verify`` honouring
        ``armbian_board_config.local_kernel.verify_match``), verified live on a cm3588-nas
        booting via its eMMC fallback. Breaking changes throughout \u2014 see the
        breaking_changes entries and update inventories and role call sites when upgrading."
      removed_features:
      - image_build - removed the unused ``armbian_build_user`` variable from ``defaults/main.yml``
        and ``meta/argument_specs.yml``. It was documented ("user that owns the build
        tree") but never referenced by any task; compile.sh runs as the connecting
        ``ansible_user``.
      - inventory (sample) - removed the unused ``armbian_branch`` variable from ``inventory/group_vars/all.yml``.
        Nothing consumed it, and its comment pointed at an ``uboot_apt_package`` field
        that does not exist. Per-board U-Boot branch selection lives in ``armbian_build_model.branch``.
    fragments:
    - local-kernel-storage-candidates.yml
    - naming-convention-and-consistency.yml
    - release-summary.yml
    - standards-and-maintainability-review.yml
    - verify-extra-modes-and-example-resolve.yml
    - wipe-contract-and-docs-truth.yml
    release_date: '2026-07-02'

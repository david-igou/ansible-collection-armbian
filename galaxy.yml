namespace: "david_igou"
name: "armbian_netboot"
version: 4.0.0
readme: README.md
authors:
  - David Igou <igou.david@gmail.com>

description: >-
  Ansible collection for end-to-end management of Armbian-based ARM SBCs:
  custom image build, per-host rootfs provisioning, netboot/SD boot-mode
  convergence, and PoE-driven hardware lifecycle. v3 decomposes roles
  into single-purpose, single-host, transport-agnostic units; networking-
  gear-specific code (e.g. RouterOS) lives in swappable reference
  playbooks under playbooks/<transport>/.

license_file: LICENSE

tags:
  - linux
  - networking
  - infrastructure
  - armbian
  - pxe
  - netboot
  - rockchip
  - allwinner

dependencies:
  "community.routeros": ">=2.0.0"
  "ansible.posix": ">=1.5.0"
  "ansible.netcommon": ">=5.0.0"

repository: https://github.com/david-igou/ansible-collection-armbian_netboot
documentation: https://github.com/david-igou/ansible-collection-armbian_netboot/tree/main/docs
homepage: https://github.com/david-igou/ansible-collection-armbian_netboot
issues: https://github.com/david-igou/ansible-collection-armbian_netboot/issues


---
# Initialized by https://github.com/ansible/ansible-creator 26.4.3
# See https://docs.ansible.com/ansible/latest/dev_guide/collections_galaxy_meta.html

namespace: "david_igou"
name: "armbian"
version: 0.0.5-alpha
readme: README.md
authors:
  - David Igou <igou.david@gmail.com>

description: >-
  Ansible collection for end-to-end management of Armbian-based ARM SBCs:
  custom image build, per-host rootfs provisioning, netboot/SD boot-mode
  convergence, and PoE-driven hardware lifecycle. Roles are single-purpose,
  single-host, and transport-agnostic; networking-gear-specific code
  (e.g. RouterOS) lives in swappable reference playbooks under
  playbooks/<transport>/. Early-stage 0.0.x — expect breaking changes
  between releases.

license:
  - MIT

tags:
  - linux
  - networking
  - infrastructure
  - armbian
  - pxe
  - netboot
  - rockchip
  - allwinner

dependencies:
  "ansible.posix": ">=1.5.0"

repository: https://github.com/david-igou/ansible-collection-armbian
documentation: https://david-igou.github.io/ansible-collection-armbian/branch/main/
homepage: https://github.com/david-igou/ansible-collection-armbian
issues: https://github.com/david-igou/ansible-collection-armbian/issues

build_ignore:
  - .ansible
  - .ansible-lint
  - .cache
  - .claude
  - .cursor
  - .devcontainer
  - .github
  - .gitignore
  - .isort.cfg
  - .pre-commit-config.yaml
  - .prettierignore
  - .vscode
  - .worktrees
  - .yamllint.yml
  - AGENTS.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - MAINTAINERS
  - Makefile
  - ansible.cfg
  # Local docsite build output (gitignored, but present in working trees
  # that have built docs — without this entry it ships in locally built
  # tarballs and fails ansible-test sanity's no-smart-quotes check).
  - build
  - changelogs/.plugin-cache.yaml
  - devfile.yaml
  # Internal design documents — not user-facing collection docs.
  - docs/superpowers
  - extensions
  - pyproject.toml
  - requirements.txt
  - tox-ansible.ini

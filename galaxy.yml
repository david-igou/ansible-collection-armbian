namespace: "david_igou"
name: "armbian_netboot"
version: 1.0.0
readme: README.md
authors:
  - david-igou

description: >-
  Ansible collection for PXE-netbooting and reprovisioning Armbian-based
  ARM SBCs (Rockchip RK3588/RK3588S, Allwinner H618/sunxi) via RouterOS
  DHCP option management and NFS-based root filesystems.

license_file: LICENSE

tags:
  - linux
  - networking
  - infrastructure
  - armbian
  - pxe
  - netboot
  - rockchip
  - allwinner

dependencies:
  "community.routeros": ">=2.0.0"
  "ansible.posix": ">=1.5.0"
  "ansible.netcommon": ">=5.0.0"

repository: https://github.com/david-igou/ansible-collection-armbian_netboot
documentation: https://github.com/david-igou/ansible-collection-armbian_netboot/tree/main/docs
homepage: https://github.com/david-igou/ansible-collection-armbian_netboot
issues: https://github.com/david-igou/ansible-collection-armbian_netboot/issues

build_ignore:
  - .ansible
  - .gitignore
  - .devcontainer
  - .github
  - .vscode

namespace: "david_igou"
name: "armbian"
version: 0.1.1-alpha
readme: README.md
authors:
  - David Igou <igou.david@gmail.com>

description: >-
  Roles for Armbian single-board computers that netboot and get reimaged:
  layered board facts, custom image builds, per-host NFS roots, pxelinux.cfg
  rendering, boot wait and verification, first-boot bootstrap and local-disk
  imaging. Roles only; orchestration and transport belong to the consumer.

license:
  - MIT

tags:
  - linux
  - networking
  - infrastructure
  - armbian
  - pxe
  - netboot
  - rockchip
  - allwinner

dependencies:
  "ansible.posix": ">=1.5.0"

repository: https://github.com/david-igou/ansible-collection-armbian
documentation: https://david-igou.github.io/ansible-collection-armbian/branch/main/
homepage: https://github.com/david-igou/ansible-collection-armbian
issues: https://github.com/david-igou/ansible-collection-armbian/issues

build_ignore:
  - .ansible
  - .cache
  - .devcontainer
  - .github
  - .vscode
  - .venv
  - .ansible-lint

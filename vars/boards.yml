---
# Per-board metadata. Keyed by armbian_netboot_board_model (matches
# inventory host_vars and pxelinux/TFTP paths).
#
# Fields:
#   armbian_dl_dir       dl.armbian.com subdirectory (documentation
#                        pointer; not used by code post-slim)
#   armbian_board_name   armbian/build BOARD= target. Used by
#                        playbooks/build_image.yml to map board_model
#                        to the build target string.
#   armbian_support      Armbian support tier (standard / community /
#                        wip / unsupported). Documentation only.
#   dtb                  Device tree path under /boot/dtb/. Used by
#                        roles/netboot_assets/tasks/per_board.yml.
#   console              Kernel console parameter. Used by
#                        roles/routeros_pxe_config/templates/pxelinux_cfg.j2.
#   earlycon             earlycon= argument that drives kernel output
#                        before the ttyS* driver loads. Format is
#                        "<driver>,<bus>,<mmio_addr>" — for RK3588S the
#                        UART2 base is 0xfeb50000. Required when
#                        armbian_netboot_pxe_verbose=true; consulted
#                        only by the verbose path in pxelinux_cfg.j2.

armbian_netboot_board_configs:
  orange-pi-5-pro:
    armbian_dl_dir: orangepi5pro
    armbian_board_name: orangepi5pro
    armbian_support: community
    dtb: rockchip/rk3588s-orangepi-5-pro.dtb
    console: ttyS2,1500000n8
    earlycon: uart8250,mmio32,0xfeb50000

  rock-5b:
    armbian_dl_dir: rock-5b
    armbian_board_name: rock-5b
    armbian_support: standard
    dtb: rockchip/rk3588-rock-5b.dtb
    console: ttyS2,1500000n8
    earlycon: uart8250,mmio32,0xfeb50000

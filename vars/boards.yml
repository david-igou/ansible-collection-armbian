---
# Per-board metadata. Keyed by armbian_netboot_board_model (matches
# inventory host_vars and pxelinux/TFTP paths).
#
# Fields:
#   armbian_dl_dir       dl.armbian.com subdirectory (documentation
#                        pointer; not used by code post-slim)
#   armbian_board_name   armbian/build BOARD= target. Used by
#                        playbooks/build_image.yml to map board_model
#                        to the build target string.
#   armbian_support      Armbian support tier (standard / community /
#                        wip / unsupported). Documentation only.
#   dtb                  Device tree path under /boot/dtb/. Used by
#                        roles/netboot_assets/tasks/per_board.yml.
#   console              Kernel console parameter. Used by
#                        roles/routeros_pxe_config/templates/pxelinux_cfg.j2.
#   earlycon             earlycon= argument that drives kernel output
#                        before the ttyS* driver loads. Format is
#                        "<driver>,<bus>,<mmio_addr>" — for RK3588S the
#                        UART2 base is 0xfeb50000. Required when
#                        armbian_netboot_pxe_verbose=true; consulted
#                        only by the verbose path in pxelinux_cfg.j2.
#   local_kernel         OPTIONAL. Board's local_kernel mechanism config.
#                        - storage_dev: U-Boot device class without partition
#                          (e.g. "nvme"). Used with " 0" for `part number
#                          nvme 0 #<label> rootpart`, then as the device
#                          prefix in ext4load commands. Replaces the old
#                          hardcoded "nvme 0:4" field so the chain works on
#                          2-partition layouts (p2=root) and 4-partition
#                          layouts (p4=root) alike.
#                        - storage_scan: scan command (e.g. "nvme scan").
#                        Absent => board does not support local_kernel mode.
#   uboot_env            Board's U-Boot env storage characteristics. Required
#                        for any board the collection builds.
#                        - storage: REQUIRED. 'nowhere' | 'spi_flash' | 'mmc'.
#                          Verified against the U-Boot defconfig at build
#                          time (see playbooks/build_image.yml's
#                          __999_uboot_env_check hook).
#                        - fw_env_config: device/offset/size/sect_size for
#                          /etc/fw_env.config. Only when storage allows
#                          runtime read/write (e.g. spi_flash).
#                        - defaults: dict of env vars to keep in SPI
#                          (consumed by persist_uboot_env.yml when storage
#                          is spi_flash).

armbian_netboot_board_configs:
  orange-pi-5-pro:
    armbian_dl_dir: orangepi5pro
    armbian_board_name: orangepi5pro
    armbian_support: community
    dtb: rockchip/rk3588s-orangepi-5-pro.dtb
    console: ttyS2,1500000n8
    earlycon: uart8250,mmio32,0xfeb50000
    local_kernel:
      storage_dev: "nvme"
      storage_scan: "nvme scan"
    uboot_env:
      storage: nowhere

  rock-5b:
    armbian_dl_dir: rock-5b
    armbian_board_name: rock-5b
    armbian_support: standard
    dtb: rockchip/rk3588-rock-5b.dtb
    console: ttyS2,1500000n8
    earlycon: uart8250,mmio32,0xfeb50000
    local_kernel:
      storage_dev: "nvme"
      storage_scan: "nvme scan"
    uboot_env:
      storage: spi_flash
      fw_env_config:
        device: /dev/mtd0
        offset: "0xc00000"
        size: "0x20000"
        sect_size: "0x1000"
      defaults:
        pxefile_addr_r: "0x00500000"
        kernel_addr_r: "0x02080000"
        ramdisk_addr_r: "0x06000000"
        fdt_addr_r: "0x08000000"
        scriptaddr: "0x00c00000"
        bootmeths: "pxe extlinux script efi"

  orange-pi-5:
    armbian_dl_dir: orangepi5
    armbian_board_name: orangepi5
    armbian_support: standard
    dtb: rockchip/rk3588s-orangepi-5.dtb
    console: ttyS2,1500000n8
    earlycon: uart8250,mmio32,0xfeb50000
    local_kernel:
      storage_dev: "nvme"
      storage_scan: "nvme scan"
    uboot_env:
      storage: nowhere

  rock-5a:
    armbian_dl_dir: rock-5a
    armbian_board_name: rock-5a
    armbian_support: standard
    dtb: rockchip/rk3588s-rock-5a.dtb
    console: ttyS2,1500000n8
    earlycon: uart8250,mmio32,0xfeb50000
    local_kernel:
      storage_dev: "nvme"
      storage_scan: "nvme scan"
    uboot_env:
      storage: nowhere    # confirmed: rock-5a has no SPI flash

  orange-pi-5-max:
    armbian_dl_dir: orangepi5-max
    armbian_board_name: orangepi5-max
    armbian_support: community
    dtb: rockchip/rk3588-orangepi-5-max.dtb
    console: ttyS2,1500000n8
    earlycon: uart8250,mmio32,0xfeb50000
    local_kernel:
      storage_dev: "nvme"
      storage_scan: "nvme scan"
    uboot_env:
      storage: nowhere    # CONFIG_ENV_IS_NOWHERE=y in defconfig
